<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayloob discussion prototype</title>
<style>
/* ===== Tokens: the only place with raw colours. Dark is the default; [data-theme=light] swaps them. ===== */
:root {
  color-scheme: dark;
  --ink: 255 255 255;
  --shade: 0 0 0;
  --shade-k: 1;
  --backdrop: #07060b;
  --surface: #121118;
  --surface-2: #17161e;
  --glass: rgba(18, 17, 24, 0.98);
  --raised: rgb(var(--ink) / 0.04);
  --raised-2: rgb(var(--ink) / 0.07);
  --hover: rgb(var(--ink) / 0.09);
  --line: rgb(var(--ink) / 0.08);
  --line-strong: rgb(var(--ink) / 0.16);
  --text: #f2f2f5;
  --soft: #c9c7d4;
  --muted: #9a99a6;
  --brand: #8b5cff;
  --brand-soft: #b28bff;
  --primary-bg: #7444f2;
  --primary-fg: #ffffff;
  --focus: rgba(139, 92, 255, 0.7);
  --idle: #9a99a6;
  --thinking: #6aa8ff;
  --working: #ffb547;
  --waiting: #ff6b78;
  --done: #4fd59a;
  --on-done: #08130d;
  --cat-workflow: #b28bff;
  --cat-analysis: #6aa8ff;
  --cat-ops: #ffb547;
  --env-dev: #4fd59a;
  --env-staging: #ffb547;
  --env-prod: #ff6b78;
  --a-claude: #ff7a5c;
  --a-codex: #22b8cf;
  --a-gemini: #5b7bff;
  --a-grok: #b6bac6;
  --a-bayloob: #8b5cff;
  --code-bg: rgb(var(--ink) / 0.05);
  --scrim: rgba(5, 4, 9, 0.62);
  --knob: #ffffff;
}
:root[data-theme="light"] {
  color-scheme: light;
  --ink: 20 16 40;
  --shade: 20 16 40;
  --shade-k: 0.35;
  --backdrop: #e9e7f0;
  --surface: #ffffff;
  --surface-2: #faf9fd;
  --glass: rgba(255, 255, 255, 0.98);
  --text: #1b1830;
  --soft: #3f3c55;
  --muted: #625f78;
  --brand: #6a3fe0;
  --brand-soft: #5a32d0;
  --primary-bg: #6a3fe0;
  --focus: rgba(106, 63, 224, 0.6);
  --idle: #625f78;
  --thinking: #1d5fd6;
  --working: #8f5200;
  --waiting: #c42338;
  --done: #12784a;
  --on-done: #ffffff;
  --cat-workflow: #5a32d0;
  --cat-analysis: #1d5fd6;
  --cat-ops: #8f5200;
  --env-dev: #12784a;
  --env-staging: #8f5200;
  --env-prod: #c42338;
  --a-claude: #d4502f;
  --a-codex: #0d8597;
  --a-gemini: #3d5ce0;
  --a-grok: #6b7080;
  --a-bayloob: #6a3fe0;
  --scrim: rgba(40, 36, 60, 0.35);
}

/* ===== Base ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--backdrop); color: var(--text); font: 500 13px/1.45 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; border: 0; background: none; outline: none; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand-soft); outline-offset: 2px; border-radius: 6px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono, code, pre { font-family: ui-monospace, "Ubuntu Mono", "JetBrains Mono", monospace; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.novi { width: 28px; height: 28px; flex: none; image-rendering: auto; }
.novi.s { width: 20px; height: 20px; }
.novi.l { width: 40px; height: 40px; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 9px; background: var(--raised-2); color: var(--text); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); }
.btn.ghost { background: none; color: var(--soft); }
.btn.ghost:hover { background: var(--hover); color: var(--text); }
.btn.danger { color: var(--waiting); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
  color: color-mix(in srgb, var(--c) 78%, var(--text)); background: color-mix(in srgb, var(--c) 15%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
.chip svg.i { width: 12px; height: 12px; stroke-width: 2.2; }
.st-propose { --c: var(--brand-soft); } .st-support { --c: var(--done); } .st-oppose { --c: var(--waiting); } .st-revise { --c: var(--thinking); } .st-undecided { --c: var(--idle); }
kbd { font: 600 10.5px/1 ui-monospace, monospace; padding: 3px 5px; border-radius: 5px; background: var(--raised-2); border: 1px solid var(--line); color: var(--soft); }

/* ===== Window ===== */
.win { height: 100vh; display: grid; grid-template-rows: auto 1fr; grid-template-columns: minmax(0, 1fr); }
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.top .title { min-width: 0; flex: 0 1 340px; }
.top .title b { display: block; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .title small { color: var(--muted); font-size: 12px; }
.mini { display: flex; align-items: center; gap: 4px; margin-left: 4px; flex: none; }
.mini span { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); }
.mini span.on { color: var(--text); border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, transparent); }
.mini i { width: 10px; height: 1px; background: var(--line-strong); }
.meters { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; white-space: nowrap; min-width: 0; overflow: hidden; }
.meters .bar { width: 44px; }
.meters b { color: var(--text); }
.bar { width: 90px; height: 6px; border-radius: 999px; background: var(--raised-2); overflow: hidden; display: inline-block; vertical-align: middle; }
.bar i { display: block; height: 100%; background: var(--c, var(--brand)); border-radius: inherit; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--raised); }
.tabs button { white-space: nowrap; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 2px rgb(var(--shade) / .25); }
.main { display: grid; grid-template-columns: 240px 5px minmax(0, 1fr) 5px 360px; min-height: 0; }
.split { cursor: col-resize; position: relative; }
.split::after { content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--line); }

/* ===== Left: participants ===== */
.people { padding: 14px 10px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 4px; }
.h { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 2px 8px 6px; }
.who { display: grid; grid-template-columns: 40px 1fr; gap: 2px 10px; align-items: center; padding: 9px 8px; border-radius: 11px; text-align: left; border: 1px solid transparent; }
.who:hover { background: var(--hover); }
.who[aria-pressed="true"] { border-color: var(--line-strong); background: var(--raised); }
.who .n b { display: block; font-size: 13px; }
.who .n small { color: var(--muted); font-size: 11.5px; }
.who .meta { grid-column: 2; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.who .live { font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.live.speaking .dot { animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.conf { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); margin-top: 3px; white-space: nowrap; }
.who .tok { grid-column: 2; font-size: 11px; color: var(--muted); }
.conf .bar { width: 70px; height: 4px; }
.people .add { margin-top: 6px; justify-content: center; border: 1px dashed var(--line-strong); background: none; color: var(--soft); }

/* ===== Center: thread ===== */
.center { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.tools { display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.search { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 9px; background: var(--raised); border: 1px solid var(--line); width: 240px; color: var(--muted); }
.search input { flex: 1; min-width: 0; color: var(--text); }
.tools .filter { color: var(--muted); font-size: 12px; }
.tools .right { margin-left: auto; display: flex; gap: 6px; }
.feed { overflow-y: auto; padding: 0 18px 24px; }
.round { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 12px 0 8px; background: linear-gradient(var(--backdrop) 75%, transparent); }
.round b { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
.round small { color: var(--muted); font-size: 12px; }
.round hr { flex: 1; border: 0; height: 1px; background: var(--line); }
.msg { position: relative; max-width: 80ch; margin: 8px 0 12px; padding: 14px 16px 14px 18px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; line-height: 1.6; }
.msg::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
.msg.you { background: color-mix(in srgb, var(--brand) 7%, var(--surface)); }
.msg.hl { box-shadow: 0 0 0 2px var(--brand-soft); }
.msg header { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; font-size: 13px; }
.msg header b { font-size: 13.5px; }
.msg header small { color: var(--muted); }
.msg header .sp { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.msg h4 { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 10px 0 3px; }
.msg p { color: var(--softer, var(--soft)); }
.msg ul { padding-left: 18px; color: var(--soft); }
.msg a, .msg .ment { color: var(--brand-soft); text-decoration: none; font-weight: 600; cursor: pointer; }
.msg a:hover, .msg .ment:hover { text-decoration: underline; }
.msg pre { margin: 8px 0; padding: 10px 12px; border-radius: 9px; background: var(--code-bg); font-size: 12.5px; line-height: 1.5; overflow-x: auto; }
.changed { --c: var(--working); }
.pinned { --c: var(--brand-soft); }
.msg .more { margin-top: 6px; }
.msg.thinking { color: var(--muted); font-size: 13.5px; }
.typing { display: inline-flex; gap: 4px; margin-left: 4px; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }

/* composer */
.composer { border-top: 1px solid var(--line); padding: 10px 18px 14px; background: var(--surface); }
.composer .row { display: flex; align-items: center; gap: 8px; }
.composer .to { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.composer select { height: 28px; padding: 0 8px; border-radius: 8px; background: var(--raised-2); color: var(--text); font-size: 12px; }
.composer textarea { width: 100%; margin: 8px 0; min-height: 52px; max-height: 160px; padding: 10px 12px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line); resize: none; font-size: 14px; line-height: 1.5; color: var(--text); }
.composer textarea:focus { border-color: var(--brand); }
.composer .acts { display: flex; align-items: center; gap: 6px; }
.composer .acts .grow { flex: 1; color: var(--muted); font-size: 11.5px; }

/* ===== Right: summary ===== */
.side { overflow-y: auto; padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 14px; }
.card { border-radius: 13px; background: var(--surface); border: 1px solid var(--line); padding: 12px 12px 14px; }
.card > .h { padding: 0 0 8px; }
.matrix { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 11.5px; }
.matrix th { font-weight: 600; color: var(--muted); text-align: center; padding: 2px; }
.matrix th:first-child { text-align: left; }
.matrix td { height: 34px; text-align: center; border-radius: 8px; background: var(--raised); color: var(--soft); }
.matrix td.self { background: none; color: var(--muted); }
.matrix td.y { background: color-mix(in srgb, var(--done) 18%, transparent); color: color-mix(in srgb, var(--done) 75%, var(--text)); font-weight: 650; }
.matrix td.n { background: color-mix(in srgb, var(--waiting) 16%, transparent); color: color-mix(in srgb, var(--waiting) 75%, var(--text)); font-weight: 650; }
.matrix td .tx { display: block; font-size: 10px; font-weight: 600; }
.prop { padding: 9px 0; border-top: 1px solid var(--line); }
.prop:first-of-type { border-top: 0; padding-top: 0; }
.prop b { font-size: 13px; }
.prop small { display: block; color: var(--muted); margin-top: 2px; }
.prop .sup { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
.open { list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--soft); }
.open li { display: flex; gap: 8px; }
.open li::before { content: '○'; color: var(--muted); }
.decision { border-color: color-mix(in srgb, var(--brand) 45%, transparent); background: color-mix(in srgb, var(--brand) 7%, var(--surface)); }
.decision p { font-size: 13px; color: var(--soft); margin: 4px 0 10px; }
.decision .acts { display: flex; flex-wrap: wrap; gap: 6px; }
.decision .conf { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }

/* ===== Other views ===== */
.cols { display: grid; grid-template-columns: 90px repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px 18px; overflow: auto; }
.cols .hd { position: sticky; top: 0; display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 650; }
.cols .rl { padding: 10px 4px; color: var(--muted); font-size: 12px; font-weight: 650; }
.cols .cell { padding: 10px 12px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-size: 13.5px; line-height: 1.55; color: var(--soft); }
.cols .cell .chip { margin-bottom: 6px; }
.tl { padding: 18px; overflow: auto; }
.tl table { border-collapse: separate; border-spacing: 8px; }
.tl th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 650; padding: 0 6px; }
.tl td { min-width: 170px; padding: 10px 12px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); }
.tl td .conf { margin: 6px 0 0; }
.tl td.chg { border-color: color-mix(in srgb, var(--working) 60%, transparent); }
.raw { padding: 14px 18px; overflow: auto; }
.raw details { margin-bottom: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.raw summary { padding: 9px 12px; cursor: pointer; font-size: 12.5px; color: var(--soft); }
.raw pre { padding: 10px 12px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; border-top: 1px solid var(--line); color: var(--soft); }

/* ===== ? sheet ===== */
.sheet { position: fixed; inset: 0; display: grid; place-items: center; background: var(--scrim); z-index: 20; }
.sheet[hidden] { display: none; }
.sheet .box { width: 520px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-strong); padding: 18px 20px; box-shadow: 0 20px 60px rgb(var(--shade) / .4); }
.sheet h2 { font-size: 15px; margin-bottom: 12px; }
.sheet dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 14px; font-size: 13px; }
.sheet dt { display: flex; gap: 4px; }
.sheet dd { color: var(--soft); }
@media (prefers-reduced-motion: reduce) { .live.speaking .dot, .typing i { animation: none; } }
</style>
</head>
<body>
<div class="win" id="app"></div>
<div class="sr" role="status" aria-live="polite" id="live"></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="box">
  <h2 id="sheetTitle">Keyboard</h2>
  <dl>
    <dt><kbd>J</kbd> <kbd>K</kbd></dt><dd>Next / previous message</dd>
    <dt><kbd>[</kbd> <kbd>]</kbd></dt><dd>Previous / next round</dd>
    <dt><kbd>R</kbd></dt><dd>Write a message (composer)</dd>
    <dt><kbd>Ctrl</kbd>+<kbd>Enter</kbd></dt><dd>Send</dd>
    <dt><kbd>Alt</kbd>+<kbd>N</kbd></dt><dd>Next round (when paused)</dd>
    <dt><kbd>Alt</kbd>+<kbd>E</kbd></dt><dd>End &amp; decide</dd>
    <dt><kbd>1</kbd>–<kbd>4</kbd></dt><dd>Thread · Columns · Stance timeline · Raw</dd>
    <dt><kbd>?</kbd></dt><dd>This sheet (Esc closes)</dd>
  </dl>
</div></div>

function topBar() {

  const pinned = m.pinned ? `<span class="chip pinned">${I.pin}Pinned</span>` : '';
  if (m.from === 'you') {
    return `<article class="msg you" id="${m.id}" style="--c:var(--a-bayloob)" aria-label="You, round ${m.r}">
      <header>${novi('you', 's')}<b>You</b><small>to everyone · ${m.t}</small><span class="sp">${pinned}</span></header><p>${m.text}</p></article>`;
  }
  const p = P.find(x => x.id === m.from);
  return `<article class="msg" id="${m.id}" style="--c:${AG[p.a].c}" aria-label="${esc(nameOf(m.from))}, round ${m.r}, ${WORD[m.st]}">
    <header>${novi(p.a, 's')}<b>${esc(nameOf(m.from))}</b><small>${m.t}</small><span class="sp">${m.changed ? `<span class="chip changed">${ICON.revise}Changed stance</span>` : ''}${chip(m.st)}<small class="num">${m.conf.toFixed(2)}</small></span></header>
    <h4>Position</h4><p>${m.pos}</p>
    ${m.code ? `<pre>${esc(m.code)}</pre>` : ''}
    ${m.resp.length ? `<h4>Responses</h4><ul>${m.resp.map(([to, t]) => `<li><span class="ment" data-ref="${M.find(x => x.from === to && x.r <= m.r)?.id || ''}">@${esc(nameOf(to))}</span>: ${t}</li>`).join('')}</ul>` : ''}
    <h4>Proposal</h4><p>${m.prop}</p>
  </article>`;
}

function thread() {
  const shown = M.filter(m => !state.filter || m.from === state.filter);
  return [1, 2, 3].map(r => {
    const ms = shown.filter(m => m.r === r);
    if (!ms.length) { return ''; }
    const agree = r === 3 ? '3 of 3 agree' : r === 2 ? '2 of 3 agree' : 'no agreement yet';
    return `<section aria-labelledby="r${r}"><div class="round"><b id="r${r}">Round ${r} of 3</b><small>${agree}</small><hr></div>${ms.map(msgHtml).join('')}</section>`;
  }).join('');
}

function columns() {
  return `<div class="cols" role="table" aria-label="Positions by round"><div></div>${P.map(p => `<div class="hd" role="columnheader">${novi(p.a, 's')}${esc(nameOf(p.id))}</div>`).join('')}
    ${[1, 2, 3].map(r => `<div class="rl" role="rowheader">Round ${r}</div>${P.map(p => { const m = at(p.id, r); return `<div class="cell" role="cell">${m ? `${chip(m.st)}<div>${m.prop}</div>` : '—'}</div>`; }).join('')}`).join('')}</div>`;
}

function timeline() {
  return `<div class="tl"><table><thead><tr><th></th>${[1, 2, 3].map(r => `<th>Round ${r}</th>`).join('')}</tr></thead><tbody>
    ${P.map(p => `<tr><th>${novi(p.a, 's')} ${esc(nameOf(p.id))}</th>${[1, 2, 3].map(r => { const m = at(p.id, r); return `<td class="${m?.changed ? 'chg' : ''}">${chip(m.st)}${m.changed ? ' <span class="chip changed">changed</span>' : ''}
      <div class="conf">Confidence <span class="bar" style="--c:${AG[p.a].c}"><i style="width:${m.conf * 100}%"></i></span><b class="num">${m.conf.toFixed(2)}</b></div></td>`; }).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}

function raw() {
  return `<div class="raw">${M.filter(m => m.from !== 'you').map(m => `<details${m.id === 'm1' ? ' open' : ''}><summary class="mono">round ${m.r} · ${m.from} · sent 3.1k chars · got ${(m.pos.length + m.prop.length + 180)} chars</summary><pre>## Position
${m.pos.replace(/<[^>]+>/g, '')}
## Responses
${m.resp.map(([to, t]) => `- @${to}: ${t.replace(/<[^>]+>/g, '')}`).join('\n') || '-'}
## Proposal
${m.prop.replace(/<[^>]+>/g, '')}
\`\`\`json
${JSON.stringify({ stance: m.st, agrees_with: m.agrees || [], confidence: m.conf, open_points: m.open })}
\`\`\`</pre></details>`).join('')}</div>`;
}

function side() {
  // Row's latest stance toward column: supports (named in agrees_with), opposes, or neutral — icon and word, not colour alone
  const cell = (row, col) => {
    if (row === col) { return '<td class="self" aria-label="self">—</td>'; }
    const l = latest(row);
    if ((l.agrees || []).includes(col)) { return '<td class="y">✓<span class="tx">supports</span></td>'; }
    if (l.st === 'oppose' && ['propose', 'revise'].includes(latest(col).st)) { return '<td class="n">✗<span class="tx">opposes</span></td>'; }
    return '<td>–<span class="tx">neutral</span></td>';
  };
  return `<aside class="side" aria-label="Summary">
    <section class="card"><div class="h">Agreement · round 3</div>
      <table class="matrix"><thead><tr><th>Row supports column</th>${P.map(p => `<th title="${esc(nameOf(p.id))}">${novi(p.a, 's')}</th>`).join('')}</tr></thead>
      <tbody>${P.map(r => `<tr><th>${novi(r.a, 's')} ${r.role}</th>${P.map(c => cell(r.id, c.id)).join('')}</tr>`).join('')}</tbody></table></section>
    <section class="card"><div class="h">Proposals</div>
      <div class="prop"><b>Cursor storefront + offset admin, opaque cursor</b><small>by Claude Code · Architect, revised in round 3</small>
        <div class="sup">${P.map(p => novi(p.a, 's')).join('')}<small>3 of 3 support</small></div></div>
      <div class="prop"><b>Keep offset, covering index, cap 50</b><small>by Codex · Skeptic, round 1 — withdrawn</small><div class="sup"><small>0 support</small></div></div>
    </section>
    <section class="card"><div class="h">Open points · 3</div><ul class="open"><li>Index migration on a large table</li><li>Deprecation date for ?page=</li><li>Two code paths to test</li></ul></section>
    <section class="card decision"><div class="h">Decision</div>
      <div class="conf">Arbiter (Codex) recommends · confidence <b class="num">0.86</b></div>
      <p><b>Adopt Claude’s round-3 proposal.</b> Everyone supports it; the remaining risk is the index migration — plan it as a separate, online step.</p>
      <div class="acts"><button class="btn primary">Adopt decision</button><button class="btn">Pick another</button><button class="btn">Another round</button><button class="btn ghost danger">Abort</button></div>
    </section>
  </aside>`;
}

function center() {
  const body = { thread: () => `<div class="feed" role="feed" aria-busy="false" aria-label="Discussion thread">${thread()}</div>`, columns, timeline, raw }[state.view]();
  return `<section class="center">
    <div class="tools"><label class="search">${I.search}<input placeholder="Search the thread…" aria-label="Search the thread"></label>
      <span class="filter">${state.filter ? `Showing ${esc(nameOf(state.filter))} · <button class="btn ghost" data-filter="">Show all</button>` : 'All participants · all rounds'}</span>
      <span class="right"><button class="btn ghost">${I.down}Export discussion.md</button></span></div>
    ${body}
    <form class="composer" onsubmit="return false">
      <div class="row"><span class="to">To <select aria-label="Send to"><option>Everyone</option>${P.map(p => `<option>@${esc(nameOf(p.id))}</option>`).join('')}</select></span>
        <span class="to" style="margin-left:auto">${I.user} Your message goes into the next round</span></div>
      <textarea aria-label="Message to the participants" placeholder="Write to everyone, or pick one above to ask a question (R)"></textarea>
      <div class="acts"><span class="grow"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> send · <kbd>?</kbd> shortcuts</span>
        <button class="btn ghost">${I.pin}Pin</button><button class="btn">${I.pause}Pause after this round</button><button class="btn">${I.flag}End &amp; decide</button><button class="btn primary">${I.send}Send</button></div>
    </form>
  </section>`;
}

function render() {
  document.getElementById('app').innerHTML = `${topBar()}<div class="main">${people()}<div class="split" role="separator" aria-orientation="vertical"></div>${center()}<div class="split" role="separator" aria-orientation="vertical"></div>${side()}</div>`;
}

document.addEventListener('click', e => {
  const v = e.target.closest('[data-view]');
  if (v) { state.view = v.dataset.view; return render(); }
  const f = e.target.closest('[data-filter]');
  if (f) { state.filter = f.dataset.filter && state.filter !== f.dataset.filter ? f.dataset.filter : null; return render(); }
  const r = e.target.closest('[data-ref]');
  if (r?.dataset.ref) { const el = document.getElementById(r.dataset.ref); el?.scrollIntoView({ block: 'center' }); el?.classList.add('hl'); setTimeout(() => el?.classList.remove('hl'), 1600); }
  if (e.target.closest('[data-sheet]')) { document.getElementById('sheet').hidden = false; }
  if (e.target.id === 'sheet') { e.target.hidden = true; }
});
document.addEventListener('keydown', e => {
  if (e.target.closest('textarea, input, select')) { return; }
  if (e.key === '?') { document.getElementById('sheet').hidden = false; }
  if (e.key === 'Escape') { document.getElementById('sheet').hidden = true; }
  const n = { 1: 'thread', 2: 'columns', 3: 'timeline', 4: 'raw' }[e.key];
  if (n) { state.view = n; render(); }
});
window.__show = (o = {}) => { Object.assign(state, o); document.documentElement.dataset.theme = state.theme; render(); };
render();
document.getElementById('live').textContent = 'Gemini CLI · Pragmatist replied (round 3). 3 of 3 agree.';
</script>
</body>
</html>
