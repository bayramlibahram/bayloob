<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bayloob orchestration prototype</title>
<style>
/* ===== Tokens: the only place with raw colours. Dark is the default; [data-theme=light] swaps them. ===== */
:root {
  color-scheme: dark;
  --ink: 255 255 255;
  --shade: 0 0 0;
  --shade-k: 1;
  --backdrop: #07060b;
  --surface: #121118;
  --surface-2: #17161e;
  --glass: rgba(18, 17, 24, 0.98);
  --raised: rgb(var(--ink) / 0.04);
  --raised-2: rgb(var(--ink) / 0.07);
  --hover: rgb(var(--ink) / 0.09);
  --line: rgb(var(--ink) / 0.08);
  --line-strong: rgb(var(--ink) / 0.16);
  --text: #f2f2f5;
  --soft: #c9c7d4;
  --muted: #9a99a6;
  --brand: #8b5cff;
  --brand-soft: #b28bff;
  --primary-bg: #7444f2;
  --primary-fg: #ffffff;
  --focus: rgba(139, 92, 255, 0.7);
  --idle: #9a99a6;
  --thinking: #6aa8ff;
  --working: #ffb547;
  --waiting: #ff6b78;
  --done: #4fd59a;
  --on-done: #08130d;
  --cat-workflow: #b28bff;
  --cat-analysis: #6aa8ff;
  --cat-ops: #ffb547;
  --env-dev: #4fd59a;
  --env-staging: #ffb547;
  --env-prod: #ff6b78;
  --a-claude: #ff7a5c;
  --a-codex: #22b8cf;
  --a-gemini: #5b7bff;
  --a-grok: #b6bac6;
  --a-bayloob: #8b5cff;
  --code-bg: rgb(var(--ink) / 0.05);
  --scrim: rgba(5, 4, 9, 0.62);
  --knob: #ffffff;
}
:root[data-theme="light"] {
  color-scheme: light;
  --ink: 20 16 40;
  --shade: 20 16 40;
  --shade-k: 0.35;
  --backdrop: #e9e7f0;
  --surface: #ffffff;
  --surface-2: #faf9fd;
  --glass: rgba(255, 255, 255, 0.98);
  --text: #1b1830;
  --soft: #3f3c55;
  --muted: #625f78;
  --brand: #6a3fe0;
  --brand-soft: #5a32d0;
  --primary-bg: #6a3fe0;
  --focus: rgba(106, 63, 224, 0.6);
  --idle: #625f78;
  --thinking: #1d5fd6;
  --working: #8f5200;
  --waiting: #c42338;
  --done: #12784a;
  --on-done: #ffffff;
  --cat-workflow: #5a32d0;
  --cat-analysis: #1d5fd6;
  --cat-ops: #8f5200;
  --env-dev: #12784a;
  --env-staging: #8f5200;
  --env-prod: #c42338;
  --a-claude: #d4502f;
  --a-codex: #0d8597;
  --a-gemini: #3d5ce0;
  --a-grok: #6b7080;
  --a-bayloob: #6a3fe0;
  --scrim: rgba(40, 36, 60, 0.35);
}

/* ===== Base ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--backdrop); color: var(--text); font: 500 13px/1.45 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; border: 0; background: none; outline: none; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono, code, pre { font-family: ui-monospace, "Ubuntu Mono", "JetBrains Mono", monospace; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.soft { color: var(--soft); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== Prototype bar (not part of the app) ===== */
.protobar { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex-wrap: wrap;
  background: var(--surface); border-bottom: 1px solid var(--line); font-size: 12px; }
.protobar b { font-weight: 700; }
.protobar .tag { padding: 2px 8px; border-radius: 999px; background: var(--raised-2); color: var(--muted); }
.protobar select { padding: 5px 8px; border-radius: 8px; background: var(--raised-2); border: 1px solid var(--line); max-width: 100%; }
.protobar .sp { flex: 1; }
.shot .protobar { display: none; }
.shot * { animation: none !important; transition: none !important; }

/* ===== Window ===== */
.stage { padding: 20px 16px; display: flex; justify-content: center; }
.shot .stage { padding: 0; }
.win { position: relative; width: 1280px; max-width: 100%; height: 800px; display: grid; grid-template-rows: 56px 1fr; border-radius: 18px;
  background: var(--glass); border: 1px solid var(--line); overflow: hidden; box-shadow: 0 24px 60px rgb(var(--shade) / calc(0.5 * var(--shade-k))); }
.shot .win { border-radius: 0; width: 1280px; height: 800px; box-shadow: none; border: 0; }
.whead { display: flex; align-items: center; gap: 12px; padding: 0 14px 0 18px; border-bottom: 1px solid var(--line); }
.whead .logo { width: 30px; height: 30px; }
.whead b { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
.whead .sep { width: 1px; height: 18px; background: var(--line-strong); }
.whead .sub { color: var(--muted); }
.whead .sp { flex: 1; }
.usage { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
.usage span { display: inline-flex; align-items: center; gap: 6px; }
.dots { display: inline-flex; gap: 2px; letter-spacing: 0; }
.dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--c); }
.dots i.on { background: var(--c); }
.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); }
.iconbtn:hover { background: var(--hover); color: var(--text); }
.wbody { display: grid; grid-template-columns: 208px 1fr; min-height: 0; }
.side { display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; border-right: 1px solid var(--line); }
.nav { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--soft); text-align: left; }
.nav:hover { background: var(--raised-2); }
.nav.on { background: rgb(var(--ink) / 0.08); color: var(--text); box-shadow: inset 2px 0 0 var(--brand); }
.nav span { flex: 1; }
.nav em { font-style: normal; font-size: 11px; color: var(--muted); }
.nav em.hot { color: var(--primary-fg); background: var(--waiting); padding: 0 6px; border-radius: 999px; font-weight: 700; }
.side hr { border: 0; height: 1px; background: var(--line); margin: 6px 8px; }
.side .bottom { margin-top: auto; }
.content { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

/* ===== Common components ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 9px;
  background: var(--raised-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--waiting); }
.btn.ghost { background: none; border-color: transparent; color: var(--soft); }
.btn.ghost:hover { background: var(--raised-2); color: var(--text); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: 0.45; filter: none; }
.btn kbd, .kbd { font: 600 10.5px/16px ui-monospace, monospace; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--muted); }
.btn.primary kbd { color: var(--primary-fg); border-color: rgb(255 255 255 / 0.4); }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
  background: var(--raised-2); color: var(--soft); white-space: nowrap; }
.chip.c { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.chip.out { background: none; border: 1px solid var(--line-strong); }
.chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c, currentColor); }
.badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font: 700 10px/1 ui-monospace, monospace;
  letter-spacing: 0.03em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.badge.writes { --c: var(--working); }
.badge.ro { --c: var(--thinking); }
.badge.plan { --c: var(--cat-workflow); }
.badge.prod { --c: var(--env-prod); background: color-mix(in srgb, var(--env-prod) 14%, transparent); }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; }
.novi { width: 22px; height: 22px; flex: none; display: inline-block; object-fit: contain; filter: drop-shadow(0 2px 3px rgb(var(--shade) / calc(0.35 * var(--shade-k)))); }
.novi.l { width: 34px; height: 34px; }
.novi.xl { width: 46px; height: 46px; }
.stack { display: inline-flex; }
.stack .novi + .novi { margin-left: -9px; }
.h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.h2 { font-size: 14px; font-weight: 700; }
.label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.note { display: flex; gap: 8px; align-items: flex-start; padding: 8px 11px; border-radius: 10px; font-size: 12.5px;
  background: color-mix(in srgb, var(--c, var(--working)) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c, var(--working)) 32%, transparent); color: var(--soft); }
.note b { color: var(--text); }
.note .i { color: var(--c, var(--working)); margin-top: 1px; }
.field { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 10px; background: var(--raised-2); border: 1px solid var(--line); }
.field:focus-within { border-color: var(--focus); }
.field input { flex: 1; min-width: 0; }
.field input::placeholder, textarea::placeholder { color: var(--muted); }
select.sel { height: 30px; padding: 0 28px 0 10px; border-radius: 8px; background: var(--raised-2); border: 1px solid var(--line); appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 13px) 13px, calc(100% - 9px) 13px; background-size: 4px 4px; background-repeat: no-repeat; }
select.sel option { background: var(--surface); color: var(--text); }
.stepper { display: inline-flex; align-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--raised-2); }
.stepper button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--soft); }
.stepper button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
.stepper button:disabled { opacity: 0.35; }
.stepper output { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.switch { width: 32px; height: 18px; border-radius: 9px; background: rgb(var(--ink) / 0.18); position: relative; flex: none; transition: background 0.2s; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--knob); transition: transform 0.2s; }
.switch[aria-checked="true"] { background: var(--primary-bg); }
.switch[aria-checked="true"]::after { transform: translateX(14px); }
.seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--raised-2); border: 1px solid var(--line); }
.seg button { height: 24px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(var(--shade) / calc(0.3 * var(--shade-k))); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 20px; }
.tab { position: relative; height: 38px; padding: 0 12px; color: var(--muted); font-weight: 600; }
.tab:hover { color: var(--text); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[aria-selected="true"]::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--brand); }
.tab em { font-style: normal; margin-left: 5px; font-size: 11px; color: var(--muted); }
.tab em.hot { color: var(--waiting); }
.scroll { overflow: auto; min-height: 0; }
.bar { height: 6px; border-radius: 3px; background: var(--raised-2); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; background: var(--c, var(--brand)); }
.bar i.busy { opacity: 0.45; }
.bar i.q { background: repeating-linear-gradient(45deg, var(--working) 0 4px, transparent 4px 7px); }
.sev { --c: var(--idle); }
.sev.high { --c: var(--waiting); }
.sev.medium { --c: var(--working); }
.sev.low { --c: var(--thinking); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 10px; color: var(--muted); font-size: 12px; text-align: center; }
.empty .novi { width: 40px; height: 40px; opacity: 0.8; }
@keyframes slidein { from { opacity: 0; transform: translateY(-6px); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

/* ===== New task dialog ===== */
.scrim { position: absolute; inset: 0; z-index: 10; background: var(--scrim); display: grid; place-items: center; backdrop-filter: blur(2px); }
.dialog { width: 640px; max-height: 720px; display: flex; flex-direction: column; border-radius: 18px; background: var(--surface);
  border: 1px solid var(--line-strong); box-shadow: 0 30px 70px rgb(var(--shade) / calc(0.55 * var(--shade-k))); overflow: hidden; animation: slidein 0.18s ease-out; }
.dh { display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px 18px; border-bottom: 1px solid var(--line); }
.dh .t { flex: 1; display: flex; flex-direction: column; }
.dh .t b { font-size: 15px; font-weight: 700; }
.dh .t span { color: var(--muted); font-size: 12px; }
.steps { display: flex; align-items: center; gap: 4px; list-style: none; }
.steps li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
.steps li + li::before { content: ''; width: 12px; height: 1px; background: var(--line-strong); margin-right: 2px; }
.steps li i { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font: 700 10px/1 system-ui; border: 1px solid var(--line-strong); font-style: normal; }
.steps li[aria-current="step"] { color: var(--text); }
.steps li[aria-current="step"] i { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-fg); }
.steps li.past i { background: color-mix(in srgb, var(--brand) 18%, transparent); border-color: color-mix(in srgb, var(--brand) 45%, transparent); color: var(--brand-soft); }
.db { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; overflow: auto; min-height: 0; }
.db > * { flex-shrink: 0; }
.df { display: flex; align-items: center; gap: 8px; padding: 12px 18px 14px; border-top: 1px solid var(--line); }
.df .msg { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.plist { display: flex; flex-direction: column; gap: 4px; }
.prow { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 11px; border: 1.5px solid transparent; text-align: left; }
.prow:hover { background: var(--raised-2); }
.prow[aria-selected="true"] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 9%, transparent); }
.prow .nm { display: flex; flex-direction: column; min-width: 0; }
.prow .nm b { font-weight: 650; }
.prow .nm span { color: var(--muted); font-size: 12px; }
.prow .meta { display: flex; gap: 6px; align-items: center; }
.glyph { display: inline-grid; place-items: center; min-width: 22px; height: 20px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line-strong);
  font: 700 9.5px/1 ui-monospace, monospace; color: var(--soft); }
.dirty { width: 8px; height: 8px; border-radius: 50%; background: var(--working); }
.clean { width: 8px; height: 8px; border-radius: 50%; background: var(--done); }
.projinfo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.projinfo div { padding: 9px 11px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.projinfo b { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cat { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 16px 14px 14px; border-radius: 14px; text-align: left;
  border: 1.5px solid var(--line); background: var(--raised); min-height: 200px; }
.cat:hover { background: var(--raised-2); }
.cat .ci { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 11px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
.cat .ci .i { width: 20px; height: 20px; }
.cat b { font-size: 14px; }
.cat p { color: var(--soft); font-size: 12.5px; flex: 1; }
.cat .safe { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
.cat .k { position: absolute; top: 12px; right: 12px; }
.cat[aria-checked="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 8%, transparent); }
.cat[aria-checked="true"] .k { background: var(--c); color: var(--surface); border-color: var(--c); }
.presets { display: flex; flex-wrap: wrap; gap: 6px; }
.preset { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-size: 12.5px; font-weight: 600; color: var(--soft); }
.preset:hover { background: var(--raised-2); }
.preset[aria-pressed="true"] { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--text); }
.preset small { font-weight: 500; color: var(--muted); margin-left: 4px; }
.arows { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.arow { display: grid; grid-template-columns: 30px 1fr auto 96px auto; align-items: center; gap: 10px; padding: 8px 12px; }
.arow + .arow { border-top: 1px solid var(--line); }
.arow .nm { display: flex; flex-direction: column; }
.arow .nm small { font-size: 11.5px; color: var(--muted); }
.arow .cap { font-size: 11.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.arow .cap.q { color: var(--working); }
.arow.off { opacity: 0.5; }
.ta { width: 100%; min-height: 76px; resize: none; padding: 10px 12px; border-radius: 12px; background: var(--raised-2); border: 1px solid var(--line); line-height: 1.5; }
.ta:focus { border-color: var(--focus); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.expander { display: flex; align-items: center; gap: 8px; color: var(--soft); font-weight: 600; }
.sentence { font-size: 14.5px; line-height: 1.55; color: var(--soft); }
.sentence b { color: var(--text); }
.diagram { display: flex; align-items: center; gap: 0; padding: 16px 12px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); overflow-x: auto; }
.node { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 92px; }
.node .box { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); min-width: 84px; }
.node .box.you { border-style: dashed; border-color: var(--brand); }
.node small { font-size: 11px; color: var(--muted); }
.node b { font-size: 12px; }
.link { flex: 1; min-width: 18px; height: 1px; background: var(--line-strong); position: relative; top: -10px; }
.gate { width: 9px; height: 9px; transform: rotate(45deg); border: 1.5px solid var(--brand); background: var(--surface); position: relative; top: -10px; margin: 0 -2px; flex: none; }
.loadrow { display: grid; grid-template-columns: 120px 1fr 120px; align-items: center; gap: 12px; font-size: 12.5px; }
.loadrow .r { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.glist { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.glist li { display: flex; align-items: center; gap: 8px; color: var(--soft); }
.glist .gate { top: 0; margin: 0 3px; }

/* ===== Board ===== */
.phead { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; }
.filters { display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; }
.board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; padding: 0 20px 16px; overflow-x: auto; }
.col { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 8px; border-radius: 14px; background: var(--raised); }
.col h3 { display: flex; align-items: center; gap: 6px; padding: 2px 4px 4px; font-size: 12px; font-weight: 700; color: var(--soft); }
.col h3 em { font-style: normal; color: var(--muted); font-weight: 600; }
.col h3 em.hot { color: var(--primary-fg); background: var(--waiting); padding: 0 6px; border-radius: 999px; }
.tcard { display: flex; flex-direction: column; gap: 7px; padding: 10px 11px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); text-align: left;
  box-shadow: 0 1px 2px rgb(var(--shade) / calc(0.2 * var(--shade-k))); animation: slidein 0.2s ease-out; }
.tcard:hover { border-color: var(--line-strong); }
.tcard.needs { border-color: color-mix(in srgb, var(--waiting) 55%, transparent); }
.tcard .tt { display: flex; gap: 7px; align-items: flex-start; }
.tcard .tt b { flex: 1; font-weight: 650; font-size: 12.5px; line-height: 1.35; }
.tcard .ci { color: var(--c); margin-top: 1px; }
.tcard .ln { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
.diff { font: 600 11px ui-monospace, monospace; }
.diff .a { color: var(--done); } .diff .r { color: var(--waiting); }
.compact .tcard { gap: 4px; padding: 7px 9px; }
.compact .tcard .usage-line { display: none; }

/* ===== Task detail ===== */
.dhead { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px 10px; }
.dhead .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
.crumb:hover { color: var(--text); }
.stepbar { display: flex; align-items: center; gap: 0; padding: 4px 20px 14px; }
.sstep { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; font-size: 12.5px; white-space: nowrap; }
.sstep .si { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); color: var(--muted); }
.sstep.done .si { background: var(--done); border-color: var(--done); color: var(--on-done); }
.sstep.run .si { border-color: var(--thinking); color: var(--thinking); }
.sstep.wait .si { border-color: var(--waiting); color: var(--waiting); background: color-mix(in srgb, var(--waiting) 14%, transparent); }
.sstep.fail .si { background: var(--waiting); border-color: var(--waiting); color: var(--primary-fg); }
.sstep small { color: var(--muted); }
.sstep[aria-current="step"] { background: var(--raised-2); }
.sline { flex: 1; min-width: 12px; height: 1px; background: var(--line-strong); }
.pane { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 20px; }
.cands { display: grid; grid-template-columns: repeat(3, minmax(250px, 1fr)); gap: 12px; align-items: start; }
.cand .row { flex-wrap: wrap; }
.cand { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--raised); border: 1.5px solid var(--line); }
.cand.win { border: 2px solid var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent); }
.cand .ch { display: flex; align-items: center; gap: 10px; }
.cand .ch .nm { flex: 1; display: flex; flex-direction: column; }
.cand .ch small { color: var(--muted); font-size: 11.5px; }
.strip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; font-size: 12px;
  background: color-mix(in srgb, var(--c) 11%, transparent); color: var(--c); font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); }
.kv dd { font-variant-numeric: tabular-nums; }
.score { display: flex; align-items: center; gap: 8px; }
.score .bar { flex: 1; }
.score b { font-variant-numeric: tabular-nums; }
.reasons { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--soft); }
.reasons li::before { content: '–'; color: var(--muted); margin-right: 6px; }
.reco { display: grid; grid-template-columns: 1fr 300px; gap: 14px; }
.reco .card { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.rlabel { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cat-workflow); }
.rank { display: flex; flex-direction: column; gap: 10px; }
.rank .r { display: grid; grid-template-columns: 22px 24px 1fr 150px; gap: 10px; align-items: center; }
.rank .r .n { color: var(--muted); font-weight: 700; text-align: right; }
.actions { position: sticky; bottom: 0; display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--surface); }
.actions .msg { flex: 1; color: var(--muted); font-size: 12px; }
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:hover td { background: var(--raised); }
.tbl .ev { font: 12px ui-monospace, monospace; color: var(--brand-soft); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--brand-soft) 40%, transparent); text-underline-offset: 2px; }
.conf { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.conf .bar { width: 44px; }
.rb { display: flex; flex-direction: column; gap: 8px; }
.rstep { display: grid; grid-template-columns: 28px 1fr; gap: 12px; padding: 10px 14px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
.rstep.prod { border-color: color-mix(in srgb, var(--env-prod) 45%, transparent); background: color-mix(in srgb, var(--env-prod) 5%, var(--raised)); }
.rstep.focus { border-color: var(--focus); }
.rstep .rn { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; background: var(--raised-2); color: var(--soft); }
.rstep.done .rn { background: var(--done); color: var(--on-done); }
.rstep.skip .rn { text-decoration: line-through; }
.rstep.run .rn { border: 2px solid var(--thinking); background: none; }
.rstep .body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.cmd { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 9px; background: var(--code-bg); border: 1px solid var(--line); font: 12.5px ui-monospace, monospace; }
.cmd code { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.output { padding: 8px 10px; border-radius: 9px; background: var(--code-bg); font: 11.5px/1.55 ui-monospace, monospace; color: var(--soft); white-space: pre-wrap; max-height: 120px; overflow: auto; }
.host { --c: var(--env-dev); }
.host.staging { --c: var(--env-staging); }
.host.prod { --c: var(--env-prod); }
details.rollback summary { cursor: pointer; color: var(--muted); font-size: 12px; }
details.rollback .cmd { margin-top: 6px; }
.timeline { list-style: none; display: flex; flex-direction: column; }
.timeline li { display: grid; grid-template-columns: 64px 28px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
.timeline .tm { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 3px; }
.actor { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--raised-2); color: var(--soft); }
.actor.you { background: color-mix(in srgb, var(--brand) 18%, transparent); color: var(--brand-soft); }
.actor.arb { background: color-mix(in srgb, var(--cat-workflow) 16%, transparent); color: var(--cat-workflow); }
.timeline .tx { display: flex; flex-direction: column; gap: 2px; font-size: 12.5px; }
.timeline .tx small { color: var(--muted); }

/* ===== Builder ===== */
.stages { display: flex; flex-direction: column; gap: 10px; max-width: 920px; }
.scard { display: grid; grid-template-columns: 20px 1fr; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
.scard .grip { color: var(--muted); cursor: grab; padding-top: 4px; }
.scard .sh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.scard .sh .sn { font-weight: 700; }
.slot { display: grid; grid-template-columns: 24px 150px auto auto 1fr; gap: 10px; align-items: center; padding: 6px 0; }
.editor { position: relative; padding: 8px 10px; border-radius: 9px; background: var(--code-bg); border: 1px solid var(--line); font: 12px/1.55 ui-monospace, monospace; color: var(--soft); white-space: pre-wrap; }
.editor .var { color: var(--brand-soft); background: color-mix(in srgb, var(--brand) 12%, transparent); border-radius: 4px; padding: 0 2px; }
.complete { position: absolute; left: 160px; top: 44px; z-index: 3; width: 240px; padding: 4px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line-strong);
  box-shadow: 0 10px 28px rgb(var(--shade) / calc(0.4 * var(--shade-k))); font-family: -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; }
.complete div { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border-radius: 7px; font-size: 12px; }
.complete div.on { background: color-mix(in srgb, var(--brand) 16%, transparent); }
.complete code { color: var(--brand-soft); }
.complete small { color: var(--muted); }
.valid { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--c); }
.opts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--soft); }

/* ===== Settings ===== */
.stbl td, .stbl th { vertical-align: middle; }
.stbl tr.off td { opacity: 0.55; }
.stbl tr.prod td { background: color-mix(in srgb, var(--env-prod) 5%, transparent); }
.inl { height: 28px; padding: 0 8px; border-radius: 7px; background: var(--raised-2); border: 1px solid var(--line); width: 100%; }
.pats { display: flex; flex-wrap: wrap; gap: 4px; }
.pats .chip { font-family: ui-monospace, monospace; font-weight: 500; }
.limits { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.limits .card { padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
.limits .card .grow small { display: block; color: var(--muted); font-size: 11.5px; }
</style>
</head>

const I = (n, extra = '') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${extra}>${ICONS[n] || ''}</svg>`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const novi = (a, cls = '') => `<img class="novi ${cls}" src="${NOVI[`${a === 'bayloob' ? 'purple' : AG[a].pack}-idle`]}" alt="">`;
const free = a => Math.max(0, AG[a].max - AG[a].busy);
const dots = (a, used) => `<span class="dots" style="--c:${AG[a].c}" aria-label="${used} of ${AG[a].max}">${Array.from({ length: AG[a].max }, (_, i) => `<i class="${i < used ? 'on' : ''}"></i>`).join('')}</span>`;
const catColor = c => c === 'ops' ? 'var(--cat-ops)' : CATS[c].c;
const catIcon = c => c === 'ops' ? 'term' : CATS[c].icon;
const catName = c => c === 'ops' ? 'Operations' : CATS[c].title;
const modeBadge = m => m === 'writes' ? '<span class="badge writes">writes</span>' : m === 'plan' ? '<span class="badge plan">plan</span>' : '<span class="badge ro">read-only</span>';
const list = (a) => a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`;

function applyScreen(id) {
  S.screen = id;
  const w = S.wiz;
  if (id.startsWith('new-')) {
    const [, part, cat] = id.split('-');
    w.step = { project: 1, category: 2, config: 3, confirm: 4 }[part];
    if (cat) { w.category = cat; w.project = cat === 'analysis' ? 'api' : cat === 'single' ? 'blog' : 'shop'; }
  }
  if (id.startsWith('detail-')) {
    S.tab = id.slice(7);
    S.detailTask = ['report', 'runbook'].includes(S.tab) ? 't2' : S.detailTask === 't2' && S.tab === 'log' ? 't2' : 't1';
  }
  if (id.startsWith('settings-')) { S.settingsTab = id.slice(9); }

// ---------- Window shell ----------
function shell(section, inner) {

// ---------- Board ----------
function board() {
  const cols = COLS.map(([k, name]) => {
    const cards = TASKS.filter(t => t.col === k);
    const body = cards.length ? cards.map(tcard).join('') : `<div class="empty">${k === 'needs' ? 'Nothing waiting on you' : 'No tasks here'}</div>`;
    return `<section class="col" aria-label="${name}"><h3>${name}<em class="${k === 'needs' && cards.length ? 'hot' : ''}">${cards.length}</em></h3>${body}</section>`;
  }).join('');
  return `<div class="phead"><div class="h1">Tasks</div><span class="grow"></span>
      <div class="seg" role="group" aria-label="Density"><button type="button" data-density="comfortable" aria-pressed="${S.density === 'comfortable'}">Comfortable</button><button type="button" data-density="compact" aria-pressed="${S.density === 'compact'}">Compact</button></div>
      <button class="btn primary" type="button" data-go="new-project">${I('plus')} New task <kbd>Ctrl N</kbd></button></div>
    <div class="filters"><div class="field" style="width:240px">${I('search')}<input placeholder="Filter tasks…  /" aria-label="Filter tasks"></div>
      <select class="sel" aria-label="Project"><option>All projects</option>${PROJECTS.map(p => `<option>${p.id}</option>`).join('')}</select>
      <select class="sel" aria-label="Category"><option>All categories</option><option>Single agent</option><option>Agentic workflow</option><option>Analysis &amp; operations</option></select>
      <select class="sel" aria-label="Agent"><option>All agents</option>${Object.keys(AG).filter(a => AG[a].installed).map(a => `<option>${AG[a].name}</option>`).join('')}</select></div>
    <div class="board${S.density === 'compact' ? ' compact' : ''}">${cols}</div>`;
}
function tcard(t) {
  const ag = Object.entries(t.agents).map(([a, n]) => `<span class="row" style="gap:3px">${novi(a)}<span class="num">×${n}</span></span>`).join('');
  const use = Object.entries(t.run).map(([a, n]) => `${dots(a, Math.min(AG[a].max, AG[a].busy))}`).join(' ');
  return `<button type="button" class="tcard${t.col === 'needs' ? ' needs' : ''}" data-open="${t.id}">
    <div class="tt"><span class="ci" style="--c:${catColor(t.cat)}" title="${catName(t.cat)}">${I(catIcon(t.cat))}</span><b>${esc(t.title)}</b></div>
    <div class="ln"><span class="chip out">${t.project}</span><span>${esc(t.pattern)}</span></div>
    <div class="ln"><span class="chip c" style="--c:${t.col === 'needs' ? 'var(--waiting)' : t.col === 'failed' ? 'var(--waiting)' : t.col === 'done' ? 'var(--done)' : t.col === 'running' ? 'var(--thinking)' : 'var(--idle)'}">${t.col === 'running' ? `${I('clock', ' class="i spin" style="width:11px;height:11px"')}` : ''}${esc(t.stage)}</span></div>
    ${t.why ? `<div class="ln" style="color:var(--waiting);font-weight:600">${I('alert', ' style="width:13px;height:13px"')}${esc(t.why)}</div>` : ''}
    ${t.queued ? `<div class="ln" style="color:var(--working)">${esc(t.queued)}</div>` : ''}
    <div class="ln usage-line">${ag}<span class="grow"></span>${use}</div>
    <div class="ln"><span class="num">${I('clock', ' style="width:12px;height:12px"')} ${t.elapsed}</span><span class="grow"></span>${t.diff ? `<span class="diff"><span class="a">+${t.diff[0]}</span> <span class="r">−${t.diff[1]}</span></span>` : ''}</div>
  </button>`;
}

// ---------- New task dialog ----------
function dialog() {
  const w = S.wiz;
  const names = ['Project', 'Category', 'Configure', 'Confirm'];
  const steps = names.map((n, i) => `<li class="${i + 1 < w.step ? 'past' : ''}"${i + 1 === w.step ? ' aria-current="step"' : ''}><i>${i + 1 < w.step ? '✓' : i + 1}</i>${n}</li>`).join('');
  const p = PROJECTS.find(x => x.id === w.project);
  const sub = w.step === 1 ? 'Where should the agents work?' : `${p.id} · ${CATS[w.category].title}`;
  const body = [null, stepProject, stepCategory, stepConfigure, stepConfirm][w.step]();
  const last = w.step === 4;
  const startOff = last && w.category !== 'single';
  const hint = w.step === 2 ? '<kbd class="kbd">1</kbd><kbd class="kbd">2</kbd><kbd class="kbd">3</kbd> pick · <kbd class="kbd">Ctrl ⏎</kbd> next'
    : last ? (startOff ? `${I('info')} Draft saved — it's here when you come back` : '<kbd class="kbd">Ctrl ⏎</kbd> start')
    : '<kbd class="kbd">Ctrl ⏎</kbd> next · <kbd class="kbd">Alt ←</kbd> back';
  return `<div class="scrim"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <header class="dh"><div class="t"><b id="dlgTitle">New task</b><span>${esc(sub)}</span></div><ol class="steps" aria-label="Steps">${steps}</ol>
      <button class="iconbtn" type="button" title="Close (Esc)" aria-label="Close" data-go="board">${I('x')}</button></header>
    <div class="db">${body}</div>
    <footer class="df"><div class="msg">${hint}</div>
      <button class="btn" type="button" data-wiz="back">${w.step === 1 ? 'Cancel' : 'Back'}</button>
      ${last ? `<span title="${startOff ? 'Available after step 03/04 — the draft is saved' : 'Start the session'}"><button class="btn primary" type="button" ${startOff ? 'disabled aria-disabled="true"' : 'data-go="board"'}>${I('play')} Start</button></span>`
        : `<button class="btn primary" type="button" data-wiz="next">Next ${I('next')}</button>`}
    </footer></section></div>`;
}
function stepProject() {
  const w = S.wiz;
  const p = PROJECTS.find(x => x.id === w.project);
  const rows = PROJECTS.map(x => `<button type="button" class="prow" role="option" aria-selected="${x.id === w.project}" data-project="${x.id}">
      <span class="nm"><b>${x.id}</b><span class="mono">${x.path}</span></span>

      <span class="meta"><span class="chip">${I('branch', ' style="width:12px;height:12px"')}${x.branch}</span><span class="${x.dirty ? 'dirty' : 'clean'}" title="${x.dirty ? `${x.dirty} uncommitted changes` : 'Clean'}"></span></span>
    </button>`).join('');

function stepCategory() {
  const w = S.wiz;
  return `<div class="cats" role="radiogroup" aria-label="Category">${Object.entries(CATS).map(([k, c], i) => `
    <button type="button" class="cat" role="radio" aria-checked="${k === w.category}" data-cat="${k}" style="--c:${c.c}">
      <span class="kbd k">${i + 1}</span><span class="ci">${I(c.icon)}</span><b>${c.title}</b><p>${c.desc}</p>
      <span class="safe">${I(k === 'single' ? 'user' : k === 'workflow' ? 'branch' : 'shield', ' style="width:13px;height:13px"')}${c.safe}</span></button>`).join('')}</div>
    <div class="muted" style="font-size:12px">Last used for <b class="soft">${w.project}</b>: ${CATS[PROJECTS.find(p => p.id === w.project).last].title}.</div>`;
}
function agentRows(counts, mode, roleWord) {
  return `<div class="arows">${Object.keys(AG).map(a => {
    const ag = AG[a];
    if (!ag.installed) {
      return `<div class="arow off"><span>${novi(a, 'l')}</span><span class="nm"><b>${ag.name}</b><small>Not installed</small></span><span></span><span class="cap"></span><span title="Install the CLI, then restart Bayloob"><span class="stepper"><button type="button" disabled aria-label="Fewer">${I('minus')}</button><output>0</output><button type="button" disabled aria-label="More">${I('plus')}</button></span></span></div>`;
    }
    const n = counts[a] || 0;
    const q = Math.max(0, n - free(a));
    return `<div class="arow"><span>${novi(a, 'l')}</span><span class="nm"><b>${ag.name}</b><small>${n ? `${n} ${roleWord}${n > 1 ? 's' : ''}` : 'not used'}</small></span>
      <span>${n ? modeBadge(mode) : ''}</span>
      <span class="cap${q ? ' q' : ''}">${q ? `${q} will queue` : `${free(a)} free of ${ag.max}`}</span>
      <span class="stepper" role="group" aria-label="${ag.name} count"><button type="button" data-count="${a}:-1" ${n === 0 ? 'disabled' : ''} aria-label="Fewer">${I('minus')}</button><output>${n}</output><button type="button" data-count="${a}:1" ${n >= ag.max ? 'disabled' : ''} aria-label="More">${I('plus')}</button></span></div>`;
  }).join('')}</div>`;
}
function arbiterRow(key, avoid) {

  return `<div class="row"><span class="label" style="width:72px">Arbiter</span>
    <select class="sel" data-arbiter="${key}" aria-label="Arbiter">${Object.keys(AG).filter(a => AG[a].installed).map(a => `<option value="${a}"${a === v ? ' selected' : ''}>${AG[a].name}</option>`).join('')}</select>
    ${modeBadge('ro')}<span class="muted grow" style="font-size:12px">${avoid.includes(v) ? `<span style="color:var(--working)">${I('alert', ' style="width:12px;height:12px;vertical-align:-2px"')} Same agent as a builder — it may prefer its own work</span>` : 'Different from the builders — less likely to prefer its own work'}</span></div>`;
}
function stepConfigure() {
  const w = S.wiz;
  if (w.category === 'single') {
    return `<div class="label">Agent</div><div class="arows">${Object.keys(AG).map(a => `<div class="arow${AG[a].installed ? '' : ' off'}" style="grid-template-columns:30px 1fr auto">
        <span>${novi(a, 'l')}</span><span class="nm"><b>${AG[a].name}</b><small>${AG[a].installed ? `${free(a)} free of ${AG[a].max}` : 'Not installed'}</small></span>
        <span role="radio" aria-checked="${w.single.agent === a}" class="chip${w.single.agent === a ? ' c' : ' out'}" style="--c:var(--brand)">${w.single.agent === a ? `${I('check', ' style="width:12px;height:12px"')} Selected` : 'Pick'}</span></div>`).join('')}</div>
      <div class="label">Prompt</div><textarea class="ta" aria-label="Prompt">Fix the broken image links in the 2024 posts.</textarea>
      <div class="row"><button type="button" class="switch" role="switch" aria-checked="false" aria-label="In a new git worktree"></button><span class="grow">In a new git worktree <span class="muted">— its own copy on a bayloob/… branch</span></span>
        <span class="muted">Open in</span><select class="sel" aria-label="Terminal"><option>Ptyxis</option><option>xterm</option></select></div>`;

      <div class="row"><span class="label grow">Builders · each in its own worktree</span><span class="muted" style="font-size:12px">Planner: Claude Code ×1 ${modeBadge('plan')}</span></div>
      ${agentRows(w.counts, 'writes', 'builder')}
      ${arbiterRow('arbiter', used)}
      <div class="label">Task</div><textarea class="ta" aria-label="Task">${esc(w.text)}</textarea>
      <button type="button" class="expander" data-go="builder">${I('edit')} Customize stages… <span class="muted" style="font-weight:500">roles, gates, loops, prompts</span></button>`;
  }
  const incident = w.preset === 'incident';
  return `<div class="presets" role="group" aria-label="Preset">${Object.entries(ANALYSIS).map(([k, n]) => `<button type="button" class="preset" aria-pressed="${k === w.preset}" data-preset="${k}">${n}</button>`).join('')}</div>
    <div class="label">Analysts · read-only, in parallel</div>
    ${agentRows(w.analysts, 'ro', 'analyst')}
    ${arbiterRow('aArbiter', [])}
    <div class="label">Question</div><textarea class="ta" style="min-height:56px" aria-label="Question">${esc(w.question)}</textarea>
    ${incident ? `<div class="label">Log sources · collected read-only into the task</div>
      <div class="arows"><div class="arow" style="grid-template-columns:auto 1fr auto"><span class="chip host staging c">${I('plug', ' style="width:12px;height:12px"')}staging-web</span><code class="mono soft">journalctl -u php8.3-fpm --since "-6h"</code><button class="btn sm ghost" type="button" aria-label="Remove">${I('x')}</button></div>
      <div class="arow" style="grid-template-columns:auto 1fr auto"><span class="chip host staging c">${I('plug', ' style="width:12px;height:12px"')}staging-web</span><code class="mono soft">docker logs --tail 500 api-web</code><button class="btn sm ghost" type="button" aria-label="Remove">${I('x')}</button></div>

    <div class="row"><button type="button" class="switch" role="switch" aria-checked="${w.opsPlan}" data-ops aria-label="Also prepare an operations plan"></button><span class="grow">Also prepare an operations plan <span class="muted">— commands are only proposed; each runs when you click</span></span></div>`;
}
function stepConfirm() {
  const w = S.wiz;
  const p = w.project;
  if (w.category === 'single') {
    return `<p class="sentence"><b>Claude Code</b> starts in <b>${p}</b> and gets your prompt. It opens in <b>Ptyxis</b>; permissions come to the pill.</p>
      <div class="diagram"><div class="node"><div class="box">${novi('claude', 'l')}<b>Claude Code</b><small>×1</small></div><small>writes in ${p}</small></div></div>`;
  }
  if (w.category === 'workflow') {
    const used = Object.keys(w.counts).filter(a => w.counts[a]);
    const total = used.reduce((s, a) => s + w.counts[a], 0);
    const lst = list(used.map(a => `${AG[a].name} ×${w.counts[a]}`));
    const builders = used.flatMap(a => Array(w.counts[a]).fill(a));
    const loads = Object.keys(AG).filter(a => AG[a].installed).map(a => {
      const req = (w.counts[a] || 0) + (a === 'claude' ? 0 : 0) + (a === w.arbiter ? 1 : 0);
      const ag = AG[a]; const fit = Math.min(req, free(a)); const q = req - fit;
      const seg = (n, cls = '') => n ? `<i class="${cls}" style="width:${(n / ag.max) * 100}%;--c:${ag.c}"></i>` : '';
      return `<div class="loadrow"><span class="row" style="gap:6px">${novi(a)}${ag.name}</span><div class="bar" role="img" aria-label="${ag.busy} busy, ${fit} new, ${q} queued of ${ag.max}">${seg(ag.busy, 'busy')}${seg(fit)}${q ? `<i class="q" style="width:${(q / ag.max) * 100}%"></i>` : ''}</div>
        <span class="r">${ag.busy + fit}/${ag.max}${q ? ` · <span style="color:var(--working)">${q} will queue</span>` : ''}</span></div>`;
    }).join('');
    return `<p class="sentence"><b>${total} agents</b> will build in parallel (${lst}), each in its own worktree. Arbiter: <b>${AG[w.arbiter].name}</b>. You'll be asked: <b>after the plan</b> and <b>before merge</b>.</p>
      <div class="diagram" role="img" aria-label="Stages: Plan, Build, Tests, Arbiter, your merge">
        <div class="node"><div class="box">${novi('claude', 'l')}<b>Plan</b><small>${modeBadge('plan')}</small></div><small>Claude Code ×1</small></div><span class="gate" title="Gate: you approve the plan"></span><span class="link"></span>
        <div class="node"><div class="box"><span class="stack">${builders.map(a => novi(a, 'l')).join('')}</span><b>Build ×${total}</b><small>${modeBadge('writes')}</small></div><small>parallel worktrees</small></div><span class="link"></span>

  ];
  const actor = a => a === 'you' ? `<span class="actor you">${I('user', ' style="width:13px;height:13px"')}</span>` : a === 'engine' ? `<span class="actor">${I('cpu', ' style="width:13px;height:13px"')}</span>` : novi(a);
  return `<div class="pane"><div class="row" style="margin-bottom:8px"><div class="seg" role="group" aria-label="Actor"><button type="button" aria-pressed="true">All</button><button type="button" aria-pressed="false">You</button><button type="button" aria-pressed="false">Engine</button><button type="button" aria-pressed="false">Agents</button><button type="button" aria-pressed="false">Arbiter</button></div><span class="grow"></span><span class="muted mono" style="font-size:12px">log.jsonl</span></div>
    <ol class="timeline">${rows.map(r => `<li><span class="tm">${r[0]}</span>${actor(r[1])}<span class="tx"><b>${esc(r[2])}</b>${r[3] ? `<small>${esc(r[3])}</small>` : ''}</span></li>`).join('')}</ol></div>`;
}

// ---------- Settings ----------
function settings() {
  const tabs = `<div class="tabs" role="tablist">${[['agents', 'Agents'], ['hosts', 'Hosts']].map(([k, n]) => `<button class="tab" role="tab" type="button" aria-selected="${S.settingsTab === k}" data-stab="${k}">${n}</button>`).join('')}</div>`;
  const head = `<div class="phead"><div class="h1">Settings</div></div>${tabs}`;
  if (S.settingsTab === 'hosts') {
    return `${head}<div class="pane"><div class="row" style="margin-bottom:12px"><span class="muted grow">Operations run only on these hosts, only commands that match their patterns, and only after your click. Bayloob never stores passwords — it uses your SSH keys.</span><button class="btn" type="button">${I('plus')} Add host</button></div>
      <table class="tbl stbl"><thead><tr><th>Name</th><th>SSH alias</th><th>Environment</th><th>Allowed commands</th><th></th></tr></thead><tbody>
      ${HOSTS.map(h => `<tr class="${h.env === 'prod' ? 'prod' : ''}"><td style="white-space:nowrap"><b>${h.name}</b> ${h.env === 'prod' ? '<span class="badge prod">PROD</span>' : ''}</td><td>${h.local ? `<span class="muted">${h.alias}</span>` : `<input class="inl mono" value="${h.alias}" aria-label="SSH alias" style="width:150px">`}</td>
        <td style="white-space:nowrap"><select class="sel" aria-label="Environment"${h.local ? ' disabled' : ''}>${['dev', 'staging', 'prod'].map(e => `<option${e === h.env ? ' selected' : ''}>${e}</option>`).join('')}</select> <span class="chip c host ${h.env}"><span class="d"></span>${h.env}</span></td>
        <td><div class="pats">${h.pats.map(p => `<span class="chip">${esc(p)}</span>`).join('')}<button class="btn sm ghost" type="button">${I('plus')}</button></div></td>
        <td style="text-align:right">${h.local ? '' : `<button class="btn sm" type="button" title="Runs ssh -o BatchMode=yes ${h.alias} true after you confirm">Test connection</button>`}</td></tr>`).join('')}
      </tbody></table>
      <div class="note" style="--c:var(--env-prod);margin-top:12px">${I('shield')}<span><b>Production hosts:</b> red everywhere, high-risk steps need the host name typed, and Combo auto-allow is off.</span></div></div>`;
  }
  return `${head}<div class="pane"><div class="limits">
      <div class="card"><span class="grow">Max parallel agents<small>all tasks together</small></span><span class="stepper"><button type="button" aria-label="Fewer">${I('minus')}</button><output>6</output><button type="button" aria-label="More">${I('plus')}</button></span></div>
      <div class="card"><span class="grow">Per project<small>at the same time</small></span><span class="stepper"><button type="button" aria-label="Fewer">${I('minus')}</button><output>4</output><button type="button" aria-label="More">${I('plus')}</button></span></div>
      <div class="card"><span class="grow">Hold launches below<small>free memory · now 20.6 GB</small></span><span class="stepper"><button type="button" aria-label="Less">${I('minus')}</button><output>2</output><button type="button" aria-label="More">${I('plus')}</button></span><span class="muted">GB</span></div></div>
    <table class="tbl stbl"><thead><tr><th>Agent</th><th>Enabled</th><th>Max parallel</th><th>Launch command</th><th>Read-only command</th><th>Notes</th></tr></thead><tbody>
    ${Object.keys(AG).map(a => { const g = AG[a]; return `<tr class="${g.installed ? '' : 'off'}"><td><span class="row">${novi(a, 'l')}<span><b>${g.name}</b><br><small class="muted">${g.installed ? `v${g.ver} · ${g.busy} running` : 'Not installed — install the CLI, then restart Bayloob'}</small></span></span></td>
      <td><button type="button" class="switch" role="switch" aria-checked="${g.installed}" aria-label="${g.name} enabled"${g.installed ? '' : ' disabled'}></button></td>
      <td><span class="stepper"><button type="button" aria-label="Fewer"${g.installed ? '' : ' disabled'}>${I('minus')}</button><output>${g.max}</output><button type="button" aria-label="More"${g.installed ? '' : ' disabled'}>${I('plus')}</button></span></td>
      <td><code class="mono soft" style="font-size:12px">${esc(g.launch)}</code></td><td><code class="mono soft" style="font-size:12px">${esc(g.ro)}</code></td>
      <td><input class="inl" value="${esc(g.notes)}" placeholder="e.g. subscription plan" aria-label="${g.name} notes"${g.installed ? '' : ' disabled'}></td></tr>`; }).join('')}
    </tbody></table>
    <p class="muted" style="margin-top:10px;font-size:12px">Commands were checked on this computer (<span class="mono">--help</span> and a test run). Colours and Novi follow each agent.</p></div>`;
}

// ---------- Render + events ----------
const win = document.getElementById('win');
function render() {
  document.documentElement.dataset.theme = S.theme;
  const sc = S.screen;
  let html;
  if (sc.startsWith('new-')) { html = shell('tasks', board()) + dialog(); }
  else if (sc === 'builder') { html = shell('tasks', builder()); }
  else if (sc.startsWith('detail-')) { html = shell('tasks', detail()); }
  else if (sc.startsWith('settings-')) { html = shell('settings', settings()); }
  else { html = shell('tasks', board()); }
  win.innerHTML = html;
  document.getElementById('theme').textContent = S.theme === 'dark' ? 'Light theme' : 'Dark theme';
  document.getElementById('screen').value = sc;
  const h = `#s=${sc}&t=${S.theme}${document.body.classList.contains('shot') ? '&shot' : ''}`;
  if (location.hash !== h) { history.replaceState(null, '', h); }
}
function go(id) { applyScreen(id); render(); }
const sel = document.getElementById('screen');
sel.innerHTML = SCREENS.map(([k, n]) => `<option value="${k}">${n}</option>`).join('');
sel.addEventListener('change', () => go(sel.value));
document.getElementById('theme').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(); });
win.addEventListener('click', e => {
  const t = e.target.closest('button, a, [data-open]');
  if (!t) { return; }
  if (t.tagName === 'A') { e.preventDefault(); }
  const d = t.dataset; const w = S.wiz;
  if (d.go) { return go(d.go); }
  if (d.open) { S.detailTask = d.open; return go(d.open === 't2' ? 'detail-runbook' : 'detail-decision'); }
  if (d.tab) { S.tab = d.tab; S.screen = `detail-${d.tab}`; return render(); }
  if (d.stab) { return go(`settings-${d.stab}`); }
  if (d.nav) { return go(d.nav === 'settings' ? 'settings-agents' : 'board'); }
  if (d.density) { S.density = d.density; return render(); }
  if (d.project) { w.project = d.project; w.category = PROJECTS.find(p => p.id === d.project).last; return render(); }
  if (d.cat) { w.category = d.cat; return render(); }
  if (d.pattern) { w.pattern = d.pattern; return render(); }
  if (d.preset) { w.preset = d.preset; return render(); }
  if (d.ops !== undefined) { w.opsPlan = !w.opsPlan; return render(); }
  if (d.pick) { S.pick = d.pick; return render(); }
  if (d.count) {
    const [a, delta] = d.count.split(':');
    const bag = w.category === 'analysis' ? w.analysts : w.counts;
    bag[a] = Math.max(0, Math.min(AG[a].max, (bag[a] || 0) + Number(delta)));
    return render();
  }
  if (d.wiz) {
    const order = ['project', 'category', 'config', 'confirm'];
    const next = w.step + (d.wiz === 'next' ? 1 : -1);
    if (next < 1) { return go('board'); }
    return go(next <= 2 ? `new-${order[next - 1]}` : `new-${order[next - 1]}-${w.category}`);
  }
});
win.addEventListener('change', e => { if (e.target.dataset.arbiter) { S.wiz[e.target.dataset.arbiter] = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  if (!S.screen.startsWith('new-')) { return; }
  if (e.ctrlKey && e.key === 'Enter') { e.preventDefault(); document.querySelector('[data-wiz="next"]')?.click(); }
  if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); document.querySelector('[data-wiz="back"]')?.click(); }
  if (S.wiz.step === 2 && ['1', '2', '3'].includes(e.key) && !e.target.closest('input, textarea')) { S.wiz.category = Object.keys(CATS)[Number(e.key) - 1]; render(); }
  if (e.key === 'Escape') { go('board'); }
});
// #s=<screen>&t=<dark|light>[&shot] — links to a screen; the screenshot script uses it too
function fromHash() {
  const hp = new URLSearchParams(location.hash.slice(1));
  document.body.classList.toggle('shot', hp.has('shot'));
  S.theme = hp.get('t') === 'light' ? 'light' : 'dark';
  applyScreen(SCREENS.some(s => s[0] === hp.get('s')) ? hp.get('s') : 'board');
  render();
}
window.addEventListener('hashchange', fromHash);
fromHash();
</script>
</body>
</html>
