<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Bayloob launcher</title>
<style>
  :root {
    --glass: rgba(18, 17, 23, 0.97);
    --field: rgba(255,255,255,0.05);
    --line: rgba(255,255,255,0.09);
    --text: #f2f2f5;
    --muted: #8b8b96;
    --brand: #8b5cff;
    --error: #ff5d6c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden;
    font: 500 13px/1.4 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; border: 0; background: none; outline: none; }
  button { cursor: pointer; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }

  .panel { margin: 10px; padding: 16px; border-radius: 18px; background: var(--glass);
    border: 1px solid var(--line); box-shadow: 0 16px 40px rgba(0,0,0,.45);
    display: flex; flex-direction: column; gap: 12px; animation: pop .18s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
  .step { display: flex; flex-direction: column; gap: 12px; animation: slide .16s ease-out; }
  @keyframes slide { from { opacity: 0; transform: translateX(8px); } }

  .title { display: flex; align-items: center; gap: 10px; }
  .title .m { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 2px 5px rgba(0,0,0,.45)); }
  .title b { font-size: 15px; font-weight: 650; }
  .title span { color: var(--muted); font-size: 12px; }
  .title kbd { margin-left: auto; color: var(--muted); font: 11px ui-monospace, monospace; }
  .thumb { position: relative; width: 100%; height: 100%; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }

  .field { width: 100%; padding: 10px 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--line); }
  .field:focus { border-color: color-mix(in srgb, var(--brand) 70%, transparent); }
  textarea.field { resize: none; height: 92px; font-size: 14px; line-height: 1.45; }
  input.field { font: 12px ui-monospace, "Ubuntu Mono", monospace; padding: 7px 10px; border-radius: 9px; }

  /* project line under the prompt */
  .project { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .project svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; }
  .project input { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--field);
    border: 1px solid var(--line); font-size: 12px; color: #c9c7d4; }
  .chip:hover { background: rgba(255,255,255,.08); }
  .chip.on { border-color: rgba(139,92,255,.5); background: rgba(139,92,255,.14); color: var(--text); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

  /* step 2: agent choice */
  .ask { color: #c9c7d4; }
  .quote { padding: 9px 12px; border-left: 2px solid var(--brand); background: rgba(139,92,255,.06); border-radius: 0 10px 10px 0;
    color: #d9d7e3; font-size: 12.5px; max-height: 64px; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote.empty { color: var(--muted); font-style: italic; }
  .agents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .agent { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px 12px;
    border-radius: 14px; background: var(--field); border: 1.5px solid transparent; transition: background .15s, border-color .15s, transform .1s; }
  .agent:hover { background: rgba(255,255,255,.08); }
  .agent.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .agent:active { transform: scale(.98); }
  .agent:disabled { opacity: .35; cursor: not-allowed; }
  .agent .m { width: 46px; height: 46px; filter: drop-shadow(0 3px 7px rgba(0,0,0,.5)); }
  .agent b { font-weight: 600; }
  .agent small { color: var(--muted); font-size: 11px; }
  .agent kbd { position: absolute; top: 7px; left: 9px; font: 10.5px ui-monospace, monospace; color: var(--muted); }

  .foot { display: flex; align-items: center; gap: 8px; }
  .msg { flex: 1; font-size: 12px; color: var(--muted); }
  .msg.error { color: var(--error); }
  .btn { padding: 8px 14px; border-radius: 10px; background: rgba(255,255,255,.08); font-weight: 600; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,.14); }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .5; cursor: progress; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <form class="panel" id="form" autocomplete="off">

    <!-- step 1: what to do (and where) -->
    <section class="step" id="stepPrompt">
      <div class="title"><div class="m" id="manager"></div><b id="title">Ask Bayloob</b><span id="subtitle"></span><kbd>Esc</kbd></div>
      <textarea class="field" id="prompt" placeholder="What should be done?"></textarea>
      <div id="projectBox">
        <div class="project">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
          <input class="field" id="cwd" placeholder="~/projects/my-app" spellcheck="false">
          <button class="btn" type="button" id="browse">Browse…</button>
        </div>
        <div class="chips" id="recent" style="margin-top:8px"></div>
      </div>
    </section>

    <!-- step 2: which agent runs it -->
    <section class="step" id="stepAgent" hidden>
      <div class="title"><div class="m" id="manager2"></div><b>Which agent should do this?</b><kbd>Esc · back</kbd></div>
      <div class="quote" id="quote"></div>
      <div class="agents" id="agents"></div>
      <div class="project" id="where"></div>
    </section>

    <div class="foot">
      <div class="msg" id="msg"></div>
      <button class="btn" type="button" id="back" hidden>Back</button>
      <button class="btn primary" type="submit" id="submit">Continue</button>
    </div>
  </form>

<script src="ui-common.js"></script>
<script>
  const T = {
    ask: 'Ask Bayloob', send: 'Send a prompt',
    continue: 'Continue', launch: 'Launch', sendBtn: 'Send', back: 'Back',
    hintPrompt: 'Enter to choose an agent · Shift+Enter for a new line',
    hintAgent: n => `1–${n} or ← → to pick · Enter to launch`,
    hintSend: 'Enter to send',
    noPrompt: 'No prompt: the agent starts and waits for you',
    pickProject: 'Pick a project folder first',
    notInstalled: 'not installed', starting: 'Starting…', in: 'in',
    promptPlaceholder: 'What should be done?', followUp: 'Type a follow-up for the agent…',
    wrong: 'Something went wrong',
  };
  const tilde = (p, home) => home && p.startsWith(home) ? '~' + p.slice(home.length) : p;
  const FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';

  /**
   * The launcher. 'new': two steps — type what should be done (and where), press Enter, then Bayloob asks
   * which agent should run it. 'prompt': a follow-up for a running session. `state` comes from main on show.
   */
  class LauncherView {
    state = null;
    step = 'prompt';       // 'prompt' | 'agent'
    agent = 'claude';
    busy = false;

    constructor(api) {
      this.api = api;
      const $ = id => document.getElementById(id);
      this.el = { form: $('form'), stepPrompt: $('stepPrompt'), stepAgent: $('stepAgent'), title: $('title'), subtitle: $('subtitle'),
        prompt: $('prompt'), projectBox: $('projectBox'), cwd: $('cwd'), browse: $('browse'), recent: $('recent'),
        quote: $('quote'), agents: $('agents'), where: $('where'), msg: $('msg'), back: $('back'), submit: $('submit') };
      $('manager').innerHTML = $('manager2').innerHTML = Agent.thumb(MANAGER);
      this.#bind();
    }

    get isNew() { return this.state?.mode === 'new'; }
    get installed() { return Object.keys(this.state.agents).filter(k => this.state.agents[k].installed); }

    show(state) {
      this.state = state;
      this.busy = false;
      this.el.prompt.value = '';
      this.el.title.textContent = this.isNew ? T.ask : T.send;
      this.el.subtitle.textContent = this.isNew ? '' : `${state.session.project} · ${state.session.agentName}`;
      this.el.prompt.placeholder = this.isNew ? T.promptPlaceholder : T.followUp;
      this.el.projectBox.hidden = !this.isNew;
      if (this.isNew) {
        const last = state.recent[0];
        this.agent = state.preset?.agent || last?.agent || this.agent;
        if (!state.agents[this.agent]?.installed) this.agent = this.installed[0] || this.agent;
        this.el.cwd.value = tilde(state.preset?.cwd || last?.cwd || '', state.home);
        this.#renderRecent();
      }
      this.#go('prompt');
    }

    // ---------- steps ----------

    #go(step) {
      this.step = step;
      this.el.stepPrompt.hidden = step !== 'prompt';
      this.el.stepAgent.hidden = step !== 'agent';
      this.el.back.hidden = step !== 'agent';
      this.el.submit.disabled = false;
      if (step === 'prompt') {
        this.el.submit.textContent = this.isNew ? T.continue : T.sendBtn;
        this.#message(this.isNew ? T.hintPrompt : T.hintSend);
        this.el.prompt.focus();
      } else {
        this.el.submit.textContent = T.launch;
        const text = this.el.prompt.value.trim();
        this.el.quote.textContent = text || T.noPrompt;
        this.el.quote.classList.toggle('empty', !text);
        this.el.where.innerHTML = `${FOLDER}<span>${T.in} <b style="color:var(--text)">${esc(this.el.cwd.value.trim())}</b></span>`;
        this.#renderAgents();
        this.#message(T.hintAgent(Object.keys(this.state.agents).length));
        this.el.submit.focus();
      }
      this.#fit();
    }

    #fit() { requestAnimationFrame(() => this.api.resize?.(Math.ceil(this.el.form.getBoundingClientRect().height) + 20)); }

    #renderAgents() {
      this.el.agents.innerHTML = Object.entries(this.state.agents).map(([key, a], i) => `
        <button type="button" class="agent${key === this.agent ? ' on' : ''}" data-agent="${key}" style="--c:${a.color}"
          ${a.installed ? '' : 'disabled'}>
          <kbd>${i + 1}</kbd><div class="m">${Agent.thumb(key)}</div><b>${esc(a.name)}</b>${a.installed ? '' : `<small>${T.notInstalled}</small>`}
        </button>`).join('');
    }

    #renderRecent() {
      const { recent, home } = this.state;
      const current = this.el.cwd.value;
      this.el.recent.innerHTML = recent.slice(0, 6).map(r => `
        <button type="button" class="chip${tilde(r.cwd, home) === current ? ' on' : ''}" data-cwd="${esc(r.cwd)}" title="${esc(tilde(r.cwd, home))}">
          <i style="--c:${this.state.agents[r.agent]?.color || '#ffb547'}"></i>${esc(r.name)}</button>`).join('');
    }

    #pick(agent) {
      if (!this.state.agents[agent]?.installed) return;
      this.agent = agent;
      this.#renderAgents();
    }

    #message(text, isError = false) {
      this.el.msg.textContent = text;
      this.el.msg.className = isError ? 'msg error' : 'msg';
    }

    // ---------- submit ----------

    async #submit() {
      if (this.busy) return;
      if (!this.isNew) return this.#send();
      if (this.step === 'prompt') {
        if (!this.el.cwd.value.trim()) { this.#message(T.pickProject, true); return this.el.cwd.focus(); }
        return this.#go('agent');
      }
      this.busy = true;
      this.el.submit.disabled = true;
      this.#message(T.starting);
      const res = await this.api.launch({ agent: this.agent, cwd: this.el.cwd.value.trim(), prompt: this.el.prompt.value.trim() });
      this.busy = false;
      this.el.submit.disabled = false;
      if (res?.ok) this.api.close();
      else this.#message(res?.error || T.wrong, true);
    }

    async #send() {
      const text = this.el.prompt.value.trim();
      if (!text) return;
      this.busy = true;
      this.el.submit.disabled = true;
      const res = await this.api.sendPrompt(this.state.session.id, text);
      this.busy = false;
      this.el.submit.disabled = false;
      if (res?.ok) this.api.close();
      else this.#message(res?.error || T.wrong, true);
    }

    #bind() {
      this.el.form.addEventListener('submit', e => { e.preventDefault(); this.#submit(); });
      this.el.back.addEventListener('click', () => this.#go('prompt'));
      this.el.agents.addEventListener('click', e => {
        const b = e.target.closest('[data-agent]');
        if (!b || b.disabled) return;
        if (b.dataset.agent === this.agent) return this.#submit(); // a second click on the chosen one launches
        this.#pick(b.dataset.agent);
      });
      this.el.recent.addEventListener('click', e => {
        const b = e.target.closest('[data-cwd]');
        if (!b) return;
        this.el.cwd.value = tilde(b.dataset.cwd, this.state.home);
        this.#renderRecent();
        this.el.prompt.focus();
      });
      this.el.cwd.addEventListener('input', () => this.#renderRecent());
      this.el.browse.addEventListener('click', async () => {
        const dir = await this.api.pickFolder(this.el.cwd.value);
        if (dir) { this.el.cwd.value = tilde(dir, this.state.home); this.#renderRecent(); this.el.prompt.focus(); }
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          e.preventDefault();
          return this.step === 'agent' ? this.#go('prompt') : this.api.close();
        }
        if (this.step === 'agent') {
          const keys = Object.keys(this.state.agents);
          const n = Number(e.key);
          if (n >= 1 && n <= keys.length) { e.preventDefault(); return this.#pick(keys[n - 1]); }
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault();
            const ok = this.installed;
            const i = ok.indexOf(this.agent);
            return this.#pick(ok[(i + (e.key === 'ArrowRight' ? 1 : -1) + ok.length) % ok.length]);
          }
          if (e.key === 'Enter') { e.preventDefault(); return this.#submit(); }
          return;
        }
        // step 1: Enter goes on (Shift+Enter is a new line); in the folder field Enter goes on too
        if (e.key === 'Enter' && !e.shiftKey && (e.target === this.el.prompt || e.target === this.el.cwd)) {
          e.preventDefault();
          this.#submit();
        }
      });
    }
  }

  const fakeApi = { launch: async () => ({ ok: true }), sendPrompt: async () => ({ ok: true }), pickFolder: async () => null, close() {}, resize() {} };
  const view = new LauncherView(window.launcherAPI || fakeApi);
  if (window.launcherAPI) window.launcherAPI.onShow(state => view.show(state));
  else window.__demo = view; // opened in a plain browser
</script>
</body>
</html>
