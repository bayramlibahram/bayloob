<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Bayloob workspace</title>
<style>
  :root {
    --glass: rgba(17, 16, 22, 0.97);
    --raised: rgba(255,255,255,0.04);
    --line: rgba(255,255,255,0.08);
    --text: #f2f2f5;
    --muted: #8b8b96;
    --idle: #8b8b96;
    --thinking: #6aa8ff;
    --working: #ffb547;
    --waiting: #ff5d6c;
    --done: #4fd59a;
    --brand: #8b5cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden;
    font: 500 13px/1.4 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  svg:not(.i) { width: 16px; height: 16px; fill: currentColor; flex: none; } /* ICON_TERM from ui-common.js */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .panel { margin: 10px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgba(0,0,0,.5); overflow: hidden; animation: drop .2s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

  .thumb { position: relative; width: 100%; height: 100%; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .m { flex: none; filter: drop-shadow(0 2px 6px rgba(0,0,0,.45)); }

  /* header */
  .head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .head .m { width: 38px; height: 38px; }
  .head .brand { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .head .sep { width: 1px; height: 22px; background: var(--line); }
  .head .sub { color: var(--muted); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--idle)); flex: none; }
  .status .dot { box-shadow: 0 0 8px var(--c); }
  .square { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--muted);
    border: 1px solid var(--line); background: var(--raised); transition: color .15s, background .15s; }
  .square:hover { color: var(--text); background: rgba(255,255,255,.09); }

  /* body */
  .body { display: grid; grid-template-columns: 1.55fr 1fr; min-height: 280px; }
  .col { padding: 14px 12px 12px; }
  .col + .col { border-left: 1px solid var(--line); padding: 14px 18px; }
  h2 { font-size: 12.5px; font-weight: 600; color: #c9c7d4; margin: 0 6px 10px; }
  .col + .col h2 { margin-left: 0; }

  .sessions { display: flex; flex-direction: column; gap: 2px; max-height: 330px; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid transparent; transition: background .12s; }
  .row:hover { background: rgba(255,255,255,.03); }
  .row.sel { background: rgba(139,92,255,.09); border-color: rgba(139,92,255,.22); }
  .row .m { width: 40px; height: 40px; }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { display: block; font-weight: 600; font-size: 13.5px; }
  .row .who span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { display: flex; align-items: center; gap: 7px; width: 132px; font-size: 12.5px; color: var(--c); }
  .row .square { width: 32px; height: 32px; }
  .kebab { width: 26px; height: 32px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; }
  .kebab:hover { color: var(--text); background: rgba(255,255,255,.07); }
  .empty { color: var(--muted); padding: 30px 10px; text-align: center; line-height: 1.6; }

  /* current activity */
  .who-big { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .who-big .m { width: 40px; height: 40px; }
  .who-big b { font-size: 15px; font-weight: 650; }
  .who-big .state { width: auto; margin-left: 12px; }
  .doing { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .doing b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doing span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timeline { list-style: none; padding: 10px 0 4px; max-height: 150px; overflow-y: auto; }
  .timeline li { position: relative; display: flex; align-items: baseline; gap: 10px; padding: 5px 0 5px 22px; font-size: 12.5px; }
  .timeline li::before { content: ''; position: absolute; left: 3px; top: 9px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--brand); box-shadow: 0 0 6px rgba(139,92,255,.6); }
  .timeline li.now::before { background: transparent; border: 1.5px solid var(--brand); box-shadow: none; }
  .timeline li + li::after { content: ''; position: absolute; left: 7px; top: -9px; height: 16px; border-left: 1px solid rgba(255,255,255,.14); }
  .timeline .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timeline .ago { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .wide { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; padding: 10px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; transition: background .15s; }
  .wide:hover { background: rgba(255,255,255,.08); }
  .wide:disabled { opacity: .4; cursor: default; }

  /* footer */
  .foot { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .btn { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--raised); font-weight: 600; transition: background .15s; }
  .btn:hover { background: rgba(255,255,255,.08); }
  .btn:disabled { opacity: .4; cursor: default; }
  .meters { flex: 1; display: flex; justify-content: center; align-items: center; gap: 16px; color: var(--muted); font-size: 12.5px; }
  .meters b { color: var(--text); font-weight: 600; margin-left: 4px; }
  .meters .sep { width: 1px; height: 16px; background: var(--line); }
  .meter { display: flex; align-items: center; gap: 7px; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <header class="head">
      <div class="m" id="managerMascot"></div>
      <span class="brand">bayloob</span><span class="sep"></span><span class="sub">Workspace overview</span>
      <div class="status" id="status"></div>
      <button class="square" id="settings" title="Settings">
        <svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </header>

    <div class="body">
      <section class="col">
        <h2>Sessions</h2>
        <div class="sessions" id="sessions"></div>
      </section>
      <section class="col">
        <h2>Current activity</h2>
        <div id="activity"></div>
      </section>
    </div>

    <footer class="foot">
      <button class="btn" id="newSession">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> New session
      </button>
      <div class="meters" id="meters"></div>
      <button class="btn" id="openWorkspace">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg> Open workspace
      </button>
    </footer>
  </div>

<script src="ui-common.js"></script>
<script>
  // Every string of the panel — a language switcher later only needs to swap this object
  const T = {
    state: { idle: 'Idle', thinking: 'Thinking', working: 'Working', waiting: 'Needs approval', done: 'Done' },
    connected: 'Connected', noEvents: 'Waiting for agents', noHooks: 'Hooks not installed',
    connectedTip: at => at ? `Hooks installed · last event ${timeAgo(at)}` : 'Hooks installed · no events yet',
    noHooksTip: 'Run "bayloob --install-hooks" or open Settings to connect Claude Code',
    empty: 'No agent sessions yet.<br>Start one with <b>New session</b>, or run an agent in any terminal.',
    pick: 'Select a session to see what it is doing.',
    nothingYet: 'Nothing yet',
    openTerminal: 'Open terminal', more: 'More actions',
    cpu: 'CPU', memory: 'Memory', metersTip: 'All watched agents and the processes they started',
  };
  const COLORS = { idle: 'var(--idle)', thinking: 'var(--thinking)', working: 'var(--working)', waiting: 'var(--waiting)', done: 'var(--done)' };
  const PRIORITY = { waiting: 5, working: 4, thinking: 3, done: 2, idle: 1 };
  const ACTIVE = new Set(['thinking', 'working', 'waiting']);
  const TIMELINE_MAX = 6;
  const ICON_DOTS = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>';
  const ICON_CPU = '<svg class="i" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>';
  const ICON_MEM = '<svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>';

  // "baynovix / website": the last two parts of the session's folder
  const projectPath = s => {
    const parts = String(s.cwd || '').split('/').filter(Boolean);
    return parts.length >= 2 ? parts.slice(-2).join(' / ') : (s.project || '');
  };
  const stateHtml = state => `<span class="state" style="--c:${COLORS[state]}"><span class="dot"></span>${T.state[state] || state}</span>`;

  /** The workspace overview panel: sessions on the left, the selected session's activity on the right. */
  class PanelView {
    sessions = [];
    stats = null;
    status = null;
    selected = null;

    constructor(api) {
      this.api = api;
      const $ = id => document.getElementById(id);
      this.el = { panel: $('panel'), mascot: $('managerMascot'), status: $('status'), sessions: $('sessions'),
        activity: $('activity'), meters: $('meters'), newSession: $('newSession'), openWorkspace: $('openWorkspace'), settings: $('settings') };
      this.el.mascot.innerHTML = Agent.thumb(MANAGER);
      this.#bind();
      setInterval(() => this.#renderActivity(), 30_000); // keep "2m ago" fresh
    }

    show(state) {
      this.sessions = state.sessions || [];
      this.status = state.status || null;
      this.stats = null;
      // Start on the session that most needs attention
      if (!this.sessions.some(s => s.id === this.selected)) this.selected = this.#mostUrgent()?.id ?? null;
      this.render();
    }

    setSessions(list) {
      this.sessions = list;
      if (!list.some(s => s.id === this.selected)) this.selected = this.#mostUrgent()?.id ?? null;
      this.render();
    }

    setStats(stats) { this.stats = stats; this.#renderMeters(); }
    setStatus(status) { this.status = status; this.#renderStatus(); }

    get current() { return this.sessions.find(s => s.id === this.selected) || null; }

    #mostUrgent() {
      return [...this.sessions].sort((a, b) => PRIORITY[b.state] - PRIORITY[a.state] || b.updatedAt - a.updatedAt)[0];
    }

    render() {
      this.#renderStatus();
      this.#renderSessions();
      this.#renderActivity();
      this.#renderMeters();
      this.el.openWorkspace.disabled = !this.current?.cwd;
      this.api?.resize(Math.ceil(this.el.panel.getBoundingClientRect().height) + 20);
    }

    #renderStatus() {
      const st = this.status;
      const [label, color, tip] = !st?.hooks ? [T.noHooks, 'var(--waiting)', T.noHooksTip]
        : st.lastEventAt ? [T.connected, 'var(--done)', T.connectedTip(st.lastEventAt)]
        : [T.noEvents, 'var(--working)', T.connectedTip(null)];
      this.el.status.style.setProperty('--c', color);
      this.el.status.title = tip;
      this.el.status.innerHTML = `<span class="dot"></span>${label}`;
    }

    #renderSessions() {
      if (!this.sessions.length) { this.el.sessions.innerHTML = `<div class="empty">${T.empty}</div>`; return; }
      this.el.sessions.innerHTML = this.sessions.map(s => `
        <div class="row${s.id === this.selected ? ' sel' : ''}" data-sid="${esc(s.id)}">
          <div class="m">${Agent.thumb(s.agent)}</div>
          <div class="who"><b>${esc(Agent.displayName(s.agent))}</b><span>${esc(projectPath(s))}</span></div>
          ${stateHtml(s.state)}
          <button class="square" data-act="focus" title="${T.openTerminal}">${ICON_TERM}</button>
          <button class="kebab" data-act="menu" title="${T.more}">${ICON_DOTS}</button>
        </div>`).join('');
    }

    #renderActivity() {
      const s = this.current;
      if (!s) { this.el.activity.innerHTML = `<div class="empty">${this.sessions.length ? T.pick : ''}</div>`; return; }
      const doing = s.activity || { title: T.nothingYet, detail: '' };
      const history = (s.history || []).slice(0, TIMELINE_MAX);
      const live = ACTIVE.has(s.state);
      this.el.activity.innerHTML = `
        <div class="who-big"><div class="m">${Agent.thumb(s.agent)}</div><b>${esc(Agent.displayName(s.agent))}</b>${stateHtml(s.state)}</div>
        <div class="doing"><b title="${esc(doing.title)}">${esc(doing.title)}</b><span title="${esc(doing.detail)}">${esc(doing.detail || projectPath(s))}</span></div>
        <ul class="timeline">${history.map((h, i) => `
          <li class="${i === 0 && live ? 'now' : ''}"><span class="t" title="${esc(h.detail || h.title)}">${esc(h.title)}</span><span class="ago">${timeAgo(h.at)}</span></li>`).join('')}
        </ul>
        <button class="wide" data-act="focus" data-sid="${esc(s.id)}">${ICON_TERM} ${T.openTerminal}</button>`;
    }

    #renderMeters() {
      const st = this.stats;
      const cpu = st?.cpu == null ? '—' : `${Math.round(st.cpu)}%`;
      const mem = st ? formatBytes(st.memory) : '—';
      this.el.meters.title = T.metersTip;
      this.el.meters.innerHTML = `<span class="meter">${ICON_CPU}${T.cpu}<b>${cpu}</b></span><span class="sep"></span><span class="meter">${ICON_MEM}${T.memory}<b>${mem}</b></span>`;
    }

    #select(id) {
      if (id === this.selected) return;
      this.selected = id;
      this.#renderSessions();
      this.#renderActivity();
      this.el.openWorkspace.disabled = !this.current?.cwd;
    }

    #move(step) {
      if (!this.sessions.length) return;
      const i = this.sessions.findIndex(s => s.id === this.selected);
      this.#select(this.sessions[(i + step + this.sessions.length) % this.sessions.length].id);
    }

    #bind() {
      this.el.sessions.addEventListener('click', e => {
        const row = e.target.closest('.row');
        if (!row) return;
        const act = e.target.closest('[data-act]')?.dataset.act;
        this.#select(row.dataset.sid);
        if (act === 'focus') this.api?.focus(row.dataset.sid);
        if (act === 'menu') this.api?.sessionMenu(row.dataset.sid);
      });
      this.el.activity.addEventListener('click', e => {
        const b = e.target.closest('[data-act=focus]');
        if (b) this.api?.focus(b.dataset.sid);
      });
      this.el.newSession.addEventListener('click', () => this.api?.newSession());
      this.el.openWorkspace.addEventListener('click', () => this.current && this.api?.openWorkspace(this.current.id));
      this.el.settings.addEventListener('click', () => this.api?.openSettings());
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') this.api?.close();
        else if (e.key === 'ArrowDown') { e.preventDefault(); this.#move(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.#move(-1); }
        else if (e.key === 'Enter' && this.current) this.api?.focus(this.current.id);
      });
    }
  }

  const view = new PanelView(window.panelAPI);
  if (window.panelAPI) {
    panelAPI.onShow(state => view.show(state));
    panelAPI.onSessions(list => view.setSessions(list));
    panelAPI.onStats(stats => view.setStats(stats));
    panelAPI.onStatus(status => view.setStatus(status));
  } else {
    window.__demo = view; // opened in a plain browser: drive it from the console
  }
</script>
</body>
</html>
