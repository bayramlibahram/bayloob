<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Bayloob launcher</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/attachments.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden;
    font: 500 13px/1.4 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; }
  button, input, textarea { font: inherit; color: inherit; border: 0; background: none; outline: none; }
  button { cursor: pointer; }
  button:focus-visible, .agent:focus-visible { outline: 2px solid color-mix(in srgb, var(--brand) 70%, transparent); outline-offset: 2px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--ink) / .12); border-radius: 3px; }
  [hidden] { display: none !important; }
  kbd { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line);
    background: rgb(var(--ink) / .06); font: 600 10.5px/16px ui-monospace, monospace; color: var(--soft); text-align: center; }

  /* ---------- dialog frame: header (title + steps), body (one step), footer (hint + actions) ---------- */
  .dialog { margin: 10px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line);
    box-shadow: 0 18px 44px rgb(var(--shade) / calc(.5 * var(--shade-k))); display: flex; flex-direction: column; overflow: hidden;
    animation: pop .18s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

  .dh { display: flex; align-items: center; gap: 12px; padding: 14px 14px 12px 16px; border-bottom: 1px solid var(--line); }
  .dh .m { width: 32px; height: 32px; flex: none; filter: drop-shadow(0 2px 5px rgb(var(--shade) / calc(.45 * var(--shade-k)))); }
  .dh .who { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .dh b { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
  .dh .who span { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .steps { display: flex; align-items: center; gap: 4px; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--muted); }
  .steps li + li::before { content: ''; width: 14px; height: 1px; background: var(--line); margin-right: 2px; }
  .steps li i { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; font: 700 10px/1 system-ui;
    border: 1px solid var(--line); font-style: normal; }
  .steps li.on { color: var(--text); }
  .steps li.on i { background: var(--brand); border-color: var(--brand); color: #fff; }
  .steps li.past i { background: color-mix(in srgb, var(--brand) 18%, transparent); border-color: color-mix(in srgb, var(--brand) 45%, transparent); color: var(--brand-soft); }
  .close { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); flex: none; }
  .close:hover { background: rgb(var(--ink) / .08); color: var(--text); }
  .close svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }

  .body { padding: 14px 16px 4px; }
  .step { display: flex; flex-direction: column; gap: 12px; animation: slide .16s ease-out; }
  @keyframes slide { from { opacity: 0; transform: translateX(8px); } }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .thumb { position: relative; width: 100%; height: 100%; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }

  /* ---------- step: write ---------- */
  .composer { border-radius: 14px; background: var(--field); border: 1px solid var(--line); transition: border-color .15s, box-shadow .15s; }
  .composer:focus-within { border-color: color-mix(in srgb, var(--brand) 70%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 12%, transparent); }
  .composer textarea { display: block; width: 100%; resize: none; padding: 12px 14px 6px; font-size: 14px; line-height: 1.5;
    min-height: 72px; max-height: 240px; overflow-y: auto; }
  .composer textarea.code { font: 12.5px/1.5 ui-monospace, "Ubuntu Mono", monospace; }
  .composer textarea::placeholder { color: var(--muted); }
  .tools { display: flex; align-items: center; gap: 8px; padding: 4px 8px 8px 10px; }
  .ghost { display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 8px; color: var(--soft); font-size: 12px; font-weight: 600; }
  .ghost:hover { background: rgb(var(--ink) / .08); color: var(--text); }
  .ghost svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .composer .atts { padding: 2px 12px 4px; }
  .tools .count { margin-left: auto; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .project { display: flex; flex-direction: column; gap: 8px; }
  .pathrow { display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; height: 38px; border-radius: 11px;
    background: var(--field); border: 1px solid var(--line); }
  .pathrow:focus-within { border-color: color-mix(in srgb, var(--brand) 70%, transparent); }
  .pathrow svg { width: 15px; height: 15px; flex: none; fill: none; stroke: var(--muted); stroke-width: 1.7; }
  .pathrow input { flex: 1; min-width: 0; font: 12.5px ui-monospace, "Ubuntu Mono", monospace; }
  .pathrow input::placeholder { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--field);
    border: 1px solid var(--line); font-size: 12px; color: var(--soft); }
  .chip:hover { background: rgb(var(--ink) / .08); }
  .chip.on { border-color: color-mix(in srgb, var(--brand) 50%, transparent); background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--text); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

  /* prompts already waiting for a busy agent */
  .queued { list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .queued li.item { display: flex; align-items: center; gap: 8px; padding: 5px 6px 5px 10px; border-radius: 9px;
    background: var(--raised); border: 1px solid var(--line); font-size: 12.5px; }
  .queued li.item em { font-style: normal; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .queued li.item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--softer); }
  .queued li.item button { width: 22px; height: 22px; border-radius: 6px; color: var(--muted); }
  .queued li.item button:hover { background: color-mix(in srgb, var(--waiting) 15%, transparent); color: var(--error); }

  /* ---------- step: agent ---------- */
  .quote { padding: 9px 12px; border-left: 2px solid var(--brand); background: color-mix(in srgb, var(--brand) 6%, transparent); border-radius: 0 10px 10px 0;
    color: var(--softer); font-size: 12.5px; max-height: 58px; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
  .quote.empty { color: var(--muted); font-style: italic; }
  .agents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .agent { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 8px 12px;
    border-radius: 14px; background: var(--field); border: 1.5px solid transparent; transition: background .15s, border-color .15s, transform .1s; }
  .agent:hover { background: rgb(var(--ink) / .08); }
  .agent.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .agent.on::after { content: '✓'; position: absolute; top: 7px; right: 9px; font-size: 11px; font-weight: 800; color: var(--c); }
  .agent:active { transform: scale(.98); }
  .agent:disabled { opacity: .35; cursor: not-allowed; }
  .agent .m { width: 46px; height: 46px; filter: drop-shadow(0 3px 7px rgb(var(--shade) / calc(.5 * var(--shade-k)))); }
  .agent b { font-weight: 600; }
  .agent small { color: var(--muted); font-size: 11px; }
  .agent kbd { position: absolute; top: 7px; left: 8px; }
  .toggle { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line); text-align: left; }
  .toggle:hover { background: rgb(var(--ink) / .06); }
  .toggle .txt { flex: 1; display: flex; flex-direction: column; }
  .toggle .txt small { color: var(--muted); font-size: 11.5px; }
  .terms { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .terms .label { margin-right: 4px; }
  .switch { width: 32px; height: 18px; border-radius: 9px; background: rgb(var(--ink) / .14); position: relative; flex: none; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .2s; }
  .toggle[aria-pressed=true] .switch { background: var(--brand); }
  .toggle[aria-pressed=true] .switch::after { transform: translateX(14px); }

  /* ---------- step: confirm ---------- */
  .review { border-radius: 14px; border: 1px solid var(--line); background: var(--raised); overflow: hidden; }
  .review .row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; }
  .review .row + .row { border-top: 1px solid var(--line); }
  .review .k { width: 84px; flex: none; color: var(--muted); font-size: 12px; }
  .review .v { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
  .review .v .m { width: 22px; height: 22px; flex: none; }
  .review .v code { font: 12.5px ui-monospace, "Ubuntu Mono", monospace; }
  .review .v small { color: var(--muted); font-size: 11.5px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
  .badge.now { color: var(--ok); background: color-mix(in srgb, var(--done) 12%, transparent); }
  .badge.paste { color: var(--brand-soft); background: color-mix(in srgb, var(--brand) 12%, transparent); }
  .badge.queue { color: var(--warn); background: color-mix(in srgb, var(--working) 12%, transparent); }
  .review .prompt { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
  .review .prompt pre { margin-top: 6px; max-height: 150px; overflow-y: auto; white-space: pre-wrap; overflow-wrap: anywhere;
    font: 12.5px/1.5 ui-monospace, "Ubuntu Mono", monospace; color: var(--softer); }
  .review .prompt pre.empty { font: italic 12.5px/1.5 inherit; color: var(--muted); }
  .review .edit { float: right; margin-top: -3px; }

  /* ---------- footer ---------- */
  .foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px 14px; }
  .msg { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .msg.error { color: var(--error); }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 10px; background: rgb(var(--ink) / .08); font-weight: 600; white-space: nowrap; }
  .btn:hover { background: rgb(var(--ink) / .14); }
  .btn.primary { background: var(--primary-bg); color: var(--primary-fg); box-shadow: 0 4px 14px color-mix(in srgb, var(--brand) 35%, transparent); }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn.primary.confirm { padding: 8px 16px; }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .btn:disabled { opacity: .45; cursor: default; box-shadow: none; filter: none; }
</style>
</head>
<body>
  <form class="dialog" id="form" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="title">
    <header class="dh">
      <div class="m" id="who"></div>
      <div class="who"><b id="title">Ask Bayloob</b><span id="subtitle"></span></div>
      <ol class="steps" id="steps"></ol>
      <button type="button" class="close" id="close" title="Close (Esc)" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </header>

    <div class="body">
      <!-- write: what to do (and, for a new session, where) -->
      <section class="step" id="stepPrompt">
        <div class="composer">
          <textarea id="prompt" rows="3" aria-label="Prompt" placeholder="What should be done?" spellcheck="false"></textarea>
          <ul class="atts" id="atts" hidden></ul>
          <ul class="pastes" id="pastes" hidden></ul>
          <div class="tools">
            <button type="button" class="ghost attach-btn" id="attach" title="Attach files — or drop them here, or paste a screenshot (Ctrl+V)" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7l8.5-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l8-7.9"/></svg>Attach</button>
            <button type="button" class="ghost" id="paste" title="Paste what you copied — an error becomes a fix-it prompt">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Paste clipboard</button>
            <span class="count" id="count"></span>
          </div>
        </div>
        <ul class="queued" id="queued" hidden></ul>
        <div class="project" id="projectBox">
          <div class="label">Project folder</div>
          <div class="pathrow">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
            <input id="cwd" aria-label="Project folder" placeholder="~/projects/my-app" spellcheck="false">
            <button class="ghost" type="button" id="browse">Browse…</button>
          </div>
          <div class="chips" id="recent"></div>
        </div>
      </section>

      <!-- agent: which agent runs it (new sessions only) -->
      <section class="step" id="stepAgent" hidden>
        <div class="quote" id="quote"></div>
        <div class="agents" id="agents"></div>
        <button type="button" class="toggle" id="worktree" aria-pressed="false">
          <span class="txt"><span>⑂ In a new git worktree</span><small>Its own copy of the repo on a <code>bayloob/…</code> branch, so it never edits the same files as another agent</small></span>
          <span class="switch"></span>
        </button>
        <div class="terms" id="terms"></div>
      </section>

      <!-- confirm: everything that's about to happen, before it happens -->
      <section class="step" id="stepConfirm" hidden>
        <div class="review" id="review"></div>
      </section>
    </div>

    <footer class="foot">
      <div class="msg" id="msg"></div>
      <button class="btn" type="button" id="back">Cancel</button>
      <button class="btn primary" type="submit" id="submit">Continue</button>
    </footer>
  </form>

<script src="../shared/ui-common.js"></script>
<script src="../shared/attachments.js"></script>
<script src="../shared/composer.js"></script>
<script>
  const T = {
    ask: 'Ask Bayloob', askSub: 'Start a new agent session',
    send: agent => `Prompt to ${agent}`,
    steps: { new: ['Task', 'Agent', 'Confirm'], prompt: ['Write', 'Confirm'] },
    next: 'Next', launch: 'Launch', sendBtn: 'Send', queueBtn: 'Add to queue', back: 'Back', cancel: 'Cancel',
    prefilled: 'Pasted the error you copied', emptyClipboard: 'The clipboard is empty',
    hintWrite: '<kbd>⏎</kbd> next · <kbd>⇧⏎</kbd> new line', hintAgent: n => `<kbd>1</kbd>–<kbd>${n}</kbd> or <kbd>←</kbd><kbd>→</kbd> pick · <kbd>⏎</kbd> next`,
    hintConfirm: '<kbd>⏎</kbd> confirm · <kbd>Esc</kbd> back',
    queuedCap: n => `Waiting for this agent · ${n}`, unqueue: 'Remove from the queue',
    noPrompt: 'No prompt — the agent starts and waits for you', writeFirst: 'Write the prompt first',
    pickProject: 'Pick a project folder first', notInstalled: 'not installed', starting: 'Starting…', sending: 'Sending…',
    promptPlaceholder: 'What should be done?', followUp: 'Type a follow-up for the agent…',
    chars: n => `${n} chars`, wrong: 'Something went wrong',
    openIn: 'Open in', rTerminal: 'Terminal',
    rAgent: 'Agent', rFolder: 'Folder', rWhere: 'Runs in', rWhen: 'Delivery', rPrompt: 'Prompt', rFiles: 'Files', edit: 'Edit',
    attaching: 'Wait — the files are still being attached',
    inFolder: 'the folder itself', inWorktree: 'a new git worktree', worktreeNote: 'next to the project, on a new bayloob/… branch',
    now: '● sent now',
    paste: '📋 copied · paste with Ctrl+Shift+V (not in tmux)', pasteBtn: 'Copy & open terminal', queued: '⏳ queued — the agent is busy; it goes out when its turn ends',
  };
  const TERMINAL_KEY = 'bayloob.terminal'; // remembered per viewer: just a convenience
  const tilde = (p, home) => home && p.startsWith(home) ? `~${p.slice(home.length)}` : p;

  /**
   * The launcher dialog. 'new': Task → Agent → Confirm, then the session starts. 'prompt': a follow-up for a
   * running session, Write → Confirm. Nothing is launched or sent before the confirm step. `state` comes from
   * main on show.
   */
  class LauncherView {
    state = null;
    step = 'prompt';       // 'prompt' | 'agent' | 'confirm'
    agent = 'claude';
    worktree = false;
    busy = false;

    constructor(api) {
      this.api = api;
      const $ = id => document.getElementById(id);
      this.el = { form: $('form'), who: $('who'), title: $('title'), subtitle: $('subtitle'), steps: $('steps'), close: $('close'),
        stepPrompt: $('stepPrompt'), stepAgent: $('stepAgent'), stepConfirm: $('stepConfirm'), prompt: $('prompt'), count: $('count'),
        paste: $('paste'), queued: $('queued'), projectBox: $('projectBox'), cwd: $('cwd'), browse: $('browse'), recent: $('recent'),
        attach: $('attach'), atts: $('atts'),
        quote: $('quote'), agents: $('agents'), worktree: $('worktree'), terms: $('terms'), review: $('review'), msg: $('msg'), back: $('back'), submit: $('submit') };
      // The prompt box (the shared Composer: files, large pastes as chips, the length label); Enter goes to the next step.
      // What you were writing is kept per session (and for a new one) until it's sent
      this.box = new Composer({ form: this.el.prompt.closest('.composer'), text: this.el.prompt, attach: this.el.attach, files: this.el.atts,
        pastes: $('pastes'), count: this.el.count, uploads: api.uploads,
        onChange: () => { this.#saveDraft(); this.#fit(); }, onSubmit: () => this.#next(), onError: t => this.#message(t, true) });
      this.drafts = new Drafts('bayloob.launcher.drafts');
      this.#bind();
    }

    get isNew() { return this.state?.mode === 'new'; }
    get installed() { return Object.keys(this.state.agents).filter(k => this.state.agents[k].installed); }
    get flow() { return this.isNew ? ['prompt', 'agent', 'confirm'] : ['prompt', 'confirm']; }
    get text() { return this.el.prompt.value.trim(); }
    // what the agent gets: the text, the pasted blocks, and the attached files
    get prompt() { return this.box.compose(); }
    get #draftKey() { return this.isNew ? 'new' : `session:${this.state?.session?.id}`; }

    #saveDraft() {
      if (!this.state || this.busy) { return; }
      this.drafts.set(this.#draftKey, this.box.snapshot());
    }

    show(state) {
      this.state = state;
      this.busy = false;
      const s = state.session;
      this.el.who.innerHTML = Agent.thumb(this.isNew ? MANAGER : s.agent || MANAGER);
      this.el.title.textContent = this.isNew ? T.ask : T.send(s.agentName);
      this.el.subtitle.textContent = this.isNew ? T.askSub : s.project;
      // No prompt handed in: what you were writing here last time comes back (files checked again)
      this.box.restore(state.prefill ? { text: state.prefill } : this.drafts.get(this.#draftKey));
      this.el.prompt.classList.toggle('code', !!state.prefill && !state.draft);
      this.el.prompt.placeholder = this.isNew ? T.promptPlaceholder : T.followUp;
      this.el.projectBox.hidden = !this.isNew;
      if (this.isNew) {
        const last = state.recent[0];
        this.agent = state.preset?.agent || last?.agent || this.agent;
        if (!state.agents[this.agent]?.installed) { this.agent = this.installed[0] || this.agent; }
        this.el.cwd.value = tilde(state.preset?.cwd || last?.cwd || '', state.home);
        this.worktree = !!state.preset?.worktree;
        // The terminal: the one picked last time if it's still installed, else the default (first)
        const ids = (state.terminals || []).map(t => t.id);
        let saved = null;
        try { saved = localStorage.getItem(TERMINAL_KEY); } catch { /* storage unavailable */ }
        this.terminal = ids.includes(saved) ? saved : ids[0] || null;
        this.#renderRecent();
      }
      this.#go('prompt');
      this.box.refresh();
      this.#fit();
      if (state.prefill) {
        // Show the prompt from its first line ("Fix this error:"), not scrolled to the end
        this.el.prompt.setSelectionRange(0, 0);
        this.el.prompt.scrollTop = 0;
      }
    }

    // ---------- steps ----------

    #go(step) {
      this.step = step;
      this.el.stepPrompt.hidden = step !== 'prompt';
      this.el.stepAgent.hidden = step !== 'agent';
      this.el.stepConfirm.hidden = step !== 'confirm';
      this.#renderSteps();
      const first = step === 'prompt';
      this.el.back.textContent = first ? T.cancel : T.back;
      const confirm = step === 'confirm';
      this.el.submit.classList.toggle('confirm', confirm);
      const arrow = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
      const check = '<svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>';
      this.el.submit.innerHTML = confirm
        ? `${check}${this.isNew ? T.launch : this.#willPaste ? T.pasteBtn : this.#willQueue ? T.queueBtn : T.sendBtn}`
        : `${T.next}${arrow}`;
      if (first) {
        this.#message(this.state.prefill && !this.state.draft && this.el.prompt.value === this.state.prefill ? `${T.prefilled} · ${T.hintWrite}` : T.hintWrite, false, true);
        this.#renderQueue();
        this.box.refresh();
        this.el.prompt.focus();
      } else if (step === 'agent') {
        this.el.quote.textContent = this.prompt || T.noPrompt;
        this.el.quote.classList.toggle('empty', !this.prompt);
        this.#renderAgents();
        this.#renderWorktree();
        this.#renderTerms();
        this.#message(T.hintAgent(Object.keys(this.state.agents).length), false, true);
        this.el.submit.focus();
      } else {
        this.#renderReview();
        this.#message(T.hintConfirm, false, true);
        this.el.submit.focus();
      }
      this.#fit();
    }

    #next() {
      if (this.busy) { return; }
      if (this.step === 'prompt') {
        if (this.box.files.busy) { return this.#message(T.attaching, true); }
        if (this.box.files.unconfirmed.length) { return this.#message(`${this.box.files.unconfirmed.map(f => f.name).join(', ')} looks like it holds a secret — remove it, or press Send anyway`, true); }
        if (!this.isNew && !this.prompt) { this.#message(T.writeFirst, true); return this.el.prompt.focus(); }
        if (this.isNew && !this.el.cwd.value.trim()) { this.#message(T.pickProject, true); return this.el.cwd.focus(); }
      }
      if (this.step === 'confirm') { return this.isNew ? this.#launch() : this.#send(); }
      this.#go(this.flow[this.flow.indexOf(this.step) + 1]);
    }

    #back() {
      const i = this.flow.indexOf(this.step);
      return i > 0 ? this.#go(this.flow[i - 1]) : this.api.close();
    }

    get #willQueue() { return !this.isNew && !this.#willPaste && !!this.state.session.busy; }

    // Not in tmux: Bayloob can't type into that terminal, so the prompt is copied for the user to paste
    get #willPaste() { return !this.isNew && !!this.state.session.paste; }

    #fit() { requestAnimationFrame(() => this.api.resize?.(Math.ceil(this.el.form.getBoundingClientRect().height) + 20)); }

    // ---------- render ----------

    #renderSteps() {
      const names = T.steps[this.isNew ? 'new' : 'prompt'];
      const at = this.flow.indexOf(this.step);
      this.el.steps.innerHTML = names.map((n, i) => `<li class="${i === at ? 'on' : i < at ? 'past' : ''}"><i>${i < at ? '✓' : i + 1}</i>${n}</li>`).join('');
    }

    #renderAgents() {
      this.el.agents.innerHTML = Object.entries(this.state.agents).map(([key, a], i) => `
        <button type="button" class="agent${key === this.agent ? ' on' : ''}" data-agent="${key}" style="--c:${Agent.color(key)}"
          ${a.installed ? '' : 'disabled'} aria-pressed="${key === this.agent}">
          <kbd>${i + 1}</kbd><div class="m">${Agent.thumb(key)}</div><b>${esc(a.name)}</b>${a.installed ? '' : `<small>${T.notInstalled}</small>`}
        </button>`).join('');
    }

    // "Open in: [Ptyxis] [xterm]" — only when there's a choice to make
    #renderTerms() {
      const list = this.state.terminals || [];
      this.el.terms.hidden = list.length < 2;
      const chips = list.map(t =>
        `<button type="button" class="chip${t.id === this.terminal ? ' on' : ''}" data-term="${esc(t.id)}" aria-pressed="${t.id === this.terminal}">${esc(t.name)}</button>`).join('');
      this.el.terms.innerHTML = `<span class="label">${T.openIn}</span>${chips}`;
    }

    #renderWorktree() { this.el.worktree.setAttribute('aria-pressed', String(!!this.worktree)); }

    #renderRecent() {
      const { recent, home } = this.state;
      const current = this.el.cwd.value;
      this.el.recent.innerHTML = recent.slice(0, 6).map(r => `
        <button type="button" class="chip${tilde(r.cwd, home) === current ? ' on' : ''}" data-cwd="${esc(r.cwd)}" title="${esc(tilde(r.cwd, home))}">
          <i style="--c:${this.state.agents[r.agent] ? Agent.color(r.agent) : 'var(--warn)'}"></i>${esc(r.name)}</button>`).join('');
    }

    // The confirmation panel: agent, where it runs, how the prompt is delivered, and the prompt itself
    #renderReview() {
      const rows = [];
      if (this.isNew) {
        const a = this.state.agents[this.agent];
        rows.push([T.rAgent, `<div class="m">${Agent.thumb(this.agent)}</div><b>${esc(a?.name || this.agent)}</b>`]);
        rows.push([T.rFolder, `<code>${esc(this.el.cwd.value.trim())}</code>`]);
        rows.push([T.rWhere, this.worktree ? `${T.inWorktree} <small>${T.worktreeNote}</small>` : T.inFolder]);
        const term = (this.state.terminals || []).find(t => t.id === this.terminal);
        if (term) { rows.push([T.rTerminal, esc(term.name)]); }
      } else {
        const s = this.state.session;
        rows.push([T.rAgent, `<div class="m">${Agent.thumb(s.agent || MANAGER)}</div><b>${esc(s.agentName)}</b><small>${esc(s.project)}</small>`]);
        rows.push([T.rWhen, this.#willPaste ? `<span class="badge paste">${T.paste}</span>`
          : this.#willQueue ? `<span class="badge queue">${T.queued}</span>` : `<span class="badge now">${T.now}</span>`]);
      }
      if (this.box.files.count) { rows.push([T.rFiles, this.box.files.items.map(a => `<code title="${esc(a.path)}">${esc(a.name)}</code>`).join(' ')]); }
      const text = this.prompt;
      this.el.review.innerHTML = rows.map(([k, v]) => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('') +
        `<div class="prompt"><span class="label">${T.rPrompt}</span><button type="button" class="ghost edit" data-edit>${T.edit}</button>
          <pre class="${text ? '' : 'empty'}">${esc(text || T.noPrompt)}</pre></div>`;
    }

    // Prompts already waiting for this agent, each removable
    #renderQueue() {
      const q = this.isNew ? [] : this.state.session.queue || [];
      this.el.queued.hidden = !q.length;
      this.el.queued.innerHTML = q.length
        ? `<li class="label">${T.queuedCap(q.length)}</li>` +
          q.map((text, i) => `<li class="item"><em>${i + 1}</em><span title="${esc(text)}">${esc(text)}</span><button type="button" data-unqueue="${i}" title="${T.unqueue}" aria-label="${T.unqueue}">×</button></li>`).join('')
        : '';
    }

    #pick(agent) {
      if (!this.state.agents[agent]?.installed) { return; }
      this.agent = agent;
      this.#renderAgents();
    }

    // Inserts the clipboard at the cursor; main turns an error into a "Fix this error" prompt
    async #pasteClipboard() {
      const text = await this.api.clipboard?.();
      if (!text) { return this.#message(T.emptyClipboard, true); }
      const el = this.el.prompt;
      const at = el.selectionStart ?? el.value.length;
      el.value = el.value.slice(0, at) + text + el.value.slice(el.selectionEnd ?? at);
      el.focus();
      this.box.changed();
    }

    #message(text, isError = false, html = false) {
      this.el.msg[html ? 'innerHTML' : 'textContent'] = text;
      this.el.msg.className = isError ? 'msg error' : 'msg';
    }

    // ---------- actions (only from the confirm step) ----------

    async #launch() {
      this.#working(T.starting);
      const res = await this.api.launch({ agent: this.agent, cwd: this.el.cwd.value.trim(), prompt: this.prompt, worktree: !!this.worktree, terminal: this.terminal });
      if (res?.ok && this.terminal) {
        try { localStorage.setItem(TERMINAL_KEY, this.terminal); } catch { /* storage unavailable */ }
      }
      this.#done(res);
    }

    async #send() {
      this.#working(T.sending);
      const res = await this.api.sendPrompt(this.state.session.id, this.prompt);
      this.#done(res);
    }

    #working(text) {
      this.busy = true;
      this.el.submit.disabled = this.el.back.disabled = true;
      this.#message(text);
    }

    #done(res) {
      this.busy = false;
      this.el.submit.disabled = this.el.back.disabled = false;
      if (res?.ok) {
        this.drafts.delete(this.#draftKey);
        this.api.close();
      } else { this.#message(res?.error || T.wrong, true); }
    }

    // ---------- events ----------

    #bind() {
      this.el.form.addEventListener('submit', e => { e.preventDefault(); this.#next(); });
      this.el.back.addEventListener('click', () => this.#back());
      this.el.close.addEventListener('click', () => this.api.close());
      this.el.paste.addEventListener('click', () => this.#pasteClipboard());
      Attachments.guardWindow();
      this.el.queued.addEventListener('click', async e => {
        const b = e.target.closest('[data-unqueue]');
        if (!b) { return; }
        try {
          this.state.session.queue = (await this.api.unqueue?.(this.state.session.id, Number(b.dataset.unqueue))) || [];
        } catch (err) {
          return this.#message(`Couldn’t remove it from the queue: ${errorText(err)}`, true);
        }
        this.#renderQueue();
        this.#fit();
      });
      this.el.agents.addEventListener('click', e => {
        const b = e.target.closest('[data-agent]');
        if (!b || b.disabled) { return; }
        if (b.dataset.agent === this.agent) { return this.#next(); } // a second click on the chosen one goes on
        this.#pick(b.dataset.agent);
      });
      this.el.worktree.addEventListener('click', () => { this.worktree = !this.worktree; this.#renderWorktree(); });
      this.el.terms.addEventListener('click', e => {
        const b = e.target.closest('[data-term]');
        if (b) { this.terminal = b.dataset.term; this.#renderTerms(); }
      });
      this.el.review.addEventListener('click', e => {
        if (e.target.closest('[data-edit]')) { this.#go('prompt'); }
      });
      this.el.recent.addEventListener('click', e => {
        const b = e.target.closest('[data-cwd]');
        if (!b) { return; }
        this.el.cwd.value = tilde(b.dataset.cwd, this.state.home);
        this.#renderRecent();
        this.el.prompt.focus();
      });
      this.el.cwd.addEventListener('input', () => this.#renderRecent());
      this.el.browse.addEventListener('click', async () => {
        const dir = await this.api.pickFolder(this.el.cwd.value);
        if (dir) { this.el.cwd.value = tilde(dir, this.state.home); this.#renderRecent(); this.el.prompt.focus(); }
      });
      document.addEventListener('keydown', e => {
        if (!this.state) { return; }
        if (e.key === 'Escape') { e.preventDefault(); return this.busy ? undefined : this.#back(); }
        if (this.step === 'agent') {
          const keys = Object.keys(this.state.agents);
          const n = Number(e.key);
          if (n >= 1 && n <= keys.length) { e.preventDefault(); return this.#pick(keys[n - 1]); }
          if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
            e.preventDefault();
            const ok = this.installed;
            const i = ok.indexOf(this.agent);
            return this.#pick(ok[(i + (e.key === 'ArrowRight' ? 1 : -1) + ok.length) % ok.length]);
          }
        }
        // Enter goes on (Shift+Enter is a new line in the prompt); a focused button handles its own Enter
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !e.defaultPrevented) { // in the prompt: the Composer's
          const onButton = e.target.closest?.('button') && e.target !== this.el.submit;
          if (!onButton) { e.preventDefault(); this.#next(); }
        }
      });
    }
  }

  const fakeApi = { launch: async () => ({ ok: true }), sendPrompt: async () => ({ ok: true }), pickFolder: async () => null, close() {}, resize() {} };
  const view = new LauncherView(window.launcherAPI || fakeApi);
  if (window.launcherAPI) { window.launcherAPI.onShow(state => view.show(state)); }
  else { window.__demo = view; // opened in a plain browser
}
</script>
</body>
</html>
