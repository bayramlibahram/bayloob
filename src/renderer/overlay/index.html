    progressShort: (d, t) => `${d} of ${t}`,
    progress: (d, t) => `${d} of ${t} to-dos done`,
    receipt: { passed: '✓ Tests passed', failed: '✗ Tests failed', untested: '⚠ Code changed, no tests run' },
    askTests: 'Ask to run tests',
    replyTo: agent => `Reply to ${agent}…`, replySend: '✓ Send', replySendTip: 'Enter, then Enter again to send',
    replyConfirm: agent => `Enter again sends it to ${agent} · Esc to edit`, replyDialog: 'Open in the prompt window',
    replyFailed: 'Could not send',
    filesChanged: n => `${n} file${n === 1 ? '' : 's'}`,
    asksInTerminal: 'asks in the terminal', termDefault: '(terminal default)',
    taskNeedsYou: 'Task needs you', openTask: 'Open task', later: 'Later', moreTasks: n => `+${n} more`,
    menuHint: 'Bayloob picks the option you click in the terminal for you',
    soundMute: 'Sounds on — click to mute', soundUnmute: 'Sounds off — click to turn on',
    soundLocked: 'Sounds are turned off by BAYLOOB_SOUNDS=0',
    menuMute: 'Mute sounds', menuUnmute: 'Turn sounds on', menuFull: 'Full view', menuShrink: 'Exit full view',
    movingToBayloob: 'moving to Bayloob', cancel: 'Cancel',
    closeToContinue: agent => `Close ${agent} in its terminal (<code>/exit</code>). Bayloob then continues it in tmux.`,
    errorCopied: 'Error copied — fix it?', lines: n => `${n} line${n === 1 ? '' : 's'}`,
    fixIn: (agent, project) => `Fix in ${agent} · ${project}`, fixNew: 'New session…',
    findings: n => `⚔ Challenge report · ${n} finding${n === 1 ? '' : 's'}`, noFindings: '⚔ No problems found',
    openFinding: 'Open in the editor at this line',
    replyConfirmPaste: 'Enter again copies it and brings the terminal forward — paste with Ctrl+Shift+V',
    copiedPaste: '📋 Copied · paste with Ctrl+Shift+V',
    challenge: '⚔ Challenge', challenger: '⚔ challenger',
    challengeTip: 'Start a different agent, read-only, to try to break these changes',
    voice: {
      title: 'Voice prompt', to: 'to', newSession: 'new session', targetTip: 'Click to choose where the prompt goes',
      listening: 'Listening…', busy: 'Transcribing on this machine…', recordOnly: 'No local speech engine — recording only',
      missing: need => `No local speech engine. Install ${need}. Nothing was sent.`,
      mic: name => `Microphone unavailable (${name})`, empty: 'Heard nothing — try again', failed: 'Could not transcribe',
      ready: 'Check it in the prompt box before it’s sent', limit: 'Stopped at the 2-minute limit',
    },
    fullTip: 'Full view', shrinkTip: 'Back to the pill',
    newSession: 'New session', sendPrompt: 'Send a prompt', stop: 'Stop this session', confirmStop: 'Click again to stop',
  };

  const COLORS = { idle: 'var(--idle)', thinking: 'var(--thinking)', working: 'var(--working)', waiting: 'var(--waiting)', done: 'var(--done)' };
  const COOL_MS = 3000;
  const RULE_NOTE_MS = 4000;
  const ERROR_NOTE_MS = 30_000; // how long "Error copied — fix it?" stays (longer while hovered)
  const LOCK = '<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const STACK_MAX = 3; // agent tiles in the pill before "+N"
  const REMIND_MS = 60_000; // an unanswered permission card gets a reminder sound this often
  const ago = at => { const m = Math.round((Date.now() - at) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const RECEIPT_MARK = { passed: ' ✓', failed: ' ✗', untested: ' ⚠' };
  const PRIORITY = { waiting: 5, working: 4, thinking: 3, done: 2, idle: 1 };
  const DONE_TOAST_MS = 12000;
  const PILL_OPEN_WIDTH = 560;
  const HOVER_OPEN_MS = 70;
  const HOVER_CLOSE_MS = 220;
  const STOP_CONFIRM_MS = 3000;
  const FULL_SWAP_MS = 320; // the pill's width transition; the window shrinks back only after it

  const SLEEP_AFTER_MS = 5 * 60 * 1000;
  // "?mascot=svg" (from BAYLOOB_MASCOT=svg) picks the SVG mascot; it's also the fallback if the raster one can't load
  const MASCOT_MODE = new URLSearchParams(location.search).get('mascot') === 'svg' || !window.Novi || !window.NOVI_META ? 'svg' : 'novi';

  const ICON_PROMPT = '<svg viewBox="0 0 16 16"><path d="M2.5 2h11A1.5 1.5 0 0 1 15 3.5v7a1.5 1.5 0 0 1-1.5 1.5H6l-3.2 2.6A.5.5 0 0 1 2 14.2V12h.5A1.5 1.5 0 0 1 1 10.5v-7A1.5 1.5 0 0 1 2.5 2Zm1.5 3v1.3h8V5H4Zm0 2.7V9h5.5V7.7H4Z"/></svg>';
  const ICON_STOP = '<svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="2"/></svg>';


  /** Builds the hexagon mascot SVG in an agent's colors. Each copy gets unique gradient ids. */
  class Mascot {
    static #seq = 0;

    static svg(agent) {
      const u = `m${++Mascot.#seq}`, p = Agent.palette(agent);
      const stops = c => c.map((col, i) => `<stop offset="${[0, .48, 1][i]}" stop-color="${col}"/>`).join('');
      const hex = '50,14 82,32 82,68 50,86 18,68 18,32';
      return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs>
        <linearGradient id="${u}t" x1="0" y1="0" x2="1" y2="1">${stops(p.top)}</linearGradient>
        <linearGradient id="${u}b" x1="0" y1="0" x2="1" y2="1">${stops(p.bot)}</linearGradient>
        <linearGradient id="${u}v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a33"/><stop offset=".7" stop-color="#0d0520"/><stop offset="1" stop-color="#3b2a8a"/></linearGradient>
        <clipPath id="${u}ct"><polygon points="-10,-10 110,-10 110,22 -10,66"/></clipPath>
        <clipPath id="${u}cb"><polygon points="-10,74 110,30 110,110 -10,110"/></clipPath></defs>
        <polygon points="${hex}" fill="url(#${u}b)" stroke="url(#${u}b)" stroke-width="12" stroke-linejoin="round" clip-path="url(#${u}cb)"/>
        <g class="lid"><polygon points="${hex}" fill="url(#${u}t)" stroke="url(#${u}t)" stroke-width="12" stroke-linejoin="round" clip-path="url(#${u}ct)"/>
          <path d="M22,30 L50,15 L66,24" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.5" stroke-linecap="round"/></g>
        <g transform="rotate(-24 50 51)"><rect class="visor-frame" x="16" y="35" width="68" height="32" rx="9" fill="url(#${u}v)" stroke-width="3"/>
          <path d="M62,39 h12 a6,6 0 0 1 6,6" fill="none" stroke="rgba(160,140,255,.45)" stroke-width="2" stroke-linecap="round"/></g>
        <g class="eyes"><rect class="eye" x="35" y="43" width="9" height="14" rx="4.5"/><rect class="eye" x="54" y="40" width="9" height="14" rx="4.5"/>
          <path class="joy" d="M34,53 q5,-8 10,0 M53,50 q5,-8 10,0" fill="none" stroke-width="3.5" stroke-linecap="round"/></g></svg>`;
    }
  }

  /** The original SVG mascot: CSS animations driven by the element's data-s attribute. */
  class SvgMascotView {
    #agent = null;
    #timers = [];

    constructor(el) { this.el = el; }

    set(agent, state) {
      if (agent !== this.#agent) {
        this.#agent = agent;
        this.el.innerHTML = `${Mascot.svg(agent)}<div class="notes"><i>♪</i><i>♫</i><i>♪</i></div>`;
      }
      if (this.el.dataset.s === state) { return; }
      this.el.dataset.s = state; // restarts the animation on change
      this.#timers.forEach(clearTimeout);
      this.#timers = [];
      this.el.classList.remove('breath', 'blink');
      if (state === 'idle') {
        this.#every('breath', 2400, 10000, 16000);
        this.#every('blink', 300, 3000, 6000);
      }
    }

    // Plays a one-off CSS animation (by toggling a class) at random intervals while the state lasts
    #every(cls, duration, min, max) {
      const run = () => {
        this.el.classList.add(cls);
        this.#timers.push(setTimeout(() => this.el.classList.remove(cls), duration));
        this.#timers.push(setTimeout(run, min + Math.random() * (max - min)));
      };
      this.#timers.push(setTimeout(run, 1000 + Math.random() * 2000));
    }

    static thumb(agent) { return Mascot.svg(agent); }
  }

  /** The layered raster mascot animated by novi.js, in the color pack of the agent. */
  class NoviMascotView {
    #pack = null;
    #novi = null;

    constructor(el, { onSleep = null } = {}) { this.el = el; this.onSleep = onSleep; }

    set(agent, state) {
      const pack = Agent.palette(agent).pack;
      if (pack !== this.#pack) {
        // A new agent color: replace the instance (each one runs its own frame loop)
        this.#novi?.destroy();
        this.#pack = pack;
        this.#novi = new Novi(this.el, NOVI_META[pack], `${PACKS_URL}/${pack}`, { sleepAfter: SLEEP_AFTER_MS, onSleep: this.onSleep });
      }
      this.#novi.set(state);
    }

    // A static idle image for the session list — no animation, so many rows stay cheap
    static thumb(agent) { return Agent.thumb(agent); }
  }

  const MascotView = MASCOT_MODE === 'novi' ? NoviMascotView : SvgMascotView;

  /** The pill: top bar, permission / "done" card and the session list that opens on hover. */
  /**
   * Records the microphone as 16 kHz mono 16-bit WAV (what local speech engines read) and reports the level
   * for the meter. Audio never leaves the machine: it goes to Bayloob's main process, nowhere else.
   */
  class VoiceRecorder {
    static MAX_MS = 120_000;
    static RATE = 16000;
    #stream = null;
    #ctx = null;
    #analyser = null;
    #chunks = [];
    #buf = null;
    startedAt = 0;

    get recording() { return !!this.#ctx; }

    async start() {
      this.#stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
      this.#ctx = new AudioContext();
      const src = this.#ctx.createMediaStreamSource(this.#stream);
      this.#analyser = this.#ctx.createAnalyser();
      this.#analyser.fftSize = 1024;
      this.#buf = new Float32Array(this.#analyser.fftSize);
      // ScriptProcessor is old but needs no extra module file; it only copies samples out
      const proc = this.#ctx.createScriptProcessor(4096, 1, 1);
      proc.onaudioprocess = e => { this.#chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
      src.connect(this.#analyser);
      src.connect(proc);
      proc.connect(this.#ctx.destination); // silent: the output buffer is never written
      this.#chunks = [];
      this.startedAt = Date.now();
    }

    /** 0..1, for the meter */
    level() {
      if (!this.#analyser) { return 0; }
      this.#analyser.getFloatTimeDomainData(this.#buf);
      let sum = 0;
      for (const v of this.#buf) { sum += v * v; }
      return Math.min(1, Math.sqrt(sum / this.#buf.length) * 4);
    }

    /** Stops and returns the WAV bytes (or null when cancelled / nothing was captured). */
    stop({ keep = true } = {}) {
      const rate = this.#ctx?.sampleRate || 48000;
      for (const t of this.#stream?.getTracks() || []) { t.stop(); }
      this.#ctx?.close().catch(() => {});
      this.#stream = this.#ctx = this.#analyser = null;
      const chunks = this.#chunks;
      this.#chunks = [];
      return keep && chunks.length ? VoiceRecorder.wav(chunks, rate) : null;
    }

    static wav(chunks, rate, out = VoiceRecorder.RATE) {
      const len = chunks.reduce((n, c) => n + c.length, 0);
      const all = new Float32Array(len);
      let o = 0;
      for (const c of chunks) { all.set(c, o); o += c.length; }
      const ratio = rate / out;
      const n = Math.floor(len / ratio);
      const v = new DataView(new ArrayBuffer(44 + n * 2));
      const str = (at, s) => { for (let i = 0; i < s.length; i++) { v.setUint8(at + i, s.charCodeAt(i)); } };
      str(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, out, true); v.setUint32(28, out * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      str(36, 'data'); v.setUint32(40, n * 2, true);
      for (let i = 0; i < n; i++) {
        // average the input samples that fall into this output sample (a simple low-pass for the downsample)
        const a = Math.floor(i * ratio), b = Math.max(a + 1, Math.floor((i + 1) * ratio));
        let s = 0;
        for (let j = a; j < b; j++) { s += all[j]; }
        s = Math.max(-1, Math.min(1, s / (b - a)));
        v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }
      return new Uint8Array(v.buffer);
    }
  }

  class OverlayView {
    sessions = [];
    music = null;
    toast = null;          // { sid, until, hint } — the "done" card
    hovering = false;
    confirmStop = null;    // session id armed for stopping
    health = { ok: true, issues: [] };
    output = {};           // session id -> latest output line (only while the list is open)
    diffs = {};            // session id -> { files, added, deleted, untracked } of its repo
    tokens = {};           // session id -> { input, output, cacheWrite, cacheRead, total }
    queues = {};           // session id -> number of prompts waiting for it
    waits = {};            // session id -> when it started waiting on a card
    receipts = {};         // session id -> { status, command? } of its last finished turn
    progress = {};         // session id -> { done, total } of its own to-do list
    collisions = {};       // session id -> { with, files, level: 'conflict' | 'shared' } (collision radar)
    #permScroll = new Map(); // permId -> scrollTop of its command box, kept across re-renders
    #permRead = new Set();   // permIds whose whole command has been scrolled through
    #permShown = new Map();  // permId -> when its card first appeared (for the Allow cooldown)
    #coolTimer = null;
    sounds = new SoundPlayer();
    #soundPrev = null;      // sessions at the previous update (null until the first one: no sounds on start)
    #permSince = new Map(); // permId -> when it appeared or was last reminded about
    #gatesSeen = new Set(); // task gate ids already announced (one sound each)
    #gatesLater = new Set(); // gate ids the user put off in the pill (still in the Inbox and on the board)
    taskGates = null;       // null until the first update: no sound for gates that were already open
    #ruleTimer = null;
    #hoverTimer = null;
    #pressing = false;     // a mouse button is down on the pill: hold re-renders until it's released
    #paintLater = false;
    #painted = new WeakMap(); // element -> the HTML last put into it
    #soundFeedback = false; // the bar's sound button was just used to switch sound on
    soundOn = true;
    soundLocked = false;
    #errorTimer = null;
    #reply = { sid: null, text: '', confirm: false, focused: false, error: '' }; // the done card's reply box
    #answers = new Map();    // permId -> Map(question -> Set(labels)), kept across re-renders
    #prevStates = new Map();

    constructor(api) {
      this.api = api;
      const $ = id => document.getElementById(id);
      this.el = { pill: $('pill'), mascot: $('mascot'), label: $('label'), count: $('count'), status: $('status'), statusText: $('statusText'), soundBtn: $('soundBtn'), progress: $('progress'), plabel: $('plabel'), card: $('card'), list: $('list'),
        voice: $('voice'), vtarget: $('vtarget'), vwave: $('vwave'), vtext: $('vtext'), vtime: $('vtime'), vnote: $('vnote'),
        vstop: $('vstop'), vcancel: $('vcancel'), vuse: $('vuse'), voiceBtn: $('voiceBtn'), fullBtn: $('fullBtn') };
      // The manager falls asleep after a long idle and wakes on the next change: a soft sound for each
      this.mascot = new MascotView(this.el.mascot, { onSleep: asleep => asleep ? this.sounds.play('sleep') : this.sounds.playIfQuiet('wake') });
      this.#bindEvents();
      setInterval(() => this.#remind(), 5000);
    }

    setSessions(list) {
      this.#soundFor(list);
      // A fresh transition to "done" shows the done card for a while
      for (const s of list) {
        const old = this.#prevStates.get(s.id);
        if (s.state === 'done' && old && old !== 'done') { this.toast = { sid: s.id, until: Date.now() + DONE_TOAST_MS }; }
      }
      this.#prevStates = new Map(list.map(s => [s.id, s.state]));
      this.sessions = list;
      this.render();
    }

    setMusic(np) {
      if (np?.playing && !this.music?.playing) { this.sounds.play('dance'); }
      this.music = np;
      this.render();
    }

    setSoundConfig(config) {
      this.sounds.configure(config);
      this.soundOn = !!config?.enabled;
      this.soundLocked = !!config?.locked;
      // Just switched on from the bar: a soft confirmation that sound is back
      if (this.#soundFeedback && this.soundOn) { this.sounds.play('allow'); }
      this.#soundFeedback = false;
      this.#renderBarButtons();
    }

    #more = false; // the ⋯ row (mute, full view) is open

    #renderMore() {
      const pill = this.el.pill;
      const open = this.#more && pill.classList.contains('open');
      pill.classList.toggle('more', open);
      document.getElementById('moreBtn').setAttribute('aria-expanded', String(open));
      document.getElementById('moreBtn').classList.toggle('on', open);
      if (!open) { return; }
      const sound = this.soundOn
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5Z"/><path class="w" d="m16 9.5 5 5m0-5-5 5"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 19V5L7.5 9.5Z"/><path class="w" d="M15.5 9a4.2 4.2 0 0 1 0 6"/></svg>';
      const full = '<svg viewBox="0 0 24 24" aria-hidden="true"><path class="w" d="M14 4.5h5.5V10M10 19.5H4.5V14M19.5 4.5 13.5 10.5M4.5 19.5l6-6"/></svg>';
      document.getElementById('moremenu').innerHTML =
        `<button type="button" role="menuitem" data-bar="sound"${this.soundLocked ? ` disabled title="${T.soundLocked}"` : ''}>${sound}${this.soundOn ? T.menuMute : T.menuUnmute}</button>` +
        `<button type="button" role="menuitem" data-bar="full">${full}${this.full ? T.menuShrink : T.menuFull}</button>`;
    }

    setAppearance(a) {
      this.el.pill.dataset.size = ['s', 'm'].includes(a?.pillSize) ? a.pillSize : 'l';
      this.render();
    }

    #renderBarButtons() {
      const b = this.el.soundBtn;
      b.classList.toggle('muted', !this.soundOn);
      b.disabled = this.soundLocked;
      const label = this.soundLocked ? T.soundLocked : this.soundOn ? T.soundMute : T.soundUnmute;
      b.title = label;
      b.setAttribute('aria-label', label);
      b.setAttribute('aria-pressed', String(!this.soundOn));
      this.#renderMore();
    }

    // One sound per update (the most important change); unanswered cards get a quiet reminder every minute
    #soundFor(list) {
      const cue = soundCue(this.#soundPrev, list);
      if (cue) { this.sounds.play(cue); }
      this.#soundPrev = list;
      const live = new Set();
      for (const s of list) {
        if (!s.perm) { continue; }
        live.add(s.perm.id);
        if (!this.#permSince.has(s.perm.id)) { this.#permSince.set(s.perm.id, Date.now()); }
      }
      for (const id of this.#permSince.keys()) { if (!live.has(id)) { this.#permSince.delete(id); } }
    }

    #remind() {
      const now = Date.now();
      for (const [id, since] of this.#permSince) {
        if (now - since >= REMIND_MS) {
          this.#permSince.set(id, now); // next reminder a minute after this one
          this.sounds.play('permission-reminder');
          return;
        }
      }
    }

    // A workflow task reached a gate: a card like a permission's, and the same sound (never only a toast)
    setTaskGates(gates) {
      const fresh = (gates || []).filter(g => !this.#gatesSeen.has(g.gate.id));
      for (const g of fresh) { this.#gatesSeen.add(g.gate.id); }
      if (fresh.length && this.taskGates) { this.sounds.play('permission'); }
      this.taskGates = gates || [];
      this.render();
    }

    #gateCard(gates) {
      const g = gates[0];
      return { kind: 'gate', html: `
        <div class="head"><span>⏸</span><b>${T.taskNeedsYou}</b> · ${esc(g.project)}${gates.length > 1 ? ` · ${T.moreTasks(gates.length - 1)}` : ''}</div>
        <div class="summary"><b>${esc(g.title)}</b><br>${esc(g.gate.title)}</div>
        <div class="actions">
          <button class="btn" data-act="gate-later" data-gate="${esc(g.gate.id)}">${T.later}</button>
          <button class="btn primary" data-act="open-task" data-task="${esc(g.id)}">${T.openTask}</button>
        </div>` };
    }

    setOutput(lines) { this.output = lines || {}; this.render(); }

    setDiffs(diffs) { this.diffs = diffs || {}; this.render(); }

    setTokens(tokens) { this.tokens = tokens || {}; this.render(); }

    setQueues(queues) { this.queues = queues || {}; this.render(); }

    setReceipts(receipts) { this.receipts = receipts || {}; this.render(); }

    setProgress(progress) { this.progress = progress || {}; this.render(); }

    setCollisions(collisions) { this.collisions = collisions || {}; this.render(); }

    // ⚠ another agent works in the same tree: red when they edited the same file, yellow otherwise
    #collisionHtml(id) {
      const c = this.collisions[id];
      if (!c) { return ''; }
      const others = c.with.map(o => this.sessions.find(x => x.id === o)).filter(Boolean)
        .map(o => `${Agent.displayName(o.agent)} (${o.project})`).join(', ');
      const files = c.files.map(f => f.split('/').pop()).join(', ');
      const tip = c.level === 'conflict' ? T.conflictTip(others, files) : T.sharedTip(others);
      return `<span class="clash ${c.level}" title="${esc(tip)}">⚠</span>`;
    }

    setBlocked(info) { this.waits = info?.waits || {}; this.render(); this.#tickWaits(); }

    setHealth(health) { this.health = health || { ok: true, issues: [] }; this.render(); }

    open() { this.el.pill.classList.add('open'); }

    render() {
      const top = this.#byPriority()[0];
      const state = top ? top.state : 'idle';
      const dancing = this.music?.playing && (state === 'idle' || state === 'done');
      document.documentElement.style.setProperty('--accent', COLORS[state]);
      this.el.pill.dataset.state = state;
      // The manager mascot shows the most urgent state across all sessions
      this.mascot.set(MANAGER, dancing ? 'dance' : state);

      const deaf = !this.health.ok && this.health.issues.length > 0;
      this.el.pill.classList.toggle('deaf', deaf);
      this.#paint(this.el.label, deaf && !(top?.perm) ? this.#deafHtml() : this.#labelHtml(top, state));
      this.el.label.title = deaf ? T.deafTip : '';
      this.#renderStatus(top, state, deaf);
      const n = this.sessions.length;
      this.#paint(this.el.count, n > 1 ? this.#stackHtml() : '');
      this.el.pill.classList.toggle('multi', n > 1);
      this.el.count.title = n > 1 ? this.#byPriority().map(s => `${Agent.displayName(s.agent)} · ${s.project} — ${T.state[s.state]}`).join('\n') : '';

      this.#expireToast();
      const perms = this.sessions.filter(s => s.perm).sort((a, b) => Number(a.perm.id) - Number(b.perm.id));
      if (this.errorNote && Date.now() > this.errorNote.until && !this.hovering) { this.errorNote = null; }
      const menus = this.sessions.filter(s => s.menu);
      const handoffs = this.sessions.filter(s => s.handoff);
      const gates = (this.taskGates || []).filter(g => !this.#gatesLater.has(g.gate.id));
      const card = perms.length ? this.#permCard(perms[0], perms.length - 1)
        : gates.length ? this.#gateCard(gates)
        : menus.length ? this.#menuCard(menus[0])
        : handoffs.length ? this.#handoffCard(handoffs[0])
        : this.toast ? this.#doneCard() : this.errorNote ? this.#errorCard() : null;
      this.el.card.className = card ? `card ${card.kind}` : 'card';
      this.#paint(this.el.card, card ? card.html : '');
      this.#restoreReply();
      this.el.pill.classList.toggle('has-card', !!card);
      if (card?.kind.split(' ')[0] === 'perm') { this.#syncPermScroll(); }

      this.#paint(this.el.list, this.#listHtml() + this.#newSessionHtml() + this.#musicHtml());
      // The ⋯ row closes with the pill
      if (!this.el.pill.classList.contains('open')) { this.#more = false; }
      this.#renderMore();
    }

    // Chip next to the name ("••• Thinking") and the to-do progress of the agent the pill shows
    #byPriority() {
      return [...this.sessions].sort((a, b) => PRIORITY[b.state] - PRIORITY[a.state] || b.updatedAt - a.updatedAt);
    }

    // Up to STACK_MAX agent tiles, most urgent first, then "+N"
    #stackHtml() {
      const all = this.#byPriority();
      const tiles = all.slice(0, STACK_MAX).map(s => `<i class="mini" style="--ring:${COLORS[s.state]}">${MascotView.thumb(s.agent)}</i>`).join('');
      return `<span class="stack">${tiles}${all.length > STACK_MAX ? `<em>+${all.length - STACK_MAX}</em>` : ''}</span>`;
    }

    #renderStatus(top, state, deaf) {
      // While "allowed by rule" shows, the label needs the room: the chip steps aside
      const ruled = this.labelNote && Date.now() < this.labelNote.until;
      const on = !!top && state !== 'idle' && !deaf && !ruled;
      const text = top?.perm?.kind === 'question' ? T.asksYou : T.state[state];
      this.el.status.classList.toggle('on', on);
      this.el.status.classList.toggle('busy', state === 'thinking' || state === 'working');
      this.el.statusText.textContent = on ? text.charAt(0).toUpperCase() + text.slice(1) : '';
      const p = top && this.progress[top.id];
      this.el.progress.classList.toggle('on', !!p);
      this.el.progress.style.setProperty('--p', p ? `${Math.round((p.done / p.total) * 100)}%` : '0%');
      this.el.progress.title = p ? T.progress(p.done, p.total) : '';
      this.el.progress.classList.toggle('labelled', !!p);
      this.el.plabel.classList.toggle('on', !!p);
      this.el.plabel.textContent = p ? T.progressShort(p.done, p.total) : '';
      this.el.plabel.title = this.el.progress.title;
    }

    // Replaces a part's content only when it changed — and never while a mouse button is held on the pill:
    // a click is a press and a release on the same element, so swapping the buttons in between (updates
    // arrive several times a second while agents work) used to swallow clicks
    #paint(el, html) {
      if (this.#pressing) {
        this.#paintLater = true;
        return;
      }
      if (this.#painted.get(el) !== html) {
        el.innerHTML = html;
        this.#painted.set(el, html);
      }
    }

    #deafHtml() {
      const kind = this.health.issues[0].kind;
      return `<b>Bayloob</b> <span class="deaf-note" data-act="settings">⚠ can’t hear · ${T.deaf[kind] || kind}</span>`;
    }

    // "Allowed by rule" shows for a few seconds in place of the label; clicking it opens Settings (the rules)
    setRuleAllowed(r) {
      this.#flashLabel(`<b>${esc(r.project)}</b> <span class="ruled" data-act="settings" title="${esc(`${r.command}\n${T.ruleTip}`)}">${T.ruled(esc(r.key))}</span>`);
    }

    // A short message in place of the label (rule allowed something, prompt copied…), then back to normal
    #flashLabel(html) {
      this.labelNote = { html, until: Date.now() + RULE_NOTE_MS };
      this.render();
      clearTimeout(this.#ruleTimer);
      this.#ruleTimer = setTimeout(() => this.render(), RULE_NOTE_MS + 50);
    }

    #labelHtml(top, state) {
      if (this.labelNote && Date.now() < this.labelNote.until) {
        return this.labelNote.html;
      }
      if (top?.perm?.kind === 'question') { return `<b>${esc(top.project)}</b>`; }
      // The state itself is in the status chip; the label keeps the project and the tool in use
      if (top && state !== 'idle') {
        return `<b>${esc(top.project)}</b>${this.#collisionHtml(top.id)}${top.tool && state === 'working' ? ` <span>· ${esc(top.tool)}</span>` : ''}`;
      }
      if (this.music?.title) {
        return `<span class="note">♪</span> <b>${esc(this.music.title)}</b> <span>· ${esc(this.music.artist)}</span>`;
      }
      return top ? `<b>${esc(top.project)}</b> <span>${T.state[state]}</span>` : `<b>Bayloob</b> <span>${T.noSessions}</span>`;
    }

    #expireToast() {
      const t = this.toast;
      if (!t) { return; }
      const stillDone = this.sessions.some(s => s.id === t.sid && s.state === 'done');
      const replying = this.#reply.sid === t.sid && (this.#reply.focused || this.#reply.text.trim());
      if (!stillDone || (Date.now() > t.until && !this.hovering && !replying)) { this.toast = null; }
    }

    // A stack trace was copied (Settings → Watch clipboard): offer to hand it to an agent — never automatically
    setErrorCopied(info) {
      this.errorNote = { ...info, until: Date.now() + ERROR_NOTE_MS };
      this.render();
      clearTimeout(this.#errorTimer);
      this.#errorTimer = setTimeout(() => this.render(), ERROR_NOTE_MS + 50);
    }

    #errorCard() {
      const e = this.errorNote;
      // The agent to offer first: the one most recently active (not a read-only challenger)
      const target = [...this.sessions].filter(s => s.role !== 'challenger').sort((a, b) => b.updatedAt - a.updatedAt)[0];
      const fix = target
        ? `<button class="btn primary" data-act="fix-err" data-sid="${esc(target.id)}">${T.fixIn(esc(Agent.displayName(target.agent)), esc(target.project))}</button>`
        : '';
      return { kind: 'errcopy', html: `
        <div class="head"><span>🐞</span><b>${T.errorCopied}</b> · ${T.lines(e.lines)}</div>
        <div class="code">${esc(e.headline)}</div>
        <div class="actions">
          <button class="btn" data-act="err-dismiss">${T.dismiss}</button>
          <button class="btn" data-act="fix-err" data-sid="">${T.fixNew}</button>
          ${fix}
        </div>` };
    }

    // A question the agent asks only in its terminal (folder trust, an update offer…). Every option is a
    // button of its own — there is no "press Enter" here, because the terminal's default may be the risky one
    #menuCard(s) {
      const m = s.menu;
      const sid = esc(s.id);
      const opts = m.options.map((label, i) => `<button class="opt" data-act="menu" data-sid="${sid}" data-i="${i}" title="${esc(label)}">
          ${esc(label)}${i === m.selected ? ` <em>${T.termDefault}</em>` : ''}</button>`).join('');
      return { kind: 'menu', html: `
        ${this.#cardHead(s, T.asksInTerminal)}
        <div class="mq" title="${esc(m.question)}">${esc(m.question)}</div>
        <div class="mopts">${opts}</div>
        <div class="hint" data-mhint="${sid}">${T.menuHint}</div>
        <div class="actions"><button class="btn" data-act="focus" data-sid="${sid}">${T.openTerminal}</button></div>` };
    }

    // "Continue in Bayloob": waiting for the user to close the agent in its own terminal
    #handoffCard(s) {
      const name = esc(Agent.displayName(s.agent));
      return { kind: 'handoff', html: `
        ${this.#cardHead(s, T.movingToBayloob)}
        <div class="summary">${T.closeToContinue(name)}</div>
        <div class="actions">
          <button class="btn" data-act="cancel-handoff" data-sid="${esc(s.id)}">${T.cancel}</button>
          <button class="btn" data-act="focus" data-sid="${esc(s.id)}">${T.openTerminal}</button>
        </div>` };
    }

    #cardHead(s, verb) {
      const dot = Agent.color(s.agent, MASCOT_MODE);
      // How long the agent has been waiting on this card, ticking live
      const since = s.perm && this.waits[s.id];
      const wait = since ? ` · <span class="wait" data-since="${since}">${T.waiting} ${formatWait(Date.now() - since)}</span>` : '';
      return `<div class="head"><span class="adot" style="background:${dot}"></span><b>${esc(Agent.displayName(s.agent))}</b> · ${esc(s.project)} · ${verb}${wait}</div>`;
    }

    #permCard(s, queued) {
      const { id, tool, detail, hidden, kind, questions } = s.perm;
      const pid = esc(id);
      const more = queued ? `<span class="more">${T.queued(queued)}</span>` : '';
      // A question (AskUserQuestion): pick the answers right here, or answer in the terminal
      if (kind === 'question') {
        const picked = this.#answers.get(id) || new Map();
        const complete = questions.length > 0 && questions.every(q => picked.get(q.question)?.size);
        const qs = questions.map((q, qi) => `
          <div class="q">
            <div class="qh">${q.header ? `<small>${esc(q.header)}</small>` : ''}<span>${esc(q.question)}${q.multiSelect ? ` <em style="color:var(--muted);font-style:normal">(${T.pickMany})</em>` : ''}</span></div>
            <div class="opts">${q.options.map((o, oi) => `
              <button type="button" class="opt${q.multiSelect ? ' multi' : ''}${picked.get(q.question)?.has(o.label) ? ' on' : ''}"
                data-act="pick" data-id="${pid}" data-q="${qi}" data-o="${oi}" title="${esc(o.description)}">${esc(o.label)}</button>`).join('')}
            </div>
          </div>`).join('');
        return { kind: 'question', html: `
          ${this.#cardHead(s, T.asksYou)}
          <div class="questions">${qs}</div>
          <div class="actions">${more}
            <button type="button" class="btn" data-act="answer-terminal" data-id="${pid}" data-sid="${esc(s.id)}">${T.answerInTerminal}</button>
            <button type="button" class="btn primary" data-act="send-answer" data-id="${pid}" ${complete ? '' : `disabled title="${T.pickAll}"`}>${T.sendAnswer}</button>
          </div>` };
      }
      const im = s.perm.immune || {};
      if (!this.#permShown.has(id)) { this.#permShown.set(id, Date.now()); }
      return { kind: im.antibody ? 'perm antibody' : 'perm', html: `
        ${this.#cardHead(s, T.permAsks)}
        <div><span class="chip">${esc(tool)}</span></div>
        ${detail ? `<div class="code" data-perm="${pid}">${esc(detail)}</div>` : ''}
        ${im.antibody ? `<div class="immune warn">${T.antibody(esc(im.antibody.command), ago(im.antibody.at))}</div>` : ''}
        <div class="hint" data-hint="${pid}">${hidden ? T.hidden(hidden) : ''}</div>
        <div class="actions">${more}
          <button class="btn deny" data-act="deny" data-id="${pid}">${T.deny}</button>
          <button class="btn" data-act="terminal" data-id="${pid}" title="${T.terminalTip}">${T.terminal}</button>
          ${im.suggest && !im.antibody ? `<button class="btn" data-act="always-allow" data-id="${pid}" title="${esc(T.alwaysTip(im.suggest.key))}">${T.always}</button>` : ''}
          <button class="btn allow" data-act="allow" data-id="${pid}" ${hidden ? `disabled title="${T.allowBlocked}"` : ''}>${T.allow}</button>
        </div>` };
    }

    #questionPerm(permId) {
      return this.sessions.find(s => s.perm?.id === permId)?.perm || null;
    }

    // Single-choice questions keep one label, multi-select ones toggle labels
    #pick(permId, qi, oi) {
      const perm = this.#questionPerm(permId);
      const q = perm?.questions?.[qi];
      const label = q?.options?.[oi]?.label;
      if (!label) {
        return;
      }
      if (!this.#answers.has(permId)) {
        this.#answers.set(permId, new Map());
      }
      const picked = this.#answers.get(permId);
      const set = q.multiSelect ? new Set(picked.get(q.question)) : new Set();
      if (q.multiSelect && set.has(label)) {
        set.delete(label);
      } else {
        set.add(label);
      }
      picked.set(q.question, set);
      this.render();
    }

    #sendAnswer(permId) {
      const picked = this.#answers.get(permId);
      if (!picked) {
        return;
      }
      const answers = Object.fromEntries([...picked].map(([q, set]) => [q, [...set]]));
      this.api?.answer(permId, answers);
      this.#answers.delete(permId);
    }

    // A command too tall for its box can be allowed only after it has been scrolled to the end, so nobody
    // approves a tail they haven't seen. The scroll position survives re-renders.
    #syncPermScroll() {
      const box = this.el.card.querySelector('.code[data-perm]');
      if (!box) { return; }
      const id = box.dataset.perm;
      const allow = this.el.card.querySelector('[data-act=allow]');
      const hint = this.el.card.querySelector(`[data-hint="${id}"]`);
      box.scrollTop = this.#permScroll.get(id) || 0;
      const fits = box.scrollHeight <= box.clientHeight + 2;
      const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
      if (fits || atEnd) { this.#permRead.add(id); }
      if (allow.disabled && allow.title === T.allowBlocked) { return; // hidden characters: terminal only
}
      const read = this.#permRead.has(id);
      // Tripwire (several approvals in a row, each under a second) or a resemblance to a denied request:
      // Allow unlocks only after a short pause, so the request actually gets read
      const im = this.#questionPerm(id)?.immune || {};
      const wait = im.slowDown || im.antibody ? COOL_MS - (Date.now() - (this.#permShown.get(id) || 0)) : 0;
      allow.disabled = !read || wait > 0;
      allow.title = !read ? T.allowUnread : wait > 0 ? T.coolTip : '';
      // 🔒 on Allow while it waits (only touched when it changes, so the button doesn't flicker)
      const locked = wait > 0 ? '1' : '';
      if (allow.dataset.locked !== locked) {
        allow.dataset.locked = locked;
        allow.innerHTML = locked ? `${LOCK}${T.allow}` : T.allow;
      }
      if (hint) { hint.textContent = !read ? T.scrollToAllow : wait > 0 ? T.cooling(Math.ceil(wait / 1000)) : ''; }
      if (wait > 0) {
        clearTimeout(this.#coolTimer);
        this.#coolTimer = setTimeout(() => this.#syncPermScroll(), Math.min(wait, 250));
      }
    }

    #doneCard() {
      const s = this.sessions.find(x => x.id === this.toast.sid);
      const r = this.receipts[s.id];
      // Green only when the turn's tests passed (or nothing needed testing)
      const tone = r?.status === 'failed' ? ' r-failed' : r?.status === 'untested' ? ' r-untested' : '';
      return { kind: `done${tone}`, html: `
        ${this.#cardHead(s, T.finished)}
        <div class="summary">${esc(s.summary || T.taskDone)}</div>
        ${this.#receiptHtml(s)}
        ${this.#findingsHtml(s)}
        ${this.#suggHtml(s)}
        ${this.#replyHtml(s)}
        ${this.toast.hint ? `<div class="hint">${esc(this.toast.hint)}</div>` : ''}
        <div class="actions">
          ${this.#needsTests(s) ? `<button class="btn" data-act="ask-tests" data-sid="${esc(s.id)}">${T.askTests}</button>` : ''}
          ${this.#canChallenge(s) ? `<button class="btn" data-act="challenge" data-sid="${esc(s.id)}" title="${T.challengeTip}">${T.challenge}</button>` : ''}
          <button class="btn" data-act="dismiss">${T.dismiss}</button>
          <button class="btn primary" data-act="focus" data-sid="${esc(s.id)}">${T.openTerminal}</button>
        </div>` };
    }

    // The next steps its answer offered — hidden while a reply is being written or confirmed
    #suggHtml(s) {
      const list = s.suggestions || [];
      const r = this.#reply.sid === s.id ? this.#reply : null;
      if (!list.length || r?.confirm || r?.text.trim()) { return ''; }
      return `<div class="sugg">${list.map((x, i) => `<button type="button" data-act="sugg" data-sid="${esc(s.id)}" data-i="${i}"
          title="${esc(x.prompt)}">${esc(x.label)}</button>`).join('')}</div>`;
    }

    // Reply right in the done card, without the terminal: Enter, then Enter again to confirm
    #replyHtml(s) {
      const r = this.#reply.sid === s.id ? this.#reply : { text: '', confirm: false, error: '' };
      // Not in tmux: Bayloob can't type into that terminal, so the reply is copied for the user to paste
      const confirm = s.term?.tmux ? T.replyConfirm(esc(Agent.displayName(s.agent))) : T.replyConfirmPaste;
      const hint = r.error ? `<span class="err">${esc(r.error)}</span>` : r.confirm ? confirm : '';
      return `<form class="reply${r.confirm ? ' confirm' : ''}" data-sid="${esc(s.id)}" autocomplete="off">
          <input class="rtext" placeholder="${esc(T.replyTo(Agent.displayName(s.agent)))}" spellcheck="false">
          <button type="button" class="ricon" data-act="reply-dialog" data-sid="${esc(s.id)}" title="${T.replyDialog}">↗</button>
          <button type="submit" class="btn primary rsend" title="${T.replySendTip}">${r.confirm ? T.replySend : '→'}</button>
        </form>${hint ? `<div class="rhint">${hint}</div>` : ''}`;
    }

    // A ⚔ challenger's report: each `file:line` it found, click to open it in the editor
    #findingsHtml(s) {
      if (s.role !== 'challenger' || !s.findings) { return ''; }
      if (!s.findings.length) { return `<div class="findings none">${T.noFindings}</div>`; }
      const rows = s.findings.map(f => `<button type="button" class="finding" data-act="finding" data-sid="${esc(s.id)}" data-file="${esc(f.file)}" data-line="${f.line}" title="${esc(T.openFinding)}">
          <code>${esc(f.file)}:${f.line}</code><span>${esc(f.text)}</span></button>`).join('');
      return `<div class="findings"><div class="fh">${T.findings(s.findings.length)}</div><div class="flist">${rows}</div></div>`;
    }

    // The card is re-rendered on every update: put the reply text, focus and caret back
    #restoreReply() {
      const input = this.el.card.querySelector('.reply .rtext');
      if (!input) { return; }
      const sid = input.closest('.reply').dataset.sid;
      if (this.#reply.sid !== sid) { this.#reply = { sid, text: '', confirm: false, focused: false, error: '' }; }
      input.value = this.#reply.text;
      if (this.#reply.focused) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    async #replySend() {
      const r = this.#reply;
      const text = r.text.trim();
      if (!text || !r.sid) { return; }
      if (!r.confirm) { r.confirm = true; r.error = ''; return this.render(); }
      const res = await this.api?.sendPrompt(r.sid, text);
      if (res?.ok) {
        this.#reply = { sid: null, text: '', confirm: false, focused: false, error: '' };
        this.api?.keyboard(false);
        this.toast = null;
        if (res.via === 'clipboard') { this.#flashLabel(`<span class="ruled">${T.copiedPaste}</span>`); }
      } else {
        Object.assign(r, { confirm: false, error: res?.error || T.replyFailed });
      }
      this.render();
    }

    // ✓ / ✗ / ⚠ line under a finished turn's summary: did its tests pass, or were none run
    #receiptHtml(s) {
      const r = this.receipts[s.id];
      if (!r || r.status === 'no-changes') { return ''; }
      const cmd = r.command ? ` · <code>${esc(r.command.length > 48 ? `${r.command.slice(0, 47)}…` : r.command)}</code>` : '';
      return `<div class="receipt ${r.status}">${T.receipt[r.status]}${cmd}</div>`;
    }

    // A finished turn that changed code can be handed to another agent to try to break it
    #canChallenge(s) {
      const r = this.receipts[s.id];
      return s.role !== 'challenger' && (!!this.diffs[s.id] || (r && r.status !== 'no-changes'));
    }

    #needsTests(s) {
      const r = this.receipts[s.id];
      return r?.status === 'failed' || r?.status === 'untested';
    }

    #listHtml() {
      if (!this.sessions.length) { return `<div class="empty">${T.noActive}</div>`; }
      return this.sessions.map((s, i, all) => `<div class="row${i === all.length - 1 ? ' last' : ''}">
          <div class="mascot mini" data-s="${s.state}" style="--ring:${COLORS[s.state]}">${MascotView.thumb(s.agent)}</div>
          <span class="name" title="${esc(`${s.project} · ${Agent.displayName(s.agent)}`)}"><b>${esc(s.project)}</b> <span class="agent">${esc(Agent.displayName(s.agent))}${s.role === 'challenger' ? ` · <span class="role">${T.challenger}</span>` : ''}${this.#tokensHtml(s.id)}</span>${this.output[s.id] ? `<span class="out" title="${esc(this.output[s.id])}">${esc(this.output[s.id])}</span>` : ''}${this.full ? this.#histHtml(s) : ''}</span>
          ${this.queues[s.id] ? `<span class="queue" title="${T.queuedTip(this.queues[s.id])}">⏳${this.queues[s.id]}</span>` : ''}
          ${this.#diffHtml(s.id)}
          ${this.#collisionHtml(s.id)}
          <span class="st" style="color:${COLORS[s.state]}">${T.state[s.state]}${s.state === 'done' && this.receipts[s.id] ? (RECEIPT_MARK[this.receipts[s.id].status] || '') : ''}</span>
          ${this.#rowControls(s)}</div>`).join('');
    }

    // Prompt needs a tmux pane (and no pending permission); stop only for sessions Bayloob launched
    #rowControls(s) {
      const sid = esc(s.id);
      const armed = this.confirmStop === s.id;
      return [
        !s.perm ? `<button class="icon" data-act="prompt" data-sid="${sid}" title="${T.sendPrompt}">${ICON_PROMPT}</button>` : '',
        s.stoppable ? `<button class="icon stop${armed ? ' armed' : ''}" data-act="stop" data-sid="${sid}" title="${armed ? T.confirmStop : T.stop}">${ICON_STOP}</button>` : '',
        `<button class="icon" data-act="focus" data-sid="${sid}" title="${T.openTerminal}">${ICON_TERM}</button>`,
      ].join('');
    }

    // " · 1.35M tok" after the agent's name, with the full breakdown on hover
    #tokensHtml(id) {
      const t = this.tokens[id];
      return t ? ` · <span title="${esc(T.tokensTip(t))}">${formatTokens(t.total)} tok</span>` : '';
    }

    // "+42 −7" for the session's repo; nothing when it's clean or not a repo
    #diffHtml(id) {
      const d = this.diffs[id];
      if (!d || (!d.added && !d.deleted && !d.files && !d.untracked)) { return ''; }
      // Files changed but no lines counted (new untracked files, binaries, renames): say how many files
      if (!d.added && !d.deleted) {
        return `<span class="diff files" title="${esc(T.diffTip(d))}">${T.filesChanged(d.files || d.untracked || 0)}</span>`;
      }
      return `<span class="diff" title="${esc(T.diffTip(d))}"><span class="add">+${d.added}</span> <span class="del">−${d.deleted}</span></span>`;
    }

    // Live "waiting 2m 14s" on cards; the mascot fades the longer an agent waits (30 s hungry, 2 min starving)
    #tickWaits() {
      const now = Date.now();
      for (const el of this.el.card.querySelectorAll('[data-since]')) {
        el.textContent = `${T.waiting} ${formatWait(now - Number(el.dataset.since))}`;
      }
      const longest = Math.max(0, ...Object.values(this.waits).map(since => now - since));
      this.el.pill.classList.toggle('starving', longest >= 120_000);
      this.el.pill.classList.toggle('hungry', longest >= 30_000 && longest < 120_000);
    }

    // Full view: the session's last few steps under its activity line
    #histHtml(s) {
      const h = (s.history || []).slice(0, 4);
      if (!h.length) { return ''; }
      return `<span class="hist">${h.map(x => `<i>${esc(x.title)}${x.detail ? ` · ${esc(x.detail)}` : ''}<time>${ago(x.at)}</time></i>`).join('')}</span>`;
    }

    // ---------- Voice prompt ----------
    // states: off · rec (recording) · busy (transcribing) · result (text ready) · error (mic / engine missing)
    voice = { s: 'off', target: null, text: '', engine: null, raf: 0, levels: [] };
    full = false;

    // Prompts go to sessions that can take one (no permission pending), or to a new session
    #voiceTargets() { return [...this.#byPriority().filter(s => !s.perm).map(s => s.id), null]; }

    #voiceTargetLabel() {
      const s = this.voice.target && this.sessions.find(x => x.id === this.voice.target);
      return `${T.voice.to} ${s ? `${Agent.displayName(s.agent)} · ${s.project}` : T.voice.newSession}`;
    }

    async #voiceOpen() {
      const v = this.voice;
      if (v.s !== 'off') { return this.#voiceClose(); }
      v.target = this.#voiceTargets()[0];
      v.text = '';
      v.levels = [];
      this.#voiceSet('rec', T.voice.listening);
      this.api?.voiceStatus?.().then(st => {
        v.engine = st;
        if (v.s === 'rec' && !st?.available) { this.#voiceSet('rec', T.voice.recordOnly, true); }
      }).catch(() => {});
      this.recorder ??= new VoiceRecorder();
      try {
        await this.recorder.start();
      } catch (err) {
        return this.#voiceSet('error', T.voice.mic(err?.name || 'error'), true);
      }
      if (v.s !== 'rec') { this.recorder.stop({ keep: false }); return; } // closed while the mic was starting
      this.#voiceTick();
    }

    async #voiceStop() {
      const v = this.voice;
      if (v.s !== 'rec') { return; }
      cancelAnimationFrame(v.raf);
      const wav = this.recorder?.stop();
      if (!wav || wav.length < 44 + VoiceRecorder.RATE / 5) { return this.#voiceSet('error', T.voice.empty, true); }
      this.#voiceSet('busy', T.voice.busy);
      let r;
      try { r = await this.api?.transcribe?.(wav); } catch { r = null; }
      if (v.s !== 'busy') { return; } // cancelled meanwhile
      if (r?.missing) { return this.#voiceSet('error', T.voice.missing(r.need || 'a local speech engine'), true); }
      const text = (r?.ok && typeof r.text === 'string') ? r.text.trim() : '';
      if (!text) { return this.#voiceSet('error', r?.ok ? T.voice.empty : T.voice.failed, true); }
      v.text = text;
      this.#voiceSet('result', T.voice.ready);
    }

    #voiceUse() {
      const v = this.voice;
      if (v.s !== 'result' || !v.text) { return; }
      // the usual confirm path: the prompt box (or Ask Bayloob for a new session), prefilled — nothing is sent from here
      this.api?.voicePrompt?.(v.target, v.text);
      this.#voiceClose();
    }

    #voiceClose() {
      const v = this.voice;
      cancelAnimationFrame(v.raf);
      if (this.recorder?.recording) { this.recorder.stop({ keep: false }); }
      v.s = 'off';
      v.text = '';
      this.el.voice.classList.remove('on');
      this.el.voice.dataset.s = 'off';
      this.el.voiceBtn.classList.remove('on');
      this.el.pill.classList.remove('voicing');
      if (!this.hovering && !this.full) { this.el.pill.classList.remove('open'); this.render(); }
    }

    // Updates the panel in place (textContent / attributes only — the buttons are never rebuilt, so clicks land)
    #voiceSet(s, note, warn = false) {
      const v = this.voice;
      const e = this.el;
      v.s = s;
      e.voice.dataset.s = s;
      e.voice.classList.add('on');
      e.voiceBtn.classList.add('on');
      e.pill.classList.add('voicing', 'open');
      e.vnote.textContent = note || '';
      e.vnote.classList.toggle('warn', warn);
      e.vtarget.textContent = this.#voiceTargetLabel();
      e.vtarget.title = T.voice.targetTip;
      e.vtarget.disabled = s !== 'rec' && s !== 'result';
      e.vtext.textContent = v.text;
      e.vtext.classList.toggle('on', s === 'result');
      e.vstop.hidden = s !== 'rec';
      e.vuse.hidden = s !== 'result';
      e.vcancel.textContent = s === 'rec' || s === 'busy' ? 'Cancel' : 'Close';
      e.vwave.hidden = s === 'result';
      if (s !== 'rec') { this.#voiceDraw(); }
    }

    #voiceTick() {
      const v = this.voice;
      if (v.s !== 'rec') { return; }
      const ms = Date.now() - this.recorder.startedAt;
      v.levels.push(this.recorder.level());
      if (v.levels.length > 400) { v.levels.shift(); }
      const sec = Math.floor(ms / 1000);
      this.el.vtime.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
      this.#voiceDraw();
      if (ms >= VoiceRecorder.MAX_MS) {
        this.#voiceStop();
        return;
      }
      v.raf = requestAnimationFrame(() => this.#voiceTick());
    }

    // A calm waveform: one rounded bar per recent level, newest on the right, mirrored around the middle
    #voiceDraw() {
      const c = this.el.vwave;
      const dpr = devicePixelRatio || 1;
      const w = c.clientWidth, h = c.clientHeight;
      if (!w || !h) { return; }
      if (c.width !== Math.round(w * dpr)) { c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); }
      const g = c.getContext('2d');
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      g.fillStyle = getComputedStyle(c).color;
      const step = 5, bars = Math.floor(w / step), lv = this.voice.levels;
      for (let i = 0; i < bars; i++) {
        const l = lv[lv.length - bars + i] ?? 0;
        const bh = Math.max(2, l * (h - 4));
        g.globalAlpha = this.voice.s === 'rec' ? .35 + .65 * (i / bars) : .35;
        g.beginPath();
        g.roundRect(i * step, (h - bh) / 2, 3, bh, 1.5);
        g.fill();
      }
    }

    #voiceCycleTarget() {
      const all = this.#voiceTargets();
      this.voice.target = all[(all.indexOf(this.voice.target) + 1) % all.length];
      this.el.vtarget.textContent = this.#voiceTargetLabel();
    }

    // ---------- Full view ----------
    #setFull(on) {
      const pill = this.el.pill;
      this.full = on;
      this.el.fullBtn.title = on ? T.shrinkTip : T.fullTip;
      this.el.fullBtn.classList.toggle('on', on);
      if (on) {
        // the window grows first, then the pill animates into the new room
        this.api?.setFull?.(true);
        setTimeout(() => { pill.classList.add('full', 'open'); this.render(); }, 60);
      } else {
        // the pill shrinks first, then the window follows once the animation is over
        pill.classList.remove('full');
        this.render();
        setTimeout(() => {
          this.api?.setFull?.(false);
          if (!this.hovering && this.voice.s === 'off') { pill.classList.remove('open'); this.render(); }
        }, FULL_SWAP_MS);
      }
    }

    #newSessionHtml() {
      return this.api ? `<button class="new" data-act="new"><span>+</span> ${T.newSession}</button>` : '';
    }

    #musicHtml() {
      const m = this.music;
      if (!m?.title) { return ''; }
      return `<div class="music">
        <div class="art">♪</div>
        <div class="t"><b>${esc(m.title)}</b> <span>${esc(m.artist)}${m.app ? ` · ${esc(m.app)}` : ''}</span></div>
        <button class="icon" data-act="music" data-m="prev" title="${T.prev}">⏮</button>
        <button class="icon" data-act="music" data-m="toggle" title="${T.playPause}">${m.playing ? '⏸' : '▶'}</button>
        <button class="icon" data-act="music" data-m="next" title="${T.next}">⏭</button></div>`;
    }

    async #onClick(e) {
      // The deaf warning opens Settings (where hooks and the extension are installed)
      if (e.target.closest('[data-act=settings]')) { return this.api?.openSettings(); }
      // The bar's own buttons: sound on/off, workspace panel (they don't open or close the list)
      const vb = e.target.closest('[data-voice]');
      if (vb) {
        e.stopPropagation();
        const a = vb.dataset.voice;
        if (a === 'stop') { this.#voiceStop(); }
        if (a === 'cancel') { this.#voiceClose(); }
        if (a === 'use') { this.#voiceUse(); }
        if (a === 'target' && !vb.disabled) { this.#voiceCycleTarget(); }
        return;
      }
      if (e.target.closest('#voice')) { return; } // the panel's own empty space does nothing
      const bb = e.target.closest('[data-bar]');
      if (bb) {
        e.stopPropagation();
        if (bb.disabled) { return; }
        if (bb.dataset.bar === 'sound') { this.#soundFeedback = !this.soundOn; this.api?.toggleSounds(); }
        if (bb.dataset.bar === 'panel') { this.api?.togglePanel(); }
        if (bb.dataset.bar === 'voice') { this.#voiceOpen(); }
        if (bb.dataset.bar === 'full') { this.#setFull(!this.full); }
        if (bb.dataset.bar === 'more') { this.#more = !this.#more; }
        else if (bb.closest('#moremenu')) { this.#more = false; }
        this.#renderMore();
        return;
      }
      // A click on the top bar (mascot / label) opens the workspace panel
      if (e.target.closest('.bar')) { return this.api?.togglePanel(); }
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) { return; }
      const act = b.dataset.act;
      if (act === 'pick') {
        this.#pick(b.dataset.id, Number(b.dataset.q), Number(b.dataset.o));
      } else if (act === 'send-answer') {
        b.disabled = true;
        this.sounds.play('allow');
        this.#sendAnswer(b.dataset.id);
      } else if (act === 'answer-terminal') {
        b.disabled = true;
        this.sounds.play('to-terminal');
        this.api?.decide(b.dataset.id, 'terminal');
        this.api?.focus(b.dataset.sid);
      } else if (act === 'always-allow') {
        b.disabled = true;
        this.sounds.play('allow');
        this.api?.alwaysAllow(b.dataset.id);
      } else if (act === 'allow' || act === 'deny' || act === 'terminal') {
        b.disabled = true;
        this.sounds.play(act === 'terminal' ? 'to-terminal' : act);
        this.api?.decide(b.dataset.id, act);
      } else if (act === 'challenge') {
        b.disabled = true;
        const r = await this.api?.challenge(b.dataset.sid);
        if (r?.ok === false && this.toast) { this.toast.hint = r.error; }
        this.render();
      } else if (act === 'menu') {
        for (const x of this.el.card.querySelectorAll('[data-act=menu]')) { x.disabled = true; }
        const r = await this.api?.answerMenu(b.dataset.sid, Number(b.dataset.i));
        if (r?.ok === false) {
          const hint = this.el.card.querySelector('[data-mhint]');
          if (hint) { hint.textContent = r.error; hint.classList.add('err'); }
          for (const x of this.el.card.querySelectorAll('[data-act=menu]')) { x.disabled = false; }
        }
      } else if (act === 'cancel-handoff') {
        this.api?.cancelHandoff(b.dataset.sid);
      } else if (act === 'fix-err') {
        this.errorNote = null;
        this.api?.fixError(b.dataset.sid || null);
        this.render();
      } else if (act === 'err-dismiss') {
        this.errorNote = null;
        this.render();
      } else if (act === 'finding') {
        const r = await this.api?.openFinding(b.dataset.sid, b.dataset.file, Number(b.dataset.line));
        if (r?.ok === false && this.toast) { this.toast.hint = r.error; this.render(); }
      } else if (act === 'sugg') {
        // One of the next steps it offered: into the reply box, waiting for ✓ Send (never sent on one click)
        const x = this.sessions.find(v => v.id === b.dataset.sid)?.suggestions?.[Number(b.dataset.i)];
        if (x) {
          this.#reply = { sid: b.dataset.sid, text: x.prompt, confirm: true, focused: false, error: '' };
          this.render();
        }
      } else if (act === 'reply-dialog') {
        this.api?.keyboard(false);
        this.api?.openPrompt(b.dataset.sid, this.#reply.sid === b.dataset.sid ? this.#reply.text : '');
      } else if (act === 'ask-tests') {
        b.disabled = true;
        this.api?.askTests(b.dataset.sid);
      } else if (act === 'dismiss') {
        this.toast = null;
        this.render();
      } else if (act === 'open-task') {
        this.api?.openTasks(b.dataset.task);
      } else if (act === 'gate-later') {
        this.#gatesLater.add(b.dataset.gate); // it stays in the Inbox and on the board
        this.render();
      } else if (act === 'focus') {
        this.sounds.play('open-terminal');
        const r = this.api ? await this.api.focus(b.dataset.sid) : { ok: false };
        if (r?.ok) { this.toast = null; }
        else if (this.toast) { this.toast.hint = T.focusFailed; }
        this.render();
      } else if (act === 'music') {
        this.api?.music(b.dataset.m);
      } else if (act === 'new') {
        this.api?.openLauncher();
      } else if (act === 'prompt') {
        this.api?.openPrompt(b.dataset.sid);
      } else if (act === 'stop') {
        // Stopping kills the agent, so it takes a second click within a few seconds
        if (this.confirmStop === b.dataset.sid) {
          this.confirmStop = null;
          this.api?.stopSession(b.dataset.sid);
        } else {
          const sid = b.dataset.sid;
          this.confirmStop = sid;
          setTimeout(() => { if (this.confirmStop === sid) { this.confirmStop = null; this.render(); } }, STOP_CONFIRM_MS);
        }
        this.render();
      }
    }

    #bindEvents() {
      const { pill } = this.el;
      pill.addEventListener('click', e => {
        this.#onClick(e);
        // On Linux the window must stay natively focusable. Hand focus back after ordinary controls;
        // the reply form keeps it until sending or leaving the field.
        if (!e.target.closest('.reply')) { this.api?.keyboard(false); }
      });
      pill.addEventListener('pointerdown', () => { this.#pressing = true; });
      // Released anywhere (or cancelled): let the click fire first, then catch up on held renders
      const release = () => {
        if (!this.#pressing) { return; }
        this.#pressing = false;
        setTimeout(() => { if (this.#paintLater) { this.#paintLater = false; this.render(); } }, 0);
      };
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
      window.addEventListener('blur', release);
      // Done card reply box: the overlay takes keyboard focus only while it's being typed into
      const card = this.el.card;
      card.addEventListener('pointerdown', async e => {
        const input = e.target.closest('.rtext');
        if (!input) { return; }
        this.#reply.focused = true;
        // Wait for the native focus handoff, then focus the field: on platforms that toggle
        // focusability, the original pointer event is otherwise already over.
        try { await this.api?.keyboard(true); } catch { return; }
        if (input.isConnected && this.#reply.focused) { input.focus(); }
      });
      card.addEventListener('focusin', e => {
        if (e.target.closest('.rtext')) { this.#reply.focused = true; }
      });
      card.addEventListener('focusout', e => {
        if (!e.target.closest('.rtext')) { return; }
        // a re-render also blurs the box for a moment; only a real leave hands the keyboard back
        setTimeout(() => {
          if (!card.querySelector('.rtext:focus')) { this.#reply.focused = false; this.api?.keyboard(false); }
        }, 50);
      });
      card.addEventListener('input', e => {
        if (!e.target.closest('.rtext')) { return; }
        Object.assign(this.#reply, { text: e.target.value, confirm: false, error: '', focused: true });
        e.target.closest('.reply').classList.remove('confirm');
        const send = card.querySelector('.rsend');
        if (send) { send.textContent = '→'; }
        card.querySelector('.rhint')?.remove();
      });
      card.addEventListener('submit', e => {
        if (!e.target.closest('.reply')) { return; }
        e.preventDefault();
        this.#replySend();
      });
      card.addEventListener('keydown', e => {
        if (e.key !== 'Escape' || !e.target.closest('.rtext')) { return; }
        e.preventDefault();
        if (this.#reply.confirm) { this.#reply.confirm = false; this.render(); }
        else { e.target.blur(); }
      });
      // scroll doesn't bubble, so listen in the capture phase for the permission command box
      pill.addEventListener('scroll', e => {
        if (!e.target.matches?.('.code[data-perm]')) { return; }
        this.#permScroll.set(e.target.dataset.perm, e.target.scrollTop);
        this.#syncPermScroll();
      }, true);
      // Opens a beat after the pointer arrives and closes a beat after it leaves: passing over the pill or
      // slipping off its edge for a moment doesn't make it flicker
      pill.addEventListener('mouseenter', () => {
        this.hovering = true;
        this.api?.setMouseOver(true);
        clearTimeout(this.#hoverTimer);
        if (pill.classList.contains('open')) { return; }
        this.#hoverTimer = setTimeout(() => { this.open(); this.sounds.play('expand'); }, HOVER_OPEN_MS);
      });
      pill.addEventListener('mouseleave', () => {
        this.hovering = false;
        this.api?.setMouseOver(false);
        clearTimeout(this.#hoverTimer);
        if (this.full || this.voice.s !== 'off') { return; } // full view and the voice panel stay until closed
        this.#hoverTimer = setTimeout(() => {
          if (!pill.classList.contains('open')) { return; }
          this.sounds.play('collapse');
          pill.classList.remove('open');
          this.render();
        }, HOVER_CLOSE_MS);
      });
      setInterval(() => { if (this.toast && !this.hovering && Date.now() > this.toast.until) { this.render();  }}, 1000);
      setInterval(() => this.#tickWaits(), 1000);

      if (!this.api) { return; }
      // Report the pill's bounds whenever they change (on Linux the window shape follows them)
      const sendRect = () => {
        const r = pill.getBoundingClientRect();
        this.api.setPillRect({ x: r.left, y: r.top, w: r.width, h: r.height });
      };
      new ResizeObserver(sendRect).observe(pill);
      // the window itself changes size for full view: the pill moves inside it without changing size
      window.addEventListener('resize', sendRect);
      // Give the full open size up front so the shape doesn't clip the opening animation
      pill.addEventListener('mouseenter', () => {
        if (this.full) { return; }
        const r = pill.getBoundingClientRect();
        this.api.setPillRect({ x: Math.min(r.left, (innerWidth - PILL_OPEN_WIDTH) / 2), y: r.top, w: PILL_OPEN_WIDTH, h: r.height + 460 });
      });
      sendRect();
    }
  }

  const view = new OverlayView(window.bayloobAPI);
  if (window.bayloobAPI) {
    window.bayloobAPI.onSessions(list => view.setSessions(list));
    window.bayloobAPI.onMusic(np => view.setMusic(np));
    window.bayloobAPI.onHealth?.(h => view.setHealth(h));
    window.bayloobAPI.onOutput?.(lines => view.setOutput(lines));
    window.bayloobAPI.onDiffs?.(diffs => view.setDiffs(diffs));
    window.bayloobAPI.onTokens?.(tokens => view.setTokens(tokens));
    window.bayloobAPI.onQueues?.(q => view.setQueues(q));
    // Shown in the open pill while any agent runs; the pill's ResizeObserver keeps its shape in step
    window.bayloobAPI.onUsage?.(usage => {
      const box = document.getElementById('usage');
      const rows = Object.entries(usage?.agents || {}).filter(([, u]) => u.enabled && (u.running || u.queued));
      box.classList.toggle('on', rows.length > 0);
      box.innerHTML = rows.map(([a, u]) => {
        const dots = Array.from({ length: Math.min(u.max, 8) }, (_, i) => `<i class="${i < u.running ? 'on' : ''}"></i>`).join('');
        return `<span title="${esc(`${Agent.displayName(a)}: ${u.running} of ${u.max} running${u.queued ? `, ${u.queued} queued` : ''}`)}">${esc(Agent.displayName(a).split(' ')[0])}
          <span class="ud" style="--c:${Agent.color(a)}">${dots}</span><b>${u.running}/${u.max}</b>${u.queued ? `<em>+${u.queued}</em>` : ''}</span>`;
      }).join('');
    });
    window.bayloobAPI.onBlocked?.(info => view.setBlocked(info));
    window.bayloobAPI.onReceipts?.(r => view.setReceipts(r));
    window.bayloobAPI.onProgress?.(p => view.setProgress(p));
    window.bayloobAPI.onCollisions?.(c => view.setCollisions(c));
    window.bayloobAPI.onSoundConfig?.(c => view.setSoundConfig(c));
    window.bayloobAPI.onRuleAllowed?.(r => view.setRuleAllowed(r));
    window.bayloobAPI.onErrorCopied?.(e => view.setErrorCopied(e));
    window.bayloobAPI.onTaskGates?.(g => view.setTaskGates(g));
    window.bayloobAPI.onAppearance?.(a => view.setAppearance(a));
  } else {
    // Opened in a plain browser: demo mode, driven from the console via window.__demo
    window.__demo = { onSessions: list => view.setSessions(list), setMusic: np => view.setMusic(np), open: () => view.open(), setAppearance: a => view.setAppearance(a), view };
  }
  view.render(); // first paint; the first list from main is the baseline for sounds, not news
</script>
</body>
</html>
