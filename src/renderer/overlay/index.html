<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Bayloob</title>
<style>
  :root {
    --glass: rgba(14, 14, 18, 0.94);
    --card: rgba(255,255,255,0.045);
    --line: rgba(255,255,255,0.08);
    --text: #f2f2f5;
    --muted: #8b8b96;
    --idle: #8b8b96;
    --thinking: #6aa8ff;
    --working: #ffb547;
    --waiting: #ff5d6c;
    --done: #4fd59a;
    --brand: #8b4dff;
    --accent: var(--idle);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; overflow: hidden; height: 100%;
    font: 500 13px/1.4 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; color: var(--text);
    user-select: none; -webkit-font-smoothing: antialiased; }
  body { display: flex; justify-content: center; align-items: flex-start; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; background: none; }

  /* ---------- Pill ---------- */
  .pill {
    width: 340px; min-height: 58px;
    background: var(--glass);
    border-radius: 0 0 20px 20px;
    border: 1px solid var(--line); border-top: none;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    overflow: hidden;
    transition: width .35s cubic-bezier(.2,.9,.3,1.2), border-radius .35s;
  }
  .pill.open, .pill.has-card { width: 480px; border-radius: 0 0 26px 26px; }
  .bar { position: relative; cursor: pointer; display: flex; align-items: center; gap: 10px; height: 58px; padding: 4px 14px 0 7px; }
  /* the manager mascot sits on its own tile, like an app icon docked to the bar */
  .tile { flex: none; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.1); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 2px 8px rgba(0,0,0,.35); }
  .label { flex: 0 1 auto; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .label b { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
  .label span { color: var(--muted); }
  /* status chip: "••• Thinking" in the state's colour; the dots pulse while the agent is busy */
  .clash { margin-left: 6px; font-size: 13px; cursor: help; }
  .clash.conflict { color: var(--waiting); }
  .clash.shared { color: var(--working); }
  .status { flex: none; display: none; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 9px; border-radius: 13px;
    font-size: 12.5px; font-weight: 600; color: color-mix(in srgb, var(--accent) 80%, white);
    background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .status.on { display: inline-flex; }
  .status .dots { display: inline-flex; gap: 3px; }
  .status .dots i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .55; }
  .status.busy .dots i { animation: dot 1.2s ease-in-out infinite; }
  .status.busy .dots i:nth-child(2) { animation-delay: .15s; }
  .status.busy .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 0%, 60%, 100% { opacity: .35; transform: none; } 30% { opacity: 1; transform: translateY(-2px); } }
  .chev { flex: none; width: 18px; height: 18px; color: var(--muted); transition: transform .3s, color .2s; }
  .pill.open .chev { transform: rotate(180deg); color: var(--text); }
  /* the top agent's own to-do list (TodoWrite / tasks): done / total along the bottom of the bar */
  .progress { position: absolute; left: 62px; right: 14px; bottom: 3px; height: 3px; border-radius: 2px;
    background: rgba(255,255,255,.07); overflow: hidden; display: none; }
  .progress.on { display: block; }
  .progress i { display: block; height: 100%; width: var(--p, 0%); border-radius: inherit;
    background: linear-gradient(90deg, var(--brand), #b28bff); transition: width .5s cubic-bezier(.2,.9,.3,1); }
  .label .note { color: #c9a4ff; }
  /* deaf: Bayloob can't hear the agents — grey mascot, warning in the label */
  /* an agent waiting on you: the mascot fades as the wait grows */
  .pill.hungry .mascot { filter: saturate(.55); }
  .pill.starving .mascot { filter: saturate(.2) brightness(.8); }
  .card.done.r-failed { border-color: color-mix(in srgb, var(--waiting) 45%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--waiting) 9%, transparent), var(--card)); }
  .card.done.r-untested { border-color: color-mix(in srgb, var(--working) 40%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--working) 8%, transparent), var(--card)); }
  .row .role { color: var(--waiting); }
  .card.perm.antibody { border-color: color-mix(in srgb, var(--waiting) 55%, transparent); }
  .immune.warn { margin-top: 8px; font-size: 12.5px; color: var(--waiting); }
  .immune code { font: 500 11.5px ui-monospace, monospace; }
  .receipt { margin-top: 8px; font-size: 12.5px; font-weight: 600; }
  .receipt code { font: 500 11.5px ui-monospace, monospace; color: var(--muted); }
  .receipt.passed { color: var(--done); }
  .receipt.failed { color: var(--waiting); }
  .receipt.untested { color: var(--working); }
  .card .head .wait { color: var(--waiting); font-variant-numeric: tabular-nums; }
  .pill.deaf .mascot { filter: grayscale(1) brightness(.75); }
  .label .deaf-note { color: var(--working); }
  .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }

  /* ---------- Mascot (based on the Baynovix logo) ---------- */
  .mascot { position: relative; width: 38px; height: 38px; flex: none; --ring: var(--accent); }
  .mascot.mini { width: 26px; height: 26px; }
  .mascot[data-s=idle], .mascot[data-s=dance] { --ring: var(--brand); }
  .mascot svg { width: 100%; height: 100%; overflow: visible; display: block;
    filter: drop-shadow(0 0 3px color-mix(in srgb, var(--ring) 70%, transparent)) drop-shadow(0 2px 3px rgba(0,0,0,.5));
    transform-origin: 50% 90%; }
  .mascot.mini svg { filter: drop-shadow(0 0 2px color-mix(in srgb, var(--ring) 60%, transparent)); }
  .mascot svg .lid, .mascot svg .eye, .mascot svg .joy { transform-box: fill-box; transform-origin: center; }
  .mascot svg .lid { transition: transform .3s cubic-bezier(.3,1.5,.5,1); }
  .mascot svg .visor-frame { stroke: var(--ring); transition: stroke .3s; }
  .mascot svg .eye { fill: #f3eaff; transition: transform .2s; }
  .mascot svg .joy { opacity: 0; stroke: #f3eaff; transition: opacity .2s; }

  /* idle: one-off breaths and blinks toggled by SvgMascotView — an endless animation would keep the
     transparent overlay redrawing every frame even when nothing happens */
  .mascot.breath svg { animation: breathe 2.4s ease-in-out 1; }
  .mascot.blink svg .eye { animation: blink-once .3s ease-in-out 1; }
  .mascot[data-s=thinking] svg .eyes { animation: scan 2.2s ease-in-out infinite; }
  .mascot[data-s=thinking] svg .visor-frame { animation: glow 1.2s ease-in-out infinite; }
  .mascot[data-s=working] svg .lid { animation: chomp .45s ease-in-out infinite; }
  .mascot[data-s=working] svg .eye { transform: scaleY(.45); }
  .mascot[data-s=waiting] svg .lid { transform: translate(-2px,-7px) rotate(-6deg); }
  .mascot[data-s=waiting] svg .eye { transform: scale(1.15,1.2); }
  .mascot[data-s=waiting] svg { animation: shake .4s ease-in-out infinite; }
  .mascot[data-s=waiting] svg .visor-frame { animation: glow .5s steps(2) infinite; }
  .mascot[data-s=done] svg .eye, .mascot[data-s=dance] svg .eye { opacity: 0; }
  .mascot[data-s=done] svg .joy, .mascot[data-s=dance] svg .joy { opacity: 1; }
  .mascot[data-s=done] svg { animation: joy .7s cubic-bezier(.3,1.6,.5,1) 1; }
  /* dance: music is playing — sways, the lid bobs to the beat, notes float up */
  .mascot[data-s=dance] svg { animation: groove .5s ease-in-out infinite alternate; }
  .mascot[data-s=dance] svg .lid { animation: chomp .5s ease-in-out infinite; }
  /* raster mascot (novi.js): static idle thumbnail in the session list */
  .thumb { position: relative; width: 100%; height: 100%;
    filter: drop-shadow(0 0 2px color-mix(in srgb, var(--ring) 60%, transparent)); }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mascot .notes { position: absolute; inset: 0; pointer-events: none; display: none; }
  .mascot[data-s=dance] .notes { display: block; }
  .mascot .notes i { position: absolute; font-style: normal; font-size: 10px; color: #c9a4ff; opacity: 0;
    text-shadow: 0 0 4px rgba(176,73,249,.8); animation: float 2s ease-out infinite; }
  .mascot .notes i:nth-child(1) { left: 26px; top: 2px; }
  .mascot .notes i:nth-child(2) { left: 30px; top: 10px; animation-delay: .7s; }
  .mascot .notes i:nth-child(3) { left: -4px; top: 6px; animation-delay: 1.3s; }

  @keyframes breathe { 50% { transform: scale(1.03, .97); } }
  @keyframes blink-once { 50% { transform: scaleY(.1); } }
  @keyframes scan { 0%,100% { transform: translate(-5px, 2px); } 50% { transform: translate(5px, -2px); } }
  @keyframes glow { 50% { stroke-opacity: .35; } }
  @keyframes chomp { 50% { transform: translate(-1px,-5px) rotate(-3deg); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }
  @keyframes joy { 0% { transform: translateY(0); } 40% { transform: translateY(-5px) scale(.95,1.06); } 100% { transform: translateY(0); } }
  @keyframes groove { from { transform: rotate(-7deg) translateY(0); } to { transform: rotate(7deg) translateY(-2px); } }
  @keyframes float { 0% { opacity: 0; transform: translateY(4px) scale(.7); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px) scale(1); } }

  /* ---------- Cards: permission and "done" ---------- */
  .card { margin: 2px 12px 12px; padding: 14px 16px; border-radius: 16px; background: var(--card);
    border: 1px solid var(--line); display: none; animation: cardIn .3s cubic-bezier(.2,.9,.3,1.2); }
  .pill.has-card .card { display: block; }
  .card.perm { border-color: color-mix(in srgb, var(--waiting) 45%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--waiting) 10%, transparent), var(--card)); }
  .card.done { border-color: color-mix(in srgb, var(--done) 40%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--done) 9%, transparent), var(--card)); }
  .card .head { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .card .head b { color: var(--text); font-weight: 600; }
  .card .head .adot { width: 7px; height: 7px; border-radius: 50%; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 7px; font-size: 12px; font-weight: 600;
    background: rgba(255,181,71,.14); color: var(--working); margin-right: 6px; }
  .code { font: 12.5px/1.5 ui-monospace, "Ubuntu Mono", "DejaVu Sans Mono", monospace; color: #e9e6f5;
    background: rgba(0,0,0,.35); border-radius: 8px; padding: 6px 8px; margin-top: 6px;
    max-height: 160px; overflow-y: auto; overflow-wrap: anywhere; white-space: pre-wrap; user-select: text; }
  .code::-webkit-scrollbar { width: 5px; }
  .code::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }
  .questions { display: flex; flex-direction: column; gap: 14px; margin-top: 2px; max-height: 360px; overflow-y: auto; }
  .q .qh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .q .qh small { flex: none; padding: 1px 7px; border-radius: 6px; background: rgba(106,168,255,.14); color: var(--thinking);
    font-size: 11px; font-weight: 600; }
  .q .qh span { color: #e9e6f5; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  .opt { padding: 6px 12px; border-radius: 10px; background: rgba(255,255,255,.06); border: 1px solid var(--line);
    color: #d9d7e3; font-size: 12.5px; text-align: left; transition: background .12s, border-color .12s; }
  .opt:hover { background: rgba(255,255,255,.11); }
  .opt.on { background: color-mix(in srgb, var(--thinking) 20%, transparent); border-color: var(--thinking); color: var(--text); }
  .opt.multi::before { content: '☐ '; color: var(--muted); }
  .opt.multi.on::before { content: '☑ '; color: var(--thinking); }
  .card.question { border-color: color-mix(in srgb, var(--thinking) 45%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--thinking) 10%, transparent), var(--card)); }
  .summary { color: #d9d7e3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .actions { display: flex; gap: 6px; margin-top: 9px; justify-content: flex-end; }
  .btn { padding: 7px 15px; border-radius: 999px; background: rgba(255,255,255,.08); font-size: 13px; font-weight: 600;
    transition: background .15s, transform .1s; }
  .btn:hover { background: rgba(255,255,255,.15); }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: #f2f2f5; color: #121216; }
  .btn.primary:hover { background: #fff; }
  .btn.allow { background: var(--done); color: #08130d; }
  .btn.deny { color: var(--waiting); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .more { color: var(--muted); font-size: 12px; margin-right: auto; align-self: center; }
  .hint { color: var(--waiting); font-size: 12px; margin-top: 8px; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(-6px); } }

  /* ---------- Session list (opens on hover) ---------- */
  .list { max-height: 0; opacity: 0; transition: max-height .35s ease, opacity .25s; padding: 0 12px; }
  .pill.open .list { max-height: 400px; opacity: 1; padding-bottom: 10px; }
  .row { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 2px 8px 18px; border-top: 1px solid var(--line); }
  /* sessions are subs of the manager mascot: a tree guide links each row to the pill's mascot column */
  .row::before { content: ''; position: absolute; left: 6px; top: -1px; bottom: 0; border-left: 1px solid rgba(255,255,255,.12); }
  .row::after { content: ''; position: absolute; left: 6px; top: 50%; width: 8px; border-top: 1px solid rgba(255,255,255,.12); }
  .row.last::before { bottom: 50%; }
  .row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the agent's latest output, under its name */
  /* uncommitted changes in the session's repo */
  .row .queue { flex: none; font-size: 12px; color: var(--thinking); }
  .row .diff { flex: none; font: 600 11.5px ui-monospace, "Ubuntu Mono", monospace; padding: 2px 6px; border-radius: 6px; background: rgba(255,255,255,.05); }
  .row .diff .add { color: var(--done); }
  .row .diff .del { color: var(--waiting); }
  .row .out { display: block; color: #8b8b96; font-size: 11.5px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .agent { color: var(--muted); font-size: 12px; }
  .row .st { font-size: 12px; }
  .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
  .icon:hover { background: rgba(255,255,255,.1); color: var(--text); }
  .icon svg { width: 15px; height: 15px; fill: currentColor; }
  .icon.stop:hover { color: var(--waiting); }
  .icon.stop.armed { background: color-mix(in srgb, var(--waiting) 22%, transparent); color: var(--waiting); }
  .new { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 2px; border-top: 1px solid var(--line);
    color: var(--muted); text-align: left; transition: color .15s; }
  .new:hover { color: var(--text); }
  .new span { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 14px;
    background: rgba(255,255,255,.07); }
  .empty { color: var(--muted); padding: 8px 2px; border-top: 1px solid var(--line); }
  .music { display: flex; align-items: center; gap: 8px; padding: 7px 2px 2px; border-top: 1px solid var(--line); }
  .music .art { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-size: 11px;
    background: linear-gradient(135deg, #B049F9, #601ADA); }
  .music .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .music .t span { color: var(--muted); }
</style>
</head>
<body>
  <div class="pill" id="pill">
    <div class="bar">
      <div class="tile"><div class="mascot" id="mascot" data-s="idle"></div></div>
      <div class="label" id="label"><b>Bayloob</b> <span>starting…</span></div>
      <span class="status" id="status"><span class="dots"><i></i><i></i><i></i></span><span id="statusText"></span></span>
      <div class="count" id="count"></div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      <div class="progress" id="progress"><i></i></div>
    </div>
    <div class="card" id="card"></div>
    <div class="list" id="list"></div>
  </div>

<script src="../shared/ui-common.js"></script>
<script src="../../assets/packs/meta.js"></script>
<script src="../shared/novi.js"></script>
<script src="../shared/sounds.js"></script>
<script>
  // Every UI string lives here — a language switcher later only needs to swap this object
  const T = {
    state: { idle: 'idle', thinking: 'thinking', working: 'working', waiting: 'needs approval', done: 'done' },
    starting: 'starting…', noSessions: 'no sessions', noActive: 'No active agent sessions',
    sessions: n => `${n} sessions`,
    permAsks: 'wants permission', finished: 'finished', taskDone: 'Task completed.',
    queued: n => `+${n} queued`,
    hidden: n => `⚠ ${n} more characters not shown — review in the terminal`,
    scrollToAllow: 'Scroll to the end of the command to enable Allow',
    asksYou: 'has a question', answerInTerminal: 'Answer in terminal', sendAnswer: 'Send answer',
    pickAll: 'Pick an answer for every question', pickMany: 'any number',
    deny: 'Deny', terminal: 'In terminal', terminalTip: 'Decide in the terminal', allow: 'Allow',
    antibody: (cmd, when) => `🛡 Looks like <code>${cmd}</code>, which you denied ${when}`,
    always: 'Always allow here',
    alwaysTip: key => `You've allowed "${key}" here several times. Allow it in this folder from now on (removable in Settings)`,
    cooling: s => `Read it first — Allow unlocks in ${s}s`,
    coolTip: 'A short pause before allowing: you approved several requests very quickly, or this resembles one you denied',
    allowBlocked: 'Part of this command is hidden, so it can only be approved in the terminal',
    allowUnread: 'Read the whole command first (scroll to its end)',
    dismiss: 'Dismiss', openTerminal: 'Open terminal',
    focusFailed: 'Could not bring this terminal to the front (see README → "Open terminal").',
    prev: 'Previous', playPause: 'Play / pause', next: 'Next',
    deaf: { 'not-installed': 'no hooks', broken: 'hook missing', unheard: 'agent silent' },
    deafTip: 'Bayloob can’t hear your agents — click to open Settings',
    diffTip: d => `Uncommitted in this repo: ${d.files} file${d.files === 1 ? '' : 's'} changed${d.untracked ? ` (${d.untracked} new)` : ''}`,
    tokensTip: t => `Tokens: ${t.input.toLocaleString()} in · ${t.output.toLocaleString()} out · ${t.cacheWrite.toLocaleString()} cache write\n+ ${t.cacheRead.toLocaleString()} read from cache (not counted)`,
    queuedTip: n => `${n} prompt${n === 1 ? '' : 's'} waiting — sent when the agent finishes`,
    waiting: 'waiting',
    conflictTip: (who, files) => `Also edited by ${who}: ${files}. Move new work to a worktree from the panel`,
    sharedTip: who => `${who} is working in the same folder; their uncommitted changes can affect each other`,
    progress: (d, t) => `${d} of ${t} to-dos done`,
    receipt: { passed: '✓ Tests passed', failed: '✗ Tests failed', untested: '⚠ Code changed, no tests run' },
    askTests: 'Ask to run tests',
    challenge: '⚔ Challenge', challenger: '⚔ challenger',
    challengeTip: 'Start a different agent, read-only, to try to break these changes',
    newSession: 'New session', sendPrompt: 'Send a prompt', stop: 'Stop this session', confirmStop: 'Click again to stop',
  };

  const COLORS = { idle: 'var(--idle)', thinking: 'var(--thinking)', working: 'var(--working)', waiting: 'var(--waiting)', done: 'var(--done)' };
  const COOL_MS = 3000;
  const REMIND_MS = 60_000; // an unanswered permission card gets a reminder sound this often
  const ago = at => { const m = Math.round((Date.now() - at) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : `${Math.round(m / 1440)} d ago`; };
  const RECEIPT_MARK = { passed: ' ✓', failed: ' ✗', untested: ' ⚠' };
  const PRIORITY = { waiting: 5, working: 4, thinking: 3, done: 2, idle: 1 };
  const DONE_TOAST_MS = 12000;
  const PILL_OPEN_WIDTH = 480;
  const STOP_CONFIRM_MS = 3000;

  const SLEEP_AFTER_MS = 5 * 60 * 1000;
  // "?mascot=svg" (from BAYLOOB_MASCOT=svg) picks the SVG mascot; it's also the fallback if the raster one can't load
  const MASCOT_MODE = new URLSearchParams(location.search).get('mascot') === 'svg' || !window.Novi || !window.NOVI_META ? 'svg' : 'novi';

  const ICON_PROMPT = '<svg viewBox="0 0 16 16"><path d="M2.5 2h11A1.5 1.5 0 0 1 15 3.5v7a1.5 1.5 0 0 1-1.5 1.5H6l-3.2 2.6A.5.5 0 0 1 2 14.2V12h.5A1.5 1.5 0 0 1 1 10.5v-7A1.5 1.5 0 0 1 2.5 2Zm1.5 3v1.3h8V5H4Zm0 2.7V9h5.5V7.7H4Z"/></svg>';
  const ICON_STOP = '<svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="2"/></svg>';


  /** Builds the hexagon mascot SVG in an agent's colors. Each copy gets unique gradient ids. */
  class Mascot {
    static #seq = 0;

    static svg(agent) {
      const u = `m${++Mascot.#seq}`, p = Agent.palette(agent);
      const stops = c => c.map((col, i) => `<stop offset="${[0, .48, 1][i]}" stop-color="${col}"/>`).join('');
      const hex = '50,14 82,32 82,68 50,86 18,68 18,32';
      return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs>
        <linearGradient id="${u}t" x1="0" y1="0" x2="1" y2="1">${stops(p.top)}</linearGradient>
        <linearGradient id="${u}b" x1="0" y1="0" x2="1" y2="1">${stops(p.bot)}</linearGradient>
        <linearGradient id="${u}v" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a0a33"/><stop offset=".7" stop-color="#0d0520"/><stop offset="1" stop-color="#3b2a8a"/></linearGradient>
        <clipPath id="${u}ct"><polygon points="-10,-10 110,-10 110,22 -10,66"/></clipPath>
        <clipPath id="${u}cb"><polygon points="-10,74 110,30 110,110 -10,110"/></clipPath></defs>
        <polygon points="${hex}" fill="url(#${u}b)" stroke="url(#${u}b)" stroke-width="12" stroke-linejoin="round" clip-path="url(#${u}cb)"/>
        <g class="lid"><polygon points="${hex}" fill="url(#${u}t)" stroke="url(#${u}t)" stroke-width="12" stroke-linejoin="round" clip-path="url(#${u}ct)"/>
          <path d="M22,30 L50,15 L66,24" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.5" stroke-linecap="round"/></g>
        <g transform="rotate(-24 50 51)"><rect class="visor-frame" x="16" y="35" width="68" height="32" rx="9" fill="url(#${u}v)" stroke-width="3"/>
          <path d="M62,39 h12 a6,6 0 0 1 6,6" fill="none" stroke="rgba(160,140,255,.45)" stroke-width="2" stroke-linecap="round"/></g>
        <g class="eyes"><rect class="eye" x="35" y="43" width="9" height="14" rx="4.5"/><rect class="eye" x="54" y="40" width="9" height="14" rx="4.5"/>
          <path class="joy" d="M34,53 q5,-8 10,0 M53,50 q5,-8 10,0" fill="none" stroke-width="3.5" stroke-linecap="round"/></g></svg>`;
    }
  }

  /** The original SVG mascot: CSS animations driven by the element's data-s attribute. */
  class SvgMascotView {
    #agent = null;
    #timers = [];

    constructor(el) { this.el = el; }

    set(agent, state) {
      if (agent !== this.#agent) {
        this.#agent = agent;
        this.el.innerHTML = `${Mascot.svg(agent)}<div class="notes"><i>♪</i><i>♫</i><i>♪</i></div>`;
      }
      if (this.el.dataset.s === state) { return; }
      this.el.dataset.s = state; // restarts the animation on change
      this.#timers.forEach(clearTimeout);
      this.#timers = [];
      this.el.classList.remove('breath', 'blink');
      if (state === 'idle') {
        this.#every('breath', 2400, 10000, 16000);
        this.#every('blink', 300, 3000, 6000);
      }
    }

    // Plays a one-off CSS animation (by toggling a class) at random intervals while the state lasts
    #every(cls, duration, min, max) {
      const run = () => {
        this.el.classList.add(cls);
        this.#timers.push(setTimeout(() => this.el.classList.remove(cls), duration));
        this.#timers.push(setTimeout(run, min + Math.random() * (max - min)));
      };
      this.#timers.push(setTimeout(run, 1000 + Math.random() * 2000));
    }

    static thumb(agent) { return Mascot.svg(agent); }
  }

  /** The layered raster mascot animated by novi.js, in the color pack of the agent. */
  class NoviMascotView {
    #pack = null;
    #novi = null;

    constructor(el) { this.el = el; }

    set(agent, state) {
      const pack = Agent.palette(agent).pack;
      if (pack !== this.#pack) {
        // A new agent color: replace the instance (each one runs its own frame loop)
        this.#novi?.destroy();
        this.#pack = pack;
        this.#novi = new Novi(this.el, NOVI_META[pack], `${PACKS_URL}/${pack}`, { sleepAfter: SLEEP_AFTER_MS });
      }
      this.#novi.set(state);
    }

    // A static idle image for the session list — no animation, so many rows stay cheap
    static thumb(agent) { return Agent.thumb(agent); }
  }

  const MascotView = MASCOT_MODE === 'novi' ? NoviMascotView : SvgMascotView;

  /** The pill: top bar, permission / "done" card and the session list that opens on hover. */
  class OverlayView {
    sessions = [];
    music = null;
    toast = null;          // { sid, until, hint } — the "done" card
    hovering = false;
    confirmStop = null;    // session id armed for stopping
    health = { ok: true, issues: [] };
    output = {};           // session id -> latest output line (only while the list is open)
    diffs = {};            // session id -> { files, added, deleted, untracked } of its repo
    tokens = {};           // session id -> { input, output, cacheWrite, cacheRead, total }
    queues = {};           // session id -> number of prompts waiting for it
    waits = {};            // session id -> when it started waiting on a card
    receipts = {};         // session id -> { status, command? } of its last finished turn
    progress = {};         // session id -> { done, total } of its own to-do list
    collisions = {};       // session id -> { with, files, level: 'conflict' | 'shared' } (collision radar)
    #permScroll = new Map(); // permId -> scrollTop of its command box, kept across re-renders
    #permRead = new Set();   // permIds whose whole command has been scrolled through
    #permShown = new Map();  // permId -> when its card first appeared (for the Allow cooldown)
    #coolTimer = null;
    sounds = new SoundPlayer();
    #soundPrev = null;      // sessions at the previous update (null until the first one: no sounds on start)
    #permSince = new Map(); // permId -> when it appeared or was last reminded about
    #answers = new Map();    // permId -> Map(question -> Set(labels)), kept across re-renders
    #prevStates = new Map();

    constructor(api) {
      this.api = api;
      const $ = id => document.getElementById(id);
      this.el = { pill: $('pill'), mascot: $('mascot'), label: $('label'), count: $('count'), status: $('status'), statusText: $('statusText'), progress: $('progress'), card: $('card'), list: $('list') };
      this.mascot = new MascotView(this.el.mascot);
      this.#bindEvents();
      setInterval(() => this.#remind(), 5000);
    }

    setSessions(list) {
      this.#soundFor(list);
      // A fresh transition to "done" shows the done card for a while
      for (const s of list) {
        const old = this.#prevStates.get(s.id);
        if (s.state === 'done' && old && old !== 'done') { this.toast = { sid: s.id, until: Date.now() + DONE_TOAST_MS }; }
      }
      this.#prevStates = new Map(list.map(s => [s.id, s.state]));
      this.sessions = list;
      this.render();
    }

    setMusic(np) {
      if (np?.playing && !this.music?.playing) { this.sounds.play('dance'); }
      this.music = np;
      this.render();
    }

    setSoundConfig(config) { this.sounds.configure(config); }

    // One sound per update (the most important change); unanswered cards get a quiet reminder every minute
    #soundFor(list) {
      const cue = soundCue(this.#soundPrev, list);
      if (cue) { this.sounds.play(cue); }
      this.#soundPrev = list;
      const live = new Set();
      for (const s of list) {
        if (!s.perm) { continue; }
        live.add(s.perm.id);
        if (!this.#permSince.has(s.perm.id)) { this.#permSince.set(s.perm.id, Date.now()); }
      }
      for (const id of this.#permSince.keys()) { if (!live.has(id)) { this.#permSince.delete(id); } }
    }

    #remind() {
      const now = Date.now();
      for (const [id, since] of this.#permSince) {
        if (now - since >= REMIND_MS) {
          this.#permSince.set(id, now); // next reminder a minute after this one
          this.sounds.play('permission-reminder');
          return;
        }
      }
    }

    setOutput(lines) { this.output = lines || {}; this.render(); }

    setDiffs(diffs) { this.diffs = diffs || {}; this.render(); }

    setTokens(tokens) { this.tokens = tokens || {}; this.render(); }

    setQueues(queues) { this.queues = queues || {}; this.render(); }

    setReceipts(receipts) { this.receipts = receipts || {}; this.render(); }

    setProgress(progress) { this.progress = progress || {}; this.render(); }

    setCollisions(collisions) { this.collisions = collisions || {}; this.render(); }

    // ⚠ another agent works in the same tree: red when they edited the same file, yellow otherwise
    #collisionHtml(id) {
      const c = this.collisions[id];
      if (!c) { return ''; }
      const others = c.with.map(o => this.sessions.find(x => x.id === o)).filter(Boolean)
        .map(o => `${Agent.displayName(o.agent)} (${o.project})`).join(', ');
      const files = c.files.map(f => f.split('/').pop()).join(', ');
      const tip = c.level === 'conflict' ? T.conflictTip(others, files) : T.sharedTip(others);
      return `<span class="clash ${c.level}" title="${esc(tip)}">⚠</span>`;
    }

    setBlocked(info) { this.waits = info?.waits || {}; this.render(); this.#tickWaits(); }

    setHealth(health) { this.health = health || { ok: true, issues: [] }; this.render(); }

    open() { this.el.pill.classList.add('open'); }

    render() {
      const top = [...this.sessions].sort((a, b) => PRIORITY[b.state] - PRIORITY[a.state] || b.updatedAt - a.updatedAt)[0];
      const state = top ? top.state : 'idle';
      const dancing = this.music?.playing && (state === 'idle' || state === 'done');
      document.documentElement.style.setProperty('--accent', COLORS[state]);
      // The manager mascot shows the most urgent state across all sessions
      this.mascot.set(MANAGER, dancing ? 'dance' : state);

      const deaf = !this.health.ok && this.health.issues.length > 0;
      this.el.pill.classList.toggle('deaf', deaf);
      this.el.label.innerHTML = deaf && !(top?.perm) ? this.#deafHtml() : this.#labelHtml(top, state);
      this.el.label.title = deaf ? T.deafTip : '';
      this.#renderStatus(top, state, deaf);
      const n = this.sessions.length;
      this.el.count.textContent = n > 1 ? n : '';
      this.el.count.title = n > 1 ? T.sessions(n) : '';

      this.#expireToast();
      const perms = this.sessions.filter(s => s.perm).sort((a, b) => Number(a.perm.id) - Number(b.perm.id));
      const card = perms.length ? this.#permCard(perms[0], perms.length - 1) : this.toast ? this.#doneCard() : null;
      this.el.card.className = card ? `card ${card.kind}` : 'card';
      this.el.card.innerHTML = card ? card.html : '';
      this.el.pill.classList.toggle('has-card', !!card);
      if (card?.kind.split(' ')[0] === 'perm') { this.#syncPermScroll(); }

      this.el.list.innerHTML = this.#listHtml() + this.#newSessionHtml() + this.#musicHtml();
    }

    // Chip next to the name ("••• Thinking") and the to-do progress of the agent the pill shows
    #renderStatus(top, state, deaf) {
      const on = !!top && state !== 'idle' && !deaf;
      const text = top?.perm?.kind === 'question' ? T.asksYou : T.state[state];
      this.el.status.classList.toggle('on', on);
      this.el.status.classList.toggle('busy', state === 'thinking' || state === 'working');
      this.el.statusText.textContent = on ? text.charAt(0).toUpperCase() + text.slice(1) : '';
      const p = top && this.progress[top.id];
      this.el.progress.classList.toggle('on', !!p);
      this.el.progress.style.setProperty('--p', p ? `${Math.round((p.done / p.total) * 100)}%` : '0%');
      this.el.progress.title = p ? T.progress(p.done, p.total) : '';
    }

    #deafHtml() {
      const kind = this.health.issues[0].kind;
      return `<b>Bayloob</b> <span class="deaf-note" data-act="settings">⚠ can’t hear · ${T.deaf[kind] || kind}</span>`;
    }

    #labelHtml(top, state) {
      if (top?.perm?.kind === 'question') { return `<b>${esc(top.project)}</b>`; }
      // The state itself is in the status chip; the label keeps the project and the tool in use
      if (top && state !== 'idle') {
        return `<b>${esc(top.project)}</b>${this.#collisionHtml(top.id)}${top.tool && state === 'working' ? ` <span>· ${esc(top.tool)}</span>` : ''}`;
      }
      if (this.music?.title) {
        return `<span class="note">♪</span> <b>${esc(this.music.title)}</b> <span>· ${esc(this.music.artist)}</span>`;
      }
      return top ? `<b>${esc(top.project)}</b> <span>${T.state[state]}</span>` : `<b>Bayloob</b> <span>${T.noSessions}</span>`;
    }

    #expireToast() {
      const t = this.toast;
      if (!t) { return; }
      const stillDone = this.sessions.some(s => s.id === t.sid && s.state === 'done');
      if (!stillDone || (Date.now() > t.until && !this.hovering)) { this.toast = null; }
    }

    #cardHead(s, verb) {
      const dot = Agent.color(s.agent, MASCOT_MODE);
      // How long the agent has been waiting on this card, ticking live
      const since = s.perm && this.waits[s.id];
      const wait = since ? ` · <span class="wait" data-since="${since}">${T.waiting} ${formatWait(Date.now() - since)}</span>` : '';
      return `<div class="head"><span class="adot" style="background:${dot}"></span><b>${esc(Agent.displayName(s.agent))}</b> · ${esc(s.project)} · ${verb}${wait}</div>`;
    }

    #permCard(s, queued) {
      const { id, tool, detail, hidden, kind, questions } = s.perm;
      const pid = esc(id);
      const more = queued ? `<span class="more">${T.queued(queued)}</span>` : '';
      // A question (AskUserQuestion): pick the answers right here, or answer in the terminal
      if (kind === 'question') {
        const picked = this.#answers.get(id) || new Map();
        const complete = questions.length > 0 && questions.every(q => picked.get(q.question)?.size);
        const qs = questions.map((q, qi) => `
          <div class="q">
            <div class="qh">${q.header ? `<small>${esc(q.header)}</small>` : ''}<span>${esc(q.question)}${q.multiSelect ? ` <em style="color:var(--muted);font-style:normal">(${T.pickMany})</em>` : ''}</span></div>
            <div class="opts">${q.options.map((o, oi) => `
              <button type="button" class="opt${q.multiSelect ? ' multi' : ''}${picked.get(q.question)?.has(o.label) ? ' on' : ''}"
                data-act="pick" data-id="${pid}" data-q="${qi}" data-o="${oi}" title="${esc(o.description)}">${esc(o.label)}</button>`).join('')}
            </div>
          </div>`).join('');
        return { kind: 'question', html: `
          ${this.#cardHead(s, T.asksYou)}
          <div class="questions">${qs}</div>
          <div class="actions">${more}
            <button type="button" class="btn" data-act="answer-terminal" data-id="${pid}" data-sid="${esc(s.id)}">${T.answerInTerminal}</button>
            <button type="button" class="btn primary" data-act="send-answer" data-id="${pid}" ${complete ? '' : `disabled title="${T.pickAll}"`}>${T.sendAnswer}</button>
          </div>` };
      }
      const im = s.perm.immune || {};
      if (!this.#permShown.has(id)) { this.#permShown.set(id, Date.now()); }
      return { kind: im.antibody ? 'perm antibody' : 'perm', html: `
        ${this.#cardHead(s, T.permAsks)}
        <div><span class="chip">${esc(tool)}</span></div>
        ${detail ? `<div class="code" data-perm="${pid}">${esc(detail)}</div>` : ''}
        ${im.antibody ? `<div class="immune warn">${T.antibody(esc(im.antibody.command), ago(im.antibody.at))}</div>` : ''}
        <div class="hint" data-hint="${pid}">${hidden ? T.hidden(hidden) : ''}</div>
        <div class="actions">${more}
          <button class="btn deny" data-act="deny" data-id="${pid}">${T.deny}</button>
          <button class="btn" data-act="terminal" data-id="${pid}" title="${T.terminalTip}">${T.terminal}</button>
          ${im.suggest && !im.antibody ? `<button class="btn" data-act="always-allow" data-id="${pid}" title="${esc(T.alwaysTip(im.suggest.key))}">${T.always}</button>` : ''}
          <button class="btn allow" data-act="allow" data-id="${pid}" ${hidden ? `disabled title="${T.allowBlocked}"` : ''}>${T.allow}</button>
        </div>` };
    }

    #questionPerm(permId) {
      return this.sessions.find(s => s.perm?.id === permId)?.perm || null;
    }

    // Single-choice questions keep one label, multi-select ones toggle labels
    #pick(permId, qi, oi) {
      const perm = this.#questionPerm(permId);
      const q = perm?.questions?.[qi];
      const label = q?.options?.[oi]?.label;
      if (!label) {
        return;
      }
      if (!this.#answers.has(permId)) {
        this.#answers.set(permId, new Map());
      }
      const picked = this.#answers.get(permId);
      const set = q.multiSelect ? new Set(picked.get(q.question)) : new Set();
      if (q.multiSelect && set.has(label)) {
        set.delete(label);
      } else {
        set.add(label);
      }
      picked.set(q.question, set);
      this.render();
    }

    #sendAnswer(permId) {
      const picked = this.#answers.get(permId);
      if (!picked) {
        return;
      }
      const answers = Object.fromEntries([...picked].map(([q, set]) => [q, [...set]]));
      this.api?.answer(permId, answers);
      this.#answers.delete(permId);
    }

    // A command too tall for its box can be allowed only after it has been scrolled to the end, so nobody
    // approves a tail they haven't seen. The scroll position survives re-renders.
    #syncPermScroll() {
      const box = this.el.card.querySelector('.code[data-perm]');
      if (!box) { return; }
      const id = box.dataset.perm;
      const allow = this.el.card.querySelector('[data-act=allow]');
      const hint = this.el.card.querySelector(`[data-hint="${id}"]`);
      box.scrollTop = this.#permScroll.get(id) || 0;
      const fits = box.scrollHeight <= box.clientHeight + 2;
      const atEnd = box.scrollTop + box.clientHeight >= box.scrollHeight - 2;
      if (fits || atEnd) { this.#permRead.add(id); }
      if (allow.disabled && allow.title === T.allowBlocked) { return; // hidden characters: terminal only
}
      const read = this.#permRead.has(id);
      // Tripwire (several approvals in a row, each under a second) or a resemblance to a denied request:
      // Allow unlocks only after a short pause, so the request actually gets read
      const im = this.#questionPerm(id)?.immune || {};
      const wait = im.slowDown || im.antibody ? COOL_MS - (Date.now() - (this.#permShown.get(id) || 0)) : 0;
      allow.disabled = !read || wait > 0;
      allow.title = !read ? T.allowUnread : wait > 0 ? T.coolTip : '';
      if (hint) { hint.textContent = !read ? T.scrollToAllow : wait > 0 ? T.cooling(Math.ceil(wait / 1000)) : ''; }
      if (wait > 0) {
        clearTimeout(this.#coolTimer);
        this.#coolTimer = setTimeout(() => this.#syncPermScroll(), Math.min(wait, 250));
      }
    }

    #doneCard() {
      const s = this.sessions.find(x => x.id === this.toast.sid);
      const r = this.receipts[s.id];
      // Green only when the turn's tests passed (or nothing needed testing)
      const tone = r?.status === 'failed' ? ' r-failed' : r?.status === 'untested' ? ' r-untested' : '';
      return { kind: `done${tone}`, html: `
        ${this.#cardHead(s, T.finished)}
        <div class="summary">${esc(s.summary || T.taskDone)}</div>
        ${this.#receiptHtml(s)}
        ${this.toast.hint ? `<div class="hint">${esc(this.toast.hint)}</div>` : ''}
        <div class="actions">
          ${this.#needsTests(s) ? `<button class="btn" data-act="ask-tests" data-sid="${esc(s.id)}">${T.askTests}</button>` : ''}
          ${this.#canChallenge(s) ? `<button class="btn" data-act="challenge" data-sid="${esc(s.id)}" title="${T.challengeTip}">${T.challenge}</button>` : ''}
          <button class="btn" data-act="dismiss">${T.dismiss}</button>
          <button class="btn primary" data-act="focus" data-sid="${esc(s.id)}">${T.openTerminal}</button>
        </div>` };
    }

    // ✓ / ✗ / ⚠ line under a finished turn's summary: did its tests pass, or were none run
    #receiptHtml(s) {
      const r = this.receipts[s.id];
      if (!r || r.status === 'no-changes') { return ''; }
      const cmd = r.command ? ` · <code>${esc(r.command.length > 48 ? `${r.command.slice(0, 47)}…` : r.command)}</code>` : '';
      return `<div class="receipt ${r.status}">${T.receipt[r.status]}${cmd}</div>`;
    }

    // A finished turn that changed code can be handed to another agent to try to break it
    #canChallenge(s) {
      const r = this.receipts[s.id];
      return s.role !== 'challenger' && (!!this.diffs[s.id] || (r && r.status !== 'no-changes'));
    }

    #needsTests(s) {
      const r = this.receipts[s.id];
      return !!s.term?.tmux && (r?.status === 'failed' || r?.status === 'untested');
    }

    #listHtml() {
      if (!this.sessions.length) { return `<div class="empty">${T.noActive}</div>`; }
      return this.sessions.map((s, i, all) => `<div class="row${i === all.length - 1 ? ' last' : ''}">
          <div class="mascot mini" data-s="${s.state}" style="--ring:${COLORS[s.state]}">${MascotView.thumb(s.agent)}</div>
          <span class="name">${esc(s.project)} <span class="agent">${esc(Agent.displayName(s.agent))}${s.role === 'challenger' ? ` · <span class="role">${T.challenger}</span>` : ''}${this.#tokensHtml(s.id)}</span>${this.output[s.id] ? `<span class="out" title="${esc(this.output[s.id])}">${esc(this.output[s.id])}</span>` : ''}</span>
          ${this.queues[s.id] ? `<span class="queue" title="${T.queuedTip(this.queues[s.id])}">⏳${this.queues[s.id]}</span>` : ''}
          ${this.#diffHtml(s.id)}
          ${this.#collisionHtml(s.id)}
          <span class="st" style="color:${COLORS[s.state]}">${T.state[s.state]}${s.state === 'done' && this.receipts[s.id] ? (RECEIPT_MARK[this.receipts[s.id].status] || '') : ''}</span>
          ${this.#rowControls(s)}</div>`).join('');
    }

    // Prompt needs a tmux pane (and no pending permission); stop only for sessions Bayloob launched
    #rowControls(s) {
      const sid = esc(s.id);
      const armed = this.confirmStop === s.id;
      return [
        s.term?.tmux && !s.perm ? `<button class="icon" data-act="prompt" data-sid="${sid}" title="${T.sendPrompt}">${ICON_PROMPT}</button>` : '',
        s.managed ? `<button class="icon stop${armed ? ' armed' : ''}" data-act="stop" data-sid="${sid}" title="${armed ? T.confirmStop : T.stop}">${ICON_STOP}</button>` : '',
        `<button class="icon" data-act="focus" data-sid="${sid}" title="${T.openTerminal}">${ICON_TERM}</button>`,
      ].join('');
    }

    // " · 1.35M tok" after the agent's name, with the full breakdown on hover
    #tokensHtml(id) {
      const t = this.tokens[id];
      return t ? ` · <span title="${esc(T.tokensTip(t))}">${formatTokens(t.total)} tok</span>` : '';
    }

    // "+42 −7" for the session's repo; nothing when it's clean or not a repo
    #diffHtml(id) {
      const d = this.diffs[id];
      if (!d || (!d.added && !d.deleted && !d.files)) { return ''; }
      return `<span class="diff" title="${esc(T.diffTip(d))}"><span class="add">+${d.added}</span> <span class="del">−${d.deleted}</span></span>`;
    }

    // Live "waiting 2m 14s" on cards; the mascot fades the longer an agent waits (30 s hungry, 2 min starving)
    #tickWaits() {
      const now = Date.now();
      for (const el of this.el.card.querySelectorAll('[data-since]')) {
        el.textContent = `${T.waiting} ${formatWait(now - Number(el.dataset.since))}`;
      }
      const longest = Math.max(0, ...Object.values(this.waits).map(since => now - since));
      this.el.pill.classList.toggle('starving', longest >= 120_000);
      this.el.pill.classList.toggle('hungry', longest >= 30_000 && longest < 120_000);
    }

    #newSessionHtml() {
      return this.api ? `<button class="new" data-act="new"><span>+</span> ${T.newSession}</button>` : '';
    }

    #musicHtml() {
      const m = this.music;
      if (!m?.title) { return ''; }
      return `<div class="music">
        <div class="art">♪</div>
        <div class="t"><b>${esc(m.title)}</b> <span>${esc(m.artist)}${m.app ? ` · ${esc(m.app)}` : ''}</span></div>
        <button class="icon" data-act="music" data-m="prev" title="${T.prev}">⏮</button>
        <button class="icon" data-act="music" data-m="toggle" title="${T.playPause}">${m.playing ? '⏸' : '▶'}</button>
        <button class="icon" data-act="music" data-m="next" title="${T.next}">⏭</button></div>`;
    }

    async #onClick(e) {
      // The deaf warning opens Settings (where hooks and the extension are installed)
      if (e.target.closest('[data-act=settings]')) { return this.api?.openSettings(); }
      // A click on the top bar (mascot / label) opens the workspace panel
      if (e.target.closest('.bar')) { return this.api?.togglePanel(); }
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) { return; }
      const act = b.dataset.act;
      if (act === 'pick') {
        this.#pick(b.dataset.id, Number(b.dataset.q), Number(b.dataset.o));
      } else if (act === 'send-answer') {
        b.disabled = true;
        this.sounds.play('allow');
        this.#sendAnswer(b.dataset.id);
      } else if (act === 'answer-terminal') {
        b.disabled = true;
        this.sounds.play('to-terminal');
        this.api?.decide(b.dataset.id, 'terminal');
        this.api?.focus(b.dataset.sid);
      } else if (act === 'always-allow') {
        b.disabled = true;
        this.sounds.play('allow');
        this.api?.alwaysAllow(b.dataset.id);
      } else if (act === 'allow' || act === 'deny' || act === 'terminal') {
        b.disabled = true;
        this.sounds.play(act === 'terminal' ? 'to-terminal' : act);
        this.api?.decide(b.dataset.id, act);
      } else if (act === 'challenge') {
        b.disabled = true;
        const r = await this.api?.challenge(b.dataset.sid);
        if (r?.ok === false && this.toast) { this.toast.hint = r.error; }
        this.render();
      } else if (act === 'ask-tests') {
        b.disabled = true;
        this.api?.askTests(b.dataset.sid);
      } else if (act === 'dismiss') {
        this.toast = null;
        this.render();
      } else if (act === 'focus') {
        this.sounds.play('open-terminal');
        const r = this.api ? await this.api.focus(b.dataset.sid) : { ok: false };
        if (r?.ok) { this.toast = null; }
        else if (this.toast) { this.toast.hint = T.focusFailed; }
        this.render();
      } else if (act === 'music') {
        this.api?.music(b.dataset.m);
      } else if (act === 'new') {
        this.api?.openLauncher();
      } else if (act === 'prompt') {
        this.api?.openPrompt(b.dataset.sid);
      } else if (act === 'stop') {
        // Stopping kills the agent, so it takes a second click within a few seconds
        if (this.confirmStop === b.dataset.sid) {
          this.confirmStop = null;
          this.api?.stopSession(b.dataset.sid);
        } else {
          const sid = b.dataset.sid;
          this.confirmStop = sid;
          setTimeout(() => { if (this.confirmStop === sid) { this.confirmStop = null; this.render(); } }, STOP_CONFIRM_MS);
        }
        this.render();
      }
    }

    #bindEvents() {
      const { pill } = this.el;
      pill.addEventListener('click', e => this.#onClick(e));
      // scroll doesn't bubble, so listen in the capture phase for the permission command box
      pill.addEventListener('scroll', e => {
        if (!e.target.matches?.('.code[data-perm]')) { return; }
        this.#permScroll.set(e.target.dataset.perm, e.target.scrollTop);
        this.#syncPermScroll();
      }, true);
      pill.addEventListener('mouseenter', () => { this.hovering = true; this.open(); this.sounds.play('expand'); this.api?.setMouseOver(true); });
      pill.addEventListener('mouseleave', () => {
        this.hovering = false;
        this.sounds.play('collapse');
        pill.classList.remove('open');
        this.api?.setMouseOver(false);
        this.render();
      });
      setInterval(() => { if (this.toast && !this.hovering && Date.now() > this.toast.until) { this.render();  }}, 1000);
      setInterval(() => this.#tickWaits(), 1000);

      if (!this.api) { return; }
      // Report the pill's bounds whenever they change (on Linux the window shape follows them)
      const sendRect = () => {
        const r = pill.getBoundingClientRect();
        this.api.setPillRect({ x: r.left, y: r.top, w: r.width, h: r.height });
      };
      new ResizeObserver(sendRect).observe(pill);
      // Give the full open size up front so the shape doesn't clip the opening animation
      pill.addEventListener('mouseenter', () => {
        const r = pill.getBoundingClientRect();
        this.api.setPillRect({ x: Math.min(r.left, (innerWidth - PILL_OPEN_WIDTH) / 2), y: r.top, w: PILL_OPEN_WIDTH, h: r.height + 460 });
      });
      sendRect();
    }
  }

  const view = new OverlayView(window.bayloobAPI);
  if (window.bayloobAPI) {
    window.bayloobAPI.onSessions(list => view.setSessions(list));
    window.bayloobAPI.onMusic(np => view.setMusic(np));
    window.bayloobAPI.onHealth?.(h => view.setHealth(h));
    window.bayloobAPI.onOutput?.(lines => view.setOutput(lines));
    window.bayloobAPI.onDiffs?.(diffs => view.setDiffs(diffs));
    window.bayloobAPI.onTokens?.(tokens => view.setTokens(tokens));
    window.bayloobAPI.onQueues?.(q => view.setQueues(q));
    window.bayloobAPI.onBlocked?.(info => view.setBlocked(info));
    window.bayloobAPI.onReceipts?.(r => view.setReceipts(r));
    window.bayloobAPI.onProgress?.(p => view.setProgress(p));
    window.bayloobAPI.onCollisions?.(c => view.setCollisions(c));
    window.bayloobAPI.onSoundConfig?.(c => view.setSoundConfig(c));
  } else {
    // Opened in a plain browser: demo mode, driven from the console via window.__demo
    window.__demo = { onSessions: list => view.setSessions(list), setMusic: np => view.setMusic(np), open: () => view.open() };
  }
  view.render(); // first paint; the first list from main is the baseline for sounds, not news
</script>
</body>
</html>
