<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Bayloob workspace</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/attachments.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden;
    font: 500 13px/1.4 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; user-select: none; }
  button, input { font: inherit; color: inherit; border: 0; background: none; outline: none; }
  button { cursor: pointer; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg:not(.i) { width: 16px; height: 16px; fill: currentColor; flex: none; } /* ICON_TERM from ui-common.js */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--ink) / .12); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .panel { position: relative; margin: 10px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgb(var(--shade) / calc(.5 * var(--shade-k))); overflow: hidden; animation: drop .2s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

  .thumb { position: relative; width: 100%; height: 100%; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ic { flex: none; display: grid; place-items: center; }
  .ic > img { width: 100%; height: 100%; object-fit: contain; }
  .ic.glyph { border-radius: 10px; background: var(--raised); border: 1px solid var(--line); color: var(--muted); }
  .ic.glyph svg { width: 55%; height: 55%; }
  .ic.agent { filter: drop-shadow(0 2px 6px rgb(var(--shade) / calc(.45 * var(--shade-k)))); }

  /* header */
  .head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .head .ic { width: 38px; height: 38px; }
  .head .brand { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .head .sep { width: 1px; height: 22px; background: var(--line); }
  .head .sub { color: var(--muted); }
  /* Live usage per agent: Claude ●●●○ 3/4 (running of max, from Settings → Agents) */
  .usage { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
  .usage[hidden] { display: none; }
  .usage span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .usage b { color: var(--soft); font-variant-numeric: tabular-nums; }
  .usage .dots { display: inline-flex; gap: 2px; }
  .usage .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--c); }
  .usage .dots i.on { background: var(--c); }
  .usage em { font-style: normal; color: var(--working); }
  .usage:not([hidden]) ~ .status { margin-left: 0; }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--idle)); flex: none; }
  .status .dot { box-shadow: 0 0 8px var(--c); }
  .square { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--muted);
    border: 1px solid var(--line); background: var(--raised); transition: color .15s, background .15s; flex: none; }
  .square:hover { color: var(--text); background: rgb(var(--ink) / .09); }

  /* layout */
  .main { display: grid; grid-template-columns: 196px 1fr 440px; height: 470px; }
  .side { padding: 12px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--soft); text-align: left; transition: background .12s; }
  .nav:hover { background: rgb(var(--ink) / .04); }
  .nav.on { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--text); }
  .nav span { flex: 1; }
  .nav em { font-style: normal; font-size: 11px; color: var(--muted); }
  .nav em.hot { color: #fff; background: var(--waiting); padding: 0 6px; border-radius: 999px; font-weight: 700; }
  .nav.bottom { margin-top: auto; }
  .side hr { border: 0; height: 1px; background: var(--line); margin: 6px 8px; }
  /* Agents: one heading per project */
  .group { display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); min-width: 0; }
  .group .gn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .group > span:last-child { flex: none; }
  /* a workflow task's agents: the task's name, in normal case, with its pattern */
  .group.task { text-transform: none; letter-spacing: 0; font-size: 12px; color: var(--soft); }
  .group.task .i { width: 13px; height: 13px; color: var(--cat-workflow); flex: none; }
  .group.task em { font-style: normal; color: var(--muted); font-weight: 500; flex: none; }
  .group:first-child { padding-top: 2px; }
  .row .who span.why { color: var(--c); }
  /* Inbox card in the agent's detail: approve / deny / answer, like the pill's card */
  .icard { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding: 11px 12px; border-radius: 12px;
    background: color-mix(in srgb, var(--waiting) 8%, transparent); border: 1px solid color-mix(in srgb, var(--waiting) 32%, transparent); }
  .icard.ask { background: color-mix(in srgb, var(--thinking) 8%, transparent); border-color: color-mix(in srgb, var(--thinking) 32%, transparent); }
  .icard .ih { font-size: 12.5px; color: var(--soft); }
  .icard .ih b { color: var(--text); }
  .icard .chip { align-self: flex-start; padding: 2px 8px; border-radius: 6px; background: rgb(var(--ink) / .07); font: 600 11.5px ui-monospace, monospace; }
  .icard pre { max-height: 130px; overflow: auto; padding: 8px 10px; border-radius: 8px; background: rgb(var(--ink) / .05);
    font: 11.5px/1.5 ui-monospace, "Ubuntu Mono", monospace; color: var(--softer); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  .icard .warn { font-size: 12px; color: var(--working); }
  .icard .hint { font-size: 11.5px; color: var(--muted); }
  .icard .hint.err { color: var(--waiting); }
  .icard .q { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; }
  .icard .q small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .icard .opts { display: flex; flex-wrap: wrap; gap: 5px; }
  .icard .opt { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--raised); font-size: 12px; color: var(--soft); text-align: left; }
  .icard .opt:hover { background: rgb(var(--ink) / .08); }
  .icard .opt.on { border-color: color-mix(in srgb, var(--brand) 60%, transparent); background: color-mix(in srgb, var(--brand) 18%, transparent); color: var(--text); }
  .icard .acts { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
  .icard .btn { padding: 6px 12px; }
  .icard .btn.allow { background: var(--done); color: var(--on-done); border-color: transparent; }
  .icard .btn.deny { color: var(--waiting); }
  /* Ctrl+K: jump to a section or an agent, or run an action */
  .pal { position: absolute; left: 50%; top: 62px; width: 520px; max-width: calc(100% - 40px); transform: translateX(-50%); z-index: 20;
    display: flex; flex-direction: column; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgb(var(--shade) / calc(.55 * var(--shade-k))); overflow: hidden; animation: cin .12s ease-out; }
  .pal[hidden] { display: none; }
  .pal .pin { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); color: var(--muted); }
  .pal .pin input { flex: 1; min-width: 0; color: var(--text); font-size: 14px; }
  .pal .pin kbd { font: 11px ui-monospace, monospace; padding: 1px 5px; border-radius: 5px; border: 1px solid var(--line); }
  .pal .plist { max-height: 300px; overflow-y: auto; padding: 5px; display: flex; flex-direction: column; }
  .pal .plist button { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; text-align: left; }
  .pal .plist button.on { background: color-mix(in srgb, var(--brand) 16%, transparent); }
  .pal .plist button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pal .plist button small { color: var(--muted); font-size: 11.5px; }
  .pal .plist .none { padding: 14px; color: var(--muted); text-align: center; }
  .pal .plist .ic { width: 22px; height: 22px; }
  .pal .plist .ic.glyph { border-radius: 6px; }

  .main > * { min-height: 0; } /* let the columns scroll instead of growing past the panel */
  .listcol { display: flex; flex-direction: column; min-width: 0; padding: 12px 10px 10px; }
  .listhead { display: flex; align-items: center; gap: 12px; padding: 0 6px 10px; }
  .listhead h2 { font-size: 15px; font-weight: 650; flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; width: 210px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--muted); }
  .search input { flex: 1; min-width: 0; color: var(--text); }
  .search input::placeholder { color: var(--muted); }
  .rows { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: background .12s; }
  .row:hover { background: rgb(var(--ink) / .03); }
  .row.sel { background: color-mix(in srgb, var(--brand) 9%, transparent); border-color: color-mix(in srgb, var(--brand) 22%, transparent); }
  .row .ic { width: 38px; height: 38px; }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .who span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { display: flex; align-items: center; gap: 7px; width: 118px; font-size: 12.5px; color: var(--c); flex: none; }
  /* A list row's right side: the status, and on hover / selection / keyboard focus the row's buttons in the same
     place — the name keeps the width the buttons used to take, and nothing shifts when they appear */
  .row .slot { position: relative; display: flex; align-items: center; justify-content: flex-end; width: 118px; height: 30px; flex: none; }
  .row .slot .state { width: auto; }
  .row .slot .acts { position: absolute; inset: 0; display: none; align-items: center; justify-content: flex-end; gap: 4px; }
  .row:hover .slot .acts, .row.sel .slot .acts, .row:focus-within .slot .acts { display: flex; }
  .row:hover .slot > .state .lbl, .row.sel .slot > .state .lbl, .row:focus-within .slot > .state .lbl { visibility: hidden; }
  .row .slot > .state { position: absolute; left: 0; }
  .row .square { width: 30px; height: 30px; }
  .clash { flex: none; font-style: normal; font-size: 15px; color: var(--working); }
  .clash.conflict { color: var(--waiting); }
  .clashbox { display: grid; gap: 3px; margin-bottom: 10px; padding: 9px 11px; border-radius: 11px; font-size: 12.5px;
    color: var(--working); background: color-mix(in srgb, var(--working) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--working) 30%, transparent); }
  .clashbox.conflict { color: var(--waiting); background: color-mix(in srgb, var(--waiting) 9%, transparent);
    border-color: color-mix(in srgb, var(--waiting) 35%, transparent); }
  .clashbox small { color: var(--muted); font-size: 11.5px; }
  .kebab { width: 24px; height: 30px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; flex: none; }
  .kebab:hover { color: var(--text); background: rgb(var(--ink) / .07); }
  .empty { color: var(--muted); padding: 30px 10px; text-align: center; line-height: 1.6; }
  /* empty state: an icon, one line, a hint at what to do */
  .empty .ei { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 14px; background: rgb(var(--ink) / .05); }
  .empty .ei .i { width: 20px; height: 20px; }
  .empty b { display: block; color: var(--soft); font-weight: 600; }
  .empty small { display: block; font-size: 12px; }
  .empty.small { padding: 12px 0; text-align: left; display: flex; align-items: center; gap: 10px; }
  .empty.small .ei { width: 30px; height: 30px; margin: 0; border-radius: 9px; flex: none; }
  .empty.small .ei .i { width: 15px; height: 15px; }
  .empty .btn { display: inline-flex; margin-top: 12px; padding: 6px 12px; font-size: 12.5px; }

  /* detail */
  .detailcol { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .detail { flex: 1; min-height: 0; padding: 16px 18px; overflow-y: auto; }
  /* prompt boxes: to the selected agent (under its details) and "Ask Bayloob" for a new session (above the footer).
     They sit outside the parts that re-render on every event, so typing is never lost. */
  .say { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .say[hidden], .askpick[hidden] { display: none; }
  .say { position: relative; }
  /* the / shortcuts: a small menu just above the box */
  .slash { position: absolute; left: 12px; right: 12px; bottom: calc(100% - 4px); display: flex; flex-direction: column; padding: 4px;
    border-radius: 12px; background: var(--glass); border: 1px solid var(--line); box-shadow: 0 8px 24px rgb(var(--shade) / calc(.4 * var(--shade-k))); z-index: 5; }
  .slash[hidden] { display: none; }
  .slash button { display: flex; align-items: baseline; gap: 10px; padding: 6px 10px; border-radius: 8px; text-align: left; font-size: 12.5px; }
  .slash button.on, .slash button:hover { background: color-mix(in srgb, var(--brand) 16%, transparent); }
  .slash code { font: 600 12px ui-monospace, monospace; color: var(--brand-soft); }
  .slash span { color: var(--soft); }
  /* next steps the agent offered: a click puts one in the box, to confirm like any prompt */
  .sugg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .sugg[hidden] { display: none; }
  .sugg .cap { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-right: 2px; }
  .sugg button { max-width: 100%; padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--softer);
    border: 1px solid color-mix(in srgb, var(--brand) 35%, transparent); background: color-mix(in srgb, var(--brand) 10%, transparent);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sugg button:hover, .sugg button:focus-visible { background: color-mix(in srgb, var(--brand) 22%, transparent); color: var(--text); }
  .pqueue { list-style: none; display: flex; flex-direction: column; gap: 3px; }
  .pqueue[hidden] { display: none; }
  .pqueue .cap { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .pqueue li:not(.cap) { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 9px; border-radius: 8px; background: rgb(var(--ink) / .04); font-size: 12px; }
  .pqueue li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--softer); }
  .pqueue li button { width: 20px; height: 20px; border-radius: 6px; color: var(--muted); }
  .pqueue li button:hover { background: color-mix(in srgb, var(--waiting) 15%, transparent); color: var(--waiting); }
  .box { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 12px;
    background: rgb(var(--ink) / .05); border: 1px solid var(--line); transition: border-color .15s; }
  .box:focus-within { border-color: color-mix(in srgb, var(--brand) 55%, transparent); }
  .box textarea, .box input { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: none; color: var(--text);
    font: inherit; line-height: 1.4; max-height: 120px; }
  .box textarea::placeholder, .box input::placeholder { color: var(--muted); }
  .send { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--brand); color: #fff; }
  .send:disabled { opacity: .35; cursor: default; }
  .send .i { width: 16px; height: 16px; }
  .say .hint, .ask .hint { font-size: 11.5px; color: var(--muted); min-height: 15px; }
  .say .hint.ok, .ask .hint.ok { color: var(--done); }
  .say .hint.err, .ask .hint.err { color: var(--waiting); }
  /* confirm strip: what is about to happen, before it happens (Enter confirms, Esc / Edit goes back) */
  /* "an agent just finished": reply from here, no terminal needed */
  .finished { display: flex; align-items: center; gap: 12px; margin: 10px 16px 0; padding: 10px 10px 10px 12px; border-radius: 14px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--done) 13%, transparent), color-mix(in srgb, var(--done) 4%, transparent)); border: 1px solid color-mix(in srgb, var(--done) 35%, transparent);
    animation: cin .2s ease-out; }
  .finished[hidden] { display: none; }
  .finished .ic { width: 30px; height: 30px; flex: none; }
  .finished .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .finished .txt .fhead { color: var(--text); }
  .finished .txt b { font-weight: 700; }
  .finished .txt span { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .finished .more { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .finished .btn.on { background: var(--done); color: var(--on-done); border-color: transparent; }
  .finished .x { width: 28px; height: 28px; border-radius: 8px; color: var(--muted); }
  .finished .x:hover { background: rgb(var(--ink) / .08); color: var(--text); }
  .confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 8px 8px 12px; border-radius: 12px;
    background: color-mix(in srgb, var(--brand) 9%, transparent); border: 1px solid color-mix(in srgb, var(--brand) 35%, transparent); animation: cin .15s ease-out; }
  .confirm[hidden] { display: none; }
  @keyframes cin { from { opacity: 0; transform: translateY(-3px); } }
  .confirm .q { flex: 1; min-width: 0; color: var(--soft, var(--soft)); font-size: 12.5px; overflow-wrap: anywhere; }
  .confirm .q b { color: var(--text); }
  .confirm code { font: 12px ui-monospace, monospace; color: var(--text); }
  .confirm .badge { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .confirm .badge.now { color: var(--done); background: color-mix(in srgb, var(--done) 12%, transparent); }
  .confirm .badge.paste { color: var(--brand-soft); background: color-mix(in srgb, var(--brand) 12%, transparent); }
  .confirm .badge.queue { color: var(--working); background: color-mix(in srgb, var(--working) 12%, transparent); }
  .confirm .btn { padding: 6px 12px; }
  .confirm .btn.on[type=submit] { background: var(--brand); border-color: transparent; color: #fff; }
  .confirm .btn.on[type=submit]:hover { filter: brightness(1.1); background: var(--brand); }
  /* the agent column is narrow: the sentence gets its own line, the badge and buttons go under it */
  .say .confirm .q { flex: 1 0 100%; }
  .say .confirm .badge { margin-right: auto; }
  .ask { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .ask .box { align-items: center; }
  .ask .spark { color: var(--brand-soft); font-size: 15px; }
  .askpick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pick { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--line); background: var(--raised); color: var(--soft); }
  .pick .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .pick.on { border-color: color-mix(in srgb, var(--brand) 60%, transparent); background: color-mix(in srgb, var(--brand) 18%, transparent); color: var(--text); }
  .pick:disabled { opacity: .4; cursor: default; }
  .askpick .where { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .askpick .where input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit;
    border-bottom: 1px dashed var(--line); padding: 2px 0; }
  .dhead { display: flex; align-items: center; gap: 12px; }
  .dhead .ic { width: 50px; height: 50px; }
  .dhead .who { flex: 1; min-width: 0; }
  .dhead b { display: block; font-size: 17px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dhead span { color: var(--muted); font-size: 12.5px; }
  .dhead .state { width: auto; }
  .dhead .square { width: 32px; height: 32px; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .tile { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
  h3 { font-size: 13px; font-weight: 600; color: var(--soft); margin: 16px 0 8px; }
  .items { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12.5px; }
  .item + .item { border-top: 1px solid var(--line); }
  .item.click { cursor: pointer; } .item.click:hover { background: rgb(var(--ink) / .04); }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .item .mini { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
  .item .mini.wide-mini { width: auto; padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--text); background: rgb(var(--ink) / .06); }
  .item .mini.danger { background: var(--waiting); color: #fff; }
  .item .ask { flex: 1; min-width: 0; color: var(--soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  pre.logs { max-height: 220px; overflow: auto; padding: 10px 12px; border-radius: 10px; background: rgb(var(--ink) / .04);
    border: 1px solid var(--line); font: 11.5px/1.5 ui-monospace, "Ubuntu Mono", monospace; color: var(--softer); white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  h3 .link { float: right; font-size: 12px; color: var(--brand-soft); font-weight: 600; }
  .item .mini:hover { color: var(--text); background: rgb(var(--ink) / .08); }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  .wide { flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 9px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--raised); font-weight: 600; transition: background .15s; }
  .wide:hover { background: rgb(var(--ink) / .08); }
  .wide:disabled { opacity: .4; cursor: default; }
  .note { margin-top: 12px; padding: 9px 11px; border-radius: 10px; background: color-mix(in srgb, var(--working) 8%, transparent); border: 1px solid color-mix(in srgb, var(--working) 20%, transparent); color: var(--note-text); font-size: 12px; }
  .doing { padding: 12px 0; border-bottom: 1px solid var(--line); margin-top: 12px; border-top: 1px solid var(--line); }
  .doing b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doing span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* agent console: turns, newest at the bottom. It fills the column under the header and is the only thing
     that scrolls (a tall inbox card above it squeezes it down to a minimum, then the column scrolls). */
  .detail.has-console { display: flex; flex-direction: column; padding-bottom: 6px; }
  .detail.has-console > * { flex: none; }
  .detail.has-console > .console { flex: 1 1 auto; min-height: 150px; max-height: none; }
  .console { display: flex; flex-direction: column; gap: 14px; max-height: 330px; overflow-y: auto; padding: 4px 4px 8px 0;
    margin-top: 12px; border-top: 1px solid var(--line); padding-top: 4px; scrollbar-width: thin; }
  .turn { display: flex; flex-direction: column; gap: 6px; }
  .tsep { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 6px; }
  .tsep::before, .tsep::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
  .tsep .live { color: var(--thinking); font-weight: 600; }
  /* messages: Markdown, folded to a few lines with a fade until opened */
  .msg { position: relative; padding: 8px 12px; color: var(--text); font-size: 12.5px; line-height: 1.5; overflow-wrap: anywhere; user-select: text; }
  .msg.you { align-self: flex-end; max-width: 88%; border-radius: 12px 12px 4px 12px; background: color-mix(in srgb, var(--brand) 16%, transparent); }
  .msg.said { border-radius: 12px 12px 12px 4px; background: rgb(var(--ink) / .05); border: 1px solid var(--line); }
  .msg.you i.cont { color: var(--muted); }
  .msg.long:not(.open) { overflow: hidden; -webkit-mask-image: linear-gradient(#000 calc(100% - 28px), transparent); mask-image: linear-gradient(#000 calc(100% - 28px), transparent); }
  .msg.you.long:not(.open) { max-height: 6.2em; }
  .msg.said.long:not(.open) { max-height: 11em; }
  .msg > :first-child { margin-top: 0; } .msg > :last-child { margin-bottom: 0; }
  .msg p, .msg ul, .msg ol, .msg pre, .msg blockquote, .msg .tablewrap { margin: 0 0 6px; }
  .msg p.h { font-weight: 700; margin-top: 8px; }
  .msg ul, .msg ol { padding-left: 18px; }
  .msg li + li { margin-top: 2px; }
  .msg b { font-weight: 650; }
  .msg code { font: 11.5px ui-monospace, "Ubuntu Mono", monospace; padding: 1px 4px; border-radius: 4px; background: rgb(var(--ink) / .08); }
  .msg pre { padding: 8px 10px; border-radius: 8px; background: rgb(var(--ink) / .07); overflow-x: auto; }
  .msg pre code { padding: 0; background: none; white-space: pre; }
  .msg hr { border: 0; border-top: 1px solid var(--line); margin: 8px 0; }
  .msg blockquote { padding-left: 10px; border-left: 2px solid var(--line); color: var(--soft); }
  .msg .tablewrap { overflow-x: auto; }
  .msg table { border-collapse: collapse; font-size: 12px; }
  .msg th, .msg td { padding: 3px 8px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
  .msg th { font-weight: 650; background: rgb(var(--ink) / .04); }
  .showmore { align-self: flex-start; font-size: 11.5px; font-weight: 600; color: var(--brand-soft); padding: 0 4px; }
  .showmore.you { align-self: flex-end; }
  /* steps: one line each (icon, what, time, result), folded per turn behind a summary row */
  .fold { align-self: flex-start; display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 6px; border-radius: 7px;
    color: var(--soft); font-size: 11.5px; font-weight: 600; }
  .fold:hover { background: rgb(var(--ink) / .06); color: var(--text); }
  .fold .chev { width: 12px; color: var(--muted); transition: transform .15s; }
  .fold.open .chev { transform: rotate(90deg); }
  .fold .err { color: var(--waiting); }
  .fold .dim { color: var(--muted); font-weight: 500; }
  .earlier { align-self: flex-start; padding: 3px 6px; font-size: 11.5px; color: var(--brand-soft); font-weight: 600; }
  .steps { display: flex; flex-direction: column; gap: 1px; margin-left: 8px; padding-left: 8px; border-left: 1px solid var(--line); }
  .step { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 7px; font-size: 12px; min-width: 0; cursor: pointer; }
  .step:hover { background: rgb(var(--ink) / .05); }
  .step .si { flex: none; width: 22px; height: 18px; display: grid; place-items: center; border-radius: 5px;
    background: rgb(var(--ink) / .07); color: var(--soft); font: 600 10.5px ui-monospace, monospace; }
  .step.bash .si { color: var(--brand-soft); } .step.edit .si, .step.write .si { color: var(--working); }
  .step.read .si, .step.search .si { color: var(--thinking); }
  .step .st { flex: none; color: var(--muted); font-size: 11.5px; }
  .step code { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 11.5px ui-monospace, "Ubuntu Mono", monospace; color: var(--text); }
  .step.open { align-items: flex-start; background: rgb(var(--ink) / .05); }
  .step.open code { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; }
  .step .dur { flex: none; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .step .res { flex: none; width: 7px; height: 7px; border-radius: 50%; background: transparent; align-self: center; }
  .step .res.ok { background: var(--done); }
  .step .res.error { background: var(--waiting); }
  .step .res.run { background: var(--working); animation: pulse 1s ease-in-out infinite; }
  .step.err code { color: var(--waiting); }
  @keyframes pulse { 50% { opacity: .3; } }
  .working { display: flex; align-items: center; gap: 4px; margin-left: 18px; color: var(--muted); font-size: 11.5px; }
  .working i { width: 5px; height: 5px; border-radius: 50%; background: var(--thinking); animation: pulse 1.2s ease-in-out infinite; }
  .working i:nth-child(2) { animation-delay: .2s; } .working i:nth-child(3) { animation-delay: .4s; margin-right: 4px; }
  .timeline { list-style: none; padding: 8px 0 0; }
  .timeline li { position: relative; display: flex; align-items: baseline; gap: 10px; padding: 5px 0 5px 22px; font-size: 12.5px; }
  .timeline li::before { content: ''; position: absolute; left: 3px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 6px color-mix(in srgb, var(--brand) 60%, transparent); }
  .timeline li.now::before { background: transparent; border: 1.5px solid var(--brand); box-shadow: none; }
  .timeline li + li::after { content: ''; position: absolute; left: 7px; top: -9px; height: 16px; border-left: 1px solid rgb(var(--ink) / .14); }
  .timeline.plain li::before { background: none; border: 1.5px solid var(--muted); box-shadow: none; }
  .timeline.plain li + li::after { display: none; }
  .timeline .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ago { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

  /* footer */
  .foot { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .btn { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; transition: background .15s; }
  .btn:hover { background: rgb(var(--ink) / .08); }
  .btn.on { background: color-mix(in srgb, var(--brand) 16%, transparent); border-color: color-mix(in srgb, var(--brand) 30%, transparent); }
  .btn:disabled { opacity: .4; cursor: default; }
  .meters { flex: 1; display: flex; justify-content: center; align-items: center; gap: 16px; color: var(--muted); font-size: 12.5px; }
  .meters b { color: var(--text); font-weight: 600; margin-left: 4px; }
  .meters .sep { width: 1px; height: 16px; background: var(--line); }
  .meter { display: flex; align-items: center; gap: 7px; }
  .flash { color: var(--note-text); }
  [hidden] { display: none !important; }

  /* ---------- The Workspace window (?mode=window): the same page, filling a resizable window ---------- */
  .wctl { display: none; gap: 2px; }
  .window-mode .wctl { display: flex; }
  .window-mode .popup-only { display: none !important; }
  html:not(.window-mode) .window-only { display: none !important; }
  .window-mode, .window-mode body { background: var(--backdrop); }
  .window-mode .panel { margin: 0; border: 0; border-radius: 0; box-shadow: none; animation: none; height: 100vh; display: flex; flex-direction: column; background: var(--backdrop); }
  .window-mode .head { -webkit-app-region: drag; padding: 10px 10px 10px 16px; }
  .window-mode .head button, .window-mode .head .usage { -webkit-app-region: no-drag; }
  .window-mode .main { flex: 1; min-height: 0; height: auto;
    grid-template-columns: var(--side-w, 196px) 5px minmax(260px, 1fr) 5px var(--detail-w, 440px); }
  .window-mode .detailcol { border-left: 0; }
  .window-mode .side { border-right: 0; }
  /* splitters between the columns: drag to resize, double-click for the default width */
  .split { cursor: col-resize; position: relative; background: transparent; }
  .split::after { content: ''; position: absolute; top: 0; bottom: 0; left: 2px; width: 1px; background: var(--line); }
  .split:hover::after, .split.drag::after { left: 1px; width: 3px; background: color-mix(in srgb, var(--brand) 55%, transparent); }
  /* the sidebar collapsed to icons (Ctrl+B) */
  .window-mode .main.collapsed .side { padding: 12px 6px; }
  .window-mode .main.collapsed .nav { justify-content: center; padding: 9px 0; position: relative; }
  .window-mode .main.collapsed .nav span { display: none; }
  .window-mode .main.collapsed .nav em { position: absolute; top: 3px; right: 6px; font-size: 9.5px; padding: 0 4px; }
  .window-mode .main.collapsed .nav em:not(.hot) { display: none; }
  /* Tasks in the Workspace window: Tasks' own page is laid over this area (list + detail columns) */
  .embed { display: none; }
  .window-mode .main.embedding .listcol, .window-mode .main.embedding .detailcol, .window-mode .main.embedding .listcol + .split { display: none; }
  .window-mode .main.embedding .embed { display: block; grid-column: 3 / 6; grid-row: 1; min-height: 0; }
  .wbtn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--muted); }
  .wbtn:hover { color: var(--text); background: var(--hover); }
  .wbtn.close:hover { background: var(--waiting); color: #fff; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <header class="head">
      <div class="ic agent" id="managerMascot"></div>
      <span class="brand">bayloob</span><span class="sep"></span><span class="sub">Workspace control</span>
      <div class="usage" id="usage" hidden title="Agents running"></div>
      <div class="status" id="status"></div>
      <button type="button" class="square window-only" id="collapseSide" title="Collapse the sidebar (Ctrl+B)" aria-label="Collapse the sidebar">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <button type="button" class="square popup-only" id="openWindow" title="Open the workspace in a window — resizable, stays open" aria-label="Open in a window">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-7 7M10 20H4v-6M4 20l7-7"/></svg>
      </button>
      <button type="button" class="square" id="settings" title="Settings">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
      <div class="wctl">
        <button type="button" class="wbtn" data-win="minimize" title="Minimize" aria-label="Minimize"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12"/></svg></button>
        <button type="button" class="wbtn" data-win="maximize" title="Maximize" aria-label="Maximize"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
        <button type="button" class="wbtn close" data-win="close" title="Close" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>

    <div class="finished" id="finished" hidden></div>

    <div class="main">
      <nav class="side" id="side"></nav>
      <section class="listcol">

            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" aria-label="Search" placeholder="Search apps…" spellcheck="false">

        </div>

<script>
  // The same page runs as the popup and as the Workspace window (?mode=window: resizable, splitters)
  const WINDOW_MODE = new URLSearchParams(location.search).get('mode') === 'window';
  if (WINDOW_MODE) { document.documentElement.classList.add('window-mode'); }
  const LAYOUT_KEY = 'bayloob.workspace.layout'; // { side, detail, collapsed } in the Workspace window
  const SIDE = { min: 180, max: 280, def: 196 };
  const DETAIL = { min: 320, max: 640, def: 440 };

  // Every string of the panel — a language switcher later only needs to swap this object
  const T = {
    sayTo: (agent, project) => `Prompt to ${agent} · ${project}…`,
    suggested: 'Suggested', useSuggestion: 'Put it in the box — you confirm before it goes',
    sayHint: 'Enter sends · Shift+Enter new line', sayBusy: 'Busy — Enter adds it to the queue',

    withFiles: n => ` · ${n} file${n === 1 ? '' : 's'}`, attaching: 'Wait — the files are still being attached', now: 'now', toQueue: 'to the queue',
    confirmLaunch: (agent, cwd) => `Launch <b>${agent}</b> in <code>${cwd}</code>`, inWorktree: '⑂ new worktree',
    edit: 'Edit', sendBtn: '✓ Send', queueBtn: '✓ Add to queue', launchBtn: '✓ Launch', confirmHint: 'Enter confirms · Esc goes back',
    taskDone: 'Task completed.',
    finishedIn: (agent, project) => `<span class="fhead"><b>${agent}</b> finished · ${project}</span>`, finishedMore: n => `+${n} more`,
    reply: 'Reply', dismissTip: 'Dismiss',
    continued: 'Continued from earlier', nFiles: n => `${n} files`,
    nSteps: n => `${n} step${n === 1 ? '' : 's'}`, nFailed: n => `${n} failed`, earlier: n => `+ ${n} earlier step${n === 1 ? '' : 's'}`, showMore: 'Show more', showLess: 'Show less',
    working: 'Working…',
    queuedN: n => `Waiting for this agent · ${n}`, unqueueTip: 'Remove from the queue',
    sent: 'Sent ✓',
    handoff: '⇄ Continue in Bayloob', handoffTip: 'Move this conversation into tmux, so replies go straight in (you close it in its terminal once)',
    handoffStarted: 'Close it in its terminal (/exit) — Bayloob continues it in tmux',
    toPaste: '📋 copy & paste', pasteBtn: '✓ Copy & open terminal', copiedPaste: 'Copied ✓ — paste it in the terminal with Ctrl+Shift+V',
    sayPaste: 'Not in tmux: Enter copies it and brings the terminal forward to paste', queued: 'Queued ⏳ — goes out when the agent finishes its turn',
    askHint: 'Pick an agent and folder · Enter starts', startAgent: 'Start', worktree: '⑂ New worktree',
    notInstalled: 'not installed', folder: 'Folder', starting: 'Starting…', started: 'Started ✓', pickFolder: 'Choose a project folder',
    clashConflict: (who, files) => `Editing the same files as ${who}: ${files}`,

    clashFix: 'Fix: ⋮ → "Move new work to a worktree…"',
    connected: 'Connected', noEvents: 'Waiting for agents', noHooks: 'Hooks not installed',
    connectedTip: at => at ? `Hooks installed · last event ${timeAgo(at)}` : 'Hooks installed · no events yet',
    noHooksTip: 'Open Settings to install the Claude Code hooks',
    sections: { inbox: 'Inbox', agents: 'Agents', tasks: 'Tasks', overview: 'Overview', browsers: 'Browsers', ides: 'IDEs', applications: 'Applications', system: 'System tools' },
    listTitle: { inbox: 'Needs you', agents: 'Agents', tasks: 'Tasks', overview: 'Running apps', browsers: 'Browsers', ides: 'IDEs', applications: 'Applications', system: 'System tools' },
