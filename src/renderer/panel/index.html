        const old = this.#prevStates.get(s.id);
        if (s.state === 'done' && old && old !== 'done') {
          this.finished = [s.id, ...this.finished.filter(id => id !== s.id)];
        }
      }
      this.#prevStates = new Map(list.map(s => [s.id, s.state]));
      this.finished = this.finished.filter(id => list.some(s => s.id === id && s.state === 'done'));
      this.sessions = list;
      this.render();
    }

    #renderFinished() {
      const s = this.sessions.find(x => x.id === this.finished[0]);
      const box = this.el.finished;
      const was = !box.hidden;
      box.hidden = !s;
      if (s) {
        const more = this.finished.length - 1;
        box.innerHTML = `<div class="ic agent">${Agent.thumb(s.agent)}</div>
          <div class="txt">${T.finishedIn(esc(Agent.displayName(s.agent)), esc(projectName(s)))}<span title="${esc(s.summary || '')}">${esc(s.summary || T.taskDone)}</span></div>
          ${more > 0 ? `<span class="more">${T.finishedMore(more)}</span>` : ''}
          <button type="button" class="btn on" data-reply="${esc(s.id)}">${T.reply}</button>
          <button type="button" class="x" data-dismiss="${esc(s.id)}" title="${T.dismissTip}" aria-label="${T.dismissTip}">✕</button>`;
      }
      if (was !== !box.hidden) { this.#fit(); }
    }

    // Reply: select that agent and put the cursor in its prompt box
    #replyTo(id) {
      this.finished = this.finished.filter(x => x !== id);
      this.launchMode = false;
      this.query = '';
      this.el.search.value = '';
      if (!['inbox', 'agents', 'overview'].includes(this.section)) { this.section = 'agents'; }
      this.selected = `agent:${id}`;
      this.render();
      this.el.sayText.focus();
    }
    setWorkspace(snap) { this.apps = snap.apps; this.extension = snap.extension; this.render(); }
    setBlocked(info) { this.blocked = info; this.#renderMeters(); }
    setCollisions(map) { this.collisions = map || {}; this.render(); }
    setStats(stats) { this.stats = stats; this.#renderMeters(); }
    setStatus(status) { this.status = status; this.#renderStatus(); }

    // Claude ●●●○ 3/4 · Codex ●○ 1/2 — enabled, installed agents only; "+n" when instances wait in the queue
    setTask(task) { this.tasks.set(task.id, task); this.render(); }
    setUsage(usage) {
      const box = document.getElementById('usage');
      const rows = Object.entries(usage?.agents || {}).filter(([, u]) => u.enabled);
      box.hidden = !rows.length;
      box.innerHTML = rows.map(([a, u]) => {
        const dots = Array.from({ length: Math.min(u.max, 8) }, (_, i) => `<i class="${i < u.running ? 'on' : ''}"></i>`).join('');
        const name = Agent.displayName(a).split(' ')[0];
        const tip = `${Agent.displayName(a)}: ${u.running} of ${u.max} running${u.queued ? `, ${u.queued} queued` : ''}${u.throttledUntil ? ' — rate-limited' : ''}`;
        return `<span title="${esc(tip)}">${esc(name)} <span class="dots" style="--c:${Agent.color(a)}">${dots}</span><b>${u.running}/${u.max}</b>${u.queued ? `<em>+${u.queued}</em>` : ''}</span>`;
      }).join('');
    }

    // ---------- model ----------

    #items(section = this.section) {
      const agents = [...this.sessions].sort((a, b) => PRIORITY[b.state] - PRIORITY[a.state] || b.updatedAt - a.updatedAt).map(agentItem);
      const apps = (this.apps || []).map(appItem);
      if (section === 'inbox') { return this.#inbox(); }
      if (section === 'tasks') {
        const rank = { 'needs-you': 3, running: 2 };
        return [...this.tasks.values()].sort((a, b) => (rank[b.status] || 0) - (rank[a.status] || 0) || b.updatedAt - a.updatedAt).map(taskItem);
      }
      // Under a project heading the path would repeat it: the row says what the agent is doing instead
      if (section === 'agents') {
        // Under a heading the path would repeat it: the row says what the agent is doing (or its part in a task)
        return this.#byProject(agents).map(i => {
          const t = taskOfSession(i.data);
          const doing = i.data.activity?.title;
          const said = doing && doing !== 'Already running' ? doing : '';
          return { ...i, subtitle: t ? [taskRole(i.data, t), said].filter(Boolean).join(' · ') : said || projectPath(i.data) };
        });
      }
      if (section === 'overview') { return [...apps, ...agents]; }
      return apps.filter(i => SECTION_OF[i.category] === section);
    }

    // Why an agent needs you right now, or null
    #why(s) {
      if (s.perm) { return s.perm.kind === 'question' ? 'question' : 'perm'; }
      if (s.menu) { return 'menu'; }
      if (this.collisions?.[s.id]?.level === 'conflict') { return 'conflict'; }
      return this.finished.includes(s.id) ? 'finished' : null;
    }

    // The Inbox: agents that wait on you, most urgent first; the reason replaces the subtitle
    #inbox() {
      // A task at a gate waits for a decision, like a permission card
      const gates = [...this.tasks.values()].filter(t => t.gate)
        .map(t => ({ ...taskItem(t), why: 'gate', subtitle: `${t.gate.title} · ${t.project.name}`, at: t.gate.at }));
      const agents = this.sessions.map(s => ({ s, why: this.#why(s) })).filter(x => x.why)
        .map(({ s, why }) => ({ ...agentItem(s), why, subtitle: `${T.why[why]} · ${projectPath(s)}`, at: s.updatedAt }));
      return [...gates, ...agents].sort((a, b) => INBOX_RANK[b.why] - INBOX_RANK[a.why] || b.at - a.at);
    }

    // Agents one project after another (the project with the most urgent agent first), urgency inside each
    #byProject(agents) {
      const groups = new Map();
      for (const a of agents) {
        const t = taskOfSession(a.data);
        const k = t ? `task:${t.id}` : a.data.cwd || a.data.project || '';
        groups.set(k, [...(groups.get(k) || []), a]);
      }
      return [...groups.values()].flat();
    }

    #visible() {
      const q = this.query.trim().toLowerCase();
      return this.#items().filter(i => !q || `${i.name} ${i.subtitle}`.toLowerCase().includes(q));
    }

    get current() {
      const items = this.#visible();
      return items.find(i => i.key === this.selected) || items[0] || null;
    }

    // ---------- render ----------

    render() {
      this.#renderStatus();
      this.#renderSide();
      this.#renderList();
      this.#renderDetail();
      this.#renderMeters();
      this.#renderSay();
      this.#renderFinished();
      // A disabled button always says why
      const cur = this.current;
      this.el.openWorkspace.disabled = !(cur?.kind === 'agent' && cur.data.cwd);
      this.el.openWorkspace.title = cur?.kind !== 'agent' ? T.wsPickAgent : !cur.data.cwd ? T.wsNoFolder : T.wsOpen;
      this.#syncEmbed();
    }

    #renderStatus() {
      const st = this.status;
      const [label, color, tip] = !st?.hooks ? [T.noHooks, 'var(--waiting)', T.noHooksTip]
        : st.lastEventAt ? [T.connected, 'var(--done)', T.connectedTip(st.lastEventAt)]
        : [T.noEvents, 'var(--working)', T.connectedTip(null)];
      this.el.status.style.setProperty('--c', color);
      this.el.status.title = tip;
      this.el.status.innerHTML = `<span class="dot"></span>${label}`;
    }

    #renderSide() {
      const nav = key => {
        const n = this.#items(key).length;
        const em = n ? `<em class="${key === 'inbox' ? 'hot' : ''}" title="${esc(T.countTip[key](n))}" data-k="nav:${key}" data-v="${n}">${n}</em>` : '';
        return `<button class="nav${key === this.section && !this.launchMode ? ' on' : ''}" data-section="${key}" title="${T.sections[key]}">${ICONS[key]}<span>${T.sections[key]}</span>${em}</button>`;
      };
      swapHtml(this.el.side, NAV.map(group => group.map(nav).join('')).join('<hr>')
        + `<button class="nav bottom" data-settings title="${T.settingsNav}">${ICONS.gear}<span>${T.settingsNav}</span></button>`);
    }

    #renderList() {
      this.el.listTitle.textContent = this.launchMode ? T.launchTitle : T.listTitle[this.section];
      this.el.search.placeholder = this.launchMode ? T.searchInstalled : T.searchIn[this.section] || T.searchApps;
      this.el.launch.classList.toggle('on', this.launchMode);
      if (this.launchMode) { return this.#renderLaunchable(); }
      if (this.apps === null && !['inbox', 'agents', 'tasks'].includes(this.section)) { this.el.rows.innerHTML = `<div class="empty">${T.loading}</div>`; return; }
      const items = this.#visible();
      if (!items.length) {
        this.el.rows.innerHTML = this.query
          ? emptyHtml(ICONS.search, T.noMatch(esc(this.query)), T.noMatchHint, '', { label: T.clearSearch, act: 'clear' })
          : emptyHtml(ICONS[this.section], T.emptyIn[this.section], T.emptyHint[this.section], '',
            EMPTY_ACTION[this.section] && { label: T.emptyAction[EMPTY_ACTION[this.section]], act: EMPTY_ACTION[this.section] });
        return;
      }
      const sel = this.current?.key;
      // Agents: a heading over each project's sessions; Overview: the apps, then the agents
      const groupOf = i => {
        if (this.section === 'overview') { return i.kind === 'agent' ? 'agents' : 'apps'; }
        if (this.section !== 'agents') { return null; }
        const t = taskOfSession(i.data);
        return t ? `task:${t.id}` : i.data.cwd || i.data.project || '';
      };
      // A task's agents sit under the task's name (not under each worktree's long folder name)
      const groupHead = i => {
        if (this.section === 'overview') { return `<span class="gn">${i.kind === 'agent' ? T.groupAgents : T.groupApps}</span>`; }
        const t = taskOfSession(i.data);
        if (t) {
          const task = this.tasks.get(t.id);
          const title = task?.title || T.taskIn(t.repo);
          return `${ICONS.tasks}<span class="gn" title="${esc(title)}">${esc(title)}</span>${task ? `<em>${esc(task.template.name)}</em>` : ''}`;
        }
        return `<span class="gn">${esc(i.data.project || projectPath(i.data))}</span>`;
      };
      const sizes = new Map();
      for (const i of items) { sizes.set(groupOf(i), (sizes.get(groupOf(i)) || 0) + 1); }
      swapHtml(this.el.rows, items.map((i, n) => `
        ${groupOf(i) !== null && (n === 0 || groupOf(items[n - 1]) !== groupOf(i))
          ? `<div class="group${String(groupOf(i)).startsWith('task:') ? ' task' : ''}" title="${esc(this.section === 'agents' ? i.data.cwd || '' : '')}">${groupHead(i)}<span>· ${sizes.get(groupOf(i))}</span></div>` : ''}
        <div class="row${i.key === sel ? ' sel' : ''}" data-key="${esc(i.key)}">
          ${iconHtml(i)}
          <div class="who"><b title="${esc(i.name)}">${esc(i.name)}</b><span title="${esc(i.subtitle || '')}"${i.why ? ` class="why" style="--c:${WHY_COLOR[i.why]}"` : ''}>${esc(i.subtitle || '')}</span></div>
          ${i.kind === 'agent' ? this.#clashBadge(i.data) : ''}
          <div class="slot">${stateHtml(i.status)}<div class="acts">
            <button class="square" data-act="primary" title="${i.kind === 'agent' ? T.openTerminal : i.kind === 'task' ? T.openTasks : T.focus}" aria-label="${i.kind === 'agent' ? T.openTerminal : i.kind === 'task' ? T.openTasks : T.focus}">${i.kind === 'agent' ? ICON_TERM : ICONS.chevron}</button>
            ${i.kind === 'docker' || i.kind === 'task' ? '' : `<button class="kebab" data-act="menu" title="${T.more}" aria-label="${T.more}">${ICONS.dots}</button>`}</div></div>
        </div>`).join(''));
    }

    // ⚠ next to an agent that shares its working tree with another busy agent (red: they edited the same file)
    #clashBadge(s) {
      const c = this.collisions?.[s.id];
      if (!c) { return ''; }
      return `<i class="clash ${c.level}" title="${esc(this.#clashText(c))}">⚠</i>`;
    }

    #clashText(c) {
      const others = c.with.map(id => this.sessions.find(x => x.id === id)).filter(Boolean)
        .map(x => `${Agent.displayName(x.agent)} (${x.project})`).join(', ');
      const files = c.files.map(f => f.split('/').pop());
      return c.level === 'conflict'
        ? T.clashConflict(others, files.slice(0, 3).join(', ') + (files.length > 3 ? ` +${files.length - 3}` : ''))
        : T.clashShared(others);
    }

    #renderLaunchable() {
      if (this.launchFailed) {
        this.el.rows.innerHTML = stateBlock({ kind: 'error', title: T.appsFailed, action: { label: T.retry, data: { 'retry-launch': '1' } }, details: this.launchFailed });
        return;
      }
      if (!this.launchable) { this.el.rows.innerHTML = stateBlock({ kind: 'loading', line: T.loading }); return; }
      const q = this.query.trim().toLowerCase();
      const list = this.launchable.filter(a => !q || a.name.toLowerCase().includes(q)).slice(0, 80);
      if (!list.length) { this.el.rows.innerHTML = emptyHtml(ICONS.search, T.noMatch(esc(this.query)), T.noMatchHint, '', { label: T.clearSearch, act: 'clear' }); return; }
      this.el.rows.innerHTML = list.map(a => `
        <div class="row" data-launch="${esc(a.id)}">
          ${iconHtml({ kind: 'app', data: a })}
          <div class="who"><b title="${esc(a.name)}">${esc(a.name)}</b><span>${T.kind[a.category] || ''}</span></div>
          <button class="square" data-act="launch" title="${T.open}">${ICONS.chevron}</button>
        </div>`).join('');
    }

    #renderDetail() {
      // Updates arrive several times a second: swapping the buttons between press and release loses the click
      if (this.#pressing) { this.#renderLater = true; return; }
      const item = this.launchMode ? null : this.current;
      if (!item) { this.el.detail.innerHTML = ''; return; }
      const term = item.kind === 'agent' ? `<button type="button" class="square" data-act="terminal" title="${T.openTerminal}" aria-label="${T.openTerminal}">${ICON_TERM}</button>` : '';
      // An agent's header names its project (and its task, when it works for one), not just "AI agent"
      const sub = item.kind === 'agent' ? [item.data.label, projectPath(item.data)].filter(Boolean).join(' · ') : T.kind[item.category] || '';
      const head = `<div class="dhead">${iconHtml(item)}<div class="who"><b title="${esc(item.name)}">${esc(item.name)}</b><span title="${esc(item.data.cwd || '')}">${esc(sub)}</span></div>${stateHtml(item.status)}${term}</div>`;
      const body = item.kind === 'agent' ? this.#agentDetail(item.data) : item.kind === 'task' ? this.#taskDetail(item.data)
        : item.kind === 'docker' ? this.#dockerDetail(item.data) : this.#appDetail(item.data);
      // Keep the console's scroll: stuck to the newest step while at the bottom, left alone when scrolled up
      const old = this.el.detail.querySelector('[data-console]');
      const atBottom = !old || old.scrollTop + old.clientHeight >= old.scrollHeight - 8;
      const top = old?.scrollTop || 0;
      swapHtml(this.el.detail, head + body);
      const con = this.el.detail.querySelector('[data-console]');
      this.el.detail.classList.toggle('has-console', !!con);
      if (con) { con.scrollTop = atBottom ? con.scrollHeight : top; }
      this.#syncPerm();
    }

    // ---------- inbox cards: approve, deny, answer — the pill's cards, same rules ----------

    #inboxCard(s) {
      const who = [esc(Agent.displayName(s.agent)), esc(projectName(s))];
      if (s.perm?.kind === 'question') {
        const picked = this.#answers.get(s.perm.id) || new Map();
        const qs = s.perm.questions || [];
        const complete = qs.length > 0 && qs.every(q => picked.get(q.question)?.size);
        return `<div class="icard ask" data-perm="${esc(s.perm.id)}">
          <div class="ih">${T.asksYou(...who)}</div>
          ${qs.map((q, qi) => `<div class="q">${q.header ? `<small>${esc(q.header)}</small>` : ''}<span>${esc(q.question)}${q.multiSelect ? ` <small>(${T.pickMany})</small>` : ''}</span>
            <div class="opts">${q.options.map((o, oi) => `<button type="button" class="opt${picked.get(q.question)?.has(o.label) ? ' on' : ''}"
              data-pick="${qi}:${oi}" title="${esc(o.description)}">${esc(o.label)}</button>`).join('')}</div></div>`).join('')}
          <div class="acts"><button type="button" class="btn" data-decide="terminal" title="${T.inTerminalTip}">${T.inTerminal}</button>
            <button type="button" class="btn allow" data-answer ${complete ? '' : `disabled title="${T.pickAll}"`}>${T.sendAnswer}</button></div>
        </div>`;
      }
      if (s.perm) {
        const { id, tool, detail, hidden } = s.perm;
        const im = s.perm.immune || {};
        if (!this.#permShown.has(id)) { this.#permShown.set(id, Date.now()); }
        return `<div class="icard" data-perm="${esc(id)}">
          <div class="ih">${T.permAsks(...who)}</div>
          <span class="chip">${esc(tool)}</span>
          ${detail ? `<pre data-permtext>${esc(detail)}</pre>` : ''}
          ${im.antibody ? `<div class="warn">⚠ ${esc(T.antibody(im.antibody.command))}</div>` : ''}
          <div class="hint" data-permhint>${hidden ? T.hiddenPart(hidden) : ''}</div>
          <div class="acts">
            <button type="button" class="btn deny" data-decide="deny">${T.deny}</button>
            <button type="button" class="btn" data-decide="terminal" title="${T.inTerminalTip}">${T.inTerminal}</button>
            ${im.suggest && !im.antibody ? `<button type="button" class="btn" data-always title="${esc(T.alwaysTip(im.suggest.key))}">${T.always}</button>` : ''}
            <button type="button" class="btn allow" data-decide="allow" ${hidden ? `disabled data-hidden title="${esc(T.hiddenPart(hidden))}"` : 'disabled'}>${T.allow}</button>
          </div>
        </div>`;
      }
      if (s.menu) {
        const m = s.menu;
        return `<div class="icard ask">
          <div class="ih">${T.asksTerminal(...who)}</div>
          <div class="q"><span>${esc(m.question)}</span>
            <div class="opts">${m.options.map((label, i) => `<button type="button" class="opt" data-menu="${i}" title="${esc(label)}">${esc(label)}${i === m.selected ? ` <small>${T.termDefault}</small>` : ''}</button>`).join('')}</div></div>
          <div class="hint" data-menuhint></div>
        </div>`;
      }
      return '';
    }

    // Allow unlocks once the whole command was seen (scrolled to its end) and after the cooling pause
    // the immune system asks for — never when part of it is hidden (that one is for the terminal only)
    #syncPerm() {
      const card = this.el.detail.querySelector('.icard[data-perm]:not(.ask)');
      const allow = card?.querySelector('[data-decide=allow]');
      if (!allow || allow.dataset.hidden !== undefined) { return; }
      const id = card.dataset.perm;
      const box = card.querySelector('[data-permtext]');
      if (box) {
        box.scrollTop = this.#permScroll.get(id) || 0;
        if (box.scrollHeight <= box.clientHeight + 2 || box.scrollTop + box.clientHeight >= box.scrollHeight - 2) { this.#permRead.add(id); }
      } else {
        this.#permRead.add(id);
      }
      const read = this.#permRead.has(id);
      const im = this.sessions.find(s => s.perm?.id === id)?.perm.immune || {};
      const wait = im.slowDown || im.antibody ? COOL_MS - (Date.now() - (this.#permShown.get(id) || 0)) : 0;
      allow.disabled = !read || wait > 0;
      allow.title = !read ? T.readFirst : '';
      const hint = card.querySelector('[data-permhint]');
      hint.textContent = !read ? T.readFirst : wait > 0 ? T.cooling(Math.ceil(wait / 1000)) : '';
      if (wait > 0) {
        clearTimeout(this.#coolTimer);
        this.#coolTimer = setTimeout(() => this.#syncPerm(), Math.min(wait, 250));
      }
    }

    // A click inside an inbox card; true when it was handled
    async #inboxAct(s, target) {
      const b = target.closest('button');
      if (!b || b.disabled || !b.closest('.icard')) { return false; }
      const permId = s.perm?.id;
      if (b.dataset.pick) {
        const [qi, oi] = b.dataset.pick.split(':').map(Number);
        const q = s.perm?.questions?.[qi];
        const label = q?.options?.[oi]?.label;
        if (!label) { return true; }
        if (!this.#answers.has(permId)) { this.#answers.set(permId, new Map()); }
        const picked = this.#answers.get(permId);
        const set = q.multiSelect ? new Set(picked.get(q.question)) : new Set();
        if (q.multiSelect && set.has(label)) { set.delete(label); } else { set.add(label); }
        picked.set(q.question, set);
        this.#renderDetail();
        return true;
      }
      if (b.dataset.answer !== undefined) {
        const picked = this.#answers.get(permId);
        if (picked) {
          b.disabled = true;
          this.api?.answer(permId, Object.fromEntries([...picked].map(([q, set]) => [q, [...set]])));
          this.#answers.delete(permId);
        }
        return true;
      }
      if (b.dataset.decide) {
        b.disabled = true;
        this.api?.decide(permId, b.dataset.decide);
        if (b.dataset.decide === 'terminal') { this.api?.focus(s.id); }
        return true;
      }
      if (b.dataset.always !== undefined) {
        b.disabled = true;
        this.api?.alwaysAllow(permId);
        return true;
      }
      if (b.dataset.menu) {
        const opts = [...this.el.detail.querySelectorAll('[data-menu]')];
        for (const x of opts) { x.disabled = true; }
        const r = await this.api?.answerMenu(s.id, Number(b.dataset.menu));
        if (r?.ok === false) {
          const hint = this.el.detail.querySelector('[data-menuhint]');
          if (hint) { hint.textContent = r.error; hint.classList.add('err'); }
          for (const x of opts) { x.disabled = false; }
        }
        return true;
      }
      return false;
    }

    #history(list) {
      if (!list?.length) { return emptyHtml(ICONS.clock, T.noActivity, T.noActivityHint, 'small'); }
      return `<ul class="timeline plain">${list.slice(0, 6).map(h => `<li><span class="t" title="${esc(h.title)}">${esc(h.title)}</span><span class="ago">${timeAgo(h.at)}</span></li>`).join('')}</ul>`;
    }

    #appDetail(a) {
      const d = a.details || {};
      const tiles = a.category === 'browser' && d.tabs !== undefined
        ? [[ICONS.tab, T.tabs(d.tabs)], [ICONS.win, T.wins(d.browserWindows.length)], [ICONS.cpu, formatBytes(a.memory)]]
        : a.category === 'terminal' && d.sessions
          ? [[ICONS.tab, T.sessions(d.sessions)], [ICONS.win, T.wins(a.windows.length)], [ICONS.cpu, formatBytes(a.memory)]]
          : [[ICONS.win, T.wins(a.windows.length)], [ICONS.mem, formatBytes(a.memory)], [ICONS.cpu, pct(a.cpu)]];

      // Browser windows come from its session (with tab counts); others from the GNOME extension
      let windows = '';
      if (a.category === 'browser' && d.browserWindows?.length) {
        windows = d.browserWindows.map(bw => {
          const gw = a.windows.find(w => w.title.startsWith(bw.title));
          return `<div class="item${gw ? ' click' : ''}"${gw ? ` data-window="${esc(gw.id)}"` : ''}>${ICONS.tab}<span class="t">${esc(bw.title)}</span><span class="m">${T.tabs(bw.tabs)}</span></div>`;
        }).join('');
      } else if (a.windows.length) {
        windows = a.windows.map(w => `<div class="item click" data-window="${esc(w.id)}">${ICONS.win}<span class="t">${esc(w.title)}</span>${w.focused ? '<span class="m">focused</span>' : ''}</div>`).join('');
      }
      const projects = d.projects?.length
        ? `<h3>${T.projects}</h3><div class="items">${d.projects.map(p => `<div class="item">${ICONS.ides}<span class="t">${esc(p)}</span></div>`).join('')}</div>` : '';
      const second = a.category === 'browser'
        ? `<button class="wide" data-act="newtab">${ICONS.plus}${T.newTab}</button>`
        : `<button class="wide" data-act="newwindow">${ICONS.plus}${T.newWindow}</button>`;
      return `
        <div class="tiles">${tiles.map(([ic, txt]) => `<div class="tile">${ic}${esc(txt)}</div>`).join('')}</div>
        ${projects}
        ${windows ? `<h3>${T.windows}</h3><div class="items">${windows}</div>` : ''}
        ${!this.extension ? `<div class="note">${T.needsExtension}</div>` : ''}
        <div class="buttons">
          <button class="wide" data-act="focus"${a.windows.length ? '' : ` disabled title="${this.extension ? T.focusNoWindows : T.focusNoExt}"`}>${ICONS.focus}${T.focus}</button>
          ${second}
        </div>
        <h3>${T.recent}</h3>${this.#history(a.history)}`;
    }

    #dockerDetail(a) {
      const cs = a.details.containers;
      const running = cs.filter(c => c.state === 'running').length;
      const unhealthy = cs.filter(c => c.health === 'unhealthy').length;
      const rows = cs.map(c => {
        const on = c.state === 'running';
        const id = esc(c.id);
        // Stop / restart ask first, in the row itself; start and logs don't change anything risky
        const ask = this.dockerAsk?.id === c.id ? this.dockerAsk.action : null;
        const actions = ask
          ? `<span class="ask">${T.dockerAsk(T[ask])}</span>
             <button class="mini wide-mini danger" data-docker="${ask}" data-id="${id}" data-confirmed="1">${T[ask]}</button>
             <button class="mini wide-mini" data-docker-cancel>${T.cancel}</button>`
          : `<button class="mini" data-logs="${id}" title="${T.logsTip}" aria-label="${T.logs}">${ICONS.logs}</button>${on
            ? `<button class="mini" data-docker="restart" data-id="${id}" title="${T.restart}" aria-label="${T.restart}">${ICONS.restart}</button><button class="mini" data-docker="stop" data-id="${id}" title="${T.stop}" aria-label="${T.stop}">${ICONS.stop}</button>`
            : `<button class="mini" data-docker="start" data-id="${id}" title="${T.start}" aria-label="${T.start}">${ICONS.play}</button>`}`;
        return `<div class="item"><span class="dot" style="--c:${HEALTH_COLOR[c.health] || 'var(--idle)'}" title="${esc(c.status)}"></span><span class="t" title="${esc(c.image)}">${esc(c.name)}</span>${ask ? '' : `<span class="m">${esc(c.health)}</span>`}${actions}</div>`;
      }).join('');
      // Logs of one container: read-only, the last 200 lines
      const lg = this.dockerLogs;
      const logs = lg && cs.some(c => c.id === lg.id)
        ? `<h3>${T.logsOf(esc(lg.name))} <button class="link" data-logs-close>${T.close}</button></h3>
           ${lg.error ? stateBlock({ kind: 'error', title: T.logsFailed, action: { label: T.retry, data: { logs: lg.id } }, details: lg.error })
             : lg.text == null ? stateBlock({ kind: 'loading', line: T.loadingLogs }) : `<pre class="logs" data-k="logs:${esc(lg.id)}">${esc(lg.text) || T.noLogs}</pre>`}`
        : '';
      return `
        <div class="tiles">
          <div class="tile">${ICONS.box}${cs.length} total</div>
          <div class="tile">${ICONS.play}${running} running</div>
          <div class="tile">${unhealthy ? ICONS.restart : ICONS.check}${unhealthy ? T.unhealthyN(unhealthy) : T.allHealthy}</div>
        </div>
        <h3>${T.containers}</h3>${rows ? `<div class="items">${rows}</div>` : emptyHtml(ICONS.box, T.noContainers, T.noContainersHint, 'small')}
        ${logs}
        <h3>${T.recent}</h3>${this.#history(a.history)}`;
    }

    // A task in the panel: where it is and what waits; the decisions are made in the Tasks window
    #taskDetail(t) {
      const total = t.template.stages.length;
      const st = t.template.stages[t.stage];
      const stages = t.template.stages.map((s, i) => {
        const state = t.stages[i].status;
        return `<li class="${i === t.stage && (t.status === 'running' || t.status === 'needs-you') ? 'now' : ''}"><span class="t">${esc(s.title)}</span><span class="ago">${esc(state)}</span></li>`;
      }).join('');
      return `
        ${t.gate ? `<div class="note">⚠ ${esc(t.gate.title)}</div>` : ''}
        <div class="doing"><b>${esc(T.taskStage(st?.title || '', Math.min(t.stage + 1, total), total))}</b><span>${esc(t.project.name)} · ${esc(t.template.name)}</span></div>
        <ul class="timeline">${stages}</ul>
        <div class="buttons"><button class="wide" data-act="open-task">${ICONS.tasks}${T.openTasks}</button></div>`;
    }

    #agentDetail(s) {
      const doing = s.activity || { title: T.nothingYet, detail: '' };
      const live = ACTIVE.has(s.state);
      const history = (s.history || []).slice(0, 6);
      const con = this.#consoleFor(s);
      // The console (turns read from the agent's transcript) when there is one; the activity timeline otherwise
      // First look at the transcript still on its way: the console's shape, so the timeline doesn't flash first
      const body = con?.turns?.length ? this.#consoleHtml(con.turns, live)
        : !con && this.api?.console ? skeletonHtml([45, 80, 65, 30])
        : `<div class="doing"><b title="${esc(doing.title)}">${esc(doing.title)}</b><span title="${esc(doing.detail)}">${esc(doing.detail || projectPath(s))}</span></div>
           <ul class="timeline">${history.map((h, i) => `<li class="${i === 0 && live ? 'now' : ''}"><span class="t" title="${esc(h.detail || h.title)}">${esc(h.title)}</span><span class="ago">${timeAgo(h.at)}</span></li>`).join('')}</ul>`;
      return `
        ${this.#inboxCard(s)}
        ${this.collisions?.[s.id] ? `<div class="clashbox ${this.collisions[s.id].level}">⚠ ${esc(this.#clashText(this.collisions[s.id]))}<small>${T.clashFix}</small></div>` : ''}
        ${body}`;
    }

    // ---------- agent console ----------

    // Cached turns for a session; fetched in the background (at most every CONSOLE_MS) and re-rendered
    #consoleFor(s) {
      const c = this.#consoles.get(s.id);
      if (!c || Date.now() - c.at > CONSOLE_MS) {
        this.#loadConsole(s.id);
      }
      return c;
    }

    async #loadConsole(id) {
      if (this.#consoleLoading.has(id) || !this.api?.console) { return; }
      this.#consoleLoading.add(id);
      const r = await this.api.console(id).catch(() => null);
      this.#consoleLoading.delete(id);
      const before = JSON.stringify(this.#consoles.get(id)?.turns || null);
      this.#consoles.set(id, { ...(r || {}), at: Date.now() });
      if (this.current?.id === id && JSON.stringify(r?.turns || null) !== before) { this.#renderDetail(); }
    }

    // Turns, newest last. The newest turn's steps are open, older ones fold behind "N steps"; long messages fold
    // to a few lines. What the user opened or folded is kept in #toggled across the frequent re-renders.
    #stepsHtml(id, groups, running) {
      const all = this.#toggled.has(`all:${id}`);
      const from = all ? 0 : Math.max(0, groups.length - STEP_TAIL);
      const rows = groups.slice(from).map((g, i) => {
        const gi = from + i;
        return stepHtml(g, running && gi === groups.length - 1, this.#toggled.has(`step:${id}:${gi}`), `step:${id}:${gi}`);
      });
      const earlier = groups.length > STEP_TAIL
        ? `<button type="button" class="earlier" data-toggle="all:${id}">${all ? T.showLess : T.earlier(from)}</button>` : '';
      return `<div class="steps">${earlier}${rows.join('')}</div>`;
    }

    #consoleHtml(turns, live) {
      const shown = turns.slice(-CONSOLE_TURNS);
      const isOn = k => this.#toggled.has(k);
      const long = (text, lines, chars) => text.length > chars || text.split('\n').length > lines;
      const message = (who, text, key, html) => {
        const big = long(text, who === 'you' ? 4 : 8, who === 'you' ? 260 : 600);
        const open = big && isOn(key);
        return `<div class="msg ${who}${big ? ' long' : ''}${open ? ' open' : ''}">${html}</div>` +
          (big ? `<button type="button" class="showmore ${who}" data-toggle="${key}">${open ? T.showLess : T.showMore}</button>` : '');
      };
      return `<div class="console" data-console>${shown.map((t, ti) => {
        const last = ti === shown.length - 1;
        const running = last && live && t.status === 'running';
        const id = esc(t.id);
        const groups = groupSteps(t.steps);
        const open = last !== isOn(`steps:${id}`); // the newest is open unless folded; older ones the other way round
        const failed = t.steps.filter(s => s.result === 'error').length;
        const took = t.startedAt && t.endedAt ? secs(t.endedAt - t.startedAt) : '';
        const time = clock(t.startedAt);
        return `<div class="turn">
          ${time || running ? `<div class="tsep">${running ? `<span class="live">● ${T.now}</span>${time ? ` · ${time}` : ''}` : time}</div>` : ''}
          ${message('you', t.prompt || '', `you:${id}`, t.prompt ? renderMarkdown(t.prompt) : `<i class="cont">${T.continued}</i>`)}
          ${groups.length ? `<button type="button" class="fold${open ? ' open' : ''}" data-toggle="steps:${id}"><span class="chev">›</span>${T.nSteps(t.steps.length)}${failed ? ` · <span class="err">${T.nFailed(failed)}</span>` : ''}${took ? ` <span class="dim">· ${took}</span>` : ''}</button>` : ''}
          ${groups.length && open ? this.#stepsHtml(id, groups, running) : ''}
          ${running ? `<div class="working"><i></i><i></i><i></i>${T.working}</div>` : ''}
          ${t.summary ? message('said', t.summary, `said:${id}`, renderMarkdown(t.summary)) : ''}
        </div>`;
      }).join('')}</div>`;
    }

    // The footer is always the whole machine — never a sum over the selected section (that read "243 %"):
    // CPU as a share of all cores (0–100 %), memory as used of total. Per-app numbers live in the detail.
    #renderMeters() {
      const sys = this.stats?.system || {};
      const cpu = sys.cpu == null ? '—' : `${Math.round(sys.cpu)}%`;
      const cpuTip = sys.cpu == null ? T.cpuTip : `${T.cpuTip} · ${T.cores(sys.coresBusy, sys.cores)}`;
      const mem = sys.memTotal ? `${formatBytes(sys.memUsed)} / ${formatBytes(sys.memTotal)}` : '—';
      const waited = this.blocked?.today
        ? `<span class="sep"></span><span class="meter" title="${T.waitedTip}">${ICONS.clock}${T.waited}<b>${formatWait(this.blocked.today)}</b></span>`
        : '';
      this.el.meters.innerHTML = `<span class="meter" title="${esc(cpuTip)}">${ICONS.cpu}${T.cpu}<b>${cpu}</b></span><span class="sep"></span><span class="meter" title="${T.memTip}">${ICONS.mem}${T.memory}<b>${mem}</b></span>${waited}`;
    }

    #flash(text) {
      clearTimeout(this.#flashTimer);
      this.el.meters.innerHTML = `<span class="flash">${esc(text)}</span>`;
      this.#flashTimer = setTimeout(() => this.#renderMeters(), 3500);
    }

    // ---------- actions ----------

    async #run(promise) {
      const r = await promise;
      if (r && r.ok === false && r.error) { this.#flash(r.error); }
    }

    #primary(item) {
      if (item.kind === 'task') { return this.api?.openTasks(item.id); }
      if (item.kind === 'agent') { return this.api?.focus(item.id); }
      if (item.kind === 'app') { return this.#run(this.api?.focusApp(item.id)); }
    }

    async #toggleLaunch() {
      this.launchMode = !this.launchMode;
      this.query = '';
      this.el.search.value = '';
      if (this.launchMode && !this.launchable) { await this.#loadLaunchable(); }
      this.render();
      this.el.search.focus();
    }

    async #loadLaunchable() {
      this.launchFailed = null;
      this.render();
      try {
        this.launchable = await this.api?.launchable() || [];
      } catch (err) {
        this.launchFailed = errorText(err);
      }
    }

    // ---------- prompts ----------

    // The selected agent's prompt box: only for sessions running in tmux and not waiting on a permission
    #renderSay() {
      const s = !this.launchMode && this.current?.kind === 'agent' ? this.current.data : null;
      const can = !!s && !s.perm;
      this.el.say.hidden = !can;
      if (!can) { return; }
      if (this.sayFor !== s.id) {   // another session: its own empty box
        if (this.#sayConfirming) { this.#confirmSay(false); }
        this.sayFor = s.id;
        this.el.sayText.value = '';
        this.sayAtt.clear();
        this.#sayHint('');
        this.#histPos = -1;
        this.#renderQueue([]);
        this.#queueAt = 0;
      }
      this.#loadQueue();
      this.el.sayText.placeholder = T.sayTo(Agent.displayName(s.agent), projectName(s));
      if (!this.el.sayHint.dataset.kind) {
        this.el.sayHint.textContent = !s.term?.tmux ? T.sayPaste : BUSY.has(s.state) ? T.sayBusy : T.sayHint;
      }
      this.el.saySend.disabled = this.#sayEmpty;
      this.#renderSugg(s);
      if (this.#sayConfirming) { this.#renderSayConfirm(); } // busy may have changed: now vs queue
    }

    // The next steps its last answer offered (cleared when a new turn starts)
    #renderSugg(s) {
      const list = s.suggestions || [];
      const key = JSON.stringify(list);
      this.el.saySugg.hidden = !list.length || this.#sayConfirming;
      if (this.el.saySugg.dataset.key === key) { return; }
      this.el.saySugg.dataset.key = key;
      this.el.saySugg.innerHTML = list.length ? `<span class="cap">${T.suggested}</span>${list.map((x, i) =>
        `<button type="button" data-sugg="${i}" title="${esc(x.prompt)}\n${T.useSuggestion}">${esc(x.label)}</button>`).join('')}` : '';
    }

    #useSuggestion(i) {
      const x = this.sessions.find(v => v.id === this.sayFor)?.suggestions?.[i];
      if (!x) { return; }
      this.el.sayText.value = x.prompt;
      this.#grow(this.el.sayText);
      this.el.saySend.disabled = false;
      this.#confirmSay(true); // shows "send now" or "queue" — the second Enter / click sends
      this.el.saySugg.hidden = true;
    }

    #sayHint(text, kind = '') {
      this.el.sayHint.textContent = text;
      this.el.sayHint.className = `hint ${kind}`;
      this.el.sayHint.dataset.kind = kind;
      clearTimeout(this.#sayTimer);
      if (kind) { this.#sayTimer = setTimeout(() => { this.el.sayHint.dataset.kind = ''; this.el.sayHint.className = 'hint'; this.#renderSay(); }, 3500); }
    }

    get #sayConfirming() { return !this.el.sayConfirm.hidden; }
    get #sayEmpty() { return !this.el.sayText.value.trim() && !this.sayAtt.count; }

    // First Enter shows what will happen (sent now or queued); the second one sends
    #confirmSay(on) {
      this.el.sayConfirm.hidden = !on;
      this.el.saySend.hidden = on;
      this.el.sayText.readOnly = on;
      this.el.saySugg.hidden = on || !this.el.saySugg.innerHTML;
      if (on) {
        this.#renderSayConfirm();
        this.#sayHint(T.confirmHint);
        this.el.sayConfirm.querySelector('[type=submit]')?.focus();
      } else {
        this.el.sayHint.dataset.kind = '';
        this.#sayHint('');
      }
      this.#fit();
    }

    #renderSayConfirm() {
      const s = this.sessions.find(x => x.id === this.sayFor);
      if (!s) { return this.#confirmSay(false); }
      // tmux: typed in now, or queued while busy. Any other terminal: copied for the user to paste
      const paste = !s.term?.tmux;
      const busy = !paste && BUSY.has(s.state);
      const [cls, badge, btn] = paste ? ['paste', T.toPaste, T.pasteBtn] : busy ? ['queue', T.toQueue, T.queueBtn] : ['now', T.now, T.sendBtn];
      this.el.sayConfirm.innerHTML = `<span class="q">${T.confirmSend(esc(Agent.displayName(s.agent)), esc(projectName(s)))}${this.sayAtt.count ? T.withFiles(this.sayAtt.count) : ''}</span>
        <span class="badge ${cls}">${badge}</span>
        <button type="button" class="btn" data-edit>${T.edit}</button>
        <button type="submit" class="btn on">${btn}</button>
        ${paste && RESUMABLE.has(s.agent) ? `<button type="button" class="btn" data-handoff title="${T.handoffTip}">${T.handoff}</button>` : ''}`;
    }

    async #send() {
      const text = this.el.sayText.value.trim();
      if (this.#sayEmpty || !this.sayFor) { return; }
      if (this.sayAtt.busy) { return this.#sayHint(T.attaching, 'err'); }
      if (!this.#sayConfirming) { return this.#confirmSay(true); }
      this.#confirmSay(false);
      this.el.saySend.disabled = true;
      const res = await this.api?.sendPrompt(this.sayFor, this.sayAtt.compose(text));
      if (res?.ok) {
        if (text) { this.#remember(this.sayFor, text); }
        this.el.sayText.value = '';
        this.sayAtt.clear();
        this.#grow(this.el.sayText);
        this.#loadQueue(true);
        this.#sayHint(res.via === 'clipboard' ? T.copiedPaste : res.queued ? T.queued : T.sent, 'ok');
      } else {
        this.#sayHint(res?.error || 'Could not send', 'err');
      }
      this.#renderSay();
    }

    // ---------- prompt box helpers: / shortcuts, history, queue ----------

    // "/" at the start of an empty box opens the shortcuts; picking one fills in its text, to edit or send
    #renderSlash() {
      const v = this.el.sayText.value;
      const open = /^\/\w*$/.test(v) && !this.#sayConfirming;
      const list = open ? SLASH.filter(c => c.cmd.startsWith(v.toLowerCase())) : [];
      this.el.slash.hidden = !list.length;
      if (!list.length) { return; }
      this.#slashAt = Math.min(this.#slashAt, list.length - 1);
      this.el.slash.innerHTML = list.map((c, i) => `<button type="button" role="option" aria-selected="${i === this.#slashAt}" data-slash="${c.cmd}"
        class="${i === this.#slashAt ? 'on' : ''}"><code>${c.cmd}</code><span>${esc(c.label)}</span></button>`).join('');
    }

    #applySlash(cmd) {
      const c = SLASH.find(x => x.cmd === cmd);
      if (!c) { return; }
      this.el.sayText.value = c.text;
      this.el.slash.hidden = true;
      this.#grow(this.el.sayText);
      this.el.saySend.disabled = false;
      this.el.sayText.focus();
      this.el.sayText.setSelectionRange(c.text.length, c.text.length);
    }

    // Prompts sent to each session, newest first (↑ / ↓ in an empty box walk through them)
    #remember(id, text) {
      const h = this.#histories.get(id) || [];
      this.#histories.set(id, [text, ...h.filter(t => t !== text)].slice(0, HISTORY_MAX));
      this.#histPos = -1;
    }

    #walkHistory(step) {
      const h = this.#histories.get(this.sayFor) || [];
      if (!h.length) { return false; }
      const pos = Math.max(-1, Math.min(h.length - 1, this.#histPos + step));
      if (pos === this.#histPos) { return true; }
      this.#histPos = pos;
      this.el.sayText.value = pos === -1 ? '' : h[pos];
      this.#grow(this.el.sayText);
      this.el.saySend.disabled = this.#sayEmpty;
      return true;
    }

    // Prompts waiting for this agent (it's busy): listed under the box, each removable
    async #loadQueue(now = false) {
      const id = this.sayFor;
      if (!id || !this.api?.queue || (!now && Date.now() - this.#queueAt < CONSOLE_MS)) { return; }
      this.#queueAt = Date.now();
      const list = (await this.api.queue(id).catch(() => [])) || [];
      if (id !== this.sayFor) { return; }
      this.#renderQueue(list);
    }

    #renderQueue(list) {
      this.el.sayQueue.hidden = !list.length;
      this.el.sayQueue.innerHTML = list.length
        ? `<li class="cap">${T.queuedN(list.length)}</li>${list.map((t, i) => `<li><span title="${esc(t)}">${esc(t)}</span><button type="button" data-unqueue="${i}" title="${T.unqueueTip}" aria-label="${T.unqueueTip}">×</button></li>`).join('')}`
        : '';
    }

    #grow(ta) { ta.style.height = 'auto'; ta.style.height = `${Math.min(ta.scrollHeight, 120)}px`; }

    // "Ask Bayloob": type what should be done, Enter, then pick the agent and folder right here
    async #askNext() {
      if (!this.el.askText.value.trim() && !this.askAtt.count) { return; }
      if (this.askAtt.busy) { return this.#askHint(T.attaching, 'err'); }
      if (!this.el.askConfirm.hidden) { return this.#askStart(); }
      if (!this.el.askPick.hidden) { return this.#confirmAsk(true); }
      const opts = await this.api?.launchOptions();
      if (!opts) { return; }
      this.askOpts = opts;
      const sel = this.current?.kind === 'agent' ? this.current.data : null;
      const last = opts.recent?.[0];
      const installed = Object.keys(opts.agents).filter(k => opts.agents[k].installed);
      this.askAgent = [sel?.agent, last?.agent].find(a => a && opts.agents[a]?.installed) || installed[0] || null;
      this.askCwd = tilde(sel?.cwd || last?.cwd || '', opts.home);
      this.askWorktree = false;
      this.#renderAskPick();
      this.el.askPick.hidden = false;
      this.#askHint(T.askHint);
      this.#fit();
    }

    #renderAskPick() {
      const { agents } = this.askOpts;
      const chips = Object.entries(agents).map(([k, a]) => `<button type="button" class="pick${k === this.askAgent ? ' on' : ''}" data-agent="${esc(k)}"
        ${a.installed ? '' : `disabled title="${T.notInstalled}"`}><span class="dot" style="--c:${esc(a.color)}"></span>${esc(a.name)}</button>`).join('');
      this.el.askPick.innerHTML = `${chips}
        <label class="where" title="${T.pickFolder}">${FOLDER}<input id="askCwd" value="${esc(this.askCwd)}" placeholder="${T.folder}" spellcheck="false"></label>
        <button type="button" class="pick${this.askWorktree ? ' on' : ''}" data-worktree>${T.worktree}</button>
        <button type="submit" class="btn on">${T.startAgent}</button>`;
    }

    #askHint(text, kind = '') {
      this.el.askHint.hidden = !text;
      this.el.askHint.textContent = text;
      this.el.askHint.className = `hint ${kind}`;
    }

    // Between picking and launching: one line with everything that's about to start
    #confirmAsk(on) {
      if (on) {
        this.askCwd = (this.el.askPick.querySelector('#askCwd')?.value || '').trim();
        if (!this.askAgent || !this.askCwd) { return this.#askHint(T.pickFolder, 'err'); }
        const a = this.askOpts.agents[this.askAgent];
        this.el.askConfirm.innerHTML = `<span class="q">${T.confirmLaunch(esc(a?.name || this.askAgent), esc(this.askCwd))}${this.askWorktree ? ` · ${T.inWorktree}` : ''}${this.askAtt.count ? T.withFiles(this.askAtt.count) : ''}</span>
          <button type="button" class="btn" data-edit>${T.edit}</button>
          <button type="submit" class="btn on">${T.launchBtn}</button>`;
        this.#askHint(T.confirmHint);
      } else {
        this.#renderAskPick();
        this.#askHint(T.askHint);
      }
      this.el.askPick.hidden = on;
      this.el.askConfirm.hidden = !on;
      this.el.askText.readOnly = on;
      if (on) { this.el.askConfirm.querySelector('[type=submit]')?.focus(); } else { this.el.askText.focus(); }
      this.#fit();
    }

    async #askStart() {
      const cwd = this.askCwd;
      if (!this.askAgent || !cwd) { return this.#askHint(T.pickFolder, 'err'); }
      this.#askHint(T.starting);
      const res = await this.api?.launch({ agent: this.askAgent, cwd, prompt: this.askAtt.compose(this.el.askText.value), worktree: this.askWorktree });
      if (res?.ok) {
        this.#askReset();
        this.askAtt.clear();
        this.#askHint(T.started, 'ok');
        setTimeout(() => { this.#askHint(''); this.#fit(); }, 2500);
      } else {
        this.#askHint(res?.error || 'Could not start the agent', 'err');
      }
    }

    #askReset() {
      this.el.askText.value = '';
      this.el.askText.readOnly = false;
      this.el.askPick.hidden = true;
      this.el.askPick.innerHTML = '';
      this.el.askConfirm.hidden = true;
      this.el.askConfirm.innerHTML = '';
      this.#askHint('');
      this.#fit();
    }

    // ---------- the Workspace window: splitters, collapsible sidebar, window controls ----------

    #layout = { side: SIDE.def, detail: DETAIL.def, collapsed: false };

    #bindWindow() {
      try { Object.assign(this.#layout, JSON.parse(localStorage.getItem(LAYOUT_KEY) || '{}')); } catch { /* storage unavailable */ }
      const main = this.el.panel.querySelector('.main');
      const [side, list] = [main.querySelector('.side'), main.querySelector('.listcol')];
      const split = (after, key, range, sign) => {
        const el = document.createElement('div');
        el.className = 'split';
        el.setAttribute('role', 'separator');
        el.setAttribute('aria-orientation', 'vertical');
        el.title = 'Drag to resize · double-click for the default width';
        after.after(el);
        el.addEventListener('dblclick', () => { this.#layout[key] = range.def; this.#applyLayout(true); });
        el.addEventListener('pointerdown', e => {
          if (key === 'side' && this.#layout.collapsed) { return; }
          e.preventDefault();
          el.setPointerCapture(e.pointerId);
          el.classList.add('drag');
          const x0 = e.clientX;
          const w0 = this.#layout[key];
          const move = ev => {
            this.#layout[key] = Math.round(Math.min(range.max, Math.max(range.min, w0 + sign * (ev.clientX - x0))));
            this.#applyLayout();
          };
          const up = () => {
            el.classList.remove('drag');
            el.removeEventListener('pointermove', move);
            el.removeEventListener('pointerup', up);
            this.#applyLayout(true);
          };
          el.addEventListener('pointermove', move);
          el.addEventListener('pointerup', up);
        });
      };
      split(side, 'side', SIDE, 1);
      split(list, 'detail', DETAIL, -1);
      document.getElementById('collapseSide').addEventListener('click', () => this.#toggleSide());
      for (const b of document.querySelectorAll('[data-win]')) {
        b.addEventListener('click', () => this.api?.windowControl(b.dataset.win));
      }
      document.addEventListener('keydown', e => {
        if (e.ctrlKey && !e.shiftKey && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); this.#toggleSide(); }
      });
      this.#applyLayout();
    }

    // Tasks: the Workspace window shows Tasks' own page over the list and detail columns
    #embedRect = '';
    #syncEmbed() {
      if (!WINDOW_MODE) { return; }
      const main = this.el.panel.querySelector('.main');
      const on = this.section === 'tasks' && !this.launchMode && this.el.pal.hidden;
      main.classList.toggle('embedding', on);
      let box = main.querySelector('.embed');
      if (!box) {
        box = document.createElement('div');
        box.className = 'embed';
        main.appendChild(box);
        new ResizeObserver(() => this.#syncEmbed()).observe(box);
        window.addEventListener('resize', () => this.#syncEmbed());
      }
      const r = on ? box.getBoundingClientRect() : null;
      const rect = r && r.width > 0 ? { x: r.left, y: r.top, width: r.width, height: r.height } : null;
      const key = JSON.stringify(rect);
      if (key === this.#embedRect) { return; }
      this.#embedRect = key;
      this.api?.embed?.(rect);
    }

    #toggleSide() {
      this.#layout.collapsed = !this.#layout.collapsed;
      this.#applyLayout(true);
    }

    #applyLayout(save = false) {
      const main = this.el.panel.querySelector('.main');
      const l = this.#layout;
      main.classList.toggle('collapsed', !!l.collapsed);
      main.style.setProperty('--side-w', `${l.collapsed ? 64 : l.side}px`);
      main.style.setProperty('--detail-w', `${l.detail}px`);
      const b = document.getElementById('collapseSide');
      const label = l.collapsed ? 'Expand the sidebar (Ctrl+B)' : 'Collapse the sidebar (Ctrl+B)';
      b.title = label;
      b.setAttribute('aria-label', label);
      if (save) { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(l)); } catch { /* storage unavailable */ } }
      requestAnimationFrame(() => this.#syncEmbed());
    }

    // The popup grows with its content; the Workspace window has its own size
    #fit() { if (!WINDOW_MODE) { this.api?.resize(Math.ceil(this.el.panel.getBoundingClientRect().height) + 20); } }

    async #showLogs(item, id) {
      const c = item.data.details.containers.find(x => x.id === id);
      this.dockerLogs = { id, name: c?.name || id, text: null };
      this.#renderDetail();
      let r;
      try {
        r = await this.api?.dockerLogs(id);
      } catch (err) {
        r = { ok: false, error: errorText(err) };
      }
      if (this.dockerLogs?.id !== id) { return; } // closed or switched meanwhile
      if (r?.ok) { this.dockerLogs.text = r.text; } else { this.dockerLogs.error = r?.error || T.wrong; }
      this.#renderDetail();
      const pre = this.el.detail.querySelector('.logs');
      if (pre) { pre.scrollTop = pre.scrollHeight; } // newest at the bottom, in view
    }

    #move(step) {
      const items = this.#visible();
      if (!items.length) { return; }
      const i = Math.max(0, items.findIndex(x => x.key === this.current?.key));
      this.selected = items[(i + step + items.length) % items.length].key;
      this.render();
    }

    #goSection(key, selected = null) {
      this.section = key;
      this.launchMode = false;
      this.selected = selected;
      this.query = '';
      this.el.search.value = '';
      this.render();
    }

    // ---------- Ctrl+K: jump to a section or an agent, or run an action ----------

    #openPal() {
      this.el.pal.hidden = false;
      this.#syncEmbed(); // the palette must not open under the Tasks page
      this.el.palText.value = '';
      this.#palAt = 0;
      this.#renderPal();
      this.el.palText.focus();
    }

    #closePal() { this.el.pal.hidden = true; this.#syncEmbed(); }

    #palCommands() {
      const cur = this.current?.kind === 'agent' ? this.current.data : null;
      const curName = cur && Agent.displayName(cur.agent);
      return [
        ...NAV.flat().map(k => ({ icon: ICONS[k], label: T.sections[k], meta: T.palGo, run: () => this.#goSection(k) })),
        ...[...this.sessions].sort((a, b) => b.updatedAt - a.updatedAt).map(s => ({
          icon: iconHtml(agentItem(s)), label: `${Agent.displayName(s.agent)} · ${s.project}`, meta: T.status[s.state] || T.palAgent,
          run: () => this.#goSection('agents', `agent:${s.id}`),
        })),
        { icon: ICONS.spark, label: T.palAsk, meta: T.palAction, run: () => this.el.askText.focus() },
        { icon: ICONS.plus, label: T.palNewTask, meta: T.palAction, run: () => this.api?.newSession() },
        { icon: ICONS.tasks, label: T.palTasks, meta: T.palAction, run: () => this.api?.openTasks() },
        { icon: ICONS.plus, label: T.palLaunch, meta: T.palAction, run: () => { if (!this.launchMode) { this.#toggleLaunch(); } } },
        ...(cur ? [{ icon: ICON_TERM, label: T.palTerminal(curName), meta: T.palAction, run: () => this.api?.focus(cur.id) }] : []),
        ...(cur?.cwd ? [{ icon: FOLDER, label: T.palWorkspace(curName), meta: T.palAction, run: () => this.api?.openWorkspace(cur.id) }] : []),
        { icon: ICONS.gear, label: T.palSettings, meta: T.palAction, run: () => this.api?.openSettings() },
      ];
    }

    // Every word typed must appear in the label
    #renderPal() {
      const words = this.el.palText.value.toLowerCase().split(/\s+/).filter(Boolean);
      this.#palCmds = this.#palCommands().filter(c => words.every(w => c.label.toLowerCase().includes(w)));
      this.#palAt = Math.max(0, Math.min(this.#palAt, this.#palCmds.length - 1));
      this.el.palList.innerHTML = this.#palCmds.length
        ? this.#palCmds.map((c, i) => `<button type="button" role="option" aria-selected="${i === this.#palAt}" class="${i === this.#palAt ? 'on' : ''}" data-pal="${i}">
            ${c.icon}<span>${esc(c.label)}</span><small>${esc(c.meta)}</small></button>`).join('')
        : `<div class="none">${T.palNoMatch}</div>`;
      this.el.palList.querySelector('.on')?.scrollIntoView({ block: 'nearest' });
    }

    #runPal(i) {
      const c = this.#palCmds[i];
      this.#closePal();
      c?.run();
    }

    #bind() {
      this.el.side.addEventListener('click', e => {
        if (e.target.closest('[data-settings]')) { return this.api?.openSettings(); }
        const b = e.target.closest('[data-section]');
        if (!b) { return; }
        this.#goSection(b.dataset.section);
      });
      // Clicks in the details: no re-render between press and release; inbox cards keep their command scroll
      this.el.detail.addEventListener('pointerdown', () => { this.#pressing = true; });
      window.addEventListener('pointerup', () => {
        if (!this.#pressing) { return; }
        this.#pressing = false;
        // after the click handlers ran
        if (this.#renderLater) { this.#renderLater = false; setTimeout(() => this.#renderDetail()); }
      });
      this.el.detail.addEventListener('scroll', e => {
        const box = e.target;
        if (!box.matches?.('[data-permtext]')) { return; }
        const id = box.closest('[data-perm]').dataset.perm;
        this.#permScroll.set(id, box.scrollTop);
        if (!this.#permRead.has(id) && box.scrollTop + box.clientHeight >= box.scrollHeight - 2) { this.#permRead.add(id); this.#syncPerm(); }
      }, true);
      this.el.palText.addEventListener('input', () => { this.#palAt = 0; this.#renderPal(); });
      this.el.palText.addEventListener('keydown', e => {
        const n = this.#palCmds.length;
        if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && n) {
          e.preventDefault();
          this.#palAt = (this.#palAt + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
          this.#renderPal();
        } else if (e.key === 'Enter') { e.preventDefault(); this.#runPal(this.#palAt); }
        else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.#closePal(); }
      });
      this.el.palList.addEventListener('click', e => {
        const b = e.target.closest('[data-pal]');
        if (b) { this.#runPal(Number(b.dataset.pal)); }
      });
      document.addEventListener('mousedown', e => {
        if (!this.el.pal.hidden && !e.target.closest('#pal')) { this.#closePal(); }
      });
      this.el.rows.addEventListener('click', async e => {
        if (e.target.closest('[data-retry-launch]')) { await this.#loadLaunchable(); return this.render(); }
        const empty = e.target.closest('[data-empty]')?.dataset.empty;
        if (empty === 'clear') { this.query = ''; this.el.search.value = ''; this.render(); return this.el.search.focus(); }
        if (empty === 'newTask') { return this.api?.newSession(); }
        if (empty === 'ask') { return this.el.askText.focus(); }
        if (empty === 'launch') { return this.#toggleLaunch(); }
        const launch = e.target.closest('[data-launch]');
        if (launch) {
          const app = this.launchable?.find(a => a.id === launch.dataset.launch);
          this.#flash(T.launched(app?.name || ''));
          return this.#run(this.api?.launchApp(launch.dataset.launch));
        }
        const row = e.target.closest('.row[data-key]');
        if (!row) { return; }
        this.selected = row.dataset.key;
        const item = this.current;
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'primary') { this.#primary(item); }
        if (act === 'menu') { item.kind === 'agent' ? this.api?.sessionMenu(item.id) : this.api?.appMenu(item.id); }
        this.render();
      });
      this.el.detail.addEventListener('click', async e => {
        const item = this.current;
        if (!item) { return; }
        if (item.kind === 'agent' && await this.#inboxAct(item.data, e.target)) { return; }
        const toggle = e.target.closest('[data-toggle]');
        // Selecting text in a step or message isn't a click to fold it
        if (toggle && !String(getSelection()).trim()) {
          const k = toggle.dataset.toggle;
          this.#toggled.has(k) ? this.#toggled.delete(k) : this.#toggled.add(k);
          return this.#renderDetail();
        }
        const win = e.target.closest('[data-window]');
        if (win) { return this.#run(this.api?.focusApp(item.id, win.dataset.window)); }
        if (e.target.closest('[data-docker-cancel]')) { this.dockerAsk = null; return this.#renderDetail(); }
        if (e.target.closest('[data-logs-close]')) { this.dockerLogs = null; return this.#renderDetail(); }
        const logs = e.target.closest('[data-logs]');
        if (logs) { return this.#showLogs(item, logs.dataset.logs); }
        const docker = e.target.closest('[data-docker]');
        if (docker) {
          const { docker: action, id, confirmed } = docker.dataset;
          if ((action === 'stop' || action === 'restart') && !confirmed) {
            this.dockerAsk = { id, action };
            return this.#renderDetail();
          }
          this.dockerAsk = null;
          docker.disabled = true;
          return this.#run(this.api?.docker(action, id));
        }
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'focus') { this.#run(this.api?.focusApp(item.id)); }
        if (act === 'newtab') { this.#run(this.api?.newTab(item.id)); }
        if (act === 'newwindow') { this.#run(this.api?.launchApp(item.id)); }
        if (act === 'terminal') { this.api?.focus(item.id); }
        if (act === 'open-task') { this.api?.openTasks(item.id); }
      });
      this.el.search.addEventListener('input', () => { this.query = this.el.search.value; this.selected = null; this.render(); });
      this.el.launch.addEventListener('click', () => this.#toggleLaunch());
      this.el.openWorkspace.addEventListener('click', () => this.current?.kind === 'agent' && this.api?.openWorkspace(this.current.id));
      this.el.settings.addEventListener('click', () => this.api?.openSettings());
      document.getElementById('openWindow').addEventListener('click', () => this.api?.openWindow(this.section));
      if (WINDOW_MODE) { this.#bindWindow(); }
      // Prompt to the selected agent: Enter sends, Shift+Enter is a new line
      this.el.say.addEventListener('submit', e => { e.preventDefault(); this.#send(); });
      this.el.finished.addEventListener('click', e => {
        const reply = e.target.closest('[data-reply]');
        if (reply) { return this.#replyTo(reply.dataset.reply); }
        const x = e.target.closest('[data-dismiss]');
        if (x) { this.finished = this.finished.filter(id => id !== x.dataset.dismiss); this.#renderFinished(); }
      });
      this.el.saySugg.addEventListener('click', e => {
        const b = e.target.closest('[data-sugg]');
        if (b) { this.#useSuggestion(Number(b.dataset.sugg)); }
      });
      this.el.sayConfirm.addEventListener('click', async e => {
        if (e.target.closest('[data-handoff]')) {
          const r = await this.api?.continueInBayloob(this.sayFor);
          this.#confirmSay(false);
          this.#sayHint(r?.ok ? T.handoffStarted : r?.error || 'Could not continue it in Bayloob', r?.ok ? 'ok' : 'err');
          return;
        }
        if (e.target.closest('[data-edit]')) { this.#confirmSay(false); this.el.sayText.focus(); }
      });
      this.el.askConfirm.addEventListener('click', e => {
        if (e.target.closest('[data-edit]')) { this.#confirmAsk(false); }
      });
      this.el.sayText.addEventListener('input', () => {
        this.#histPos = -1;
        this.#slashAt = 0;
        this.#renderSlash(); this.#grow(this.el.sayText); this.el.saySend.disabled = this.#sayEmpty; });
      this.el.sayText.addEventListener('keydown', e => {
        // The / shortcuts menu takes the arrows, Enter / Tab and Esc while it's open
        if (!this.el.slash.hidden) {
          const n = this.el.slash.children.length;
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
            e.preventDefault();
            this.#slashAt = (this.#slashAt + (e.key === 'ArrowDown' ? 1 : -1) + n) % n;
            return this.#renderSlash();
          }
          if (e.key === 'Enter' || e.key === 'Tab') {
            e.preventDefault();
            return this.#applySlash(this.el.slash.children[this.#slashAt]?.dataset.slash);
          }
          if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); this.el.slash.hidden = true; return; }
        }
        // ↑ / ↓ in an empty box (or while walking the history) bring back earlier prompts
        const ta = this.el.sayText;
        if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && (!ta.value || this.#histPos !== -1) && !this.#sayConfirming) {
          if (this.#walkHistory(e.key === 'ArrowUp' ? 1 : -1)) { e.preventDefault(); return; }
        }
        // Enter or Ctrl+Enter sends; Shift+Enter is a new line
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.#send(); }
      });
      this.el.slash.addEventListener('mousedown', e => {
        const b = e.target.closest('[data-slash]');
        if (b) { e.preventDefault(); this.#applySlash(b.dataset.slash); }
      });
      this.el.sayQueue.addEventListener('click', async e => {
        const b = e.target.closest('[data-unqueue]');
        if (!b || !this.sayFor) { return; }
        b.disabled = true;
        this.#renderQueue((await this.api?.unqueue(this.sayFor, Number(b.dataset.unqueue))) || []);
      });
      // Ask Bayloob: Enter → pick agent + folder → Enter starts
      this.el.ask.addEventListener('submit', e => { e.preventDefault(); this.#askNext(); });
      this.el.sayAttach.addEventListener('click', () => this.sayAtt.pick());
      this.el.askAttach.addEventListener('click', () => this.askAtt.pick());
      this.sayAtt.bindDrop(this.el.say);
      this.sayAtt.bindPaste(this.el.sayText);
      this.askAtt.bindDrop(this.el.ask);
      this.askAtt.bindPaste(this.el.askText);
      Attachments.guardWindow();
      this.el.askText.addEventListener('input', () => { if (!this.el.askText.value.trim() && !this.el.askPick.hidden) { this.#askReset(); } });
      this.el.askPick.addEventListener('click', e => {
        const a = e.target.closest('[data-agent]');
        if (a && !a.disabled) { this.askAgent = a.dataset.agent; }
        if (e.target.closest('[data-worktree]')) { this.askWorktree = !this.askWorktree; }
        if (a || e.target.closest('[data-worktree]')) {
          this.askCwd = this.el.askPick.querySelector('#askCwd')?.value || this.askCwd;
          this.#renderAskPick();
        }
      });
      document.addEventListener('keydown', e => {
        // Ctrl+K anywhere, even while typing: the command palette
        if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          return this.el.pal.hidden ? this.#openPal() : this.#closePal();
        }
        if (e.target.closest?.('#pal')) { return; }
        // Typing in a prompt box: only Escape is ours (leave the box / cancel the agent pick)
        if (e.target.closest?.('#say, #ask')) {
          if (e.key === 'Escape') {
            e.preventDefault();
            if (this.#sayConfirming && e.target.closest('#say')) { this.#confirmSay(false); this.el.sayText.focus(); }
            else if (!this.el.askConfirm.hidden) { this.#confirmAsk(false); }
            else if (!this.el.askPick.hidden) { this.#askReset(); }
            else { e.target.blur(); }
          }
          return;
        }
        if (e.key === 'Escape') {
          if (this.launchMode || this.query) { this.launchMode = false; this.query = ''; this.el.search.value = ''; this.render(); }
          else if (!WINDOW_MODE) { this.api?.close(); } // Esc never closes the Workspace window
        } else if (e.key === 'ArrowDown') { e.preventDefault(); this.#move(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.#move(-1); }
        else if (e.key === 'Enter' && this.current && !this.launchMode) { this.#primary(this.current); }
      });
    }
  }

  const view = new PanelView(window.panelAPI);
  if (window.panelAPI) {
    panelAPI.onShow(state => view.show(state));
    panelAPI.onSessions(list => view.setSessions(list));
    panelAPI.onStats(stats => view.setStats(stats));
    panelAPI.onStatus(status => view.setStatus(status));
    panelAPI.onWorkspace(snap => view.setWorkspace(snap));
    panelAPI.onBlocked?.(info => view.setBlocked(info));
    panelAPI.onCollisions?.(map => view.setCollisions(map));
    panelAPI.onUsage?.(usage => view.setUsage(usage));
    panelAPI.onTask?.(task => view.setTask(task));
  } else {
    window.__demo = view; // opened in a plain browser: drive it from the console
  }
</script>
</body>
</html>
