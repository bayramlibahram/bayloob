<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Bayloob workspace</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  :root {
    --glass: rgba(17, 16, 22, 0.97);
    --raised: rgb(var(--ink) / 0.04);
    --line: rgb(var(--ink) / 0.08);
    --text: #f2f2f5;
    --muted: #8b8b96;
    --idle: #8b8b96;
    --thinking: #6aa8ff;
    --working: #ffb547;
    --waiting: #ff5d6c;
    --done: #4fd59a;
    --brand: #8b5cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: transparent; height: 100%; overflow: hidden;
    font: 500 13px/1.4 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif; color: var(--text);
    -webkit-font-smoothing: antialiased; user-select: none; }
  button, input { font: inherit; color: inherit; border: 0; background: none; outline: none; }
  button { cursor: pointer; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg:not(.i) { width: 16px; height: 16px; fill: currentColor; flex: none; } /* ICON_TERM from ui-common.js */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--ink) / .12); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  .panel { margin: 10px; border-radius: 18px; background: var(--glass); border: 1px solid var(--line);
    box-shadow: 0 18px 50px rgb(var(--shade) / calc(.5 * var(--shade-k))); overflow: hidden; animation: drop .2s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes drop { from { opacity: 0; transform: translateY(-8px); } }

  .thumb { position: relative; width: 100%; height: 100%; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ic { flex: none; display: grid; place-items: center; }
  .ic > img { width: 100%; height: 100%; object-fit: contain; }
  .ic.glyph { border-radius: 10px; background: var(--raised); border: 1px solid var(--line); color: var(--muted); }
  .ic.glyph svg { width: 55%; height: 55%; }
  .ic.agent { filter: drop-shadow(0 2px 6px rgb(var(--shade) / calc(.45 * var(--shade-k)))); }

  /* header */
  .head { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .head .ic { width: 38px; height: 38px; }
  .head .brand { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
  .head .sep { width: 1px; height: 22px; background: var(--line); }
  .head .sub { color: var(--muted); }
  .status { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--idle)); flex: none; }
  .status .dot { box-shadow: 0 0 8px var(--c); }
  .square { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: var(--muted);
    border: 1px solid var(--line); background: var(--raised); transition: color .15s, background .15s; flex: none; }
  .square:hover { color: var(--text); background: rgb(var(--ink) / .09); }

  /* layout */
  .main { display: grid; grid-template-columns: 196px 1fr 360px; height: 470px; }
  .side { padding: 12px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 3px; }
  .nav { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--soft); text-align: left; transition: background .12s; }
  .nav:hover { background: rgb(var(--ink) / .04); }
  .nav.on { background: rgba(139,92,255,.14); color: var(--text); }
  .nav span { flex: 1; }
  .nav em { font-style: normal; font-size: 11px; color: var(--muted); }

  .main > * { min-height: 0; } /* let the columns scroll instead of growing past the panel */
  .listcol { display: flex; flex-direction: column; min-width: 0; padding: 12px 10px 10px; }
  .listhead { display: flex; align-items: center; gap: 12px; padding: 0 6px 10px; }
  .listhead h2 { font-size: 15px; font-weight: 650; flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; width: 210px; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); color: var(--muted); }
  .search input { flex: 1; min-width: 0; color: var(--text); }
  .search input::placeholder { color: var(--muted); }
  .rows { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: background .12s; }
  .row:hover { background: rgb(var(--ink) / .03); }
  .row.sel { background: rgba(139,92,255,.09); border-color: rgba(139,92,255,.22); }
  .row .ic { width: 38px; height: 38px; }
  .row .who { flex: 1; min-width: 0; }
  .row .who b { display: block; font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .who span { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .state { display: flex; align-items: center; gap: 7px; width: 118px; font-size: 12.5px; color: var(--c); flex: none; }
  .row .square { width: 30px; height: 30px; }
  .clash { flex: none; font-style: normal; font-size: 15px; color: var(--working); }
  .clash.conflict { color: var(--waiting); }
  .clashbox { display: grid; gap: 3px; margin-bottom: 10px; padding: 9px 11px; border-radius: 11px; font-size: 12.5px;
    color: var(--working); background: color-mix(in srgb, var(--working) 9%, transparent);
    border: 1px solid color-mix(in srgb, var(--working) 30%, transparent); }
  .clashbox.conflict { color: var(--waiting); background: color-mix(in srgb, var(--waiting) 9%, transparent);
    border-color: color-mix(in srgb, var(--waiting) 35%, transparent); }
  .clashbox small { color: var(--muted); font-size: 11.5px; }
  .kebab { width: 24px; height: 30px; border-radius: 8px; color: var(--muted); display: grid; place-items: center; flex: none; }
  .kebab:hover { color: var(--text); background: rgb(var(--ink) / .07); }
  .empty { color: var(--muted); padding: 30px 10px; text-align: center; line-height: 1.6; }

  /* detail */
  .detailcol { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); }
  .detail { flex: 1; min-height: 0; padding: 16px 18px; overflow-y: auto; }
  /* prompt boxes: to the selected agent (under its details) and "Ask Bayloob" for a new session (above the footer).
     They sit outside the parts that re-render on every event, so typing is never lost. */
  .say { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--line); }
  .say[hidden], .askpick[hidden] { display: none; }
  .box { display: flex; align-items: flex-end; gap: 8px; padding: 8px 8px 8px 12px; border-radius: 12px;
    background: rgb(var(--ink) / .05); border: 1px solid var(--line); transition: border-color .15s; }
  .box:focus-within { border-color: rgba(139,92,255,.55); }
  .box textarea, .box input { flex: 1; min-width: 0; resize: none; border: 0; outline: 0; background: none; color: var(--text);
    font: inherit; line-height: 1.4; max-height: 120px; }
  .box textarea::placeholder, .box input::placeholder { color: var(--muted); }
  .send { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: var(--brand); color: #fff; }
  .send:disabled { opacity: .35; cursor: default; }
  .send .i { width: 16px; height: 16px; }
  .say .hint, .ask .hint { font-size: 11.5px; color: var(--muted); min-height: 15px; }
  .say .hint.ok, .ask .hint.ok { color: var(--done); }
  .say .hint.err, .ask .hint.err { color: var(--waiting); }
  /* confirm strip: what is about to happen, before it happens (Enter confirms, Esc / Edit goes back) */
  /* "an agent just finished": reply from here, no terminal needed */
  .finished { display: flex; align-items: center; gap: 12px; margin: 10px 16px 0; padding: 10px 10px 10px 12px; border-radius: 14px;
    background: linear-gradient(90deg, rgba(79,213,154,.13), rgba(79,213,154,.04)); border: 1px solid rgba(79,213,154,.35);
    animation: cin .2s ease-out; }
  .finished[hidden] { display: none; }
  .finished .ic { width: 30px; height: 30px; flex: none; }
  .finished .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .finished .txt .fhead { color: var(--text); }
  .finished .txt b { font-weight: 700; }
  .finished .txt span { color: var(--muted); font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .finished .more { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .finished .btn.on { background: var(--done); color: var(--on-done); border-color: transparent; }
  .finished .x { width: 28px; height: 28px; border-radius: 8px; color: var(--muted); }
  .finished .x:hover { background: rgb(var(--ink) / .08); color: var(--text); }
  .confirm { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 8px 8px 12px; border-radius: 12px;
    background: rgba(139,92,255,.09); border: 1px solid rgba(139,92,255,.35); animation: cin .15s ease-out; }
  .confirm[hidden] { display: none; }
  @keyframes cin { from { opacity: 0; transform: translateY(-3px); } }
  .confirm .q { flex: 1; min-width: 0; color: var(--soft, var(--soft)); font-size: 12.5px; overflow-wrap: anywhere; }
  .confirm .q b { color: var(--text); }
  .confirm code { font: 12px ui-monospace, monospace; color: var(--text); }
  .confirm .badge { padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .confirm .badge.now { color: var(--done); background: rgba(79,213,154,.12); }
  .confirm .badge.queue { color: var(--working); background: rgba(255,181,71,.12); }
  .confirm .btn { padding: 6px 12px; }
  .confirm .btn.on[type=submit] { background: var(--brand); border-color: transparent; color: #fff; }
  .confirm .btn.on[type=submit]:hover { filter: brightness(1.1); background: var(--brand); }
  /* the agent column is narrow: the sentence gets its own line, the badge and buttons go under it */
  .say .confirm .q { flex: 1 0 100%; }
  .say .confirm .badge { margin-right: auto; }
  .ask { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .ask .box { align-items: center; }
  .ask .spark { color: var(--brand-soft); font-size: 15px; }
  .askpick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pick { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--line); background: var(--raised); color: var(--soft); }
  .pick .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .pick.on { border-color: rgba(139,92,255,.6); background: rgba(139,92,255,.18); color: var(--text); }
  .pick:disabled { opacity: .4; cursor: default; }
  .askpick .where { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; }
  .askpick .where input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit;
    border-bottom: 1px dashed var(--line); padding: 2px 0; }
  .dhead { display: flex; align-items: center; gap: 12px; }
  .dhead .ic { width: 50px; height: 50px; }
  .dhead .who { flex: 1; min-width: 0; }
  .dhead b { display: block; font-size: 17px; font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dhead span { color: var(--muted); font-size: 12.5px; }
  .dhead .state { width: auto; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .tile { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-size: 12.5px; white-space: nowrap; overflow: hidden; }
  h3 { font-size: 13px; font-weight: 600; color: var(--soft); margin: 16px 0 8px; }
  .items { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-size: 12.5px; }
  .item + .item { border-top: 1px solid var(--line); }
  .item.click { cursor: pointer; } .item.click:hover { background: rgb(var(--ink) / .04); }
  .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  .item .mini { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; color: var(--muted); }
  .item .mini:hover { color: var(--text); background: rgb(var(--ink) / .08); }
  .buttons { display: flex; gap: 8px; margin-top: 12px; }
  .wide { flex: 1; display: flex; align-items: center; justify-content: center; gap: 9px; padding: 9px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--raised); font-weight: 600; transition: background .15s; }
  .wide:hover { background: rgb(var(--ink) / .08); }
  .wide:disabled { opacity: .4; cursor: default; }
  .note { margin-top: 12px; padding: 9px 11px; border-radius: 10px; background: rgba(255,181,71,.08); border: 1px solid rgba(255,181,71,.2); color: var(--note-text); font-size: 12px; }
  .doing { padding: 12px 0; border-bottom: 1px solid var(--line); margin-top: 12px; border-top: 1px solid var(--line); }
  .doing b { display: block; font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .doing span { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timeline { list-style: none; padding: 8px 0 0; }
  .timeline li { position: relative; display: flex; align-items: baseline; gap: 10px; padding: 5px 0 5px 22px; font-size: 12.5px; }
  .timeline li::before { content: ''; position: absolute; left: 3px; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 6px rgba(139,92,255,.6); }
  .timeline li.now::before { background: transparent; border: 1.5px solid var(--brand); box-shadow: none; }
  .timeline li + li::after { content: ''; position: absolute; left: 7px; top: -9px; height: 16px; border-left: 1px solid rgb(var(--ink) / .14); }
  .timeline.plain li::before { background: none; border: 1.5px solid var(--muted); box-shadow: none; }
  .timeline.plain li + li::after { display: none; }
  .timeline .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ago { color: var(--muted); font-size: 11.5px; white-space: nowrap; }

  /* footer */
  .foot { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .btn { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--raised); font-weight: 600; transition: background .15s; }
  .btn:hover { background: rgb(var(--ink) / .08); }
  .btn.on { background: rgba(139,92,255,.16); border-color: rgba(139,92,255,.3); }
  .btn:disabled { opacity: .4; cursor: default; }
  .meters { flex: 1; display: flex; justify-content: center; align-items: center; gap: 16px; color: var(--muted); font-size: 12.5px; }
  .meters b { color: var(--text); font-weight: 600; margin-left: 4px; }
  .meters .sep { width: 1px; height: 16px; background: var(--line); }
  .meter { display: flex; align-items: center; gap: 7px; }
  .flash { color: var(--note-text); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="panel" id="panel">
    <header class="head">
      <div class="ic agent" id="managerMascot"></div>
      <span class="brand">bayloob</span><span class="sep"></span><span class="sub">Workspace control</span>
      <div class="status" id="status"></div>
      <button type="button" class="square" id="settings" title="Settings">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </header>

    <div class="finished" id="finished" hidden></div>

    <div class="main">
      <nav class="side" id="side"></nav>
      <section class="listcol">
        <div class="listhead">
          <h2 id="listTitle">Running apps</h2>
          <div class="search">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" aria-label="Search" placeholder="Search apps…" spellcheck="false">
          </div>
        </div>
        <div class="rows" id="rows"></div>
      </section>
      <div class="detailcol">
        <section class="detail" id="detail"></section>
        <form class="say" id="say" hidden autocomplete="off">
          <div class="box"><textarea id="sayText" rows="1" spellcheck="false"></textarea>
            <button type="submit" class="send" id="saySend" title="Send (Enter)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
          <div class="confirm" id="sayConfirm" hidden></div>
          <div class="hint" id="sayHint"></div>
        </form>
      </div>
    </div>

    <form class="ask" id="ask" autocomplete="off">
      <div class="box"><span class="spark">✦</span><input id="askText" spellcheck="false" placeholder="Ask Bayloob — what should be done?">
        <button type="submit" class="send" id="askSend" title="Next (Enter)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>
      <div class="askpick" id="askPick" hidden></div>
      <div class="confirm" id="askConfirm" hidden></div>
      <div class="hint" id="askHint" hidden></div>
    </form>

    <footer class="foot">
      <button type="button" class="btn" id="launch">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Launch app
      </button>
      <div class="meters" id="meters"></div>
      <button type="button" class="btn" id="openWorkspace">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg> Open workspace
      </button>
    </footer>
  </div>

<script src="../shared/ui-common.js"></script>
<script>
  // Every string of the panel — a language switcher later only needs to swap this object
  const T = {
    sayTo: (agent, project) => `Prompt to ${agent} · ${project}…`,
    sayHint: 'Enter sends · Shift+Enter new line', sayBusy: 'Busy — Enter adds it to the queue',
    confirmSend: (agent, project) => `Send to <b>${agent}</b> · ${project}`, now: 'now', toQueue: 'to the queue',
    confirmLaunch: (agent, cwd) => `Launch <b>${agent}</b> in <code>${cwd}</code>`, inWorktree: '⑂ new worktree',
    edit: 'Edit', sendBtn: '✓ Send', queueBtn: '✓ Add to queue', launchBtn: '✓ Launch', confirmHint: 'Enter confirms · Esc goes back',
    taskDone: 'Task completed.',
    finishedIn: (agent, project) => `<span class="fhead"><b>${agent}</b> finished · ${project}</span>`, finishedMore: n => `+${n} more`,
    reply: 'Reply', dismissTip: 'Dismiss',
    sent: 'Sent ✓', queued: 'Queued ⏳ — goes out when the agent finishes its turn',
    askHint: 'Pick an agent and folder · Enter starts', startAgent: 'Start', worktree: '⑂ New worktree',
    notInstalled: 'not installed', folder: 'Folder', starting: 'Starting…', started: 'Started ✓', pickFolder: 'Choose a project folder',
    clashConflict: (who, files) => `Editing the same files as ${who}: ${files}`,
    clashShared: who => `Working in the same folder as ${who}; uncommitted changes can break each other's tests`,
    clashFix: 'Fix: ⋮ → "Move new work to a worktree…"',
    connected: 'Connected', noEvents: 'Waiting for agents', noHooks: 'Hooks not installed',
    connectedTip: at => at ? `Hooks installed · last event ${timeAgo(at)}` : 'Hooks installed · no events yet',
    noHooksTip: 'Open Settings to install the Claude Code hooks',
    sections: { overview: 'Overview', agents: 'AI agents', browsers: 'Browsers', ides: 'IDEs', applications: 'Applications', system: 'System tools' },
    listTitle: { overview: 'Running apps', agents: 'AI agents', browsers: 'Browsers', ides: 'IDEs', applications: 'Applications', system: 'System tools' },
    launchTitle: 'Launch app', searchApps: 'Search apps…', searchInstalled: 'Search installed apps…',
    status: { active: 'Active', running: 'Running', healthy: 'Healthy', unhealthy: 'Unhealthy', stopped: 'Stopped',
      idle: 'Idle', thinking: 'Thinking', working: 'Working', waiting: 'Needs approval', done: 'Done' },
    kind: { browser: 'Browser', ide: 'IDE', terminal: 'Terminal', files: 'Files', app: 'Application', system: 'System tool', agent: 'AI agent' },
    empty: 'Nothing here right now.', noMatch: q => `No apps match “${q}”.`,
    loading: 'Looking at what’s running…',
    windows: 'Windows', projects: 'Projects', containers: 'Containers', recent: 'Recent activity', nothingYet: 'Nothing yet',
    focus: 'Focus window', newTab: 'New tab', newWindow: 'New window', openTerminal: 'Open terminal', more: 'More actions', open: 'Open',
    tabs: n => `${n} tab${n === 1 ? '' : 's'}`, wins: n => `${n} window${n === 1 ? '' : 's'}`, sessions: n => `${n} session${n === 1 ? '' : 's'}`,
    unhealthyN: n => `${n} unhealthy`, allHealthy: 'All healthy',
    needsExtension: 'Enable the Bayloob GNOME extension in Settings to see and focus this app’s windows.',
    start: 'Start', stop: 'Stop', restart: 'Restart', launched: name => `Launching ${name}…`,
    waited: 'Agents waited', waitedTip: 'Today, agents spent this long waiting on your permission and question cards (screen-locked time not counted)',
    cpu: 'CPU', memory: 'Memory', metersTip: 'Apps in this view and the processes they started',
  };
  const STATUS_COLOR = { active: 'var(--done)', running: 'var(--thinking)', healthy: 'var(--done)', unhealthy: 'var(--waiting)', stopped: 'var(--idle)',
    idle: 'var(--idle)', thinking: 'var(--thinking)', working: 'var(--working)', waiting: 'var(--waiting)', done: 'var(--done)' };
  const HEALTH_COLOR = { healthy: 'var(--done)', running: 'var(--thinking)', starting: 'var(--working)', unhealthy: 'var(--waiting)' };
  const PRIORITY = { waiting: 5, working: 4, thinking: 3, done: 2, idle: 1 };
  const FINISHED_RECENT_MS = 10 * 60 * 1000;
  const BUSY = new Set(['thinking', 'working', 'waiting']); // a prompt sent now is queued for the end of the turn
  const tilde = (p, home) => home && p.startsWith(home) ? `~${p.slice(home.length)}` : p;
  const FOLDER = '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';
  const ACTIVE = new Set(['thinking', 'working', 'waiting']);
  const SECTION_OF = { browser: 'browsers', ide: 'ides', terminal: 'applications', files: 'applications', app: 'applications', system: 'system' };
  const I = (d, extra = '') => `<svg class="i" viewBox="0 0 24 24"${extra}>${d}</svg>`;
  const ICONS = {
    overview: I('<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/>'),
    agents: I('<circle cx="12" cy="10" r="6"/><path d="M9 10h.01M15 10h.01M8 20c1.2-1.5 2.5-2 4-2s2.8.5 4 2"/>'),
    browsers: I('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3Z"/>'),
    ides: I('<path d="m8 8-4 4 4 4M16 8l4 4-4 4"/>'),
    applications: I('<rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/>'),
    system: I('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'),
    app: I('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>'),
    box: I('<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5Z"/><path d="m3 7.5 9 4.5 9-4.5M12 12v9"/>'),
    chevron: I('<path d="m9 6 6 6-6 6"/>'),
    dots: I('<circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>'),
    cpu: I('<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>'),
    mem: I('<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>'),
    tab: I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v4"/>'),
    win: I('<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M5 7h14"/>'),
    clock: I('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
    plus: I('<path d="M12 5v14M5 12h14"/>'),
    play: I('<path d="M7 4v16l13-8Z"/>'), stop: I('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
    restart: I('<path d="M4 4v6h6"/><path d="M20 12a8 8 0 0 1-13.7 5.7M4 10a8 8 0 0 1 14.5-3.5"/>'),
    focus: I('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 12h8M12 8v8"/>'),
    check: I('<path d="m5 12 4.5 4.5L19 7"/>'),
  };

  const projectPath = s => {
    const parts = String(s.cwd || '').split('/').filter(Boolean);
    return parts.length >= 2 ? parts.slice(-2).join(' / ') : (s.project || '');
  };
  const stateHtml = status => `<span class="state" style="--c:${STATUS_COLOR[status] || 'var(--idle)'}"><span class="dot"></span>${T.status[status] || status}</span>`;
  const pct = v => v == null ? '—' : `${Math.round(v)}%`;

  /** One row's data, whatever it is: an installed app, Docker, or an agent session. */
  function appItem(a) {
    return { key: `app:${a.id}`, kind: a.id === 'docker' ? 'docker' : 'app', id: a.id, name: a.name, subtitle: a.subtitle,
      status: a.status, category: a.category, data: a };
  }
  function agentItem(s) {
    return { key: `agent:${s.id}`, kind: 'agent', id: s.id, name: Agent.displayName(s.agent), subtitle: projectPath(s),
      status: s.state, category: 'agent', data: s };
  }
  function iconHtml(item, size = '') {
    if (item.kind === 'agent') { return `<div class="ic agent ${size}">${Agent.thumb(item.data.agent)}</div>`; }
    if (item.data?.icon) { return `<div class="ic ${size}"><img src="${item.data.icon}" alt=""></div>`; }
    return `<div class="ic glyph ${size}">${item.kind === 'docker' ? ICONS.box : ICONS.app}</div>`;
  }

  /** The workspace control panel: sections on the left, the section's list, and the selected item's details. */
  class PanelView {
    sessions = [];
    apps = null;           // null until the first workspace snapshot arrives
    extension = false;
    stats = null;
    status = null;
    section = 'overview';
    selected = null;       // item key
    query = '';
    launchMode = false;    // the list shows installed apps to launch
    launchable = null;
    #flashTimer = null;
    #sayTimer = null;
    #prevStates = new Map(); // session id -> state at the previous update
    finished = [];         // ids of agents that just finished, newest first (the banner shows the first)
    sayFor = null;         // session the prompt box is for (its text is cleared when the selection changes)

    constructor(api) {
      this.api = api;
      const $ = id => document.getElementById(id);
      this.el = { panel: $('panel'), mascot: $('managerMascot'), status: $('status'), side: $('side'), listTitle: $('listTitle'),
        search: $('search'), rows: $('rows'), detail: $('detail'), meters: $('meters'), launch: $('launch'),
        openWorkspace: $('openWorkspace'), settings: $('settings'), say: $('say'), sayText: $('sayText'),
        saySend: $('saySend'), sayHint: $('sayHint'), ask: $('ask'), askText: $('askText'), askPick: $('askPick'), askHint: $('askHint'),
        sayConfirm: $('sayConfirm'), askConfirm: $('askConfirm'), finished: $('finished') };
      this.el.mascot.innerHTML = Agent.thumb(MANAGER);
      this.#bind();
      setInterval(() => this.#renderDetail(), 30_000); // keep "2m ago" fresh
    }

    // ---------- data in ----------

    show(state) {
      this.sessions = state.sessions || [];
      this.#prevStates = new Map(this.sessions.map(s => [s.id, s.state]));
      // Opened after an agent finished: still offer the reply for turns that ended in the last few minutes
      this.finished = this.sessions
        .filter(s => s.state === 'done' && s.term?.tmux && Date.now() - s.updatedAt < FINISHED_RECENT_MS)
        .sort((a, b) => b.updatedAt - a.updatedAt).map(s => s.id);
      this.collisions = state.collisions || {};
      this.status = state.status || null;
      this.launchMode = false;
      this.query = '';
      this.el.search.value = '';
      this.render();
      this.api?.resize(Math.ceil(this.el.panel.getBoundingClientRect().height) + 20);
    }
    setSessions(list) {
      // Agents that just finished their turn, newest first, until replied to or dismissed
      for (const s of list) {
        const old = this.#prevStates.get(s.id);
        if (s.state === 'done' && old && old !== 'done' && s.term?.tmux) {
          this.finished = [s.id, ...this.finished.filter(id => id !== s.id)];
        }
      }
      this.#prevStates = new Map(list.map(s => [s.id, s.state]));
      this.finished = this.finished.filter(id => list.some(s => s.id === id && s.state === 'done'));
      this.sessions = list;
      this.render();
    }

    #renderFinished() {
      const s = this.sessions.find(x => x.id === this.finished[0]);
      const box = this.el.finished;
      const was = !box.hidden;
      box.hidden = !s;
      if (s) {
        const more = this.finished.length - 1;
        box.innerHTML = `<div class="ic agent">${Agent.thumb(s.agent)}</div>
          <div class="txt">${T.finishedIn(esc(Agent.displayName(s.agent)), esc(s.project))}<span title="${esc(s.summary || '')}">${esc(s.summary || T.taskDone)}</span></div>
          ${more > 0 ? `<span class="more">${T.finishedMore(more)}</span>` : ''}
          <button type="button" class="btn on" data-reply="${esc(s.id)}">${T.reply}</button>
          <button type="button" class="x" data-dismiss="${esc(s.id)}" title="${T.dismissTip}" aria-label="${T.dismissTip}">✕</button>`;
      }
      if (was !== !box.hidden) { this.#fit(); }
    }

    // Reply: select that agent and put the cursor in its prompt box
    #replyTo(id) {
      this.finished = this.finished.filter(x => x !== id);
      this.launchMode = false;
      this.query = '';
      this.el.search.value = '';
      if (this.section !== 'agents' && this.section !== 'overview') { this.section = 'agents'; }
      this.selected = `agent:${id}`;
      this.render();
      this.el.sayText.focus();
    }
    setWorkspace(snap) { this.apps = snap.apps; this.extension = snap.extension; this.render(); }
    setBlocked(info) { this.blocked = info; this.#renderMeters(); }
    setCollisions(map) { this.collisions = map || {}; this.render(); }
    setStats(stats) { this.stats = stats; this.#renderMeters(); }
    setStatus(status) { this.status = status; this.#renderStatus(); }

    // ---------- model ----------

    #items(section = this.section) {
      const agents = [...this.sessions].sort((a, b) => PRIORITY[b.state] - PRIORITY[a.state] || b.updatedAt - a.updatedAt).map(agentItem);
      const apps = (this.apps || []).map(appItem);
      if (section === 'agents') { return agents; }
      if (section === 'overview') { return [...apps, ...agents]; }
      return apps.filter(i => SECTION_OF[i.category] === section);
    }

    #visible() {
      const q = this.query.trim().toLowerCase();
      return this.#items().filter(i => !q || `${i.name} ${i.subtitle}`.toLowerCase().includes(q));
    }

    get current() {
      const items = this.#visible();
      return items.find(i => i.key === this.selected) || items[0] || null;
    }

    // ---------- render ----------

    render() {
      this.#renderStatus();
      this.#renderSide();
      this.#renderList();
      this.#renderDetail();
      this.#renderMeters();
      this.#renderSay();
      this.#renderFinished();
      this.el.openWorkspace.disabled = !(this.current?.kind === 'agent' && this.current.data.cwd);
    }

    #renderStatus() {
      const st = this.status;
      const [label, color, tip] = !st?.hooks ? [T.noHooks, 'var(--waiting)', T.noHooksTip]
        : st.lastEventAt ? [T.connected, 'var(--done)', T.connectedTip(st.lastEventAt)]
        : [T.noEvents, 'var(--working)', T.connectedTip(null)];
      this.el.status.style.setProperty('--c', color);
      this.el.status.title = tip;
      this.el.status.innerHTML = `<span class="dot"></span>${label}`;
    }

    #renderSide() {
      this.el.side.innerHTML = Object.entries(T.sections).map(([key, label]) => {
        const n = this.#items(key).length;
        return `<button class="nav${key === this.section && !this.launchMode ? ' on' : ''}" data-section="${key}">${ICONS[key]}<span>${label}</span>${n ? `<em>${n}</em>` : ''}</button>`;
      }).join('');
    }

    #renderList() {
      this.el.listTitle.textContent = this.launchMode ? T.launchTitle : T.listTitle[this.section];
      this.el.search.placeholder = this.launchMode ? T.searchInstalled : T.searchApps;
      this.el.launch.classList.toggle('on', this.launchMode);
      if (this.launchMode) { return this.#renderLaunchable(); }
      if (this.apps === null && this.section !== 'agents') { this.el.rows.innerHTML = `<div class="empty">${T.loading}</div>`; return; }
      const items = this.#visible();
      if (!items.length) { this.el.rows.innerHTML = `<div class="empty">${this.query ? T.noMatch(esc(this.query)) : T.empty}</div>`; return; }
      const sel = this.current?.key;
      this.el.rows.innerHTML = items.map(i => `
        <div class="row${i.key === sel ? ' sel' : ''}" data-key="${esc(i.key)}">
          ${iconHtml(i)}
          <div class="who"><b>${esc(i.name)}</b><span>${esc(i.subtitle || '')}</span></div>
          ${i.kind === 'agent' ? this.#clashBadge(i.data) : ''}
          ${stateHtml(i.status)}
          <button class="square" data-act="primary" title="${i.kind === 'agent' ? T.openTerminal : T.focus}">${i.kind === 'agent' ? ICON_TERM : ICONS.chevron}</button>
          <button class="kebab" data-act="menu" title="${T.more}"${i.kind === 'docker' ? ' style="visibility:hidden"' : ''}>${ICONS.dots}</button>
        </div>`).join('');
    }

    // ⚠ next to an agent that shares its working tree with another busy agent (red: they edited the same file)
    #clashBadge(s) {
      const c = this.collisions?.[s.id];
      if (!c) { return ''; }
      return `<i class="clash ${c.level}" title="${esc(this.#clashText(c))}">⚠</i>`;
    }

    #clashText(c) {
      const others = c.with.map(id => this.sessions.find(x => x.id === id)).filter(Boolean)
        .map(x => `${Agent.displayName(x.agent)} (${x.project})`).join(', ');
      const files = c.files.map(f => f.split('/').pop());
      return c.level === 'conflict'
        ? T.clashConflict(others, files.slice(0, 3).join(', ') + (files.length > 3 ? ` +${files.length - 3}` : ''))
        : T.clashShared(others);
    }

    #renderLaunchable() {
      if (!this.launchable) { this.el.rows.innerHTML = `<div class="empty">${T.loading}</div>`; return; }
      const q = this.query.trim().toLowerCase();
      const list = this.launchable.filter(a => !q || a.name.toLowerCase().includes(q)).slice(0, 80);
      if (!list.length) { this.el.rows.innerHTML = `<div class="empty">${T.noMatch(esc(this.query))}</div>`; return; }
      this.el.rows.innerHTML = list.map(a => `
        <div class="row" data-launch="${esc(a.id)}">
          ${iconHtml({ kind: 'app', data: a })}
          <div class="who"><b>${esc(a.name)}</b><span>${T.kind[a.category] || ''}</span></div>
          <button class="square" data-act="launch" title="${T.open}">${ICONS.chevron}</button>
        </div>`).join('');
    }

    #renderDetail() {
      const item = this.launchMode ? null : this.current;
      if (!item) { this.el.detail.innerHTML = ''; return; }
      const head = `<div class="dhead">${iconHtml(item)}<div class="who"><b>${esc(item.name)}</b><span>${T.kind[item.category] || ''}</span></div>${stateHtml(item.status)}</div>`;
      const body = item.kind === 'agent' ? this.#agentDetail(item.data) : item.kind === 'docker' ? this.#dockerDetail(item.data) : this.#appDetail(item.data);
      this.el.detail.innerHTML = head + body;
    }

    #history(list) {
      if (!list?.length) { return `<div class="empty" style="padding:10px 0;text-align:left">${T.nothingYet}</div>`; }
      return `<ul class="timeline plain">${list.slice(0, 6).map(h => `<li><span class="t" title="${esc(h.title)}">${esc(h.title)}</span><span class="ago">${timeAgo(h.at)}</span></li>`).join('')}</ul>`;
    }

    #appDetail(a) {
      const d = a.details || {};
      const tiles = a.category === 'browser' && d.tabs !== undefined
        ? [[ICONS.tab, T.tabs(d.tabs)], [ICONS.win, T.wins(d.browserWindows.length)], [ICONS.cpu, formatBytes(a.memory)]]
        : a.category === 'terminal' && d.sessions
          ? [[ICONS.tab, T.sessions(d.sessions)], [ICONS.win, T.wins(a.windows.length)], [ICONS.cpu, formatBytes(a.memory)]]
          : [[ICONS.win, T.wins(a.windows.length)], [ICONS.mem, formatBytes(a.memory)], [ICONS.cpu, pct(a.cpu)]];

      // Browser windows come from its session (with tab counts); others from the GNOME extension
      let windows = '';
      if (a.category === 'browser' && d.browserWindows?.length) {
        windows = d.browserWindows.map(bw => {
          const gw = a.windows.find(w => w.title.startsWith(bw.title));
          return `<div class="item${gw ? ' click' : ''}"${gw ? ` data-window="${esc(gw.id)}"` : ''}>${ICONS.tab}<span class="t">${esc(bw.title)}</span><span class="m">${T.tabs(bw.tabs)}</span></div>`;
        }).join('');
      } else if (a.windows.length) {
        windows = a.windows.map(w => `<div class="item click" data-window="${esc(w.id)}">${ICONS.win}<span class="t">${esc(w.title)}</span>${w.focused ? '<span class="m">focused</span>' : ''}</div>`).join('');
      }
      const projects = d.projects?.length
        ? `<h3>${T.projects}</h3><div class="items">${d.projects.map(p => `<div class="item">${ICONS.ides}<span class="t">${esc(p)}</span></div>`).join('')}</div>` : '';
      const second = a.category === 'browser'
        ? `<button class="wide" data-act="newtab">${ICONS.plus}${T.newTab}</button>`
        : `<button class="wide" data-act="newwindow">${ICONS.plus}${T.newWindow}</button>`;
      return `
        <div class="tiles">${tiles.map(([ic, txt]) => `<div class="tile">${ic}${esc(txt)}</div>`).join('')}</div>
        ${projects}
        ${windows ? `<h3>${T.windows}</h3><div class="items">${windows}</div>` : ''}
        ${!this.extension ? `<div class="note">${T.needsExtension}</div>` : ''}
        <div class="buttons">
          <button class="wide" data-act="focus"${a.windows.length ? '' : ' disabled'}>${ICONS.focus}${T.focus}</button>
          ${second}
        </div>
        <h3>${T.recent}</h3>${this.#history(a.history)}`;
    }

    #dockerDetail(a) {
      const cs = a.details.containers;
      const running = cs.filter(c => c.state === 'running').length;
      const unhealthy = cs.filter(c => c.health === 'unhealthy').length;
      const rows = cs.map(c => {
        const on = c.state === 'running';
        const actions = on
          ? `<button class="mini" data-docker="restart" data-id="${esc(c.id)}" title="${T.restart}">${ICONS.restart}</button><button class="mini" data-docker="stop" data-id="${esc(c.id)}" title="${T.stop}">${ICONS.stop}</button>`
          : `<button class="mini" data-docker="start" data-id="${esc(c.id)}" title="${T.start}">${ICONS.play}</button>`;
        return `<div class="item"><span class="dot" style="--c:${HEALTH_COLOR[c.health] || 'var(--idle)'}" title="${esc(c.status)}"></span><span class="t" title="${esc(c.image)}">${esc(c.name)}</span><span class="m">${esc(c.health)}</span>${actions}</div>`;
      }).join('');
      return `
        <div class="tiles">
          <div class="tile">${ICONS.box}${cs.length} total</div>
          <div class="tile">${ICONS.play}${running} running</div>
          <div class="tile">${unhealthy ? ICONS.restart : ICONS.check}${unhealthy ? T.unhealthyN(unhealthy) : T.allHealthy}</div>
        </div>
        <h3>${T.containers}</h3><div class="items">${rows}</div>
        <h3>${T.recent}</h3>${this.#history(a.history)}`;
    }

    #agentDetail(s) {
      const doing = s.activity || { title: T.nothingYet, detail: '' };
      const live = ACTIVE.has(s.state);
      const history = (s.history || []).slice(0, 6);
      return `
        ${this.collisions?.[s.id] ? `<div class="clashbox ${this.collisions[s.id].level}">⚠ ${esc(this.#clashText(this.collisions[s.id]))}<small>${T.clashFix}</small></div>` : ''}
        <div class="doing"><b title="${esc(doing.title)}">${esc(doing.title)}</b><span title="${esc(doing.detail)}">${esc(doing.detail || projectPath(s))}</span></div>
        <ul class="timeline">${history.map((h, i) => `<li class="${i === 0 && live ? 'now' : ''}"><span class="t" title="${esc(h.detail || h.title)}">${esc(h.title)}</span><span class="ago">${timeAgo(h.at)}</span></li>`).join('')}</ul>
        <div class="buttons"><button class="wide" data-act="terminal">${ICON_TERM}${T.openTerminal}</button></div>`;
    }

    #renderMeters() {
      let cpu = null, memory = null;
      if (this.section === 'agents' && !this.launchMode) { ({ cpu, memory } = this.stats || {}); }
      else {
        for (const i of this.#items()) {
          if (i.kind !== 'app') { continue; }
          if (i.data.cpu != null) { cpu = (cpu || 0) + i.data.cpu; }
          if (i.data.memory != null) { memory = (memory || 0) + i.data.memory; }
        }
      }
      this.el.meters.title = T.metersTip;
      const waited = this.blocked?.today
        ? `<span class="sep"></span><span class="meter" title="${T.waitedTip}">${ICONS.clock}${T.waited}<b>${formatWait(this.blocked.today)}</b></span>`
        : '';
      this.el.meters.innerHTML = `<span class="meter">${ICONS.cpu}${T.cpu}<b>${pct(cpu)}</b></span><span class="sep"></span><span class="meter">${ICONS.mem}${T.memory}<b>${memory == null ? '—' : formatBytes(memory)}</b></span>${waited}`;
    }

    #flash(text) {
      clearTimeout(this.#flashTimer);
      this.el.meters.innerHTML = `<span class="flash">${esc(text)}</span>`;
      this.#flashTimer = setTimeout(() => this.#renderMeters(), 3500);
    }

    // ---------- actions ----------

    async #run(promise) {
      const r = await promise;
      if (r && r.ok === false && r.error) { this.#flash(r.error); }
    }

    #primary(item) {
      if (item.kind === 'agent') { return this.api?.focus(item.id); }
      if (item.kind === 'app') { return this.#run(this.api?.focusApp(item.id)); }
    }

    async #toggleLaunch() {
      this.launchMode = !this.launchMode;
      this.query = '';
      this.el.search.value = '';
      if (this.launchMode && !this.launchable) {
        this.render();
        this.launchable = await this.api?.launchable() || [];
      }
      this.render();
      this.el.search.focus();
    }

    // ---------- prompts ----------

    // The selected agent's prompt box: only for sessions running in tmux and not waiting on a permission
    #renderSay() {
      const s = !this.launchMode && this.current?.kind === 'agent' ? this.current.data : null;
      const can = !!s?.term?.tmux && !s.perm;
      this.el.say.hidden = !can;
      if (!can) { return; }
      if (this.sayFor !== s.id) {   // another session: its own empty box
        if (this.#sayConfirming) { this.#confirmSay(false); }
        this.sayFor = s.id;
        this.el.sayText.value = '';
        this.#sayHint('');
      }
      this.el.sayText.placeholder = T.sayTo(Agent.displayName(s.agent), s.project);
      if (!this.el.sayHint.dataset.kind) {
        this.el.sayHint.textContent = BUSY.has(s.state) ? T.sayBusy : T.sayHint;
      }
      this.el.saySend.disabled = !this.el.sayText.value.trim();
      if (this.#sayConfirming) { this.#renderSayConfirm(); } // busy may have changed: now vs queue
    }

    #sayHint(text, kind = '') {
      this.el.sayHint.textContent = text;
      this.el.sayHint.className = `hint ${kind}`;
      this.el.sayHint.dataset.kind = kind;
      clearTimeout(this.#sayTimer);
      if (kind) { this.#sayTimer = setTimeout(() => { this.el.sayHint.dataset.kind = ''; this.el.sayHint.className = 'hint'; this.#renderSay(); }, 3500); }
    }

    get #sayConfirming() { return !this.el.sayConfirm.hidden; }

    // First Enter shows what will happen (sent now or queued); the second one sends
    #confirmSay(on) {
      this.el.sayConfirm.hidden = !on;
      this.el.saySend.hidden = on;
      this.el.sayText.readOnly = on;
      if (on) {
        this.#renderSayConfirm();
        this.#sayHint(T.confirmHint);
        this.el.sayConfirm.querySelector('[type=submit]')?.focus();
      } else {
        this.el.sayHint.dataset.kind = '';
        this.#sayHint('');
      }
      this.#fit();
    }

    #renderSayConfirm() {
      const s = this.sessions.find(x => x.id === this.sayFor);
      if (!s) { return this.#confirmSay(false); }
      const busy = BUSY.has(s.state);
      this.el.sayConfirm.innerHTML = `<span class="q">${T.confirmSend(esc(Agent.displayName(s.agent)), esc(s.project))}</span>
        <span class="badge ${busy ? 'queue' : 'now'}">${busy ? T.toQueue : T.now}</span>
        <button type="button" class="btn" data-edit>${T.edit}</button>
        <button type="submit" class="btn on">${busy ? T.queueBtn : T.sendBtn}</button>`;
    }

    async #send() {
      const text = this.el.sayText.value.trim();
      if (!text || !this.sayFor) { return; }
      if (!this.#sayConfirming) { return this.#confirmSay(true); }
      this.#confirmSay(false);
      this.el.saySend.disabled = true;
      const res = await this.api?.sendPrompt(this.sayFor, text);
      if (res?.ok) {
        this.el.sayText.value = '';
        this.#grow(this.el.sayText);
        this.#sayHint(res.queued ? T.queued : T.sent, 'ok');
      } else {
        this.#sayHint(res?.error || 'Could not send', 'err');
      }
      this.#renderSay();
    }

    #grow(ta) { ta.style.height = 'auto'; ta.style.height = `${Math.min(ta.scrollHeight, 120)}px`; }

    // "Ask Bayloob": type what should be done, Enter, then pick the agent and folder right here
    async #askNext() {
      const text = this.el.askText.value.trim();
      if (!text) { return; }
      if (!this.el.askConfirm.hidden) { return this.#askStart(); }
      if (!this.el.askPick.hidden) { return this.#confirmAsk(true); }
      const opts = await this.api?.launchOptions();
      if (!opts) { return; }
      this.askOpts = opts;
      const sel = this.current?.kind === 'agent' ? this.current.data : null;
      const last = opts.recent?.[0];
      const installed = Object.keys(opts.agents).filter(k => opts.agents[k].installed);
      this.askAgent = [sel?.agent, last?.agent].find(a => a && opts.agents[a]?.installed) || installed[0] || null;
      this.askCwd = tilde(sel?.cwd || last?.cwd || '', opts.home);
      this.askWorktree = false;
      this.#renderAskPick();
      this.el.askPick.hidden = false;
      this.#askHint(T.askHint);
      this.#fit();
    }

    #renderAskPick() {
      const { agents } = this.askOpts;
      const chips = Object.entries(agents).map(([k, a]) => `<button type="button" class="pick${k === this.askAgent ? ' on' : ''}" data-agent="${esc(k)}"
        ${a.installed ? '' : `disabled title="${T.notInstalled}"`}><span class="dot" style="--c:${esc(a.color)}"></span>${esc(a.name)}</button>`).join('');
      this.el.askPick.innerHTML = `${chips}
        <label class="where" title="${T.pickFolder}">${FOLDER}<input id="askCwd" value="${esc(this.askCwd)}" placeholder="${T.folder}" spellcheck="false"></label>
        <button type="button" class="pick${this.askWorktree ? ' on' : ''}" data-worktree>${T.worktree}</button>
        <button type="submit" class="btn on">${T.startAgent}</button>`;
    }

    #askHint(text, kind = '') {
      this.el.askHint.hidden = !text;
      this.el.askHint.textContent = text;
      this.el.askHint.className = `hint ${kind}`;
    }

    // Between picking and launching: one line with everything that's about to start
    #confirmAsk(on) {
      if (on) {
        this.askCwd = (this.el.askPick.querySelector('#askCwd')?.value || '').trim();
        if (!this.askAgent || !this.askCwd) { return this.#askHint(T.pickFolder, 'err'); }
        const a = this.askOpts.agents[this.askAgent];
        this.el.askConfirm.innerHTML = `<span class="q">${T.confirmLaunch(esc(a?.name || this.askAgent), esc(this.askCwd))}${this.askWorktree ? ` · ${T.inWorktree}` : ''}</span>
          <button type="button" class="btn" data-edit>${T.edit}</button>
          <button type="submit" class="btn on">${T.launchBtn}</button>`;
        this.#askHint(T.confirmHint);
      } else {
        this.#renderAskPick();
        this.#askHint(T.askHint);
      }
      this.el.askPick.hidden = on;
      this.el.askConfirm.hidden = !on;
      this.el.askText.readOnly = on;
      if (on) { this.el.askConfirm.querySelector('[type=submit]')?.focus(); } else { this.el.askText.focus(); }
      this.#fit();
    }

    async #askStart() {
      const cwd = this.askCwd;
      if (!this.askAgent || !cwd) { return this.#askHint(T.pickFolder, 'err'); }
      this.#askHint(T.starting);
      const res = await this.api?.launch({ agent: this.askAgent, cwd, prompt: this.el.askText.value.trim(), worktree: this.askWorktree });
      if (res?.ok) {
        this.#askReset();
        this.#askHint(T.started, 'ok');
        setTimeout(() => { this.#askHint(''); this.#fit(); }, 2500);
      } else {
        this.#askHint(res?.error || 'Could not start the agent', 'err');
      }
    }

    #askReset() {
      this.el.askText.value = '';
      this.el.askText.readOnly = false;
      this.el.askPick.hidden = true;
      this.el.askPick.innerHTML = '';
      this.el.askConfirm.hidden = true;
      this.el.askConfirm.innerHTML = '';
      this.#askHint('');
      this.#fit();
    }

    #fit() { this.api?.resize(Math.ceil(this.el.panel.getBoundingClientRect().height) + 20); }

    #move(step) {
      const items = this.#visible();
      if (!items.length) { return; }
      const i = Math.max(0, items.findIndex(x => x.key === this.current?.key));
      this.selected = items[(i + step + items.length) % items.length].key;
      this.render();
    }

    #bind() {
      this.el.side.addEventListener('click', e => {
        const b = e.target.closest('[data-section]');
        if (!b) { return; }
        this.section = b.dataset.section;
        this.launchMode = false;
        this.selected = null;
        this.render();
      });
      this.el.rows.addEventListener('click', e => {
        const launch = e.target.closest('[data-launch]');
        if (launch) {
          const app = this.launchable.find(a => a.id === launch.dataset.launch);
          this.#flash(T.launched(app?.name || ''));
          return this.#run(this.api?.launchApp(launch.dataset.launch));
        }
        const row = e.target.closest('.row[data-key]');
        if (!row) { return; }
        this.selected = row.dataset.key;
        const item = this.current;
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'primary') { this.#primary(item); }
        if (act === 'menu') { item.kind === 'agent' ? this.api?.sessionMenu(item.id) : this.api?.appMenu(item.id); }
        this.render();
      });
      this.el.detail.addEventListener('click', e => {
        const item = this.current;
        if (!item) { return; }
        const win = e.target.closest('[data-window]');
        if (win) { return this.#run(this.api?.focusApp(item.id, win.dataset.window)); }
        const docker = e.target.closest('[data-docker]');
        if (docker) { docker.disabled = true; return this.#run(this.api?.docker(docker.dataset.docker, docker.dataset.id)); }
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'focus') { this.#run(this.api?.focusApp(item.id)); }
        if (act === 'newtab') { this.#run(this.api?.newTab(item.id)); }
        if (act === 'newwindow') { this.#run(this.api?.launchApp(item.id)); }
        if (act === 'terminal') { this.api?.focus(item.id); }
      });
      this.el.search.addEventListener('input', () => { this.query = this.el.search.value; this.selected = null; this.render(); });
      this.el.launch.addEventListener('click', () => this.#toggleLaunch());
      this.el.openWorkspace.addEventListener('click', () => this.current?.kind === 'agent' && this.api?.openWorkspace(this.current.id));
      this.el.settings.addEventListener('click', () => this.api?.openSettings());
      // Prompt to the selected agent: Enter sends, Shift+Enter is a new line
      this.el.say.addEventListener('submit', e => { e.preventDefault(); this.#send(); });
      this.el.finished.addEventListener('click', e => {
        const reply = e.target.closest('[data-reply]');
        if (reply) { return this.#replyTo(reply.dataset.reply); }
        const x = e.target.closest('[data-dismiss]');
        if (x) { this.finished = this.finished.filter(id => id !== x.dataset.dismiss); this.#renderFinished(); }
      });
      this.el.sayConfirm.addEventListener('click', e => {
        if (e.target.closest('[data-edit]')) { this.#confirmSay(false); this.el.sayText.focus(); }
      });
      this.el.askConfirm.addEventListener('click', e => {
        if (e.target.closest('[data-edit]')) { this.#confirmAsk(false); }
      });
      this.el.sayText.addEventListener('input', () => { this.#grow(this.el.sayText); this.el.saySend.disabled = !this.el.sayText.value.trim(); });
      this.el.sayText.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); this.#send(); }
      });
      // Ask Bayloob: Enter → pick agent + folder → Enter starts
      this.el.ask.addEventListener('submit', e => { e.preventDefault(); this.#askNext(); });
      this.el.askText.addEventListener('input', () => { if (!this.el.askText.value.trim() && !this.el.askPick.hidden) { this.#askReset(); } });
      this.el.askPick.addEventListener('click', e => {
        const a = e.target.closest('[data-agent]');
        if (a && !a.disabled) { this.askAgent = a.dataset.agent; }
        if (e.target.closest('[data-worktree]')) { this.askWorktree = !this.askWorktree; }
        if (a || e.target.closest('[data-worktree]')) {
          this.askCwd = this.el.askPick.querySelector('#askCwd')?.value || this.askCwd;
          this.#renderAskPick();
        }
      });
      document.addEventListener('keydown', e => {
        // Typing in a prompt box: only Escape is ours (leave the box / cancel the agent pick)
        if (e.target.closest?.('#say, #ask')) {
          if (e.key === 'Escape') {
            e.preventDefault();
            if (this.#sayConfirming && e.target.closest('#say')) { this.#confirmSay(false); this.el.sayText.focus(); }
            else if (!this.el.askConfirm.hidden) { this.#confirmAsk(false); }
            else if (!this.el.askPick.hidden) { this.#askReset(); }
            else { e.target.blur(); }
          }
          return;
        }
        if (e.key === 'Escape') {
          if (this.launchMode || this.query) { this.launchMode = false; this.query = ''; this.el.search.value = ''; this.render(); }
          else { this.api?.close(); }
        } else if (e.key === 'ArrowDown') { e.preventDefault(); this.#move(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); this.#move(-1); }
        else if (e.key === 'Enter' && this.current && !this.launchMode) { this.#primary(this.current); }
      });
    }
  }

  const view = new PanelView(window.panelAPI);
  if (window.panelAPI) {
    panelAPI.onShow(state => view.show(state));
    panelAPI.onSessions(list => view.setSessions(list));
    panelAPI.onStats(stats => view.setStats(stats));
    panelAPI.onStatus(status => view.setStatus(status));
    panelAPI.onWorkspace(snap => view.setWorkspace(snap));
    panelAPI.onBlocked?.(info => view.setBlocked(info));
    panelAPI.onCollisions?.(map => view.setCollisions(map));
  } else {
    window.__demo = view; // opened in a plain browser: drive it from the console
  }
</script>
</body>
</html>
