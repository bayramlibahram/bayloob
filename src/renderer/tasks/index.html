<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Bayloob · Tasks</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="../shared/select-menu.css">
<style>
  /* Tokens follow the approved prototype (docs/orchestration/prototype); theme.css switches light/dark */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--backdrop); color: var(--text); font: 500 13px/1.45 -apple-system, "Segoe UI", Ubuntu, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; border: 0; background: none; outline: none; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  svg:not(.i) { width: 15px; height: 15px; fill: currentColor; flex: none; } /* ICON_TERM */
  code, pre, .mono { font-family: ui-monospace, "Ubuntu Mono", monospace; }
  [hidden] { display: none !important; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }

  .app { height: 100%; display: grid; grid-template-rows: 52px 1fr; }
  /* header: the window's own title bar (frameless window) */
  .whead { display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; user-select: none; }
  .whead button, .whead .usage { -webkit-app-region: no-drag; }
  .whead .logo { width: 28px; height: 28px; }
  .whead b { font-size: 15px; font-weight: 700; }
  .whead .sep { width: 1px; height: 18px; background: var(--line-strong); }
  .whead .sub { color: var(--muted); }
  .whead .sp { flex: 1; }
  .usage { display: flex; gap: 14px; color: var(--muted); font-size: 12px; }
  .usage span { display: inline-flex; align-items: center; gap: 6px; }
  .usage b { color: var(--text); font-variant-numeric: tabular-nums; }
  .usage em { font-style: normal; color: var(--working); }
  .dots { display: inline-flex; gap: 2px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--c); }
  .dots i.on { background: var(--c); }
  .cuse { gap: 10px; }
  .cu { display: inline-flex; align-items: center; gap: 5px; }
  .cu b { font-weight: 650; color: var(--soft); }
  .cu em { font-style: normal; color: var(--working); font-weight: 600; }
  .wctl { display: flex; gap: 2px; }
  .iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; color: var(--muted); }
  .iconbtn:hover { background: var(--hover); color: var(--text); }
  .iconbtn.close:hover { background: var(--waiting); color: #fff; }
  .thumb { position: relative; width: 100%; height: 100%; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .novi { width: 22px; height: 22px; flex: none; display: inline-block; }
  .novi.l { width: 34px; height: 34px; }
  .main { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* components */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; padding: 0 13px; border-radius: 9px;
    background: var(--raised-2); border: 1px solid var(--line); font-weight: 600; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--primary-bg); color: var(--primary-fg); border-color: transparent; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger { color: var(--waiting); }
  .btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 7px; }
  .btn:disabled { opacity: 0.45; filter: none; }
  .btn kbd { font: 600 10.5px/16px ui-monospace, monospace; padding: 0 5px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--muted); }
  .btn.primary kbd { color: var(--primary-fg); border-color: rgb(255 255 255 / 0.4); }
  .chip { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600;
    background: var(--raised-2); color: var(--soft); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip.c { color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .chip.out { background: none; border: 1px solid var(--line-strong); }
  .chip .d { width: 7px; height: 7px; border-radius: 50%; background: var(--c, currentColor); flex: none; }
  .chip .d.live { animation: pulse 1.2s ease-in-out infinite; }
  .badge { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 5px; font: 700 10px/1 ui-monospace, monospace;
    letter-spacing: 0.03em; text-transform: uppercase; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
  .badge.writes { --c: var(--working); } .badge.ro { --c: var(--thinking); } .badge.plan { --c: var(--cat-workflow); }
  .field { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 9px; background: var(--raised-2); border: 1px solid var(--line); }
  .field:focus-within { border-color: var(--focus); }
  .field input { flex: 1; min-width: 0; }
  .field input::placeholder, textarea::placeholder { color: var(--muted); }
  .sel { height: 32px; padding: 0 28px 0 10px; border-radius: 9px; background: var(--raised-2); border: 1px solid var(--line); appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 13px) 14px, calc(100% - 9px) 14px; background-size: 4px 4px; background-repeat: no-repeat; }
  select.sel option { background: var(--surface); color: var(--text); }
  .seg { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--raised-2); border: 1px solid var(--line); }
  .seg button { height: 26px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--backdrop); color: var(--text); box-shadow: 0 1px 3px rgb(var(--shade) / calc(0.3 * var(--shade-k))); }
  .empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 10px; color: var(--muted); font-size: 12px; text-align: center; }
  .empty .novi { width: 44px; height: 44px; opacity: .85; }
  .empty b { color: var(--soft); font-size: 13px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .diff { font: 600 11px ui-monospace, monospace; white-space: nowrap; }
  .diff .a { color: var(--done); } .diff .r { color: var(--waiting); }
  .num { font-variant-numeric: tabular-nums; }

  /* board */
  .phead { display: flex; align-items: center; gap: 10px; padding: 16px 20px 12px; }
  .phead h1 { font-size: 18px; font-weight: 700; flex: 1; }
  .filters { display: flex; align-items: center; gap: 8px; padding: 0 20px 12px; }
  .filters .field { width: 260px; }
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 10px; padding: 0 20px 16px; overflow: auto; }
  .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; padding: 8px; border-radius: 14px; background: var(--raised); overflow-y: auto; }
  .col h3 { display: flex; align-items: center; gap: 6px; padding: 2px 4px 4px; font-size: 12px; font-weight: 700; color: var(--soft); }
  .col h3 em { font-style: normal; color: var(--muted); font-weight: 600; }
  .col h3 em.hot { color: var(--primary-fg); background: var(--waiting); padding: 0 6px; border-radius: 999px; }
  .col .none { padding: 10px 6px; color: var(--muted); font-size: 11.5px; }
  /* an empty column folds into a narrow rail: its name runs down the side, the room goes to the full ones */
  .col.rail { align-items: center; padding: 10px 0; overflow: hidden; }
  .col.rail h3 { writing-mode: vertical-rl; padding: 0; gap: 8px; white-space: nowrap; }
  .col.rail h3 em { writing-mode: horizontal-tb; }
  .tcard { display: flex; flex-direction: column; gap: 7px; padding: 10px 11px; border-radius: 12px; background: var(--backdrop); border: 1px solid var(--line);
    text-align: left; box-shadow: 0 1px 2px rgb(var(--shade) / calc(0.2 * var(--shade-k))); }
  .tcard.fresh { animation: slidein 0.2s ease-out; }
  /* a stage that just finished: its check pops in */
  .sstep.done.changed { animation: none; }
  .sstep.done.changed .si { animation: tick 0.35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes tick { from { transform: scale(.4); opacity: 0; } }
  .tcard:hover { border-color: var(--line-strong); }
  .tcard.needs { border-color: color-mix(in srgb, var(--waiting) 55%, transparent); }
  .tcard .tt { display: flex; gap: 7px; align-items: flex-start; }
  .tcard .tt b { flex: 1; font-weight: 650; font-size: 12.5px; line-height: 1.35; overflow-wrap: anywhere; }
  .tcard .ci { color: var(--cat-workflow); margin-top: 1px; width: 15px; height: 15px; }
  .tcard .ln { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .tcard .why { color: var(--waiting); font-size: 11.5px; font-weight: 600; display: flex; gap: 5px; }
  .tcard .agents { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
  .tcard .agents span { display: inline-flex; align-items: center; gap: 2px; }
  .compact .tcard { gap: 4px; padding: 7px 9px; }
  .compact .tcard .agents { display: none; }
  .phead .seg button { display: inline-flex; align-items: center; gap: 5px; }
  .phead .seg .i { width: 14px; height: 14px; }

  /* list: one row per task, grouped by the board's columns */
  .tlist { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 16px; }
  .tlist .lrow { display: grid; grid-template-columns: minmax(220px, 1fr) 150px 120px 190px 92px 64px 96px; align-items: center; gap: 12px; padding: 0 12px; }
  .tlist .lhead { position: sticky; top: 0; z-index: 1; height: 32px; background: var(--backdrop); border-bottom: 1px solid var(--line); }
  .tlist .lhead button { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .tlist .lhead button:hover, .tlist .lhead button[aria-sort] { color: var(--text); }
  .tlist .lhead .r, .tlist .trow .r { justify-content: flex-end; text-align: right; }
  .tlist .grp { display: flex; align-items: center; gap: 6px; width: 100%; margin-top: 12px; padding: 6px 4px; font-size: 12px; font-weight: 700; color: var(--soft); }
  .tlist .grp .i { width: 13px; height: 13px; transition: transform .15s; }
  .tlist .grp[aria-expanded="false"] .i { transform: rotate(-90deg); }
  .tlist .grp em { font-style: normal; color: var(--muted); font-weight: 600; }
  .tlist .grp em.hot { color: var(--primary-fg); background: var(--waiting); padding: 0 6px; border-radius: 999px; }
  .tlist .trow { width: 100%; min-height: 44px; padding-top: 7px; padding-bottom: 7px; text-align: left; border-radius: 10px; border: 1px solid transparent; font-size: 12.5px; }
  .tlist .trow:hover { background: var(--raised); border-color: var(--line); }
  .tlist .trow.needs { border-left: 3px solid var(--waiting); }
  .tlist .trow .tt { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tlist .trow .tt .ci { color: var(--cat-workflow); width: 15px; height: 15px; }
  .tlist .trow .tt span { display: flex; flex-direction: column; min-width: 0; }
  .tlist .trow .tt b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tlist .trow .tt small { color: var(--waiting); font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tlist .trow .m { color: var(--muted); font-size: 12px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tlist .trow .who { display: flex; gap: 2px; }
  .tlist .trow .who .novi { width: 18px; height: 18px; }
  .tlist .others { margin-top: 14px; padding: 0 4px; color: var(--muted); font-size: 11.5px; }
  /* timeline: one lane per task on a shared clock, a section per day */
  .tline { flex: 1; min-height: 0; overflow: auto; padding: 0 20px 16px; }
  .tline .day { margin-top: 12px; }
  .tline .dhd { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: minmax(220px, 360px) 1fr 60px; gap: 12px; align-items: end; padding: 8px 12px 6px; background: var(--backdrop); border-bottom: 1px solid var(--line); }
  .tline .dhd b { font-size: 12px; font-weight: 700; color: var(--soft); }
  .tline .dhd b em { font-style: normal; color: var(--muted); font-weight: 600; margin-left: 4px; }
  .tline .axis { position: relative; height: 16px; font-size: 10.5px; color: var(--muted); }
  .tline .axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .tline .axis span:first-child { transform: none; } .tline .axis span:last-child { transform: translateX(-100%); }
  .tline .lane { display: grid; grid-template-columns: minmax(220px, 360px) 1fr 60px; gap: 12px; align-items: center; width: 100%; min-height: 40px; padding: 5px 12px; border-radius: 10px; border: 1px solid transparent; text-align: left; font-size: 12.5px; }
  .tline .lane:hover { background: var(--raised); border-color: var(--line); }
  .tline .lane .tt { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tline .lane .tt .ci { color: var(--cat-workflow); width: 15px; height: 15px; }
  .tline .lane .tt span { display: flex; flex-direction: column; min-width: 0; }
  .tline .lane .tt b { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tline .lane .tt small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tline .lane .tt small.why { color: var(--waiting); font-weight: 600; }
  .tline .track { position: relative; height: 22px; border-radius: 6px;
    background: repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 25%); }
  .tline .bar { position: absolute; top: 5px; height: 12px; min-width: 6px; border-radius: 6px; background: var(--c); opacity: .85; }
  .tline .bar.live { opacity: 1; animation: pulse 1.6s ease-in-out infinite; }
  .tline .bar.live::after { content: ''; position: absolute; right: -1px; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--c); }
  .tline .lane .r { text-align: right; color: var(--muted); font-size: 12px; }
  @media (max-width: 900px) { .tline .dhd, .tline .lane { grid-template-columns: minmax(160px, 240px) 1fr 50px; } }
  @media (max-width: 1100px) { .tlist .lrow { grid-template-columns: minmax(200px, 1fr) 130px 180px 64px 90px; } .tlist .lrow > :is(.c-pat, .c-who) { display: none; } }

  /* detail */
  .dhead { display: flex; align-items: flex-start; gap: 12px; padding: 14px 20px 8px; }
  .dhead .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .dhead h1 { font-size: 18px; font-weight: 700; overflow-wrap: anywhere; }
  .crumb { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; align-self: flex-start; }
  .crumb:hover { color: var(--text); }
  .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
  .stepbar { display: flex; align-items: center; padding: 4px 20px 12px; overflow-x: auto; }
  .sstep { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 10px; font-size: 12.5px; white-space: nowrap; }
  .sstep .si { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-strong); color: var(--muted); font-weight: 700; font-size: 11px; }
  .sstep .si .i { width: 12px; height: 12px; }
  .sstep.done .si { background: var(--done); border-color: var(--done); color: var(--on-done); }
  .sstep.run .si { border-color: var(--thinking); border-top-color: transparent; animation: spin 1s linear infinite; }
  .sstep.wait .si { border-color: var(--waiting); color: var(--waiting); background: color-mix(in srgb, var(--waiting) 14%, transparent); }
  .sstep.fail .si { background: var(--waiting); border-color: var(--waiting); color: #fff; }
  .sstep small { color: var(--muted); }
  .sstep[aria-current="step"] { background: var(--raised-2); }
  .sline { flex: 1; min-width: 12px; height: 1px; background: var(--line-strong); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 20px; }
  .tab { position: relative; height: 38px; padding: 0 12px; color: var(--muted); font-weight: 600; }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); }
  .tab[aria-selected="true"]::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--brand); }
  .tab em { font-style: normal; margin-left: 5px; font-size: 11px; color: var(--muted); }
  .pane { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px 20px; }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .cards { display: flex; flex-direction: column; gap: 12px; max-width: 980px; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .facts div { padding: 9px 11px; border-radius: 10px; background: var(--raised); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .facts b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
  .tbl th { text-align: left; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .tbl td .who { display: flex; align-items: center; gap: 8px; }
  .tbl .wait { color: var(--working); font-size: 11.5px; }
  .cands { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-items: start; }
  .cand { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 14px; background: var(--raised); border: 1.5px solid var(--line); }
  .cand.win { border: 2px solid var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 14%, transparent); }
  .cand.picked { border-color: var(--brand); }
  .cand.out { opacity: .7; }
  .cand .ch { display: flex; align-items: center; gap: 10px; }
  .cand .ch .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .cand .ch small { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cand .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .strip { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; font-size: 12px; background: color-mix(in srgb, var(--c) 11%, transparent); color: var(--c); font-weight: 600; }
  /* The Arbiter's decision: its ranking with score bars, confidence, risks */
  .dec { display: flex; flex-direction: column; gap: 12px; max-width: 1080px; }
  .dec .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 14px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
  .dec .top b { font-size: 14px; }
  .conf { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--soft); }
  .conf .bar, .rank .bar { width: 120px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 10%, transparent); overflow: hidden; }
  .conf .bar i, .rank .bar i { display: block; height: 100%; background: var(--c, var(--brand)); border-radius: 3px; }
  .risks { list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
  .risks li { display: flex; gap: 8px; align-items: flex-start; }
  .risks li.high { color: var(--waiting); font-weight: 600; }
  .rank { display: grid; grid-template-columns: 40px minmax(150px, 220px) 150px 1fr auto; align-items: center; gap: 10px 14px; padding: 10px 14px; border-radius: 14px; background: var(--raised); border: 1.5px solid var(--line); }
  .rank.win { border-color: var(--brand); }
  .rank.mine { border-color: var(--done); }
  .rank .n { font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
  .rank .who { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .rank .who small { display: block; color: var(--muted); font-size: 11.5px; }
  .rank .sc { display: flex; align-items: center; gap: 8px; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  .rank ul { margin: 0; padding-left: 16px; font-size: 12.5px; color: var(--soft); }
  .sev { display: inline-block; min-width: 58px; text-align: center; }
  /* Runbook: one card per step, in order; only the next one has buttons */
  .ops { display: flex; flex-direction: column; gap: 10px; max-width: 1080px; }
  .opscard { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--raised); border: 1.5px solid var(--line); }
  .opscard:focus-within, .opscard.next { border-color: color-mix(in srgb, var(--brand) 60%, transparent); }
  .opscard.done { border-color: color-mix(in srgb, var(--done) 45%, transparent); }

  .opscard .oh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }

  .opscard .purpose { font-size: 12.5px; color: var(--soft); }
  .opscard .cmd { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--text) 6%, transparent);

  .opscard textarea.argv { width: 100%; min-height: 54px; font: 12.5px ui-monospace, monospace; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--text); }
  .opscard pre.output { max-height: 240px; }
  .opscard .res { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .env-dev { --c: var(--idle); } .env-staging { --c: var(--working); } .env-prod { --c: var(--waiting); }
  .rfilter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .rfilter .sp { flex: 1; }
  .rfilter .chip { cursor: pointer; border: 1px solid transparent; }
  .rfilter .chip[aria-pressed="true"] { border-color: var(--c, var(--text)); }
  .rfilter .chip:disabled { opacity: .45; cursor: default; }
  /* Split work: the planner's subtasks and the files each owns */
  .subs { display: flex; flex-direction: column; gap: 8px; max-width: 980px; }
  .sub { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; gap: 6px 14px; padding: 10px 12px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line); }
  .sub b { font-size: 13px; } .sub small { display: block; color: var(--muted); font-size: 11.5px; }
  .sub .files { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
  .sub code { font: 11.5px ui-monospace, monospace; padding: 2px 6px; border-radius: 6px; background: color-mix(in srgb, var(--text) 7%, transparent); }
  .sub code.clash { background: color-mix(in srgb, var(--waiting) 20%, transparent); color: var(--text); }
  .subs .banner { margin: 0; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv dt { color: var(--muted); }
  details.more summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  details.more[open] summary { margin-bottom: 6px; }
  .md { font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; user-select: text; }
  .md p, .md ul, .md ol, .md pre, .md blockquote, .md .tablewrap { margin: 0 0 8px; }

  .md pre { padding: 8px 10px; border-radius: 8px; background: var(--code-bg); overflow-x: auto; }
  .md pre code { padding: 0; background: none; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .md blockquote { padding-left: 10px; border-left: 2px solid var(--line); color: var(--soft); }
  .md .tablewrap { overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 12.5px; }
  .md th, .md td { padding: 4px 9px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
  .output { padding: 10px 12px; border-radius: 10px; background: var(--code-bg); border: 1px solid var(--line); font: 11.5px/1.55 ui-monospace, monospace; color: var(--soft);
    white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; user-select: text; }
  .timeline { list-style: none; display: flex; flex-direction: column; max-width: 980px; }
  .timeline li { display: grid; grid-template-columns: 64px 28px 1fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); align-items: start; }
  .timeline .tm { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 3px; }
  .actor { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--raised-2); color: var(--soft); }
  .actor .i { width: 13px; height: 13px; }

    background: color-mix(in srgb, var(--c) 10%, transparent); border: 1px solid color-mix(in srgb, var(--c) 32%, transparent); color: var(--soft); }
  /* the decision bar: the human actions, always at the same place (bottom right) */

  .actions .msg small { color: var(--muted); white-space: pre-wrap; }

  .actions .msg .fix b { color: var(--working); }
  .actions .msg details pre { max-height: 180px; }
  .actions textarea { flex: 1 1 100%; min-height: 60px; resize: vertical; padding: 8px 10px; border-radius: 10px; background: var(--raised-2); border: 1px solid var(--line); line-height: 1.5; }

  /* The discussion window (?mode=discussion): the header keeps the logo and the window controls only */

  .embedded .whead { -webkit-app-region: no-drag; height: 46px; padding-left: 12px; }
  .embedded .whead .logo, .embedded .whead > b, .embedded .whead .sep, .embedded .usage, .embedded .wctl { display: none; }
  .embedded .app { grid-template-rows: 46px 1fr; }
  /* header nav */
  .wnav { display: flex; gap: 2px; -webkit-app-region: no-drag; }
  .wnav button { height: 28px; padding: 0 10px; border-radius: 8px; color: var(--muted); font-weight: 600; }
  .wnav button:hover { color: var(--text); background: var(--raised-2); }
  .wnav button[aria-current="page"] { color: var(--text); background: var(--raised-2); }
  /* templates */
  .tpls { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; max-width: 1100px; }
  .tpl { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
  .tpl .tph { display: flex; align-items: center; gap: 8px; }

  .tpl p { color: var(--soft); font-size: 12.5px; }

  .confirm { color: var(--waiting); font-weight: 600; font-size: 12.5px; }
  /* builder */
  .titlein { font-size: 18px; font-weight: 700; padding: 2px 6px; margin-left: -6px; border-radius: 8px; border: 1px solid transparent; min-width: 0; }

  .descin { flex: 1; min-width: 200px; padding: 2px 6px; border-radius: 7px; border: 1px solid transparent; color: var(--soft); }
  .stages { display: flex; flex-direction: column; gap: 10px; max-width: 980px; }
  .scard { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 14px; background: var(--raised); border: 1px solid var(--line); }
  .scard.bad { border-color: color-mix(in srgb, var(--waiting) 45%, transparent); }
  .scard .sh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .scard .grip { color: var(--muted); display: grid; }
  .scard .sn { font-weight: 700; color: var(--muted); }
  .stitle { width: 140px; height: 30px; padding: 0 8px; border-radius: 8px; background: var(--raised-2); border: 1px solid var(--line); font-weight: 700; }
  .stitle:focus, input.small:focus { border-color: var(--focus); }
  .sbody { display: flex; flex-direction: column; gap: 8px; padding-left: 26px; }
  .slot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .slot .cap { font-size: 11.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
  .slot .cap.q { color: var(--working); }
  .slot .cap .i { width: 13px; height: 13px; }
  .sel.small { height: 26px; font-size: 12px; padding-right: 24px; background-position: calc(100% - 12px) 11px, calc(100% - 8px) 11px; }
  input.small { height: 26px; width: 120px; padding: 0 8px; border-radius: 7px; background: var(--raised-2); border: 1px solid var(--line); font-size: 12px; }
  .stepper { display: inline-flex; align-items: center; border-radius: 9px; border: 1px solid var(--line); background: var(--raised-2); }
  .stepper button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--soft); }
  .stepper button:hover:not(:disabled) { color: var(--text); background: var(--hover); }
  .stepper button:disabled { opacity: .35; }
  .stepper output { min-width: 22px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  .check { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--soft); }
  .check input[type=checkbox] { accent-color: var(--brand); width: 14px; height: 14px; }
  .opts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; color: var(--soft); }
  .hint { color: var(--muted); font-size: 12.5px; }
  .editor { position: relative; }
  .editor textarea { width: 100%; min-height: 56px; resize: none; padding: 8px 10px; border-radius: 9px; background: var(--code-bg); border: 1px solid var(--line);
    font: 12px/1.55 ui-monospace, "Ubuntu Mono", monospace; color: var(--soft); }
  .editor textarea:focus { border-color: var(--focus); color: var(--text); }
  .complete { position: absolute; left: 10px; top: calc(100% - 4px); z-index: 3; width: 320px; padding: 4px; border-radius: 10px; background: var(--surface);
    border: 1px solid var(--line-strong); box-shadow: 0 10px 28px rgb(var(--shade) / calc(0.4 * var(--shade-k))); }

  .complete code { color: var(--brand-soft); }
  .complete small { color: var(--muted); text-align: right; }
  .sissues { display: flex; flex-direction: column; gap: 2px; padding-left: 26px; color: var(--waiting); font-size: 12px; }
  .sissues span { display: flex; align-items: center; gap: 5px; }
  .sissues .i { width: 12px; height: 12px; }
  .addstage { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 0 20px; }
  .btn.ghost { background: none; border-color: transparent; color: var(--soft); }

  /* ---------- Discussion (14): participants · thread · summary, as in docs/orchestration/prototype/discussion.html ---------- */
  /* Delegation (the orchestrator) and its first batch at the gate */
  .deleg-sum { margin: 0 0 10px; color: var(--muted); }
  .deleg-sum b { color: var(--fg); }
  .dh { margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .deleg { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }

  .deleg .w small { color: var(--muted); }

  .deleg code, .batch code { font: 12px ui-monospace, "Ubuntu Mono", monospace; overflow-wrap: anywhere; }
  .deleg-turns details { border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; margin-bottom: 6px; }
  .deleg-turns summary { cursor: pointer; font-weight: 600; }
  .batch { display: block; margin-top: 8px; }
  .batch .h { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  .disc { display: grid; grid-template-columns: 220px minmax(0, 1fr) 320px; gap: 16px; min-height: 100%; }

  .disc .who[aria-pressed="true"] { border-color: var(--line-strong); background: var(--raised); }
  .disc .who b { display: block; font-size: 13px; }
  .disc .who small { color: var(--muted); font-size: 11.5px; }
  .disc .who .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 3px; }
  .disc .live { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .disc .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
  .disc .live.on i { animation: dpulse 1.1s infinite; }
  @keyframes dpulse { 50% { opacity: .3; } }
  .disc .conf { grid-column: 2; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); white-space: nowrap; }
  .disc .cbar { width: 64px; height: 4px; border-radius: 999px; background: var(--raised-2, var(--hover)); overflow: hidden; }
  .disc .cbar i { display: block; height: 100%; background: var(--c); }

  .disc .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: var(--raised); }
  .disc .seg button { height: 26px; padding: 0 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .disc .seg button[aria-pressed="true"] { background: var(--surface, var(--card)); color: var(--text); }
  .disc .rhead { display: flex; align-items: center; gap: 10px; margin: 8px 0 2px; }
  .disc .rhead b { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--soft); }
  .disc .rhead small { color: var(--muted); }
  .disc .rhead hr { flex: 1; border: 0; height: 1px; background: var(--line); }
  .disc .msg { position: relative; max-width: 80ch; padding: 13px 16px 13px 18px; border-radius: 14px; background: var(--card, var(--surface)); border: 1px solid var(--line); font-size: 15px; line-height: 1.6; }
  .disc .msg::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--c); }
  .disc .msg.you { background: color-mix(in srgb, var(--brand) 7%, var(--card, var(--surface))); }
  .disc .msg header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
  .disc .msg header .sp { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .disc .msg header small { color: var(--muted); }
  .disc .msg h4 { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 9px 0 2px; }
  .disc .msg .md p { margin: 0 0 6px; }
  .disc .msg.thinking { color: var(--muted); font-size: 13.5px; }
  .disc .dots { display: inline-flex; gap: 4px; margin-left: 4px; }
  .disc .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: dpulse 1.2s infinite; }
  .disc .dots i:nth-child(2) { animation-delay: .2s; } .disc .dots i:nth-child(3) { animation-delay: .4s; }
  .disc .stc { display: inline-flex; align-items: center; gap: 4px; height: 21px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 650; white-space: nowrap;
    color: color-mix(in srgb, var(--c) 78%, var(--text)); background: color-mix(in srgb, var(--c) 15%, transparent); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); }
  .disc .st-propose { --c: var(--brand-soft); } .disc .st-support { --c: var(--done); } .disc .st-oppose { --c: var(--waiting); }
  .disc .st-revise { --c: var(--thinking); } .disc .st-undecided, .disc .st-unstructured { --c: var(--idle); } .disc .st-changed { --c: var(--working); } .disc .st-pinned { --c: var(--brand-soft); }
  .disc .composer { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .disc .composer textarea { min-height: 56px; max-height: 160px; padding: 9px 11px; border-radius: 11px; background: var(--raised); border: 1px solid var(--line); resize: vertical; font-size: 14px; color: var(--text); }
  .disc .composer .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .disc .composer .row .grow { flex: 1; color: var(--muted); font-size: 11.5px; }
  .disc .card h3 { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .disc .matrix { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 11.5px; }
  .disc .matrix th { font-weight: 600; color: var(--muted); text-align: center; }
  .disc .matrix th:first-child { text-align: left; }
  .disc .matrix td { height: 32px; text-align: center; border-radius: 8px; background: var(--raised); color: var(--soft); }
  .disc .matrix td.self { background: none; color: var(--muted); }
  .disc .matrix td.y { background: color-mix(in srgb, var(--done) 18%, transparent); font-weight: 650; }
  .disc .matrix td.n { background: color-mix(in srgb, var(--waiting) 16%, transparent); font-weight: 650; }
  .disc .matrix .tx { display: block; font-size: 10px; }
  .disc .prop { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .disc .prop:first-of-type { border-top: 0; padding-top: 0; }
  .disc .prop small { display: block; color: var(--muted); }
  .disc .open { list-style: none; display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--soft); }
  .disc .open li::before { content: '○ '; color: var(--muted); }
  .disc .grid { display: grid; gap: 8px; }
  .disc .grid .cell { padding: 9px 11px; border-radius: 11px; background: var(--card, var(--surface)); border: 1px solid var(--line); font-size: 13px; }
  .disc .grid .rl { color: var(--muted); font-size: 12px; font-weight: 650; padding-top: 9px; }
  .disc .grid .chg { border-color: color-mix(in srgb, var(--working) 60%, transparent); }
  .disc details.raw { border: 1px solid var(--line); border-radius: 10px; background: var(--card, var(--surface)); }
  .disc details.raw summary { padding: 8px 12px; cursor: pointer; font-size: 12.5px; }
  .disc details.raw pre { padding: 10px 12px; white-space: pre-wrap; border-top: 1px solid var(--line); font-size: 12px; }
  @media (max-width: 1180px) { .disc { grid-template-columns: 200px minmax(0, 1fr); } .disc .side { grid-column: 1 / -1; } }
  @media (prefers-reduced-motion: reduce) { .disc .live.on i, .disc .dots i { animation: none; } }

<div class="app">

      violation: { continue: 'Continue anyway', abort: 'Abort' },

      discussion: { next: 'Next round', end: 'End & decide', abort: 'Abort' },

    },
    deleg: {
      turn: n => `Turn ${n}`, used: (n, max) => `${n} of ${max} workers`, turns: (n, max) => `${n} of ${max} turns`, minutes: (n, max) => `${n} of ${max} min`,

      status: { queued: 'waiting', running: 'working', done: 'done', failed: 'failed', interrupted: 'cut off', stopped: 'stopped' },
    },
    disc: {
      notYet: 'The discussion hasn’t started', notYetHint: 'It starts when the task reaches its discussion stage.',
      views: { thread: 'Thread', columns: 'Columns', timeline: 'Stance timeline', raw: 'Raw' },

      live: { speaking: 'Speaking', waiting: 'Next', done: 'Done', idle: 'Waiting', removed: 'Removed' },
      confidence: 'Confidence', you: 'You', toAll: 'Everyone', thinking: name => `${name} is thinking`, unstructured: 'Unstructured', changed: 'Changed stance', pinned: 'Pinned',
      pin: 'Pin', unpin: 'Unpin', send: 'Send', ask: 'Ask', pause: 'Pause after this round', unpause: 'Don’t pause', end: 'End & decide',
      composerPh: 'Write to everyone, or pick one above to ask a question — it goes into the next turn', keys: 'Ctrl+Enter send',
      search: 'Search the thread…', all: 'All participants', showAll: 'Show all', save: 'Save thread.md',
      window: 'Open in a window', windowTip: 'The discussion in a wide window of its own — minimize sends it to the pill',
      agreement: 'Agreement', matrixHead: 'Row supports column', supports: 'supports', opposes: 'opposes', neutral: 'neutral',
      proposals: 'Proposals', noProposals: 'No proposal yet', support: n => `${n} support`, by: (who, r) => `by ${who}, round ${r}`,
      open: 'Open points', none: 'None', decision: 'Decision', decidedBy: who => `Written by ${who === 'you' ? 'you' : who}`,
      ended: { consensus: 'Ended: they agree', rounds: 'Ended: the rounds ran out', budget: 'Ended: the token budget ran out', owner: 'Ended by you' },
      running: (r, n) => `Round ${r} of ${n} — it stops on consensus, the last round, the token budget, or End & decide`,
      tokens: n => `${(n / 1000).toFixed(1)}k tokens`, asked: 'Asked — they answer next', sent: 'Sent — it goes into the next turn',
    },
    mergeInto: b => `Merge into ${b}`, applyFiles: 'Apply to my files', yourFiles: b => `your files on ${b} (uncommitted included)`, pickFirst: 'Choose a candidate first (Decision or Candidates tab)',
    noDecision: 'No decision yet', noDecisionHint: 'The Arbiter decides after the tests and reviews — its ranking appears here.',
    ownerPicks: 'This workflow has no Arbiter agent — you pick in Candidates.',
    verdict: { select: 'Keeps', retry: 'Wants another round', merge_ideas: 'Merge ideas into', escalate: 'Leaves it to you' },
    confidence: 'confidence', risks: 'Risks', score: s => `${s}/10`, arbiterAnswer: 'The Arbiter’s answer',

    ops: {
      next: 'Next', running: 'Running…', done: 'Done', failed: 'Failed', skipped: 'Skipped', pending: 'Not run', edited: 'edited by you',

      run: 'Run', dry: 'Dry run', skip: 'Skip', more: 'More', skipDanger: 'Skip — looks dangerous', edit: 'Edit', save: 'Save', cancel: 'Cancel', retry: 'Retry', rollback: 'Run rollback',
      confirmQ: (cmd, host) => `Run <code>${cmd}</code> on <b>${host}</b>?`, typeQ: host => `Type <b>${host}</b> to run this step`, refused: host => `${host} is prod — this command isn’t in its allowed patterns. Add one in Settings → Hosts first.`,
      exit: (c, ms) => `exit ${c ?? '—'} · ${ms < 1000 ? `${ms} ms` : `${(ms / 1000).toFixed(1)} s`}`, rollbackOf: 'Rollback', dryDone: 'Dry run',

    },
    analystsTab: 'Analysts', all: 'All', filterSev: 'Show findings of', exportMd: 'Export Markdown', exported: p => `Saved ${p}`, collected: 'What Bayloob collected for the analysts (read-only)',

    notePh: { changes: 'What should change? It goes to the same agent.', retry: 'What should the builders do differently?' },
    send: 'Send', abortAsk: 'Abort this task? Its agents stop; worktrees and branches stay.', yesAbort: 'Abort',
    stopPlanAsk: 'Stop this plan? Steps not run stay as they are.', yesStopPlan: 'Stop plan',

    log: {
      started: e => e.fromWorktree ? `Task started from your files as they were (on ${e.branch || '?'})` : `Task started from ${String(e.base || '').slice(0, 8)} on ${e.branch || '?'}`,

      candidate: e => `${e.candidate}: +${e.diff?.added ?? 0} −${e.diff?.deleted ?? 0}`,
      tests: e => `Tests on ${e.candidate}: ${e.ok ? 'pass' : `fail (exit ${e.code})`}`,

      gate: e => `Waiting for you: ${e.title}`,
      merged: e => `Merged ${e.branch} into ${e.into}`,
      applied: e => `Applied ${e.branch} to your files (uncommitted)`,
      'merge-failed': e => `Merge failed: ${e.error}`,
      finished: e => `Finished: ${e.status} — ${e.why}`,
      interrupted: e => `${instName(e.instance)} was interrupted`,

      'trusted-folder': () => 'Answered the folder-trust question (task worktree)',

      integrated: e => `Integrated ${(e.parts || []).join(', ')} into ${e.branch}`,
      'arbiter-input': e => `Input for the Arbiter prepared (${e.chars} chars)`,
      'arbiter-invalid': e => `The Arbiter's answer couldn't be used${e.reasked ? ' again' : ' — asked again'}: ${e.error}`,
      arbiter: e => `Arbiter: ${e.decision}${e.winner ? ` ${e.winner}` : ''} · confidence ${e.confidence}${e.high ? ` · ${e.high} high risk(s)` : ''}`,
      report: e => `Arbiter merged the reviews: ${e.findings} finding(s)`,
      override: e => `You chose ${e.candidate} over the Arbiter's ${e.arbiter}`,
      'integrate-failed': e => `Integration stopped: ${e.error}${e.conflicts?.length ? ` (${e.conflicts.join(', ')})` : ''}`,
      stop: () => 'You stopped the task',
      error: e => `Engine error: ${e.error}`,
    },
  };

  const I = (d, extra = '') => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"${extra}>${d}</svg>`;
  const ICON = {
    flow: I('<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 6h7M6 8.5v3a4 4 0 0 0 4 4h5.5"/>', ' class="i ci"'),
    back: I('<path d="m15 6-6 6 6 6"/>', ' style="width:13px;height:13px"'),
    check: I('<path d="m5 12 5 5 9-10"/>'),
    down: I('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),
    x: I('<path d="M6 6l12 12M18 6 6 18"/>'),
    clock: I('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>', ' style="width:12px;height:12px"'),
    warn: I('<path d="M12 4 2.5 20h19Z"/><path d="M12 10v4M12 17h.01"/>', ' style="width:13px;height:13px"'),
    stop: I('<rect x="7" y="7" width="10" height="10" rx="2"/>'),
    search: I('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>'),
    you: I('<circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/>'),
    engine: I('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/>'),
    agent: I('<rect x="4" y="7" width="16" height="11" rx="4"/><path d="M9 12h.01M15 12h.01"/>'),
    board: I('<rect x="4" y="4" width="4.5" height="16" rx="1.5"/><rect x="10.5" y="4" width="4.5" height="11" rx="1.5"/><rect x="17" y="4" width="3" height="7" rx="1.5"/>'),
    list: I('<path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/>'),
    chev: I('<path d="m6 9 6 6 6-6"/>'),
    timeline: I('<path d="M4 6h9M8 12h12M4 18h7"/>'),
  };
  if (new URLSearchParams(location.search).get('embedded') === '1') { document.documentElement.classList.add('embedded'); }
  // The discussion window (?mode=discussion): one task's discussion, full size — no board, no other tabs
  const DISCUSSION_MODE = new URLSearchParams(location.search).get('mode') === 'discussion';
  if (DISCUSSION_MODE) { document.documentElement.classList.add('discussion-mode'); }
  const COLS = ['queued', 'running', 'needs', 'review', 'done', 'failed'];
  const PATTERN = { pipeline: 'Pipeline', bestofn: 'Best-of-N', split: 'Split work', board: 'Review board' };
  const LIVE = new Set(['starting', 'running']);
  const OPEN_TASK = new Set(['running', 'needs-you']);
  const DENSITY_KEY = 'bayloob.tasks.density';
  const LAYOUT_KEY = 'bayloob.tasks.layout';
  const novi = (agent, size = '') => `<span class="novi ${size}">${Agent.thumb(agent)}</span>`;
  const elapsed = t => {
    const s = Math.max(0, Math.round(((t.endedAt || Date.now()) - t.createdAt) / 1000));
    return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m` : `${Math.floor(s / 3600)}h ${String(Math.floor((s % 3600) / 60)).padStart(2, '0')}m`;
  };
  const clockTime = at => new Date(at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const tilde = (p, home) => (home && p?.startsWith(home) ? `~${p.slice(home.length)}` : p || '');
  // "build.2.1.build-1" → "build-1 · round 2"; "plan.1.1" → "plan"
  const instName = id => {
    const [stage, round, n, cand] = String(id || '').split('.');
    return `${cand || (Number(n) > 1 ? `${stage} ${n}` : stage)}${Number(round) > 1 ? ` · round ${round}` : ''}`;
  };
  const findingsIn = text => (String(text || '').match(/^\s*[-*]?\s*`?[\w./-]+:\d+/gm) || []).length;

  /** Which board column a task is in. */
  function columnOf(t) {
    if (t.status === 'done') { return 'done'; }
    if (t.status === 'stopped' || t.status === 'failed') { return 'failed'; }
    if (t.status === 'needs-you') { return t.gate?.kind === 'merge' ? 'review' : 'needs'; }
    return t.instances.some(i => LIVE.has(i.status)) || t.stages[t.stage]?.status !== 'running' ||
      !t.instances.some(i => i.status === 'queued') ? 'running' : 'queued';
  }

  class TasksView {
    tasks = new Map();
    usage = null;
    view = 'board';
    open = null; // task id in the detail
    tab = 'overview';
    query = '';
    project = '';
    density = 'comfortable';
    layout = 'board'; // how the board view shows the tasks: board | list | timeline
    collapsed = new Set(); // list groups the owner folded
    sort = { key: 'recent', dir: -1 }; // the list's order inside each group
    picked = new Map(); // task id → candidate the owner selected for "Pick"
    sevFilter = new Map(); // task id → the Report's severity filter (null: all)
    opsUi = null; // the runbook step being confirmed / typed / edited: { task, step, mode, action, typed, argv }
    composing = null; // { action } while a note / confirmation is being written
    #seenCards = null; // `${task}:${column}` of the cards on the board's last paint (null before the first)
    #art = new Map(); // `${task}:${name}` → text | null (artifacts and logs, refreshed when the task changes)
    #artFailed = new Map(); // `${task}:${name}` → why loading it failed
    #toastTimer = null;
    templates = [];
    #builder = null;

    constructor(api) {
      this.api = api;
      this.el = { main: document.getElementById('main'), usage: document.getElementById('usage'), toast: document.getElementById('toast') };
      document.getElementById('logo').innerHTML = Agent.thumb(MANAGER);
      try {
        this.density = localStorage.getItem(DENSITY_KEY) || 'comfortable';
        const layout = localStorage.getItem(LAYOUT_KEY);
        this.layout = layout in T.layouts ? layout : 'board';
      } catch { /* storage unavailable */ }
      // Until the first state arrives: the board's shape, not a blank window
      this.el.main.innerHTML = `<div class="phead"><h1>${T.tasks}</h1></div><div class="board">${COLS.map(() => `<section class="col">${skeletonHtml([60, 85, 40])}</section>`).join('')}</div>`;
      this.#bind();
      setInterval(() => { if (!this.composing && !this.editing) { this.render(); } }, 30_000);
    }

    show(state) {
      this.state = state;
      this.tasks = new Map((state.tasks || []).map(t => [t.id, t]));
      this.usage = state.usage || null;
      this.templates = state.templates || [];
      if (state.builder) {
        this.builder.open(state.builder);
        this.view = 'builder';
        this.render();
      } else if (state.focus && this.tasks.has(state.focus)) { this.#openTask(state.focus); } else { this.render(); }
      this.#renderUsage();
    }

    setTask(task) {
      const before = this.tasks.get(task.id);
      this.tasks.set(task.id, task);
      this.#announceChanges(before, task);
      if (this.open === task.id) {
        if (before?.gate?.id !== task.gate?.id && task.gate) {
          this.tab = this.#preferredTab(task);
        } else if (!before?.report && task.report) {
          this.tab = 'report';
        }
      }
      // Artifacts may have changed with it: read them again when shown
      if (before?.updatedAt !== task.updatedAt) {
        for (const k of [...this.#art.keys()]) { if (k.startsWith(`${task.id}:`)) { this.#art.delete(k); } }
      }
      if (this.composing && this.open === task.id && task.gate?.id !== this.composing.gate) { this.composing = null; }
      if (!this.editing && (!this.composing || this.open !== task.id)) { this.render(); }
    }

    // What changed on its own, for a screen reader: the task now needs you, a runbook step finished
    #announceChanges(before, task) {
      if (!before) { return; }
      if (task.status === 'needs-you' && (before.status !== 'needs-you' || before.gate?.id !== task.gate?.id)) {
        announce(T.say.needsYou(task.title, task.gate?.title));
      } else if (task.status !== before.status && ['done', 'failed', 'stopped'].includes(task.status)) {
        announce(T.say.ended(task.title, T.status[task.status]));
      }
      const was = new Map((before.runbook?.steps || []).map(x => [x.id, x.status]));
      for (const [i, x] of (task.runbook?.steps || []).entries()) {
        if (was.has(x.id) && was.get(x.id) !== x.status && ['done', 'failed', 'skipped'].includes(x.status)) {
          announce(T.say.step(i + 1, x.purpose || x.id, x.status));
        }
      }
    }

    setUsage(usage) { this.usage = usage; this.#renderUsage(); }

    get builder() {
      if (!this.#builder) { this.#builder = new window.WorkflowBuilder(this); }
      return this.#builder;
    }
    get editing() { return this.view === 'builder' || this.view === 'templates'; }

    // ---------- header ----------

    #renderUsage() {
      const agents = this.usage?.agents || {};
      this.el.usage.innerHTML = Object.entries(agents)
        .filter(([, u]) => u.enabled && (u.running || u.queued || u.max))
        .map(([a, u]) => `<span title="${esc(Agent.displayName(a))}: ${u.running} of ${u.max} running${u.queued ? `, ${u.queued} queued` : ''}">${esc(Agent.displayName(a).split(' ')[0])}
          <span class="dots" style="--c:${Agent.color(a)}">${Array.from({ length: u.max }, (_, i) => `<i class="${i < u.running ? 'on' : ''}"></i>`).join('')}</span>
          <b>${u.running}/${u.max}</b>${u.queued ? `<em>+${u.queued}</em>` : ''}</span>`).join('');
    }

    // ---------- views ----------

    render() {
      for (const b of document.querySelectorAll('#wnav [data-view]')) {
        const on = b.dataset.view === 'templates' ? this.editing : !this.editing;
        if (on) { b.setAttribute('aria-current', 'page'); } else { b.removeAttribute('aria-current'); }
      }
      if (this.view === 'builder' && this.builder.edit) {
        this.el.main.innerHTML = this.builder.html();
        return this.builder.afterRender(this.el.main);
      }
      if (this.editing) {
        this.view = 'templates';
        this.el.main.innerHTML = this.builder.listHtml(this.templates);
        return;
      }
      const detail = this.view === 'detail' && this.tasks.has(this.open);
      swapHtml(this.el.main, detail ? this.#detail(this.tasks.get(this.open)) : this.#board());
      if (!detail) { this.#seenCards = new Set([...this.el.main.querySelectorAll('.tcard')].map(c => c.dataset.seen)); }
      const note = this.el.main.querySelector('[data-note]');
      if (note) { note.focus(); }
    }

    #board() {
      const all = [...this.tasks.values()];
      if (!all.length) {
        return `<div class="phead"><h1>${T.tasks}</h1></div>
          <div class="empty" style="flex:1;justify-content:center">${novi(MANAGER, 'l')}<b>${T.noTasks}</b>${T.noTasksHint}
          <button class="btn primary" type="button" data-act="new">${T.newTask}</button></div>`;
      }
      const projects = [...new Set(all.map(t => t.project.name))].sort();
      const q = this.query.trim().toLowerCase();
      const shown = all.filter(t => (!this.project || t.project.name === this.project) && (!q || t.title.toLowerCase().includes(q) || t.project.name.toLowerCase().includes(q)));
      const by = Object.fromEntries(COLS.map(c => [c, []]));
      for (const t of shown) { by[columnOf(t)].push(t); }
      const layouts = `<div class="seg" role="group" aria-label="Layout">${Object.entries(T.layouts).map(([k, name]) => `<button type="button" data-layout="${k}" aria-pressed="${this.layout === k}">${ICON[k]}${name}</button>`).join('')}</div>`;
      const density = this.layout === 'board' ? `<div class="seg" role="group" aria-label="Density">${['comfortable', 'compact'].map(d => `<button type="button" data-density="${d}" aria-pressed="${this.density === d}">${T[d]}</button>`).join('')}</div>` : '';
      const head = `<div class="phead"><h1>${T.tasks}</h1>${density}${layouts}</div>
        <div class="filters"><label class="field">${ICON.search}<input id="q" placeholder="${T.filter}" aria-label="${T.filter}" value="${esc(this.query)}" spellcheck="false"></label>
          <select class="sel" id="proj" aria-label="Project"><option value="">${T.allProjects}</option>${projects.map(p => `<option${p === this.project ? ' selected' : ''}>${esc(p)}</option>`).join('')}</select></div>`;
      if (this.layout === 'list') { return head + this.#list(by); }
      if (this.layout === 'timeline') { return head + this.#timeline(by); }
      const cols = COLS.map(c => by[c].length ? `<section class="col" data-k="col:${c}" aria-label="${T.cols[c]}">
          <h3>${T.cols[c]} <em class="${c === 'needs' && by[c].length ? 'hot' : ''}" data-k="n:${c}" data-v="${by[c].length}">${by[c].length}</em></h3>
          ${by[c].map(t => this.#card(t, c)).join('')}
        </section>`
        : `<section class="col rail" data-k="col:${c}" aria-label="${T.cols[c]}: ${T.colEmpty[c]}" title="${T.colEmpty[c]}">
          <h3>${T.cols[c]} <em data-k="n:${c}" data-v="0">0</em></h3></section>`).join('');
      if (!shown.length) { return `${head}<div class="empty" style="flex:1">${T.noMatch}</div>`; }
      const widths = COLS.map(c => (by[c].length ? 'minmax(180px, 1fr)' : '40px')).join(' ');
      return `${head}
        <div class="board${this.density === 'compact' ? ' compact' : ''}" data-k="board" style="grid-template-columns:${widths}">${cols}</div>`;
    }

    // A task's status chip: its column's colour and where it is ("Merged into main", "Build — 2 queued")
    #colColor(t, col) {
      return { needs: 'var(--waiting)', failed: t.status === 'stopped' ? 'var(--idle)' : 'var(--waiting)', done: 'var(--done)', review: 'var(--cat-workflow)', running: 'var(--thinking)', queued: 'var(--idle)' }[col];
    }

    #statusChip(t, col) {
      const st = t.template.stages[t.stage];
      const queued = t.instances.filter(i => i.status === 'queued' && i.stage === st?.id).length;
      const color = this.#colColor(t, col);
      const stageText = t.status === 'done' ? (t.merged ? `${t.merged.applied ? 'Applied to' : 'Merged into'} ${t.merged.into}` : 'Done')
        : t.status === 'stopped' ? 'Stopped' : `${st?.title || ''}${queued ? ` — ${T.queuedN(queued)}` : ''}`;
      return `<span class="chip c" style="--c:${color}" title="${esc(stageText)}"><span class="d${col === 'running' ? ' live' : ''}"></span>${esc(stageText)}</span>`;
    }

    // ---------- list ----------

    #list(by) {
      const key = this.sort.key;
      const value = {
        recent: t => t.createdAt,
        title: t => t.title.toLowerCase(),
        project: t => t.project.name.toLowerCase(),
        pattern: t => (PATTERN[t.template.id] || t.template.name).toLowerCase(),
        time: t => (t.endedAt || Date.now()) - t.createdAt,
        diff: t => { const d = this.#bestDiff(t); return d ? d.added + d.deleted : -1; },
      }[key] || (t => t.createdAt);
      const order = (a, b) => { const x = value(a); const y = value(b); return (x < y ? -1 : x > y ? 1 : 0) * this.sort.dir; };
      const th = (k, cls = '') => {
        const on = key === k;
        return `<span class="${cls}"><button type="button" data-sort="${k}"${on ? ` aria-sort="${this.sort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>${T.lcol[k]}${on ? (this.sort.dir > 0 ? ' ↑' : ' ↓') : ''}</button></span>`;
      };
      const head = `<div class="lrow lhead">${th('title')}${th('project')}${th('pattern', 'c-pat')}<span><button type="button" disabled>${T.lcol.status}</button></span><span class="c-who"><button type="button" disabled>${T.lcol.who}</button></span>${th('time', 'r')}${th('diff', 'r')}</div>`;
      const filled = COLS.filter(c => by[c].length);
      const groups = filled.map(c => {
        const open = !this.collapsed.has(c);
        return `<section aria-label="${T.cols[c]}"><button type="button" class="grp" data-group="${c}" aria-expanded="${open}">${ICON.chev}${T.cols[c]} <em class="${c === 'needs' ? 'hot' : ''}">${by[c].length}</em></button>
          ${open ? by[c].slice().sort(order).map(t => this.#row(t, c)).join('') : ''}</section>`;
      }).join('');
      const empty = COLS.filter(c => !by[c].length).map(c => T.cols[c]);
      return `<div class="tlist" data-k="list">${filled.length ? head + groups : `<div class="empty">${T.noMatch}</div>`}
        ${empty.length && filled.length ? `<div class="others">${esc(T.emptyGroups(empty.join(' · ')))}</div>` : ''}</div>`;
    }

    #row(t, col) {
      const best = this.#bestDiff(t);
      const agents = (t.template.stages.find(s => s.role === 'builder')?.agents || []).flatMap(a => Array.from({ length: Math.min(a.count, 4) }, () => a.adapter));
      return `<button type="button" class="lrow trow${col === 'needs' ? ' needs' : ''}" data-open="${esc(t.id)}" title="${esc(t.title)}">
        <span class="tt">${ICON.flow}<span><b>${esc(t.title)}</b>${t.gate ? `<small>${esc(t.gate.title)}</small>` : ''}</span></span>
        <span class="m"><span class="chip out">${esc(t.project.name)}</span></span>
        <span class="m c-pat">${esc(PATTERN[t.template.id] || t.template.name)}</span>
        <span class="m">${this.#statusChip(t, col)}</span>
        <span class="who c-who">${agents.map(a => novi(a)).join('')}</span>
        <span class="m r num" title="${esc(clockTime(t.createdAt))}">${elapsed(t)}</span>
        <span class="r">${best ? `<span class="diff"><span class="a">+${best.added}</span> <span class="r">−${best.deleted}</span></span>` : '<span class="m">—</span>'}</span>
      </button>`;
    }

    // ---------- timeline ----------

    #timeline(by) {
      const items = COLS.flatMap(c => by[c].map(t => ({ t, col: c })));
      if (!items.length) { return `<div class="tline" data-k="timeline"><div class="empty">${T.noMatch}</div></div>`; }
      const now = Date.now();
      const dayOf = at => new Date(at).toDateString();
      const label = key => {
        const d = new Date(key);
        const today = new Date(now);
        const yesterday = new Date(now - 86_400_000);
        return key === today.toDateString() ? T.today : key === yesterday.toDateString() ? T.yesterday
          : d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
      };
      const days = new Map();
      for (const it of items.sort((a, b) => b.t.createdAt - a.t.createdAt)) {
        const k = dayOf(it.t.createdAt);
        if (!days.has(k)) { days.set(k, []); }
        days.get(k).push(it);
      }
      return `<div class="tline" data-k="timeline">${[...days].map(([k, list]) => {
        // The day's clock: its first start to its last end (at least half an hour, so short tasks still read)
        const lo = Math.min(...list.map(x => x.t.createdAt));
        const hi = Math.max(lo + 30 * 60_000, ...list.map(x => x.t.endedAt || now));
        const pos = at => ((at - lo) / (hi - lo)) * 100;
        const ticks = [0, 0.25, 0.5, 0.75, 1].map(f => `<span style="left:${f * 100}%">${clockTime(lo + f * (hi - lo))}</span>`).join('');
        const lanes = list.map(({ t, col }) => {
          const left = pos(t.createdAt);
          const width = Math.max(0.5, pos(t.endedAt || now) - left);
          const live = !t.endedAt && (col === 'running' || col === 'needs' || col === 'queued');
          const sub = t.gate ? `<small class="why">${esc(t.gate.title)}</small>` : `<small>${esc(t.project.name)} · ${esc(PATTERN[t.template.id] || t.template.name)}</small>`;
          return `<button type="button" class="lane" data-open="${esc(t.id)}" title="${esc(`${t.title}\n${T.startedAt(clockTime(t.createdAt), elapsed(t))}`)}">
            <span class="tt">${ICON.flow}<span><b>${esc(t.title)}</b>${sub}</span></span>
            <span class="track"><span class="bar${live ? ' live' : ''}" style="--c:${this.#colColor(t, col)};left:${left.toFixed(2)}%;width:${width.toFixed(2)}%"></span></span>
            <span class="r num">${elapsed(t)}</span>
          </button>`;
        }).join('');
        return `<section class="day" aria-label="${esc(label(k))}"><div class="dhd"><b>${esc(label(k))}<em>${list.length}</em></b><div class="axis" aria-hidden="true">${ticks}</div><span></span></div>${lanes}</section>`;
      }).join('')}</div>`;
    }

    #card(t, col) {
      const builders = t.template.stages.find(s => s.role === 'builder')?.agents || [];
      const best = this.#bestDiff(t);
      const why = t.gate ? `<div class="why">${ICON.warn}<span>${esc(t.gate.title)}</span></div>` : '';
      const waiting = t.instances.find(i => i.status === 'queued' && i.waiting);
      // Slides in only when it is new to this column (not on every refresh); nothing on the first paint
      const seen = `${t.id}:${col}`;
      const fresh = this.#seenCards && !this.#seenCards.has(seen);
      return `<button type="button" class="tcard${col === 'needs' ? ' needs' : ''}${fresh ? ' fresh' : ''}" data-open="${esc(t.id)}" data-seen="${esc(seen)}">
        <div class="tt">${ICON.flow}<b>${esc(t.title)}</b></div>
        <div class="ln"><span class="chip out">${esc(t.project.name)}</span>${esc(PATTERN[t.template.id] || t.template.name)}</div>
        <div class="ln">${this.#statusChip(t, col)}</div>
        ${why}${waiting ? `<div class="ln" style="color:var(--working)" title="${esc(waiting.waiting)}">${esc(this.#waitingText(waiting.waiting))}</div>` : ''}
        ${this.#cardUsage(t) || `<div class="agents">${builders.map(a => `<span>${novi(a.adapter)}×${a.count}</span>`).join('')}</div>`}
        <div class="ln">${ICON.clock}<span class="num">${elapsed(t)}</span>${best ? `<span class="diff"><span class="a">+${best.added}</span> <span class="r">−${best.deleted}</span></span>` : ''}</div>
      </button>`;
    }

    // While a task runs: its agents per adapter against the adapter's limit — Claude ●●○○ 2/4 +1
    #cardUsage(t) {
      if (t.status !== 'running' && t.status !== 'needs-you') { return ''; }
      const by = {};
      for (const i of t.instances) {
        if (LIVE.has(i.status) || i.status === 'queued') {
          by[i.adapter] = by[i.adapter] || { live: 0, queued: 0 };
          by[i.adapter][i.status === 'queued' ? 'queued' : 'live'] += 1;
        }
      }
      const rows = Object.entries(by).map(([a, u]) => {
        const max = this.usage?.agents?.[a]?.max || 1;
        const over = u.live > max;
        return `<span class="cu" title="${esc(T.usageTip(Agent.displayName(a), u.live, max, u.queued))}">${esc(Agent.displayName(a).split(' ')[0])}
          <span class="dots" style="--c:${Agent.color(a)}">${Array.from({ length: max }, (_, k) => `<i class="${k < u.live ? 'on' : ''}"></i>`).join('')}</span>
          <b class="num">${u.live}/${max}</b>${u.queued ? `<em class="num">+${u.queued}</em>` : ''}${over ? `<em>${T.overLimit}</em>` : ''}</span>`;
      });
      return rows.length ? `<div class="ln cuse">${rows.join('')}</div>` : '';
    }

    #bestDiff(t) {
      const c = t.candidates.find(x => x.id === t.winner) || t.candidates.filter(x => x.diff).sort((a, b) => (b.diff.added + b.diff.deleted) - (a.diff.added + a.diff.deleted))[0];
      return c?.diff || null;
    }

    #detail(t) {
      const live = t.status === 'running' || t.status === 'needs-you';
      const statusColor = { running: 'var(--thinking)', 'needs-you': 'var(--waiting)', done: 'var(--done)', stopped: 'var(--idle)', failed: 'var(--waiting)' }[t.status];
      const steps = t.template.stages.map((s, i) => {
        const st = t.stages[i];
        const cls = { done: 'done', running: 'run', waiting: 'wait', stopped: 'fail', failed: 'fail' }[st.status] || '';
        const inner = cls === 'done' ? ICON.check : cls === 'wait' ? '!' : cls === 'fail' ? '×' : '';
        return `${i ? '<span class="sline"></span>' : ''}<div class="sstep ${cls}" data-k="step:${esc(t.id)}:${i}" data-v="${cls}"${i === t.stage && live ? ' aria-current="step"' : ''}><span class="si">${inner}</span><span>${esc(s.title)} <small>${esc(this.#stageNote(t, s, st))}</small></span></div>`;
      }).join('');
      const orch = t.template.stages.some(s => s.role === 'orchestrator');
      const board = !orch && !t.template.stages.some(s => s.role === 'builder');
      const arb = t.template.stages.some(s => s.role === 'arbiter' && s.agents?.length);
      const tabs = board ? [['overview'], ...(arb ? [['report', t.report?.findings?.length || '']] : []), ...(t.runbook ? [['runbook', t.runbook.steps.length || '']] : []), ['reviews', t.instances.filter(i => (i.role === 'reviewer' || i.role === 'analyst') && i.status === 'done').length || ''], ['log']]
        : [['overview'], ['plan'], ['candidates', t.candidates.length || ''], ['decision'], ['tests'], ['log']];
      if (t.template.stages.some(s => s.role === 'discussion')) { tabs.splice(1, 0, ['discussion', t.discussion?.messages?.length || '']); }
      if (orch) { tabs.splice(1, 1, ['delegation', t.orchestrator?.workers?.length || '']); } // no plan: its turns are in Delegation
      if (DISCUSSION_MODE) { this.tab = 'discussion'; }
      if (!tabs.some(([k]) => k === this.tab)) { this.tab = 'overview'; }
      const pane = { delegation: () => this.#delegation(t), discussion: () => this.#discussion(t), overview: () => this.#overview(t), plan: () => this.#plan(t), candidates: () => this.#candidates(t), tests: () => this.#tests(t), reviews: () => this.#reviews(t), decision: () => this.#decision(t), report: () => this.#report(t), runbook: () => this.#runbook(t), log: () => this.#log(t) }[this.tab]();
      return `<div class="dhead"><div class="t">
          <button class="crumb" type="button" data-act="board">${ICON.back} ${T.back}</button>
          <h1 tabindex="-1">${esc(t.title)}</h1>
          <div class="meta"><span class="chip out">${esc(t.project.name)}</span><span class="chip c" style="--c:var(--cat-workflow)">${esc(T.category[t.category] || t.category)}</span>
            <span class="chip">${esc(PATTERN[t.template.id] || t.template.name)}</span><span class="chip c" style="--c:${statusColor}"><span class="d"></span>${T.status[t.status]}</span>
            <span>${ICON.clock} <span class="num">${elapsed(t)}</span></span></div></div>
          ${live ? (this.composing?.action === 'stop'
            ? `<span class="confirm" style="color:var(--waiting);font-weight:600;max-width:280px">${T.stopAsk}</span><button class="btn danger" type="button" data-act="stop-yes">${T.yesStop}</button><button class="btn" type="button" data-act="cancel">${T.cancel}</button>`
            : this.composing?.action === 'stop-stage'
              ? `<span class="confirm" style="color:var(--waiting);font-weight:600;max-width:280px">${esc(T.stopStageAsk(t.template.stages[t.stage]?.title || ''))}</span><button class="btn danger" type="button" data-act="stop-stage-yes">${T.yesStopStage}</button><button class="btn" type="button" data-act="cancel">${T.cancel}</button>`
              : `${this.#stageStoppable(t) ? `<button class="btn" type="button" data-act="stop-stage">${ICON.stop} ${T.stopStage}</button>` : ''}<button class="btn danger" type="button" data-act="stop">${ICON.stop} ${T.stop}</button>`) : ''}
        </div>
        <nav class="stepbar" aria-label="Stages">${steps}</nav>
        ${t.status === 'stopped' ? `<div class="banner" style="--c:var(--idle)">${T.stopped}</div>` : ''}
        <div class="tabs" role="tablist">${tabs.map(([k, n]) => `<button type="button" class="tab" role="tab" data-tab="${k}" aria-selected="${this.tab === k}" aria-controls="pane" tabindex="${this.tab === k ? 0 : -1}">${k === 'reviews' && t.template.stages.some(x => x.role === 'analyst') ? T.analystsTab : T.tabs[k]}${n ? `<em data-k="tab:${t.id}:${k}" data-v="${n}">${n}</em>` : ''}</button>`).join('')}</div>
        <div class="pane" id="pane" role="tabpanel" aria-label="${esc(T.tabs[this.tab] || this.tab)}" data-k="pane:${esc(t.id)}:${this.tab}">${pane}</div>
        ${t.gate ? this.#actions(t) : ''}`;
    }

    // The current stage runs agents (not one of Bayloob's own steps) and nothing waits on you
    #stageStoppable(t) {
      const st = t.template.stages[t.stage];
      return t.status === 'running' && t.stages[t.stage]?.status === 'running' && !st?.action && !!st?.agents?.length;
    }

    #stageNote(t, s, st) {
      // The orchestrator: "turn 3 · 2 working · 4 of 6 workers"
      if (s.role === 'orchestrator' && t.orchestrator) {
        const o = t.orchestrator;
        const busy = o.workers.filter(w => w.status === 'running' || w.status === 'queued').length;
        return `turn ${o.turns}${busy ? ` · ${busy} working` : ''} · ${o.workers.length} of ${o.budget.workers} workers`;
      }
      // A discussion: "Round 2/3 · 2 of 3 agree"
      if (s.role === 'discussion' && t.discussion?.stage === s.id) {
        const d = t.discussion;
        const n = Math.min(10, (Number(s.rounds) || 3) + (d.extraRounds || 0));
        return `Round ${d.round}/${n}${d.agreement?.of ? ` · ${d.agreement.agree} of ${d.agreement.of} agree` : ''}`;
      }
      const round = t.instances.filter(i => i.stage === s.id && i.round === st.round);
      if (s.role === 'builder') { const n = t.candidates.filter(c => c.id !== 'integrate-1').length; return n ? `×${n}` : ''; }
      if (s.action === 'integrate') { const c = t.candidates.find(x => x.id === 'integrate-1'); return c ? `${c.parts.length} parts` : ''; }
      if (s.action === 'run-tests') {
        const tested = t.candidates.filter(c => c.tests && c.tests.ok !== null);
        return tested.length ? `${T.of(tested.filter(c => c.tests.ok).length, tested.length)} pass` : '';
      }
      if (s.role === 'arbiter' && t.report) { return `${t.report.findings.length} findings`; }
      if (s.role === 'arbiter' && t.arbiter) { return t.arbiter.winner ? `${t.arbiter.winner} · ${t.arbiter.confidence}` : t.arbiter.decision; }
      if (s.role === 'arbiter') { return t.winner ? t.winner : st.status === 'waiting' ? 'you pick' : s.agents?.[0] ? Agent.displayName(s.agents[0].adapter) : ''; }
      if (s.action === 'merge') { return t.merged ? `into ${t.merged.into}` : ''; }
      if (s.gate === 'human' && st.status === 'done') { return 'approved'; }
      if (round.length > 1) { return `×${round.length}`; }
      return round.length ? Agent.displayName(round[0].adapter) : (s.agents?.[0] ? Agent.displayName(s.agents[0].adapter) : '');
    }

    // ---------- tabs ----------

    #overview(t) {
      const home = this.state?.home;
      const rows = t.instances.map(i => `<tr>
          <td><span class="who">${novi(i.adapter)}<span>${esc(Agent.displayName(i.adapter))}<br><small class="mono" style="color:var(--muted)">${esc(i.id)}</small></span></span></td>
          <td>${esc(i.role)}</td><td><span class="badge ${i.mode === 'writes' ? 'writes' : i.mode === 'plan' ? 'plan' : 'ro'}">${T.mode[i.mode] || i.mode}</span></td>
          <td>${T.istatus[i.status] || i.status}${i.waiting ? `<br><span class="wait">${esc(this.#waitingText(i.waiting))}</span>` : ''}${i.error ? `<br><span class="wait" style="color:var(--waiting)">${esc(i.error)}</span>` : ''}</td>
          <td class="num">${i.startedAt ? clockTime(i.startedAt) : '—'}</td>
          <td><span class="rowacts">${this.composing?.action === 'stop-inst' && this.composing.inst === i.id
            ? `<span class="confirm">${T.stopAgentAsk}</span><button class="btn sm danger" type="button" data-act="stop-inst-yes">${T.yesStop}</button><button class="btn sm" type="button" data-act="cancel">${T.cancel}</button>`
            : `${i.handle && LIVE.has(i.status) || (i.handle && t.status !== 'done' && t.status !== 'stopped') ? `<button class="btn sm" type="button" data-term="${esc(i.id)}" title="${T.terminalTip}">${ICON_TERM} ${T.terminal}</button>` : ''}${(LIVE.has(i.status) || i.status === 'queued') && OPEN_TASK.has(t.status) ? `<button class="btn sm ghost" type="button" data-stop-inst="${esc(i.id)}" title="${T.stopAgentTip}" aria-label="${T.stopAgentTip}">${ICON.stop} ${T.stopAgent}</button>` : ''}`}</span></td></tr>`).join('');
      return `<div class="cards">
        <div class="card md">${renderMarkdown(t.text)}</div>
        <div class="facts">
          <div><span class="label">${T.the.project}</span><b title="${esc(t.project.root)}">${esc(tilde(t.project.root, home))}</b></div>
          <div><span class="label">${T.the.base}</span><b class="mono">${t.base.fromWorktree ? esc(T.yourFiles(t.base.branch)) : `${esc(t.base.branch)} @ ${esc(t.base.sha.slice(0, 8))}`}</b></div>
          ${t.review ? `<div><span class="label">${T.reviews}</span><b class="mono" title="${esc(`${t.review.from}..${t.review.to}`)}">${esc(t.review.label)}</b></div>` : ''}
          <div><span class="label">${T.the.ro}</span><b title="${esc(t.roDir)}">${esc(tilde(t.roDir, home))}</b></div>
          <div><span class="label">${T.the.tests}</span><b class="mono">${esc(t.testCommand || T.the.noTests)}</b></div>
          ${t.attachments?.length ? `<div><span class="label">${T.the.files}</span><b>${t.attachments.map(f => `<span class="mono" title="${esc([f.name, f.note, f.secrets ? T.the.sentAnyway : ''].filter(Boolean).join(' · '))}">${esc(f.file)}${f.secrets ? ' ⚠' : ''}</span>`).join(', ')}</b><small style="color:var(--muted)">${T.the.filesWhere}</small></div>` : ''}
        </div>
        <div><div class="label" style="margin-bottom:6px">${T.instances}</div>
          ${rows ? `<table class="tbl"><thead><tr><th>${T.inst.agent}</th><th>${T.inst.role}</th><th>${T.inst.mode}</th><th>${T.inst.status}</th><th>${T.inst.time}</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${rows}</tbody></table>` : stateBlock({ line: T.noInstances })}</div>
      </div>`;
    }

    // ---------- Discussion (14): who's in it, the thread (or columns / stance timeline / raw), and the summary ----------

    disc = { view: 'thread', filter: null, q: '', to: '', text: '' };

    // The orchestrator's first batch, at its gate: who it starts, how, with which files and prompt; what was refused
    #batchHtml(g) {
      const D = T.deleg;
      const rows = g.batch.filter(a => a.do === 'start').map(a => `<li><b>${esc(a.id)}</b> · ${esc(AGENTS[a.agent]?.name || a.agent)} · ${a.mode === 'writes' ? `${D.writes} <code>${esc(a.files.join(', '))}</code>` : D.readOnly}<small>${esc(a.prompt.length > 240 ? `${a.prompt.slice(0, 240)}…` : a.prompt)}</small></li>`).join('');
      const no = (g.refused || []).map(r => `<li class="refused">${esc(r.do)} <b>${esc(r.id)}</b> — ${esc(r.why)}</li>`).join('');
      return `<span class="batch"><span class="h">${D.batch}</span><ul>${rows}${no ? `<li class="h">${D.refused}</li>${no}` : ''}</ul></span>`;
    }

    // Delegation: the orchestrator's budget, its workers (status, mode, files, changes), and its turns as it wrote them
    #delegation(t) {
      const D = T.deleg;
      const o = t.orchestrator;
      if (!o) { return stateBlock({ kind: 'loading', line: D.none }); }
      const mins = Math.round((Math.min(Date.now(), t.endedAt || Date.now()) - o.startedAt) / 60000);
      const head = `<p class="deleg-sum"><b>${D.turn(o.turns)}</b> · ${D.used(o.workers.length, o.budget.workers)} · ${D.turns(o.turns, o.budget.turns)} · ${D.minutes(Math.min(mins, o.budget.minutes), o.budget.minutes)}</p>`;
      const cand = id => t.candidates.find(c => c.id === id);
      const rows = o.workers.map(w => {
        const c = w.candidate ? cand(w.candidate) : null;
        const diff = c?.diff ? ` · ${c.diff.files} files +${c.diff.added} −${c.diff.deleted}` : '';
        return `<li class="w ${esc(w.status)}">${novi(w.agent, 's')}<span><span><b>${esc(w.id)}</b> · ${esc(AGENTS[w.agent]?.name || w.agent)} · ${w.mode === 'writes' ? `${D.writes} <code>${esc((w.files || []).join(', '))}</code>` : D.readOnly}</span><small>${esc(D.status[w.status] || w.status)}${diff}</small></span></li>`;
      }).join('');
      const turns = Array.from({ length: o.turns }, (_, k) => o.turns - k).map(n => {
        const text = this.#artifact(t.id, `orchestrator.${n}.md`);
