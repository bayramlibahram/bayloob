        return `<details${n === o.turns ? ' open' : ''}><summary>${D.turn(n)}</summary>${text === undefined ? this.#loadState(t.id, `orchestrator.${n}.md`) : `<pre class="output">${esc(text || '')}</pre>`}</details>`;
      }).join('');
      return `${head}<h3 class="dh">${D.workers}</h3>${rows ? `<ul class="deleg">${rows}</ul>` : `<p class="muted">${D.none}</p>`}
        ${turns ? `<h3 class="dh">${D.turnsTitle}</h3><div class="deleg-turns">${turns}</div>` : ''}`;
    }

    #discussion(t) {
      const d = t.discussion;
      if (!d) { return stateBlock({ kind: 'empty', icon: novi(MANAGER, 'l'), title: T.disc.notYet, line: T.disc.notYetHint }); }
      const D = T.disc;
      const st = t.template.stages.find(x => x.id === d.stage);
      const rounds = Math.min(10, (Number(st?.rounds) || 3) + (d.extraRounds || 0));
      const name = id => id === 'you' ? D.you : d.participants.find(p => p.id === id)?.name || id;
      const adapter = id => d.participants.find(p => p.id === id)?.adapter;
      const color = id => id === 'you' ? 'var(--brand)' : Agent.color(adapter(id) || 'other');
      const latest = {};
      for (const m of d.messages) { if (m.reply) { latest[m.from] = m; } }
      const live = new Map(t.instances.filter(i => i.speaker && i.stage === d.stage && (LIVE.has(i.status) || i.status === 'queued')).map(i => [i.speaker, i.status]));
      const chip = (cls, text) => `<span class="stc st-${cls}">${esc(text)}</span>`;
      const bar = (c, v) => `<span class="cbar" style="--c:${c}"><i style="width:${Math.round((v || 0) * 100)}%"></i></span>`;
      const open = t.status === 'running' || t.status === 'needs-you';

      const people = `<aside class="people" aria-label="Participants">
        ${d.participants.map(p => {
          const l = latest[p.id]?.reply;
          const state = !d.active.includes(p.id) ? 'removed' : LIVE.has(live.get(p.id)) ? 'speaking' : live.get(p.id) === 'queued' || d.queue?.[0] === p.id ? 'waiting' : l ? 'done' : 'idle';
          const c = { speaking: 'var(--working)', waiting: 'var(--thinking)', done: 'var(--done)', idle: 'var(--idle)', removed: 'var(--idle)' }[state];
          return `<button type="button" class="who" data-disc-filter="${esc(p.id)}" aria-pressed="${this.disc.filter === p.id}" title="${esc(D.all)}: ${esc(p.name)}">
            ${novi(p.adapter)}<span><b>${esc(p.name.split(' · ')[0])}</b><small>${esc(p.label)} · ${esc(p.id)}</small></span>
            <span class="meta"><span class="live${state === 'speaking' ? ' on' : ''}" style="--c:${c}"><i></i>${D.live[state]}</span>${l ? chip(l.stance, D.stance[l.stance]) : ''}</span>
            ${l ? `<span class="conf">${D.confidence} ${bar(color(p.id), l.confidence)}<b class="num">${l.confidence.toFixed(2)}</b></span>` : ''}
          </button>`; }).join('')}
        <span class="conf" style="grid-column:auto;padding:4px 8px">${D.tokens(d.tokens || 0)}</span>
      </aside>`;

      const q = this.disc.q.trim().toLowerCase();
      const shown = d.messages.filter(m => (!this.disc.filter || m.from === this.disc.filter) && (!q || m.text.toLowerCase().includes(q)));
      const card = m => {
        const pin = `<button type="button" class="btn ghost sm" data-disc-pin="${esc(m.id)}" aria-pressed="${!!m.pinned}">${m.pinned ? D.unpin : D.pin}</button>`;
        const head = `<header>${m.from === 'you' ? novi(MANAGER) : novi(adapter(m.from))}<b>${esc(name(m.from))}</b>${m.to ? `<small>→ ${esc(name(m.to))}</small>` : ''}<small>${clockTime(m.at)}</small>
          <span class="sp">${m.pinned ? chip('pinned', D.pinned) : ''}${m.changed ? chip('changed', D.changed) : ''}${m.reply ? `${chip(m.reply.stance, D.stance[m.reply.stance])}<small class="num">${m.reply.confidence.toFixed(2)}</small>` : m.unstructured ? chip('unstructured', D.unstructured) : ''}${open ? pin : ''}</span></header>`;
        const label = `${name(m.from)}, ${D.round(m.round, rounds)}${m.reply ? `, ${D.stance[m.reply.stance]}` : ''}`;
        const body = m.reply
          ? `<h4>Position</h4><div class="md">${renderMarkdown(m.reply.position)}</div>${m.reply.responses ? `<h4>Responses</h4><div class="md">${renderMarkdown(m.reply.responses)}</div>` : ''}${m.reply.proposal ? `<h4>Proposal</h4><div class="md">${renderMarkdown(m.reply.proposal)}</div>` : ''}`
          : `<div class="md">${renderMarkdown(m.text)}</div>`;
        return `<article class="msg${m.from === 'you' ? ' you' : ''}" id="dm-${esc(m.id)}" style="--c:${color(m.from)}" aria-label="${esc(label)}" data-k="dm:${esc(m.id)}">${head}${body}</article>`;
      };
      const thinking = [...live].filter(([, s]) => LIVE.has(s)).map(([id]) => id === 'decider'
        ? `<article class="msg thinking" style="--c:var(--brand)" aria-label="${esc(D.decision)}">${esc(D.thinking(D.decision))}<span class="dots"><i></i><i></i><i></i></span></article>`
        : `<article class="msg thinking" style="--c:${color(id)}" aria-label="${esc(D.thinking(name(id)))}">${novi(adapter(id))} ${esc(D.thinking(name(id)))}<span class="dots"><i></i><i></i><i></i></span></article>`).join('');
      const byRound = [...new Set(shown.map(m => m.round))].sort((a, b) => a - b);
      const thread = `<div role="feed" aria-busy="${live.size > 0}" aria-label="Discussion thread" style="display:flex;flex-direction:column;gap:10px">
        ${byRound.map(r => `<div class="rhead"><b>${D.round(r, rounds)}</b>${r === d.round ? `<small>${esc(D.agree(d.agreement))}</small>` : ''}<hr></div>${shown.filter(m => m.round === r).map(card).join('')}`).join('')}
        ${thinking}</div>`;
      const ids = d.participants.map(p => p.id);
      const allRounds = Array.from({ length: d.round }, (_, i) => i + 1);
      const at = (id, r) => [...d.messages].reverse().find(m => m.from === id && m.round === r && m.reply);
      const columns = `<div class="grid" role="table" style="grid-template-columns:80px repeat(${ids.length}, minmax(0, 1fr))"><span></span>${d.participants.map(p => `<span class="cell" role="columnheader">${novi(p.adapter, 's')} ${esc(p.name)}</span>`).join('')}
        ${allRounds.map(r => `<span class="rl" role="rowheader">${D.round(r, rounds)}</span>${ids.map(id => { const m = at(id, r); return `<span class="cell" role="cell">${m ? `${chip(m.reply.stance, D.stance[m.reply.stance])}<div class="md">${renderMarkdown(m.reply.proposal || m.reply.position)}</div>` : '—'}</span>`; }).join('')}`).join('')}</div>`;
      const timeline = `<div class="grid" role="table" style="grid-template-columns:200px repeat(${Math.max(1, d.round)}, minmax(140px, 1fr))"><span></span>${allRounds.map(r => `<span class="rl" role="columnheader">${D.round(r, rounds)}</span>`).join('')}
        ${d.participants.map(p => `<span class="rl" role="rowheader">${novi(p.adapter, 's')} ${esc(p.name)}</span>${allRounds.map(r => { const m = at(p.id, r); return `<span class="cell${m?.changed ? ' chg' : ''}" role="cell">${m ? `${chip(m.reply.stance, D.stance[m.reply.stance])}${m.changed ? ` ${chip('changed', D.changed)}` : ''}<span class="conf" style="margin-top:6px">${bar(color(p.id), m.reply.confidence)}<b class="num">${m.reply.confidence.toFixed(2)}</b></span>` : '—'}</span>`; }).join('')}`).join('')}</div>`;
      const raw = d.messages.map(m => `<details class="raw"><summary class="mono">${D.round(m.round, rounds)} · ${esc(m.from)}${m.to ? ` → ${esc(m.to)}` : ''} · ${m.text.length} chars</summary><pre>${esc(m.text)}</pre></details>`).join('');
      const view = { thread, columns, timeline, raw }[this.disc.view] || thread;

      const composer = open ? `<form class="composer" onsubmit="return false" aria-label="Write to the participants">
        <div class="row"><label class="grow" style="flex:none">To <select data-disc-to aria-label="Send to"><option value="">${D.toAll}</option>${d.participants.filter(p => d.active.includes(p.id)).map(p => `<option value="${esc(p.id)}"${this.disc.to === p.id ? ' selected' : ''}>@${esc(p.name)}</option>`).join('')}</select></label></div>
        <textarea data-disc-text aria-label="Message to the participants" placeholder="${esc(D.composerPh)}">${esc(this.disc.text)}</textarea>
        <div class="row"><span class="grow">${D.keys}</span>
          <button type="button" class="btn" data-disc-act="pause" aria-pressed="${!!d.pauseAfterRound}">${d.pauseAfterRound ? D.unpause : D.pause}</button>
          ${t.gate?.kind === 'discussion' || d.ended ? '' : `<button type="button" class="btn" data-disc-act="end">${D.end}</button>`}
          ${this.disc.to ? `<button type="button" class="btn" data-disc-act="ask">${D.ask}</button>` : ''}
          <button type="button" class="btn primary" data-disc-act="message">${D.send}</button></div>
      </form>` : '';

      const center = `<section class="center">
        <div class="dtools"><div class="seg" role="group" aria-label="View">${Object.entries(D.views).map(([k, n]) => `<button type="button" data-disc-view="${k}" aria-pressed="${this.disc.view === k}">${n}</button>`).join('')}</div>
          <input data-disc-q value="${esc(this.disc.q)}" placeholder="${esc(D.search)}" aria-label="${esc(D.search)}">
          ${this.disc.filter ? `<button type="button" class="btn ghost sm" data-disc-filter="">${D.showAll}</button>` : ''}
          <button type="button" class="btn ghost sm" data-disc-save style="margin-left:auto">${D.save}</button>
          ${DISCUSSION_MODE || !this.api.openDiscussion ? '' : `<button type="button" class="btn sm" data-disc-window title="${esc(D.windowTip)}">${D.window}</button>`}</div>
        ${view}${composer}</section>`;

      // the summary: who backs whom now, the live proposals, open points, and the decision
      const cell = (row, col) => {
        if (row === col) { return '<td class="self">—</td>'; }
        const l = latest[row]?.reply;
        if (l?.agreesWith.includes(col)) { return `<td class="y">✓<span class="tx">${D.supports}</span></td>`; }
        if (l?.stance === 'oppose' && ['propose', 'revise'].includes(latest[col]?.reply.stance)) { return `<td class="n">✗<span class="tx">${D.opposes}</span></td>`; }
        return `<td>–<span class="tx">${D.neutral}</span></td>`;
      };
      const proposals = d.participants.map(p => latest[p.id]).filter(m => m && ['propose', 'revise'].includes(m.reply.stance))
        .map(m => ({ m, n: 1 + d.participants.filter(q => latest[q.id]?.reply.agreesWith.includes(m.from)).length }))
        .sort((a, b) => b.n - a.n);
      const openPts = [...new Map(Object.values(latest).flatMap(m => m.reply.openPoints).map(o => [o.toLowerCase().replace(/\W+/g, ' ').trim(), o])).values()];
      const decisionText = d.decision ? this.#artifact(t.id, d.decision.artifact) : null;
      const side = `<aside class="side" aria-label="Summary">
        <section class="card"><h3>${D.agreement}</h3><table class="matrix"><thead><tr><th>${D.matrixHead}</th>${d.participants.map(p => `<th title="${esc(p.name)}">${novi(p.adapter, 's')}</th>`).join('')}</tr></thead>
          <tbody>${d.participants.map(r => `<tr><th>${novi(r.adapter, 's')} ${esc(r.label)}</th>${ids.map(c => cell(r.id, c)).join('')}</tr>`).join('')}</tbody></table>
          <p class="conf" style="margin-top:8px">${esc(D.agree(d.agreement))}</p></section>
        <section class="card"><h3>${D.proposals}</h3>${proposals.length ? proposals.map(({ m, n }) => `<div class="prop"><div class="md">${renderMarkdown(m.reply.proposal || m.reply.position)}</div><small>${esc(D.by(name(m.from), m.round))} · ${esc(D.support(n))}</small></div>`).join('') : `<small style="color:var(--muted)">${D.noProposals}</small>`}</section>
        <section class="card"><h3>${D.open} · ${openPts.length}</h3>${openPts.length ? `<ul class="open">${openPts.map(o => `<li>${esc(o)}</li>`).join('')}</ul>` : `<small style="color:var(--muted)">${D.none}</small>`}</section>
        <section class="card"><h3>${D.decision}</h3>
          ${decisionText ? `<div class="md">${renderMarkdown(decisionText)}</div><small style="color:var(--muted)">${esc(D.decidedBy(d.decision.by))}</small>`
            : `<small style="color:var(--muted)">${esc(d.ended ? D.ended[d.ended] || d.ended : D.running(d.round, rounds))}</small>`}</section>
      </aside>`;
      return `<div class="disc">${people}${center}${side}</div>`;
    }

    async #discussionAct(t, action, opts = {}) {
      const r = await this.api.discussion?.(t.id, action, opts);
      if (!r?.ok) { this.toast(r?.error || 'Something went wrong', true); return false; }
      return true;
    }

    // Saves the thread as Markdown (thread.md, as the participants read it)
    async #saveThread(t) {
      const text = await this.api.artifact(t.id, 'thread.md').catch(() => null);
      if (!text) { return this.toast('There is no thread yet', true); }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'text/markdown' }));
      a.download = `discussion-${t.id}.md`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }

    #plan(t) {
      const plan = this.#artifact(t.id, 'plan.md');
      const loading = this.#loadState(t.id, 'plan.md');
      if (loading) { return loading; }
      if (!plan) { return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.noPlan}</b>${T.noPlanHint}</div>`; }
      // Split work: the subtasks block is shown as cards above; the raw JSON stays one click away
      let body = plan;
      let raw = '';
      if (t.subtasks) {
        const blocks = [...plan.matchAll(/```(?:json)?\s*\n[\s\S]*?```/g)].filter(m => m[0].includes('"subtasks"'));
        const last = blocks.at(-1);
        if (last) {
          body = plan.slice(0, last.index) + plan.slice(last.index + last[0].length);
          raw = `<details class="more"><summary>${T.rawJson}</summary><pre class="output">${esc(last[0].replace(/^```(?:json)?\s*\n|```$/g, ''))}</pre></details>`;
        }
      }
      return `${this.#subtasks(t)}<div class="card md" style="max-width:980px">${renderMarkdown(body)}${raw}</div>`;
    }

    // Split work: who owns which files — overlaps marked, before any builder starts
    #subtasks(t) {
      const s = t.subtasks;
      if (!s) { return ''; }
      if (s.error) { return `<div class="subs"><div class="banner" style="--c:var(--waiting)">${ICON.warn}<span><b>${T.subsBad}</b><br>${esc(s.error)}</span></div></div><br>`; }
      const clash = new Set(s.overlaps.map(o => o.file));
      const owner = id => t.candidates.find(c => c.subtask === id);
      return `<div class="subs"><div class="label">${T.subtasks} · ${s.list.length} <small style="text-transform:none;letter-spacing:0">— ${T.subsHint}</small></div>
        ${s.overlaps.length ? `<div class="banner" style="--c:var(--waiting)">${ICON.warn}<span>${s.overlaps.map(o => esc(T.clash(o.a, o.b, o.file))).join('<br>')}</span></div>` : ''}
        ${s.list.map(x => {
          const c = owner(x.id);
          return `<div class="sub"><div><b>${esc(x.title)}</b><small class="mono">${esc(x.id)}${c ? ` · ${esc(c.id)} · ${esc(Agent.displayName(c.adapter))}` : ''}</small></div>
            <div class="files">${x.files.map(f => `<code class="${[...clash].some(k => k === f || k.startsWith(f)) ? 'clash' : ''}">${esc(f)}</code>`).join('')}</div></div>`;
        }).join('')}</div><br>`;
    }

    // The Arbiter's decision: the candidates ranked with its reasons; choose another here before Pick
    #decision(t) {
      const d = t.arbiter;
      if (!d) {
        const own = !t.template.stages.some(s => s.role === 'arbiter' && s.agents?.length);
        return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.noDecision}</b>${own ? T.ownerPicks : T.noDecisionHint}</div>`;
      }
      const picking = !!t.gate?.actions.includes('pick');
      const picked = this.picked.get(t.id);
      const ranked = [...d.ranking, ...t.candidates.filter(c => c.status === 'active' && !d.ranking.some(r => r.candidate === c.id)).map(c => ({ candidate: c.id, score: null, reasons: [] }))];
      const confC = d.confidence >= 0.6 ? 'var(--done)' : 'var(--working)';
      const answer = [...t.instances].reverse().find(i => i.role === 'arbiter' && i.artifact);
      const text = answer ? this.#artifact(t.id, answer.artifact) : null;
      return `<div class="dec">
        <div class="top">${novi(d.adapter || 'codex')}<b>${esc(T.verdict[d.decision] || d.decision)}${d.winner ? ` ${esc(d.winner)}` : ''}</b>
          <span class="conf"><span class="bar" role="img" aria-label="${T.confidence} ${d.confidence}"><i style="width:${d.confidence * 100}%;--c:${confC}"></i></span>${T.confidence} ${d.confidence.toFixed(2)}</span>
          ${d.retry ? `<span style="color:var(--soft);font-size:12.5px">“${esc(d.retry)}”</span>` : ''}</div>
        ${d.risks.length ? `<div><div class="label" style="margin-bottom:6px">${T.risks}</div><ul class="risks">${d.risks.map(r => `<li class="${r.high ? 'high' : ''}">${r.high ? ICON.warn : '·'}<span>${esc(r.text)}</span></li>`).join('')}</ul></div>` : ''}
        ${ranked.map((r, i) => {
          const c = t.candidates.find(x => x.id === r.candidate);
          const tests = c?.tests ? (c.tests.skipped ? T.testsSkip : c.tests.ok ? T.testsPass : T.testsFail) : T.testsNot;
          const mine = picked === r.candidate || (t.winner === r.candidate && t.winner !== d.winner);
          return `<div class="rank${r.candidate === d.winner ? ' win' : ''}${mine ? ' mine' : ''}">
            <span class="n">${i + 1}</span>
            <span class="who">${novi(c?.adapter || 'claude')}<span><b>${esc(r.candidate)}</b><small>${esc(tests)}${c?.diff ? ` · +${c.diff.added} −${c.diff.deleted}` : ''}</small></span></span>
            <span class="sc">${r.score === null ? '—' : `<span class="bar"><i style="width:${r.score * 10}%"></i></span>${T.score(r.score)}`}</span>
            <ul>${r.reasons.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
            ${picking && c?.status === 'active' ? `<button class="btn sm${picked === r.candidate ? ' primary' : ''}" type="button" data-pick="${esc(r.candidate)}">${picked === r.candidate ? `${ICON.check} ${T.chosen}` : T.choose}</button>` : '<span></span>'}
          </div>`;
        }).join('')}
        ${text ? `<details class="more"><summary>${T.arbiterAnswer}</summary><div class="md">${renderMarkdown(text)}</div></details>` : ''}
      </div>`;
    }

    // Review board: the Arbiter's one list, duplicates merged, by severity
    #report(t) {
      const r = t.report;
      const inputs = ['logs.md', 'audit.md'].map(n => [n, this.#artifact(t.id, n)]).filter(([, x]) => x);
      const collected = inputs.length ? `<details class="more"><summary>${T.collected}</summary>${inputs.map(([, x]) => `<div class="md">${renderMarkdown(x)}</div>`).join('')}</details>` : '';
      if (!r) { return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.noReport}</b>${T.noReportHint}</div>${collected}`; }
      if (r.error) { return `<div class="banner" style="--c:var(--waiting);margin:0">${ICON.warn}<span><b>${T.reportBad}</b><br>${esc(r.error)}</span></div>${collected}`; }
      const col = { high: 'var(--waiting)', medium: 'var(--working)', low: 'var(--idle)' };
      const only = this.sevFilter.get(t.id) || null;
      const count = sev => r.findings.filter(f => f.severity === sev).length;
      const shown = r.findings.filter(f => !only || f.severity === only);
      const rich = r.findings.some(f => f.recommendation || f.evidence || f.confidence != null);
      return `<div class="cards">${r.summary ? `<div class="card md">${renderMarkdown(r.summary)}</div>` : ''}
        <div class="rfilter" role="group" aria-label="${T.filterSev}">
          <button type="button" class="chip" data-sev="" aria-pressed="${!only}">${T.all} · ${r.findings.length}</button>
          ${['high', 'medium', 'low'].map(sv => `<button type="button" class="chip c" style="--c:${col[sv]}" data-sev="${sv}" aria-pressed="${only === sv}" ${count(sv) ? '' : 'disabled'}>${T.sev[sv]} · ${count(sv)}</button>`).join('')}
          <span class="sp"></span><button type="button" class="btn sm" data-act="export">${ICON.down || ''}${T.exportMd}</button></div>
        <table class="tbl"><thead><tr><th>${T.col.sev}</th><th>${T.col.where}</th><th>${T.col.problem}</th>${rich ? `<th>${T.col.rec}</th><th>${T.col.conf}</th>` : ''}<th>${T.col.by}</th></tr></thead><tbody>
        ${shown.map(f => `<tr><td><span class="chip c sev" style="--c:${col[f.severity]}">${T.sev[f.severity]}</span></td>
          <td class="mono" title="${esc(f.evidence || '')}">${esc(f.file ? `${f.file}${f.line ? `:${f.line}` : ''}` : f.evidence || '—')}</td>
          <td>${esc(f.problem)}${f.evidence && f.file && f.evidence !== `${f.file}:${f.line}` ? `<br><small class="mono" style="color:var(--muted)">${esc(f.evidence)}</small>` : ''}</td>
          ${rich ? `<td>${esc(f.recommendation || '—')}</td><td class="num">${f.confidence == null ? '—' : f.confidence.toFixed(2)}</td>` : ''}
          <td>${esc(f.reviewers.join(', '))}</td></tr>`).join('')}
        </tbody></table>${collected}</div>`;
    }

    // Operations: the Arbiter's runbook as step cards — each runs only from its own button, in order
    #runbook(t) {
      const rb = t.runbook;
      if (rb.status === 'unusable') { return `<div class="banner" style="--c:var(--waiting);margin:0">${ICON.warn}<span><b>${T.ops.over.unusable}</b><br>${esc(rb.error || '')}</span></div>`; }
      if (!rb.steps.length) { return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.noSteps}</b>${T.noStepsHint}</div>`; }
      const open = rb.status === 'open';
      const next = rb.steps.find(x => x.status !== 'done' && x.status !== 'skipped');
      const q = a => (/^[\w@%+=:,./-]+$/.test(a) ? a : `'${a.replace(/'/g, "'\\''")}'`);
      const line = argv => esc(argv.map(q).join(' '));
      const ui = this.opsUi?.task === t.id ? this.opsUi : null;
      const cards = rb.steps.map((x, i) => {
        const isNext = open && x === next;
        const st = x.status === 'pending' && isNext ? 'next' : x.status;
        const res = r => r ? `<span class="res">${r.error ? `${esc(r.error)} · ` : ''}${T.ops.exit(r.code, r.ms)}</span>` : '';
        let actions = '';
        if (isNext && x.status !== 'running') {
          const mine = ui?.step === x.id ? ui : null;
          if (mine?.mode === 'edit') {
            actions = `<textarea class="argv" data-ops-argv spellcheck="false">${esc(mine.argv)}</textarea>
              <div class="row"><span class="sp"></span><button class="btn" type="button" data-ops="cancel">${T.ops.cancel}</button><button class="btn primary" type="button" data-ops="save-edit" data-step="${x.id}">${T.ops.save}</button></div>`;
          } else if (mine?.mode === 'confirm') {
            const argv = mine.action === 'dry' ? x.dryRun : mine.action === 'rollback' ? x.rollback : x.argv;
            actions = `<div class="row"><span class="msg">${T.ops.confirmQ(line(argv), esc(x.hostName))}</span><button class="btn" type="button" data-ops="cancel">${T.ops.cancel}</button>
              <button class="btn primary" type="button" data-ops="go" data-step="${x.id}">${ICON.check} ${T.ops[mine.action === 'dry' ? 'dry' : mine.action === 'rollback' ? 'rollback' : 'run']}</button></div>`;
          } else if (mine?.mode === 'typed') {
            const okName = mine.typed.trim() === x.hostName;
            actions = `<div class="row"><span class="msg">${T.ops.typeQ(esc(x.hostName))}</span><input class="typed" data-ops-typed value="${esc(mine.typed)}" spellcheck="false" aria-label="${esc(T.ops.typeQ(x.hostName).replace(/<[^>]+>/g, ''))}">
              <button class="btn" type="button" data-ops="cancel">${T.ops.cancel}</button><button class="btn danger" type="button" data-ops="go" data-step="${x.id}" ${okName ? '' : 'disabled'}>${T.ops[mine.action === 'rollback' ? 'rollback' : 'run']}</button></div>`;
          } else if (x.level === 'refused') {
            actions = `<div class="row"><span class="msg" style="color:var(--waiting)">${esc(T.ops.refused(x.hostName))}</span><button class="btn" type="button" data-ops="edit" data-step="${x.id}">${T.ops.edit}</button><button class="btn" type="button" data-ops="skip" data-step="${x.id}">${T.ops.skip}</button></div>`;
          } else {
            const failed = x.status === 'failed';
            actions = `<div class="row">
              ${x.dryRun && !failed ? `<button class="btn" type="button" data-ops="dry" data-step="${x.id}">${T.ops.dry}</button>` : ''}
              ${failed && x.rollback ? `<button class="btn" type="button" data-ops="rollback" data-step="${x.id}">${T.ops.rollback}</button>` : ''}
              <button class="btn" type="button" data-ops="edit" data-step="${x.id}">${T.ops.edit}</button>
              <button class="btn" type="button" data-ops="skip" data-step="${x.id}">${T.ops.skip}</button>
              <details class="more"><summary>${T.ops.more}</summary><button class="btn sm" type="button" data-ops="skip-danger" data-step="${x.id}">${T.ops.skipDanger}</button></details>
              <span class="sp"></span>
              <button class="btn ${x.risk === 'high' || x.level === 'typed' ? 'danger' : 'primary'}" type="button" data-ops="run" data-step="${x.id}" data-primary>${failed ? T.ops.retry : T.ops.run} <kbd>Alt ↵</kbd></button></div>`;
          }
        }
        return `<article class="opscard ${st}${!isNext && x.status === 'pending' ? ' later' : ''}" data-step="${x.id}" tabindex="${isNext ? 0 : -1}">
          <div class="oh"><span class="n">${i + 1}</span><span class="chip c env-${esc(x.env)}">${x.env === 'prod' ? 'PROD · ' : ''}${esc(x.hostName)}</span>
            <span class="chip c" style="--c:${{ low: 'var(--done)', medium: 'var(--working)', high: 'var(--waiting)' }[x.risk]}">${T.ops.risk[x.risk]}</span>
            ${x.edited ? `<span class="chip">${T.ops.edited}</span>` : ''}<span class="sp"></span>
            <span class="chip c" style="--c:${{ done: 'var(--done)', failed: 'var(--waiting)', running: 'var(--thinking)', skipped: 'var(--idle)' }[x.status] || 'var(--idle)'}">${x.status === 'pending' && isNext ? T.ops.next : T.ops[x.status]}</span></div>
          ${x.warn ? `<div class="warn">${ICON.warn}<span>${esc(x.warn)}</span></div>` : ''}
          ${x.purpose ? `<div class="purpose">${esc(x.purpose)}</div>` : ''}
          <div class="cmd"><span class="p">$</span><span>${line(x.argv)}</span></div>
          ${x.rollback ? `<details class="more"><summary>${T.ops.rollbackOf}</summary><div class="cmd"><span class="p">$</span><span>${line(x.rollback)}</span></div>${res(x.rollbackResult)}</details>` : ''}
          ${x.dryResult ? `<div class="res">${T.ops.dryDone}: ${res(x.dryResult)}</div>` : ''}
          ${x.tail ? `<pre class="output">${esc(x.tail)}</pre>` : ''}${res(x.result)}
          ${actions}
        </article>`;
      }).join('');
      const offer = rb.offer ? `<div class="banner" style="--c:var(--brand);margin:0">${ICON.check}<span>${esc(T.ops.offer(rb.offer.pattern, rb.offer.host))}</span><button class="btn sm" type="button" data-ops="allow">${T.ops.add}</button></div>` : '';
      const over = open ? `<small style="color:var(--muted)">${T.ops.keys}${rb.steps.some(x => x.env && x.host !== 'local') ? ` · ${T.ops.remoteStop}` : ''}</small>` : `<div class="banner" style="--c:var(--idle);margin:0">${T.ops.over[rb.status] || ''}</div>`;
      return `<div class="ops">${over}${offer}${cards}</div>`;
    }

    async #opsAction(t, stepId, action, opts = {}) {
      const r = await this.api.runbook?.(t.id, stepId, action, opts);
      if (r && !r.ok) { this.toast(r.error, true); return false; }
      this.opsUi = null;
      return true;
    }

    // Review board: every reviewer's answer on its own, with its findings count (the Arbiter merges them from 06)
    #reviews(t) {
      const done = t.instances.filter(i => i.artifact && (i.role === 'reviewer' || i.role === 'analyst'));
      if (!done.length) { return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.noReviews}</b>${T.noReviewsHint}</div>`; }
      return `<div class="cands">${done.map(i => {
        const text = this.#artifact(t.id, i.artifact);
        const n = text ? findingsIn(text) : 0;
        return `<article class="cand"><div class="ch">${novi(i.adapter, 'l')}<div class="nm"><b>${esc(Agent.displayName(i.adapter))}</b><small class="mono">${esc(i.artifact)}</small></div>
            <span class="chip c" style="--c:${n ? 'var(--working)' : 'var(--done)'}">${T.findings(n)}</span></div>
          ${this.#loadState(t.id, i.artifact) || `<div class="md">${renderMarkdown(text || '')}</div>`}</article>`;
      }).join('')}</div>`;
    }

    #candidates(t) {
      if (!t.candidates.length) { return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.noCands}</b>${T.noCandsHint}</div>`; }
      const picking = !!t.gate?.actions.includes('pick');
      const picked = this.picked.get(t.id);
      return `<div class="cands">${t.candidates.map(c => {
        const builder = [...t.instances].reverse().find(i => i.candidate === c.id && i.role === 'builder');
        const tests = c.status === 'part' ? ['var(--idle)', T.testedIn] : !c.tests ? ['var(--idle)', T.testsNot] : c.tests.skipped ? ['var(--idle)', T.testsSkip] : c.tests.ok ? ['var(--done)', T.testsPass] : ['var(--waiting)', `${T.testsFail} (exit ${c.tests.code})`];
        const review = this.#artifact(t.id, `review.${c.id}.md`);
        const answer = builder ? this.#artifact(t.id, `msg.${builder.id}.md`) : null;
        const n = review ? findingsIn(review) : 0;
        const win = t.winner === c.id;
        const role = c.subtask ? `<span class="chip">${esc(T.partOf(c.subtask))}</span>` : c.parts ? `<span class="chip c" style="--c:var(--brand)">${T.integrated}</span>` : '';
        return `<article class="cand${win ? ' win' : picked === c.id ? ' picked' : ''}${c.status === 'out' || c.status === 'part' ? ' out' : ''}">
          <div class="ch">${novi(c.adapter, 'l')}<div class="nm"><b>${esc(c.id)}</b><small title="${esc(c.branch || '')}">${esc(Agent.displayName(c.adapter))}${c.branch ? ` · ${esc(c.branch)}` : ''}</small></div>
            ${role}${win ? `<span class="chip c" style="--c:var(--brand)">${T.winner}</span>` : c.status === 'out' ? `<span class="chip c" style="--c:var(--waiting)">${T.out}</span>` : ''}</div>
          <div class="strip" style="--c:${tests[0]}">${tests[0] === 'var(--done)' ? ICON.check : tests[0] === 'var(--waiting)' ? ICON.x : ''}${esc(tests[1])}</div>
          <dl class="kv"><dt>${T.diff}</dt><dd>${c.diff ? `<span class="diff"><span class="a">+${c.diff.added}</span> <span class="r">−${c.diff.deleted}</span></span> · ${T.files(c.diff.files)}` : '—'}</dd>
            ${review !== null && review !== undefined ? `<dt>${T.review}</dt><dd style="color:${n ? 'var(--working)' : 'var(--done)'}">${T.findings(n)}</dd>` : ''}
            ${c.parts ? `<dt>${T.integrated}</dt><dd>${esc(c.parts.join(', '))}</dd>` : ''}
            <dt>${T.status2}</dt><dd>${win ? (t.merged ? T.mergedInto(esc(t.merged.into), t.merged.applied) : T.winner) : c.status === 'part' ? T.inIntegrated : c.status === 'out' ? esc(c.out || T.out) : T.active}</dd></dl>
          ${review ? `<details class="more"><summary>${T.reviewText}</summary><div class="md">${renderMarkdown(review)}</div></details>` : ''}
          ${answer ? `<details class="more"><summary>${T.answer}</summary><div class="md">${renderMarkdown(answer)}</div></details>` : ''}
          <div class="row">${builder?.handle && t.status !== 'done' && t.status !== 'stopped' ? `<button class="btn sm" type="button" data-term="${esc(builder.id)}" title="${T.terminalTip}">${ICON_TERM} ${T.terminal}</button>` : ''}
            ${picking && c.status === 'active' ? `<button class="btn sm${picked === c.id ? ' primary' : ''}" type="button" data-pick="${esc(c.id)}">${picked === c.id ? `${ICON.check} ${T.chosen}` : T.choose}</button>` : ''}</div>
        </article>`;
      }).join('')}</div>`;
    }

    #tests(t) {
      const tested = t.candidates.filter(c => c.tests);
      if (!tested.length) { return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.testsNot}</b>${esc(t.testCommand || T.the.noTests)}</div>`; }
      return `<div class="cards">${tested.map(c => {
        const out = this.#artifact(t.id, `test-output.${c.id}.txt`);
        const ok = c.tests.skipped ? null : c.tests.ok;
        return `<div><div class="row" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">${novi(c.adapter)}<b>${esc(c.id)}</b>
            <span class="chip c" style="--c:${ok === null ? 'var(--idle)' : ok ? 'var(--done)' : 'var(--waiting)'}">${ok === null ? T.testsSkip : ok ? T.testsPass : T.testsFail}</span></div>
          ${this.#loadState(t.id, `test-output.${c.id}.txt`) || `<pre class="output">${esc(out || T.noOutput)}</pre>`}</div>`;
      }).join('')}</div>`;
    }

    #log(t) {
      const entries = this.#artifact(t.id, '#log');
      const loading = this.#loadState(t.id, '#log');
      if (loading) { return loading; }
      if (!entries?.length) { return `<div class="empty">${novi(MANAGER, 'l')}<b>${T.noLog}</b>${T.noLogHint}</div>`; }
      return `<ul class="timeline">${[...entries].reverse().map(e => {
        const text = (T.log[e.event] || (x => x.event.startsWith('gate:') ? `You: ${x.event.slice(5)}${x.candidate ? ` ${x.candidate}` : ''}${x.note ? ` — “${x.note}”` : ''}` : x.event))(e);
        const icon = e.actor === 'you' ? ICON.you : e.actor === 'agent' ? ICON.agent : ICON.engine;
        return `<li><span class="tm">${clockTime(e.at)}</span><span class="actor ${esc(e.actor)}" title="${esc(e.actor)}">${icon}</span>
          <span class="tx"><span>${esc(text)}</span>${e.cwd || e.dir ? `<small>${esc(tilde(e.cwd || e.dir, this.state?.home))}</small>` : ''}</span></li>`;
      }).join('')}</ul>`;
    }

    // ---------- the decision bar ----------

    #actions(t) {
      const g = t.gate;
      const labels = T.gate[g.kind] || {};
      const c = this.composing;
      if (c?.gate === g.id && (c.action === 'changes' || c.action === 'retry')) {
        return `<div class="actions"><textarea data-note placeholder="${T.notePh[c.action]}">${esc(c.note || '')}</textarea>
          <span class="msg"><small>Ctrl+Enter</small></span>
          <button class="btn" type="button" data-act="cancel">${T.cancel}</button>
          <button class="btn primary" type="button" data-act="send-note">${T.send}</button></div>`;
      }
      if (c?.gate === g.id && c.action === 'abort') {
        return `<div class="actions"><span class="msg confirm">${g.kind === 'runbook' ? T.stopPlanAsk : T.abortAsk}</span>
          <button class="btn" type="button" data-act="cancel">${T.cancel}</button>
          <button class="btn danger" type="button" data-act="abort-yes">${g.kind === 'runbook' ? T.yesStopPlan : T.yesAbort}</button></div>`;
      }
      const picked = this.picked.get(t.id) || (g.kind === 'pick' && t.candidates.filter(x => x.status === 'active').length === 1 ? t.candidates.find(x => x.status === 'active').id : null);
      const primary = g.actions.find(a => ['accept', 'approve', 'merge', 'adopt', 'next'].includes(a)) || g.actions.find(a => a === 'pick') || g.actions.find(a => a === 'retry' && g.kind !== 'pick' && g.kind !== 'tests-failed') || null;
      const btn = a => {
        if (a === 'pick') {
          const main = primary === 'pick';
          return `<button class="btn${main ? ' primary' : ''}" type="button" data-decide="pick" ${picked ? '' : `disabled title="${T.pickFirst}"`}>${main ? `${ICON.check} ` : ''}${picked ? `${labels.pick} ${esc(picked)}` : labels.pick} <kbd>${main ? 'Alt A' : 'Alt P'}</kbd></button>`;
        }
        const text = a === 'merge' ? (t.base.fromWorktree ? T.applyFiles : T.mergeInto(esc(t.base.branch))) : labels[a] || a;
        const cls = a === primary ? 'btn primary' : a === 'abort' ? 'btn danger' : 'btn';
        return `<button class="${cls}" type="button" data-decide="${a}">${a === primary ? `${ICON.check} ` : ''}${text}${a === primary ? ' <kbd>Alt A</kbd>' : ''}</button>`;
      };
      // Primary last (bottom right), abort first
      const order = [...g.actions].sort((a, b) => (a === 'abort' ? -1 : b === 'abort' ? 1 : 0) || (a === primary ? 1 : b === primary ? -1 : 0));
      return `<div class="actions"><span class="msg"><b>${esc(g.title)}</b><small>${esc((g.kind === 'merge' && t.base.fromWorktree ? T.gateHint.apply : T.gateHint[g.kind]) || '')}</small>
          ${g.detail ? `<small>${esc(g.detail)}</small>` : ''}${g.error ? `<small class="err">${esc(g.error)}</small>` : ''}
          ${g.hint ? `<small class="fix"><b>${T.fix}</b> ${esc(g.hint)}</small>` : ''}
          ${g.screen ? `<details class="more"><summary>${T.lastScreen}</summary><pre class="output">${esc(g.screen)}</pre></details>` : ''}
          ${g.batch ? this.#batchHtml(g) : ''}</span>
        ${order.map(btn).join('')}</div>`;
    }

    async #decide(t, action, opts = {}) {
      const r = await this.api.decide(t.id, t.gate.id, action, opts);
      if (!r?.ok) { this.toast(r?.error || 'Something went wrong', true); return false; }
      this.composing = null;
      return true;
    }

    // ---------- data ----------

    // An artifact's text: undefined while it loads (then a re-render), null when there is none or it failed
    // (the reason is kept in #artFailed, so the view says what failed instead of "nothing yet")
    #artifact(id, name) {
      const key = `${id}:${name}`;
      if (this.#art.has(key)) { return this.#art.get(key); }
      this.#art.set(key, undefined);
      this.#artFailed.delete(key);
      const done = () => { if (this.view === 'detail' && this.open === id && !this.composing) { this.render(); } };
      Promise.resolve()
        .then(() => (name === '#log' ? this.api.log(id) : this.api.artifact(id, name)))
        .then(v => { this.#art.set(key, v ?? null); done(); }, err => {
          this.#art.set(key, null);
          this.#artFailed.set(key, errorText(err));
          done();
        });
      return undefined;
    }

    // The loading or error block for an artifact, or '' once its text is here
    #loadState(id, name) {
      const key = `${id}:${name}`;
      if (this.#artifact(id, name) === undefined) { return stateBlock({ kind: 'loading', line: T.loading }); }
      if (!this.#artFailed.has(key)) { return ''; }
      return stateBlock({ kind: 'error', title: T.loadFailed(name), action: { label: T.retry, data: { retry: key } }, details: this.#artFailed.get(key) });
    }

    #preferredTab(task) {
      if (DISCUSSION_MODE) { return 'discussion'; }
      if (task?.gate?.kind === 'runbook') { return 'runbook'; }
      if (task?.template.stages[task.stage]?.role === 'orchestrator' || ['delegation', 'budget', 'orchestrator-stuck', 'orchestrator-lost'].includes(task?.gate?.kind)) { return 'delegation'; }
      if (['discussion', 'discussion-end'].includes(task?.gate?.kind) || task?.template.stages[task.stage]?.role === 'discussion') { return 'discussion'; }
      if (task?.gate?.kind === 'decision' || (task?.gate?.kind === 'merge' && task.candidates.filter(x => x.status === 'active').length > 1)) { return 'decision'; }
      if (task?.gate?.kind === 'pick') { return 'candidates'; }
      if (task?.gate?.kind === 'approve') { return 'plan'; }
      if (task?.report) { return 'report'; }
      return 'overview';
    }

    #waitingText(text) {
      const raw = String(text || '');
      const agent = /^(\w+) (\d+)\/(\d+) running$/.exec(raw);
      if (agent) { return `${Agent.displayName(agent[1])}: limit ${agent[3]} reached`; }
      const throttle = /^throttled until (.+)$/.exec(raw);
      if (throttle) {
        const at = new Date(throttle[1]);
        return Number.isNaN(at.getTime()) ? raw : `Rate limit until ${at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
      }
      return raw;
    }

    #openTask(id) {
      if (this.open !== id) { this.tab = this.#preferredTab(this.tasks.get(id)); }
      this.open = id;
      this.view = 'detail';
      this.composing = null;
      this.render();
      this.el.main.querySelector('.dhead h1')?.focus(); // keyboard users land on what just opened
    }

    // Back to the board, with focus on the card of the task that was open
    #closeTask() {
      if (DISCUSSION_MODE) { return; } // the discussion window shows one task; it has no board to go back to
      const id = this.open;
      this.view = 'board';
      this.open = null;
      this.render();
      [...this.el.main.querySelectorAll('.tcard')].find(c => c.dataset.open === id)?.focus();
    }

    // Arrow keys on the board: ↑/↓ within a column, ←/→ to the nearest card in the next column that has any
    #moveOnBoard(card, key) {
      const cols = [...this.el.main.querySelectorAll('.col')].map(c => [...c.querySelectorAll('.tcard')]);
      const ci = cols.findIndex(c => c.includes(card));
      const ri = cols[ci].indexOf(card);
      if (key === 'ArrowUp' || key === 'ArrowDown') { return cols[ci][ri + (key === 'ArrowDown' ? 1 : -1)]?.focus(); }
      const step = key === 'ArrowRight' ? 1 : -1;
      for (let c = ci + step; c >= 0 && c < cols.length; c += step) {
        if (cols[c].length) { return cols[c][Math.min(ri, cols[c].length - 1)].focus(); }
      }
    }

    toast(text, err = false) {
      clearTimeout(this.#toastTimer);
      this.el.toast.textContent = text;
      this.el.toast.className = `toast${err ? ' err' : ''}`;
      this.el.toast.hidden = false;
      this.#toastTimer = setTimeout(() => { this.el.toast.hidden = true; }, 4000);
    }

    // ---------- input ----------

    #bind() {
      document.getElementById('newTask').addEventListener('click', () => this.api?.newTask());
      for (const b of document.querySelectorAll('[data-win]')) { b.addEventListener('click', () => this.api?.control(b.dataset.win)); }
      for (const b of document.querySelectorAll('#wnav [data-view]')) {
        b.addEventListener('click', () => {
          if (this.view === 'builder' && this.builder.edit?.dirty) { this.builder.edit.confirmLeave = true; return this.render(); }
          if (this.view === 'builder') { this.builder.edit = null; }
          this.view = b.dataset.view;
          this.open = null;
          this.composing = null;
          this.render();
        });
      }
      this.el.main.addEventListener('input', e => {
        // The host name typed for a high-risk step: Run turns on when it matches (no re-render under the caret)
        if (e.target.matches?.('[data-ops-typed]') && this.opsUi) {
          this.opsUi.typed = e.target.value;
          const t = this.tasks.get(this.opsUi.task);
          const step = t?.runbook?.steps.find(x => x.id === this.opsUi.step);
          const go = this.el.main.querySelector('[data-ops="go"]');
          if (go && step) { go.disabled = e.target.value.trim() !== step.hostName; }
          return;
        }
        if (this.view === 'builder' && this.builder.onInput(e, this.el.main)) { return; }
        if (e.target.id === 'q') {
          this.query = e.target.value;
          const pos = e.target.selectionStart;
          this.render();
          const q = document.getElementById('q');
          q.focus();
          q.setSelectionRange(pos, pos);
        }
        if (e.target.matches('[data-note]') && this.composing) { this.composing.note = e.target.value; }
        if (e.target.matches('[data-disc-text]')) { this.disc.text = e.target.value; }
        if (e.target.matches('[data-disc-q]')) {
          this.disc.q = e.target.value;
          const pos = e.target.selectionStart;
          this.render();
          const q = this.el.main.querySelector('[data-disc-q]');
          q?.focus();
          q?.setSelectionRange(pos, pos);
        }
      });
      this.el.main.addEventListener('change', e => {
        if (this.view === 'builder' && e.target.matches('select') && this.builder.onChange(e)) { return this.render(); }
        if (e.target.id === 'proj') { this.project = e.target.value; this.render(); }
        if (e.target.matches('[data-disc-to]')) { this.disc.to = e.target.value; this.render(); }
      });
      this.el.main.addEventListener('click', async e => {
        if (this.editing) {
          const r = await this.builder.onClick(e);
          if (r === 'builder' || r === 'templates') { this.view = r; }
          if (r) { this.render(); }
          return;
        }
        const t = this.tasks.get(this.open);
        const open = e.target.closest('[data-open]');
        if (open) { return this.#openTask(open.dataset.open); }
        const retry = e.target.closest('[data-retry]');
        if (retry) { this.#art.delete(retry.dataset.retry); return this.render(); }
        const lay = e.target.closest('[data-layout]');
        if (lay) {
          this.layout = lay.dataset.layout;
          try { localStorage.setItem(LAYOUT_KEY, this.layout); } catch { /* storage unavailable */ }
          return this.render();
        }
        const grp = e.target.closest('[data-group]');
        if (grp) {
          const c = grp.dataset.group;
          if (this.collapsed.has(c)) { this.collapsed.delete(c); } else { this.collapsed.add(c); }
          return this.render();
        }
        const so = e.target.closest('[data-sort]');
        if (so) {
          const k = so.dataset.sort;
          this.sort = this.sort.key === k ? { key: k, dir: -this.sort.dir } : { key: k, dir: ['title', 'project', 'pattern'].includes(k) ? 1 : -1 };
          return this.render();
        }
        const d = e.target.closest('[data-density]');
        if (d) {
          this.density = d.dataset.density;
          try { localStorage.setItem(DENSITY_KEY, this.density); } catch { /* storage unavailable */ }
          return this.render();
        }
        const tab = e.target.closest('[data-tab]');
        if (tab) { this.tab = tab.dataset.tab; return this.render(); }
        // The discussion tab
        const dv = e.target.closest('[data-disc-view]');
        if (dv) { this.disc.view = dv.dataset.discView; return this.render(); }
        const df = e.target.closest('[data-disc-filter]');
        if (df) { this.disc.filter = df.dataset.discFilter && this.disc.filter !== df.dataset.discFilter ? df.dataset.discFilter : null; return this.render(); }
        if (t && e.target.closest('[data-disc-save]')) { return this.#saveThread(t); }
        if (t && e.target.closest('[data-disc-window]')) { return this.api.openDiscussion(t.id); }
        const dp = e.target.closest('[data-disc-pin]');
        if (t && dp) { return this.#discussionAct(t, 'pin', { message: dp.dataset.discPin, pinned: dp.getAttribute('aria-pressed') !== 'true' }); }
        const da = e.target.closest('[data-disc-act]');
        if (t && da) {
          const act = da.dataset.discAct;
          if (act === 'pause') { return this.#discussionAct(t, 'pause', { on: !t.discussion?.pauseAfterRound }); }
          if (act === 'end') { return this.#discussionAct(t, 'end'); }
          const text = this.disc.text.trim();
          if (!text) { return this.toast('Write the message first', true); }
          if (await this.#discussionAct(t, act === 'ask' ? 'ask' : 'message', { text, to: this.disc.to || null })) {
            this.disc.text = '';
            this.toast(act === 'ask' ? T.disc.asked : T.disc.sent);
            this.render();
          }
          return;
        }
        const term = e.target.closest('[data-term]');
        if (term && t) {
          const r = await this.api.terminal(t.id, term.dataset.term);
          if (!r?.ok) { this.toast(r?.error || 'Could not open a terminal', true); }
          return;
        }
        const ob = e.target.closest('[data-ops]');
        if (ob && t?.runbook) {
          const a = ob.dataset.ops;
          const step = t.runbook.steps.find(x => x.id === ob.dataset.step);
          if (a === 'cancel') { this.opsUi = null; return this.render(); }
          if (a === 'allow') {
            const r = await this.api.allowPattern?.(t.runbook.offer.host, t.runbook.offer.pattern);
            this.toast(r?.ok ? T.ops.added : r?.error || T.wrong, !r?.ok);
            return;
          }
          if (a === 'edit') { this.opsUi = { task: t.id, step: step.id, mode: 'edit', argv: step.argv.map(x => (/\s/.test(x) ? `"${x}"` : x)).join(' ') }; return this.render(); }
          if (a === 'save-edit') {
            const text = this.el.main.querySelector('[data-ops-argv]')?.value || '';
            const argv = [...text.matchAll(/"([^"]*)"|'([^']*)'|(\S+)/g)].map(m => m[1] ?? m[2] ?? m[3]);
            await this.#opsAction(t, step.id, 'edit', { argv });
            return this.render();
          }
          if (a === 'skip' || a === 'skip-danger') { await this.#opsAction(t, step.id, 'skip', { dangerous: a === 'skip-danger' }); return this.render(); }
          if (a === 'go') {
            const ui = this.opsUi;
            await this.#opsAction(t, step.id, ui.action, ui.mode === 'typed' ? { typed: ui.typed } : { confirmed: true });
            return this.render();
          }
          // run / dry / rollback: straight away for 'click', otherwise the step's confirmation first
          const level = a === 'dry' ? (step.env === 'prod' ? 'confirm' : 'click') : step.level === 'click' && a === 'rollback' ? 'confirm' : step.level;
          if (level === 'click') { await this.#opsAction(t, step.id, a); return this.render(); }
          this.opsUi = { task: t.id, step: step.id, mode: level === 'typed' ? 'typed' : 'confirm', action: a, typed: '' };
          this.render();
          this.el.main.querySelector('[data-ops-typed], [data-ops="go"]')?.focus();
          return;
        }
        const sev = e.target.closest('[data-sev]');
        if (sev && t) { this.sevFilter.set(t.id, sev.dataset.sev || null); return this.render(); }
        const pick = e.target.closest('[data-pick]');
        if (pick && t) { this.picked.set(t.id, pick.dataset.pick); return this.render(); }
        const decide = e.target.closest('[data-decide]');
        if (decide && t?.gate) {
          const a = decide.dataset.decide;
          if (a === 'changes' || a === 'retry') {
            // An interrupted stage simply runs again; the others need a note
            if (['interrupted', 'failed', 'stopped'].includes(t.gate.kind)) { return this.#decide(t, a); }
            this.composing = { gate: t.gate.id, action: a, note: '' };
            return this.render();
          }
          if (a === 'abort') { this.composing = { gate: t.gate.id, action: 'abort' }; return this.render(); }
          if (a === 'pick') { return this.#decide(t, 'pick', { candidate: this.picked.get(t.id) || (t.gate.kind === 'pick' ? t.candidates.find(x => x.status === 'active')?.id : null) }); }
          decide.disabled = true;
          if (!(await this.#decide(t, a))) { decide.disabled = false; }
          return;
        }
        const act = e.target.closest('[data-act]')?.dataset.act;
        if (act === 'board') { this.composing = null; return this.#closeTask(); }
        if (act === 'new') { return this.api?.newTask(); }
        if (act === 'cancel') { this.composing = null; return this.render(); }
        if (act === 'send-note' && t?.gate) { return this.#decide(t, this.composing.action, { note: this.composing.note || '' }); }
        if (act === 'abort-yes' && t?.gate) { return this.#decide(t, 'abort'); }
        if (act === 'stop' && t) { this.composing = { gate: null, action: 'stop' }; return this.render(); }
        if (act === 'export' && t) {
          const r = await this.api.exportReport?.(t.id);
          if (r?.ok) { this.toast(T.exported(r.path)); } else if (r && !r.canceled) { this.toast(r.error, true); }
          return;
        }
        const stopInst = e.target.closest('[data-stop-inst]');
        if (stopInst && t) { this.composing = { gate: null, action: 'stop-inst', inst: stopInst.dataset.stopInst }; return this.render(); }
        if (act === 'stop-inst-yes' && t) {
          const r = await this.api.stopInstance(t.id, this.composing?.inst);
          this.composing = null;
          if (!r?.ok) { this.toast(r?.error || 'Could not stop the agent', true); }
          return this.render();
        }
        if (act === 'stop-stage' && t) { this.composing = { gate: null, action: 'stop-stage' }; return this.render(); }
        if (act === 'stop-stage-yes' && t) {
          const r = await this.api.stopStage(t.id);
          this.composing = null;
          if (!r?.ok) { this.toast(r?.error || 'Could not stop the stage', true); }
          return this.render();
        }
        if (act === 'stop-yes' && t) {
          const r = await this.api.stop(t.id);
          this.composing = null;
          if (!r?.ok) { this.toast(r?.error || 'Could not stop the task', true); }
          return this.render();
        }
      });
      // A decision is never taken by a bare Enter / Space on a focused button (Tab lands there easily):
      // only by a click or its Alt shortcut. The buttons that just open a note or a confirmation stay free.
      const bareAction = e => {
        if (e.altKey || !['Enter', ' '].includes(e.key)) { return false; }
        const decision = e.target.closest?.('[data-decide]')?.dataset.decide;
        const ops = e.target.closest?.('[data-ops]')?.dataset.ops;
        return (decision && !['changes', 'retry', 'abort'].includes(decision)) ||
          ['run', 'dry', 'rollback', 'go'].includes(ops);
      };
      document.addEventListener('keyup', e => { if (bareAction(e)) { e.preventDefault(); } });
      document.addEventListener('keydown', async e => {
        if (bareAction(e)) {
          e.preventDefault();
          return this.toast(e.target.closest?.('[data-ops="run"]') ? T.useAltRun : T.useAlt);
        }
        if (this.view === 'builder') {
          let r = this.builder.onKey(e, this.el.main);
          if (r === 'save') { r = await this.builder.save(); if (r === 'templates') { this.view = 'templates'; } }
          if (r === 'render' || r === 'templates') { this.render(); }
          if (r) { return; }
          if (e.key === 'Escape') { this.builder.edit.confirmLeave = !!this.builder.edit.dirty; if (!this.builder.edit.dirty) { this.builder.edit = null; this.view = 'templates'; } return this.render(); }
          return;
        }
        const t = this.tasks.get(this.open);
        if (e.key === 'Enter' && e.ctrlKey && e.target.matches?.('[data-disc-text]')) {
          e.preventDefault();
          return this.el.main.querySelector(this.disc.to ? '[data-disc-act="ask"]' : '[data-disc-act="message"]')?.click();
        }
        if (e.key === 'Enter' && e.ctrlKey && e.target.matches?.('[data-note]')) {
          e.preventDefault();
          return this.el.main.querySelector('[data-act="send-note"]')?.click();
        }
        if (e.key === 'Escape') {
          if (this.composing) { this.composing = null; return this.render(); }
          if (this.view === 'detail') { return this.#closeTask(); }
        }
        const arrow = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && !e.altKey && !e.ctrlKey;
        if (arrow && this.view === 'board' && e.target.matches?.('.tcard')) {
          e.preventDefault();
          return this.#moveOnBoard(e.target, e.key);
        }
        // The detail's tabs: ←/→ move between them (Home / End to the ends)
        if (e.target.matches?.('[role="tab"]') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
          e.preventDefault();
          const tabs = [...this.el.main.querySelectorAll('[role="tab"]')].map(b => b.dataset.tab);
          const i = tabs.indexOf(e.target.dataset.tab);
          const next = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
          this.tab = tabs[next];
          this.render();
          return this.el.main.querySelector(`[role="tab"][data-tab="${this.tab}"]`)?.focus();
        }
        if (e.altKey && (e.key === 'a' || e.key === 'A') && this.view === 'detail' && t?.gate) {
          e.preventDefault();
          return this.el.main.querySelector('.actions .btn.primary:not(:disabled)')?.click();
        }
        // Alt+Enter on a focused runbook card: its Run (which still asks for its confirmation)
        if (e.altKey && e.key === 'Enter' && this.view === 'detail') {
          const card = document.activeElement?.closest?.('.opscard');
          const run = card?.querySelector('[data-primary]');
          if (run) { e.preventDefault(); return run.click(); }
        }
        // Alt+P pick another · Alt+R retry with a note (never a bare Enter on a decision)
        const alt = e.altKey && { p: 'pick', r: 'retry' }[e.key.toLowerCase()];
        if (alt && this.view === 'detail' && t?.gate?.actions.includes(alt)) {
          e.preventDefault();
          return this.el.main.querySelector(`.actions [data-decide="${alt}"]:not(:disabled)`)?.click();
        }
        if (this.view === 'detail' && !e.target.matches?.('input, textarea') && (e.key === '[' || e.key === ']')) {
          const keys = [...this.el.main.querySelectorAll('[role="tab"]')].map(b => b.dataset.tab);
          this.tab = keys[(keys.indexOf(this.tab) + (e.key === ']' ? 1 : keys.length - 1)) % keys.length];
          return this.render();
        }
        if (e.key === '/' && this.view === 'board' && !e.target.matches?.('input, textarea')) {
          e.preventDefault();
          document.getElementById('q')?.focus();
        }
      });
    }
  }

  const view = new TasksView(window.tasksAPI);
  if (window.tasksAPI) {
    tasksAPI.onShow(state => view.show(state));
    tasksAPI.onTask(task => view.setTask(task));
    tasksAPI.onUsage(usage => view.setUsage(usage));
  } else {
    window.__demo = view; // opened in a plain browser: drive it from the console
  }
</script>
<script src="builder.js"></script>
</body>
</html>
